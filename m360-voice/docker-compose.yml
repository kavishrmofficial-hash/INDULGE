# The voice box with https in front. Copy .env.example to .env, set VOICE_API_KEY and DOMAIN (a name
# that points at this machine), then: docker compose up -d. Caddy fetches the certificate itself.
services:
  voice:
    build: .
    restart: unless-stopped
    environment:
      VOICE_API_KEY: ${VOICE_API_KEY}
      WHISPER_HINTS: ${WHISPER_HINTS:-Mask360, M360, Kaavish}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://m360os-wx9u1bqs.edgeone.dev}
      EN_ENGINE: ${EN_ENGINE:-turbo}
      LOAD_MULTILINGUAL: ${LOAD_MULTILINGUAL:-1}
    volumes:
      - voice-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to voice:8000
    volumes:
      - caddy-data:/data
    depends_on:
      - voice
volumes:
  voice-data:
  caddy-data:
