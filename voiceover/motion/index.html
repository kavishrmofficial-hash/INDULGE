<style>

.body{font-size:26px;line-height:1.45;color:var(--ink62)}
.micro{font-size:18px;font-weight:400;letter-spacing:.14em;text-transform:lowercase;color:var(--micro);display:flex;align-items:center;gap:10px}
.micro::before{content:"";width:8px;height:8px;border-radius:9px;background:var(--flame);flex:none}
.bg-dark .micro{color:rgba(255,255,255,.6)}
.flame{color:var(--flame)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(10,10,10,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:14px;height:64px;padding:0 28px;font-weight:500;font-size:22px}
.btn.sec{background:var(--paper);color:var(--ink);border:1.5px solid var(--line2)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-size:17px;font-weight:500;border:1.5px solid var(--line2)}
.pill.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.fl{background:var(--flame);color:#fff;border-color:var(--flame)}
.pill.flo{color:var(--flame);border-color:var(--flame)}
.av{width:48px;height:48px;border-radius:99px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;flex:none}
.av.w{background:var(--col);color:var(--ink)} .av.f{background:var(--flame)}
.row{display:flex;align-items:center;gap:14px}

/* phone */

.tile .v{font-weight:600;font-size:54px;letter-spacing:-.035em;margin-top:12px}

.trophy .ic{width:84px;height:84px;border-radius:99px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.trophy .ic svg{width:44px;height:44px}

<body>
<div id="stage"></div>
<script src="mark.js"></script>
<script>
'use strict';
/* ---------- timing: one entry per voiceover scene ----------
   dur: seconds for the scene; words: word count of each line of the script, so the beats land on the lines.
   To sync to the real ElevenLabs audio, set each dur to that clip's length. */
const SCENES_T = [
  {dur: 24.0, words: [7, 10, 23, 9, 9]},
  {dur: 19.0, words: [4, 7, 15, 19]},
  {dur: 34.0, words: [6, 23, 18, 10, 16, 10]},
  {dur: 31.0, words: [6, 10, 29, 21, 10]},
  {dur: 45.0, words: [7, 20, 18, 29, 8, 18, 12]},
  {dur: 45.5, words: [9, 7, 24, 21, 8, 19, 25]},
  {dur: 41.0, words: [5, 19, 10, 16, 30, 22]},
  {dur: 22.0, words: [21, 17, 14]},
  {dur: 23.0, words: [9, 15, 15, 17]},
  {dur: 12.0, words: [2, 14, 9]}
];
const LEAD = 0.6, TAIL = 0.9, XF = 0.5;

/* ---------- motion helpers ---------- */
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  inout: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: t => t
};
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (lt, a, d = .6, e = E.out) => e(cl((lt - a) / d));
function st(el, o, x = 0, y = 0, s = 1, r = 0) {
  el.style.opacity = o;
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
}
/* in at a, out at b (b may be Infinity) */
function vis(lt, a, b = Infinity, din = .6, dout = .45) { return P(lt, a, din) * (1 - P(lt, b, dout, E.inout)); }
function rise(el, lt, a, b = Infinity, dy = 40, d = .7) {
  const pi = P(lt, a, d), po = P(lt, b, .45, E.inout);
  st(el, pi * (1 - po), 0, (1 - pi) * dy - po * 20);
}
function pop(el, lt, a, b = Infinity, s0 = .6) {
  const pi = P(lt, a, .55, E.back), po = P(lt, b, .4, E.inout);
  st(el, cl(P(lt, a, .25)) * (1 - po), 0, 0, (s0 + (1 - s0) * pi) * (1 - po * .08));
}
function typeIn(el, txt, lt, a, cps = 30) {
  const n = Math.floor(cl((lt - a) * cps, 0, txt.length));
  el.textContent = txt.slice(0, n);
  el.classList.toggle('caret', lt > a - .3 && n < txt.length && lt < a + txt.length / cps + .1);
}
function count(el, lt, a, d, v0, v1, fmt = x => Math.round(x).toLocaleString('en-IN')) {
  el.textContent = fmt(v0 + (v1 - v0) * P(lt, a, d, E.inout));
}
function track(lt, keys, e = E.inout) {
  if (lt <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (lt <= keys[i][0]) {
    const A = keys[i - 1], B = keys[i], p = e((lt - A[0]) / (B[0] - A[0]));
    return A.slice(1).map((v, k) => v + (B[k + 1] - v) * p);
  }
  return keys[keys.length - 1].slice(1);
}
/* a cursor that moves along keys [[t,x,y]] and clicks at times */
function cursor(r, lt, keys, clicks, show = [0, Infinity]) {
  const [x, y] = track(lt, keys);
  let s = 1;
  for (const c of clicks) { const k = lt - c; if (k > 0 && k < .3) s = 1 - .25 * Math.sin(k / .3 * Math.PI); }
  st(r.cur, vis(lt, show[0], show[1], .3, .3), x, y, s);
  let ro = 0, rs = .3;
  for (const c of clicks) { const k = lt - c; if (k > 0 && k < .6) { ro = 1 - k / .6; rs = .3 + k / .6 * 1.1; } }
  st(r.rip, ro, x - 40 + 6, y - 40 + 4, rs);
}
const CURSOR = `<div class="cursor" data-k="cur"><svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#0A0A0A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="ripple" data-k="rip"></div>`;
const FACE = `<svg viewBox="0 0 28 28" style="width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 12px rgba(10,10,10,.3))"><path d="M5 3.6 23.2 11.5c1 .45.9 1.9-.15 2.25l-7.3 2.2-3 7.1c-.45 1.05-1.95 1-2.3-.1L3.9 5c-.3-.95.35-1.75 1.1-1.4Z" fill="#F53901" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><circle cx="10.2" cy="9.4" r="2.1" fill="#fff"/><circle cx="15.2" cy="11.6" r="2.1" fill="#fff"/><circle data-k="p1" cx="10.4" cy="9.5" r="1" fill="#0A0A0A"/><circle data-k="p2" cx="15.4" cy="11.7" r="1" fill="#0A0A0A"/><path data-k="mouth" d="M11 15.2c1 .9 2.3 1 3.4.3" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" style="transform-origin:12.7px 15.4px"/></svg>`;
const NAV = ['Home', 'Work', 'Accounts', 'Vibe', 'Base', 'Chat', 'Radar', 'Me'];
function win(active, inner, who = ['R', 'Riya Shah', 'Designer'], attrs = '') {
  return `<div class="win" ${attrs}><div class="side"><div class="logo">${MARK}</div>${NAV.map(n => `<div class="nav${n === active ? ' on' : ''}" data-k="nav${n}"><i></i>${n}</div>`).join('')}
    <div class="me"><span class="av">${who[0]}</span><div><b>${who[1]}</b><small>${who[2]}</small></div></div></div><div class="main">${inner}</div></div>`;
}
const ICON = {
  flame: '<path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="#fff"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  sun: '<circle cx="12" cy="12" r="4.5" fill="#fff"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#fff"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="#fff"/>',
  timer: '<circle cx="12" cy="13" r="7.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M12 9v4.5l3 2M9.5 2.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#fff"/>'
};
const ic = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;

/* ---------- scenes ---------- */
const SC = [];

/* 1. The hook: Friday 19:40, the client asks, the phone floods */
SC.push({cls: 'bg-dark', html: () => {
  const N = [
    ['WhatsApp', 'Client: Tara Foods', 'Hey, where are we on the reels?', 1],
    ['WhatsApp', 'Reels team', 'who has the latest cut?'],
    ['Gmail', 'Re: Fwd: Re: reels status', 'Looping in the team here...'],
    ['WhatsApp', 'Design x Strategy', 'which version did we send them'],
    ['Sheets', 'Tracker_v7_FINAL', '3 people edited this sheet'],
    ['WhatsApp', 'Shoot day 2', 'did the call time move?'],
    ['Gmail', 'Re: approvals', 'Did they approve v2 or v3?'],
    ['WhatsApp', 'Edits', 'final_final_v4.mp4'],
    ['WhatsApp', 'Accounts', 'any update for the client?'],
    ['Gmail', 'Fwd: brief', 'see below, see below'],
    ['WhatsApp', 'Reels team', '@all where are we on this'],
    ['WhatsApp', 'Client: Tara Foods', 'Hello?', 1]
  ];
  return `<div class="a" data-k="t0" style="left:140px;top:360px;width:900px"><div class="micro">friday, 26 september</div><div class="h1" style="margin-top:22px">7:40 pm.</div></div>
  <div class="a" data-k="t1" style="left:140px;top:330px;width:900px"><div class="micro">the client</div><div class="h2" style="margin-top:24px">“Hey, where are we<br>on the reels?”</div></div>
  <div class="a" data-k="t2" style="left:140px;top:250px;width:900px">
    <div class="h1 num" style="font-size:100px"><span data-k="c1">0</span> <span style="font-weight:300;font-size:56px;letter-spacing:-.02em">WhatsApp groups</span></div>
    <div class="h1 num" style="font-size:100px;margin-top:22px"><span data-k="c2">0</span> <span style="font-weight:300;font-size:56px;letter-spacing:-.02em">email threads</span></div>
    <div class="h1 num" style="font-size:100px;margin-top:22px"><span data-k="c3">0</span> <span style="font-weight:300;font-size:56px;letter-spacing:-.02em">someone's Google Sheet</span></div></div>
  <div class="a h2" data-k="t3" style="left:140px;top:390px;width:900px">If you run an agency,<br>you know this feeling.</div>
  <div class="a h2" data-k="t4" style="left:140px;top:350px;width:960px">The work is happening.</div>
  <div class="a h2 flame" data-k="t5" style="left:140px;top:450px;width:960px">You just can't see it.</div>
  <div class="a phone" data-k="phone">
    <div style="position:absolute;left:0;right:0;top:90px;text-align:center;color:#fff"><div style="font-size:21px;opacity:.7">Friday 26 September</div><div style="font-size:120px;font-weight:300;letter-spacing:-.04em;line-height:1.1">19:40</div></div>
    <div style="position:absolute;left:0;right:0;top:300px;bottom:0;overflow:hidden">
      ${N.map((n, i) => `<div class="notif a${n[3] ? ' hot' : ''}" data-k="n${i}"><div class="ap"><i></i>${n[0]}<span style="margin-left:auto">now</span></div><div class="tt">${n[1]}</div><div class="tx">${n[2]}</div></div>`).join('')}
    </div>
    <div data-k="dim" style="position:absolute;inset:0;background:#000;opacity:0"></div>
  </div>`;
}, update(lt, r, B, dur) {
  rise(r.t0, lt, B[0], B[1]);
  rise(r.t1, lt, B[1], B[2]);
  rise(r.t2, lt, B[2], B[3]);
  count(r.c1, lt, B[2] + .3, 1.2, 0, 6); count(r.c2, lt, B[2] + 1.4, 1.2, 0, 3); count(r.c3, lt, B[2] + 2.6, .8, 0, 1);
  rise(r.t3, lt, B[3], B[4]);
  rise(r.t4, lt, B[4]); rise(r.t5, lt, B[4] + 1.6);
  /* phone */
  const ph = P(lt, .2, 1.2);
  const shake = lt > B[4] ? Math.sin(lt * 40) * 3 * cl((lt - B[4]) / 1) * (1 - P(lt, dur - 1.5, 1)) : 0;
  st(r.phone, ph, shake, (1 - ph) * 80, 1, shake * .15);
  const times = [B[1] + .2];
  const span = B[3] + 2 - (B[2] + .2);
  for (let i = 1; i < 11; i++) times.push(B[2] + .2 + span * Math.pow(i / 11, .8));
  times.push(B[4] + .4);
  for (let i = 0; i < 12; i++) {
    const el = r['n' + i];
    let slot = 0; for (let j = i + 1; j < 12; j++) slot += P(lt, times[j], .35);
    const pi = P(lt, times[i], .45, E.back);
    el.style.opacity = cl(P(lt, times[i], .2) * (1 - cl((slot - 5) / 1)));
    el.style.transform = `translateY(${20 + slot * 110 - (1 - pi) * 40}px) scale(${.92 + .08 * pi})`;
  }
  r.dim.style.opacity = .55 * P(lt, B[4] + 1.4, 1.2);
}});

/* 2. The idea: so I built m360 */
SC.push({cls: 'bg-paper', html: () => `
  <div class="a" data-k="mark" style="left:460px;top:390px;width:1000px;color:#000">${MARK}</div>
  <div class="a h2 cx" data-k="l1" style="top:560px">The operating system for my agency.</div>
  <div class="a cx" data-k="l2" style="top:700px;display:flex;justify-content:center;gap:22px">
    ${['The work.', 'The clients.', 'The team.', 'The culture.'].map((w, i) => `<span class="a pill${i === 3 ? ' fl' : ' ink'}" data-k="w${i}" style="position:relative;font-size:36px;padding:16px 30px">${w}</span>`).join('')}
  </div>
  <div class="a h1 cx" data-k="r1" style="top:360px"><span class="flame">Results</span> and <span class="flame">culture</span></div>
  <div class="a h2 cx" data-k="r2" style="top:520px;font-weight:400;color:var(--ink62)">are the only two things that count.</div>`,
update(lt, r, B, dur) {
  const m = r.mark;
  const rev = P(lt, B[0], 1.4, E.inout);
  m.style.clipPath = `inset(0 ${100 - rev * 100}% 0 0)`;
  const up = P(lt, B[1], 1, E.inout);
  st(m, 1 - P(lt, B[3], .4), 0, -up * 230, 1 - up * .45);

  <div class="a" data-k="tt" style="left:140px;top:90px"><div class="micro">hq · dashboard</div><div class="h2" style="margin-top:12px">Everything, in one place.</div></div>
  ${[['in today', 11, ' of 12'], ['late today', 1, ''], ['office verified', 100, '%'], ['eod yesterday', 12, ' of 12'], ['outcomes hit', 27, ' of 33'],
     ['tasks overdue', 2, ''], ['high flags', 1, ''], ['weighted pipeline', 18.4, 'L'], ['largest client share', 34, '%'], ['team energy', 4.2, ' / 5']]
    .map((k, i) => `<div class="a tile" data-k="k${i}" style="left:${140 + (i % 5) * 332}px;top:${260 + Math.floor(i / 5) * 200}px;width:310px;height:180px"><div class="micro" style="font-size:16px">${k[0]}</div>
      <div class="v num${i === 6 ? ' flame' : ''}">${i === 7 ? '₹' : ''}<span data-k="kv${i}" data-v="${k[1]}">0</span><span style="font-size:30px;font-weight:400;opacity:.55">${k[2]}</span></div></div>`).join('')}
  <div class="a card" data-k="tape" style="left:140px;top:670px;width:800px;height:340px;padding:28px">
    <div class="micro">the tape · today</div>
    ${[['19:02', 'Riya posted her EOD line'], ['18:40', 'Arjun moved Launch carousel to Done'], ['17:15', 'Meher gave kudos to Kabir'], ['16:58', 'Tara Foods pitch moved to Proposal sent']].map((t, i) => `<div class="a row" data-k="tp${i}" style="position:relative;margin-top:${i ? 12 : 22}px;font-size:22px"><span class="num" style="opacity:.55;width:70px">${t[0]}</span>${t[1]}</div>`).join('')}
  </div>
  <div class="a card" data-k="heat" style="left:980px;top:670px;width:800px;height:340px;padding:28px">
    <div class="micro">mood · last three weeks</div>
    <div style="display:grid;grid-template-columns:repeat(18,1fr);gap:6px;margin-top:22px">
      ${Array.from({length: 18 * 6}, (_, i) => { const v = (Math.sin(i * 7.3) + Math.sin(i * 1.7) + 2) / 4; return `<div data-k="hc${i}" style="height:36px;border-radius:6px;background:${v > .8 ? 'var(--flame)' : `rgba(14,14,14,${(.08 + v * .75).toFixed(2)})`};opacity:0"></div>`; }).join('')}
    </div>
  </div>
  <div class="a card" data-k="ring" style="left:0;top:0;width:330px;height:200px;border:3px solid var(--flame);background:transparent;box-shadow:0 0 0 8px rgba(245,57,1,.12);padding:0"></div>
  <div class="a" data-k="vsh" style="left:0;top:0;width:1920px;height:1080px;background:var(--warm)"></div>
  <div class="a card" data-k="ver" style="left:460px;top:240px;width:1000px;padding:44px">
    <div class="micro">admin · every change kept</div><div class="h3" style="margin-top:12px">Tara Foods, client brain</div>
    ${[['Today 16:02', 'Meher', 'current'], ['Today 11:40', 'Arjun', ''], ['Yesterday 18:15', 'Riya', '']].map((v, i) => `<div class="row" style="margin-top:${i ? 12 : 30}px;padding:18px 22px;border-radius:16px;background:var(--warm);font-size:24px"><span class="num" style="width:230px">${v[0]}</span><span>${v[1]}</span>${v[2] ? '<span class="pill ink" style="margin-left:auto">current</span>' : `<span class="btn sec" data-k="rv${i}" style="margin-left:auto;height:50px;font-size:19px">Revert to this</span>`}</div>`).join('')}
    <div class="a pill ink" data-k="done" style="position:relative;margin-top:24px;font-size:22px;padding:10px 20px">✓ Restored. Nothing is ever lost.</div>
  </div>
  <div class="a bg-dark" data-k="dk" style="left:0;top:0;width:1920px;height:1080px">
    <div class="a h2 cx" data-k="d1" style="top:330px;color:rgba(255,255,255,.6);font-weight:400">I don't have to parent anyone.</div>
    <div class="a h1 cx" data-k="d2" style="top:450px">The system does the checking.</div>
    <div class="a h1 cx flame" data-k="d3" style="top:600px">So I can do the thinking.</div>
  </div>
  ${CURSOR}`,
update(lt, r, B, dur) {
  rise(r.tt, lt, B[0]);
  for (let i = 0; i < 10; i++) {
    pop(r['k' + i], lt, B[0] + .4 + i * .12, Infinity, .85);
    const el = r['kv' + i], v = +el.dataset.v;
    count(el, lt, B[0] + .6 + i * .12, 1.6, 0, v, x => v % 1 ? x.toFixed(1) : Math.round(x));
  }
  rise(r.tape, lt, B[0] + 1.6); rise(r.heat, lt, B[0] + 1.8);
  for (let i = 0; i < 4; i++) rise(r['tp' + i], lt, B[0] + 2.2 + i * .3);
  for (let i = 0; i < 108; i++) r['hc' + i].style.opacity = P(lt, B[0] + 2 + (i % 18) * .05 + Math.floor(i / 18) * .08, .4);
  /* the ring walks the tiles as the lines name them */
  const seq = [0, 3, 6, 7, 9], seg = (B[2] - B[1]) / 5.4;
  const keys = seq.map((k, i) => [B[1] + i * seg, 140 + (k % 5) * 332 - 10, 260 + Math.floor(k / 5) * 200 - 10]);
  const hk = []; keys.forEach((k, i) => { hk.push(k); hk.push([k[0] + seg - .35, k[1], k[2]]); });
  const [rx, ry] = track(lt, hk);
  st(r.ring, vis(lt, B[1], B[2] - .2, .3, .3), rx, ry);
  r.ver.style.opacity = vis(lt, B[2], B[3] - .1);
  r.vsh.style.opacity = .75 * vis(lt, B[2], B[3] - .1);
  r.ver.style.transform = `translateY(${(1 - P(lt, B[2], .6)) * 40}px)`;
  const rvAt = B[2] + 3;
  pop(r.done, lt, rvAt + .3);
  cursor(r, lt, [[0, 1600, 950], [rvAt - 1.2, 1600, 950], [rvAt - .1, 1330, 468]], [rvAt], [B[2] + .5, B[3] - .2]);
  r.dk.style.opacity = P(lt, B[3], .6);
  rise(r.d1, lt, B[3] + .3); rise(r.d2, lt, B[3] + 2.4); rise(r.d3, lt, B[3] + 4.4);
}});

/* 10. Close */
SC.push({cls: 'bg-paper', html: () => `
  <div class="a" data-k="mark" style="left:660px;top:250px;width:600px;color:#000">${MARK}</div>
  <div class="a h1 cx" data-k="l1" style="top:520px"><span class="flame">Results</span> and <span class="flame">culture.</span></div>
  <div class="a h2 cx" data-k="l2" style="top:660px;font-weight:400;color:var(--ink62)">The only two things that count.</div>
  <div class="a micro cx" data-k="l3" style="top:900px;justify-content:center">m360 os</div>`,
update(lt, r, B, dur) {
  const rev = P(lt, 0.2, 1.4, E.inout);
  r.mark.style.clipPath = `inset(0 ${100 - rev * 100}% 0 0)`;
  st(r.mark, 1, 0, 0, 1 + .04 * (lt / dur));
  rise(r.l1, lt, B[2]);
  rise(r.l2, lt, B[2] + 1.6);
  rise(r.l3, lt, B[2] + 3);
}});

/* ---------- assembly ---------- */
const stage = document.getElementById('stage');
let T0 = 0;
const scenes = SC.map((s, i) => {
  const T = SCENES_T[i];
  const el = document.createElement('div');
  el.className = 'scene ' + s.cls;
  el.innerHTML = `<div class="cam">${s.html()}</div>`;
  stage.appendChild(el);
  const r = {root: el};
  el.querySelectorAll('[data-k]').forEach(n => { r[n.dataset.k] = n; });
  const total = T.words.reduce((a, b) => a + b, 0);
  let acc = 0;
  const B = T.words.map(w => { const b = LEAD + acc / total * (T.dur - LEAD - TAIL); acc += w; return b; });
  const sc = {el, cam: el.firstChild, r, B, dur: T.dur, start: T0, update: s.update};
  T0 += T.dur;
  return sc;
});
const TOTAL = T0 + 1.0;
window.TOTAL = TOTAL;
window.seek = function (t) {
  for (let i = 0; i < scenes.length; i++) {
    const s = scenes[i], lt = t - s.start;
    const on = lt > -0.01 && lt < s.dur + XF + .05;
    if (!on) { s.el.style.opacity = 0; s.el.style.display = 'none'; continue; }
    s.el.style.display = '';
    /* scenes cross fade: the next one fades in on top of this one */
    const fin = i === 0 ? 1 : P(lt, 0, XF, E.inout);
    const fout = i === scenes.length - 1 ? 1 - P(lt, s.dur, 1, E.inout) : 1;
    s.el.style.opacity = fin * fout;
    s.el.style.zIndex = i;
    s.cam.style.transform = `scale(${1 + .03 * cl(lt / s.dur)})`;
    s.update(lt, s.r, s.B, s.dur);
  }
};
/* live preview: open the page in a browser to play it; ?t=seconds seeks */
const q = new URLSearchParams(location.search);
if (!q.has('render')) {
  const scale = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); document.body.style.transform = `scale(${k})`; document.body.style.transformOrigin = '0 0'; };
  addEventListener('resize', scale); scale();
  const start = performance.now() - (+q.get('t') || 0) * 1000;
  const loop = () => { const t = (performance.now() - start) / 1000; seek(t % TOTAL); requestAnimationFrame(loop); };
  if (q.has('t') && q.has('still')) seek(+q.get('t')); else loop();
}
</script>
