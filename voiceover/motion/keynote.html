<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>m360 OS, the 90 second keynote</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url(sg-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url(sg-latin-ext.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url(sg-rupee.woff2) format('woff2');unicode-range:U+20B9}
:root{--ink:#0E0E0E;--flame:#F53901;--paper:#fff;--warm:#F7F6F2}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Space Grotesk','Noto Color Emoji',sans-serif;font-weight:300;color:#fff;-webkit-font-smoothing:antialiased}
b{font-weight:600}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0A0A0A}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1c1b19 0%,#0A0A0A 70%)}
.scene.paper{background:var(--warm);color:var(--ink)}
.a{position:absolute;opacity:0;will-change:transform,opacity}
.cx{left:0;right:0;text-align:center}
.h0{font-weight:600;font-size:200px;letter-spacing:-.05em;line-height:.95}
.h1{font-weight:600;font-size:132px;letter-spacing:-.045em;line-height:.98}
.h2{font-weight:600;font-size:80px;letter-spacing:-.04em;line-height:1.02}
.h3{font-weight:500;font-size:48px;letter-spacing:-.03em;line-height:1.1}
.sub{font-weight:300;font-size:36px;color:rgba(255,255,255,.62)}
.flame{color:var(--flame)}
.micro{font-size:20px;font-weight:400;letter-spacing:.16em;text-transform:lowercase;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:12px}
.micro::before{content:"";width:9px;height:9px;border-radius:9px;background:var(--flame);flex:none}
/* a real screen, 1440x900 css px, framed like a floating window */
.win{position:absolute;left:0;top:0;width:1440px;height:900px;border-radius:26px;overflow:hidden;background:#F7F6F2;box-shadow:0 60px 140px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);transform-origin:0 0;will-change:transform,opacity}
.camv{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;will-change:transform}
.camv img{position:absolute;left:0;top:0;width:1440px;height:900px;display:block}
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;z-index:50;opacity:0;pointer-events:none}
.cursor svg{width:34px;height:34px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.ripple{position:absolute;width:70px;height:70px;border-radius:99px;border:3px solid var(--flame);opacity:0;z-index:49}
.ring{position:absolute;border:3px solid var(--flame);border-radius:14px;box-shadow:0 0 0 6px rgba(245,57,1,.16),0 0 40px rgba(245,57,1,.25);opacity:0;z-index:48}
.dim{position:absolute;inset:0;background:#0A0A0A;opacity:0;pointer-events:none}
/* captions: the black keynote pill */
.cap{position:absolute;left:96px;bottom:60px;background:#0A0A0A;color:#fff;border-radius:22px;padding:22px 38px;font-size:46px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);z-index:60}
.cap.fl{background:var(--flame)}
.cap.white{background:#fff;color:var(--ink)}
.cap .k{color:rgba(255,255,255,.5);font-weight:400;margin-right:10px}
.words{position:absolute;left:96px;bottom:60px;display:flex;gap:16px;z-index:60}
.words .w{position:relative;opacity:0;background:#0A0A0A;color:#fff;border-radius:22px;padding:22px 34px;font-size:46px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
.words .w.fl{background:var(--flame)}
/* phone for the hook */
.phone{left:1190px;top:80px;width:470px;height:920px;border-radius:62px;background:#141414;border:10px solid #2a2a2a;overflow:hidden;box-shadow:0 60px 140px rgba(0,0,0,.7)}
.notif{position:absolute;left:18px;right:18px;height:96px;border-radius:22px;background:rgba(255,255,255,.1);padding:14px 18px;color:#fff}
.notif .ap{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);display:flex;gap:8px;align-items:center}
.notif .ap i{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.35);display:inline-block}
.notif.hot{background:rgba(245,57,1,.92)} .notif.hot .ap{color:rgba(255,255,255,.85)} .notif.hot .ap i{background:#fff}
.notif .tt{font-weight:600;font-size:20px;margin-top:4px}
.notif .tx{font-size:19px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid-l{position:absolute;color:#fff;font-size:26px;font-weight:500;letter-spacing:-.01em;opacity:0;text-align:center}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage"></div>
<script src="mark.js"></script>
<script src="boxes.js"></script>
<script>
'use strict';
/* ---------- timing: one entry per line group of m360-keynote-90s.md ----------
   dur is seconds for the group, words the word count of each line, so the beats land on the lines.
   With the real ElevenLabs clip, put each group's measured length into dur. */
const SCENES_T = [
  {dur: 11.5, words: [4, 9, 10, 9]},          /* hook */
  {dur: 4.6, words: [4, 7]},                  /* reveal */
  {dur: 9.4, words: [3, 3, 6, 8, 3]},         /* the day */
  {dur: 7.2, words: [3, 5, 4, 5]},            /* the week */
  {dur: 10.2, words: [4, 3, 9, 3, 6]},        /* the game */
  {dur: 7.8, words: [4, 4, 11]},              /* the vibe */
  {dur: 12.2, words: [11, 6, 8, 6]},          /* clients and new business */
  {dur: 4.6, words: [11]},                    /* the buddy */
  {dur: 6.2, words: [10, 2]},                 /* everything else */
  {dur: 4.4, words: [7]},                     /* the founder */
  {dur: 5.6, words: [1, 9]}                   /* close */
];
const LEAD = 0.3, TAIL = 0.5, XF = 0.28;

/* ---------- motion helpers ---------- */
const E = {
  out: t => 1 - Math.pow(1 - t, 3),
  inout: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  snap: t => 1 - Math.pow(1 - t, 5)
};
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (lt, a, d = .5, e = E.out) => e(cl((lt - a) / d));
function st(el, o, x = 0, y = 0, s = 1, r = 0) { el.style.opacity = o; el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; }
function vis(lt, a, b = Infinity, din = .4, dout = .3) { return P(lt, a, din) * (1 - P(lt, b, dout, E.inout)); }
function rise(el, lt, a, b = Infinity, dy = 36, d = .5) { const pi = P(lt, a, d), po = P(lt, b, .3, E.inout); st(el, pi * (1 - po), 0, (1 - pi) * dy - po * 16); }
function pop(el, lt, a, b = Infinity, s0 = .6, d = .45) { const pi = P(lt, a, d, E.back), po = P(lt, b, .28, E.inout); st(el, cl(P(lt, a, .18)) * (1 - po), 0, 0, (s0 + (1 - s0) * pi) * (1 - po * .1)); }
function count(el, lt, a, d, v0, v1, fmt = x => Math.round(x).toLocaleString('en-IN')) { el.textContent = fmt(v0 + (v1 - v0) * P(lt, a, d, E.inout)); }
function track(lt, keys, e = E.inout) {
  if (lt <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (lt <= keys[i][0]) {
    const A = keys[i - 1], B = keys[i], p = e((lt - A[0]) / (B[0] - A[0]));
    return A.slice(1).map((v, k) => v + (B[k + 1] - v) * p);
  }
  return keys[keys.length - 1].slice(1);
}
/* the window: place a 1440x900 screen on the 1920x1080 stage */
const FULL = {x: 96, y: 0, s: 1.2};                 /* fills the height, 96px either side */
function place(win, o, x = FULL.x, y = FULL.y, s = FULL.s, dy = 0) { win.style.opacity = o; win.style.transform = `translate(${x}px,${y + dy}px) scale(${s})`; }
/* the camera inside a window: centre a box (css px of the 1440x900 page) at a zoom */
/* boxes the capture could not measure, drawn by hand from the screens (css px of the 1440x900 page) */
const MANUAL = {'day-before': {card: [912, 84, 412, 214]}, 'day-mood': {card: [912, 84, 412, 214]}, 'day-eod': {eod: [300, 330, 642, 400], blocked: [320, 612, 602, 48]}, pulse: {energy: [298, 60, 1080, 430]}};
const BOX = (shot, key) => { const b = ((MANUAL[shot] || {})[key]) || ((BOXES[shot] || {})[key]) || [0, 0, 1440, 900]; return [b[0], b[1], b[2], Math.min(b[3], 900)]; };
function camOf(shot, key, pad = 40, maxZ = 1.85, minZ = 1) {
  const b = BOX(shot, key);
  const z = Math.max(1, minZ, Math.min(maxZ, 1440 / (b[2] + 2 * pad), 900 / (b[3] + 2 * pad)));
  return [b[0] + b[2] / 2, b[1] + b[3] / 2, z];
}
const HOME = [720, 450, 1];
function cam(v, cx, cy, z) {
  let tx = 720 - z * cx, ty = 450 - z * cy;
  tx = cl(tx, 1440 - 1440 * z, 0); ty = cl(ty, 900 - 900 * z, 0);
  v.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
}
function camTrack(v, lt, keys) { const [cx, cy, z] = track(lt, keys); cam(v, cx, cy, z); }
/* keys: [[t, shot, key, pad?, maxZ?] ...] where key 'home' is the whole screen */
const MOVE = .5;
function camKeys(spec) {
  const out = []; let prev = null;
  for (const k of spec) {
    const c = k[2] === 'home' ? HOME : camOf(k[1], k[2], k[3], k[4], k[5]);
    const same = prev && Math.abs(prev[0] - c[0]) < .5 && Math.abs(prev[1] - c[1]) < .5 && Math.abs(prev[2] - c[2]) < .001;
    const d = k[6] != null ? k[6] : MOVE;
    if (!prev || same) out.push([k[0], c[0], c[1], c[2]]);
    else { out.push([k[0], prev[0], prev[1], prev[2]]); out.push([k[0] + Math.max(.001, d), c[0], c[1], c[2]]); }
    prev = c;
  }
  return out;
}
/* a window that cuts in hard, with a small settle, over one or more [in, out] ranges */
function cutIn(win, lt, ...ranges) {
  let o = 0, pp = 1;
  for (const [a, b] of ranges) { o += vis(lt, a, b, .01, .2); if (lt >= a - .01 && lt < b) pp = .965 + .035 * P(lt, a, .4); }
  const s = FULL.s * pp;
  place(win, cl(o), 960 - 720 * s, 540 - 450 * s, s);
}
/* highlight ring on a box */
function ring(el, lt, a, b, shot, key, pad = 10) {
  const bx = BOX(shot, key);
  el.style.left = (bx[0] - pad) + 'px'; el.style.top = (bx[1] - pad) + 'px'; el.style.width = (bx[2] + 2 * pad) + 'px'; el.style.height = (bx[3] + 2 * pad) + 'px';
  const p = P(lt, a, .35, E.back), pulse = 1 + .015 * Math.sin((lt - a) * 9);
  el.style.opacity = vis(lt, a, b, .2, .25);
  el.style.transform = `scale(${(0.8 + .2 * p) * pulse})`;
}
function cursor(r, lt, keys, clicks, show = [0, Infinity]) {
  const [x, y] = track(lt, keys);
  let s = 1, ro = 0, rs = .3;
  for (const c of clicks) { const k = lt - c; if (k > 0 && k < .25) s = 1 - .25 * Math.sin(k / .25 * Math.PI); if (k > 0 && k < .5) { ro = 1 - k / .5; rs = .3 + k / .5 * 1.1; } }
  st(r.cur, vis(lt, show[0], show[1], .25, .25), x, y, s);
  st(r.rip, ro, x - 35 + 4, y - 35 + 3, rs);
}
const CURSOR = `<div class="cursor" data-k="cur"><svg viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#0A0A0A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="ripple" data-k="rip"></div>`;
const bc = (shot, key) => { const b = BOX(shot, key); return [b[0] + b[2] / 2, b[1] + b[3] / 2]; };
/* a window with one or more screenshots stacked; the first is visible */
function W(name, shots, extra = '') {
  return `<div class="win a" data-k="w_${name}"><div class="camv" data-k="v_${name}">${shots.map((s, i) => `<img data-k="i_${name}_${i}" src="capture/shots/${s}.png" style="opacity:${i ? 0 : 1}">`).join('')}${extra}</div></div>`;
}
function show(r, name, n, idx) { for (let i = 0; i < n; i++) r[`i_${name}_${i}`].style.opacity = i === idx ? 1 : 0; }
const CAP = (k, txt, cls = '') => `<div class="cap a ${cls}" data-k="${k}">${txt}</div>`;
const WORDS = (k, words) => `<div class="words" data-k="${k}">${words.map((w, i) => `<span class="w${/!$/.test(w) ? ' fl' : ''}" data-k="${k}${i}">${w.replace(/!$/, '')}</span>`).join('')}</div>`;
function words(r, k, n, lt, a, gap = .3, b = Infinity) { for (let i = 0; i < n; i++) pop(r[k + i], lt, a + i * gap, b, .5, .38); }
function cap(r, k, lt, a, b = Infinity) { const p = P(lt, a, .42, E.back), o = cl(P(lt, a, .15)) * (1 - P(lt, b, .25, E.inout)); r[k].style.opacity = o; r[k].style.transform = `translateY(${(1 - p) * 30}px) scale(${.85 + .15 * p})`; }

/* ---------- scenes ---------- */
const SC = [];

/* 1. the hook */
SC.push({html: () => {
  const N = [['WhatsApp', 'Client: Tara Foods', 'Hey, where are we on the reels?', 1], ['WhatsApp', 'Reels team', 'who has the latest cut?'],
    ['Gmail', 'Re: Fwd: Re: reels status', 'Looping in the team here...'], ['WhatsApp', 'Design x Strategy', 'which version did we send them'],
    ['Sheets', 'Tracker_v7_FINAL', '3 people edited this sheet'], ['WhatsApp', 'Shoot day 2', 'did the call time move?'],
    ['Gmail', 'Re: approvals', 'Did they approve v2 or v3?'], ['WhatsApp', 'Edits', 'final_final_v4.mp4'],
    ['WhatsApp', 'Accounts', 'any update for the client?'], ['Gmail', 'Fwd: brief', 'see below, see below'],
    ['WhatsApp', 'Reels team', '@all where are we on this'], ['WhatsApp', 'Client: Tara Foods', 'Hello?', 1]];
  return `<div class="a" data-k="t0" style="left:120px;top:380px"><div class="micro">friday</div><div class="h0 num" style="margin-top:20px">7:40<span style="font-size:110px;letter-spacing:-.03em;font-weight:300"> pm</span></div></div>
  <div class="a" data-k="t1" style="left:120px;top:330px;width:960px"><div class="micro">the client</div><div class="h1" style="margin-top:24px;font-size:112px">“Where are we<br>on the reels?”</div></div>
  <div class="a" data-k="t2" style="left:120px;top:230px;width:1000px">
    <div class="h1 num"><span data-k="c1">0</span> <span class="sub" style="font-size:64px">WhatsApp groups</span></div>
    <div class="h1 num" style="margin-top:26px"><span data-k="c2">0</span> <span class="sub" style="font-size:64px">email threads</span></div>
    <div class="h1 num" style="margin-top:26px"><span data-k="c3">0</span> <span class="sub" style="font-size:64px">very sad spreadsheet</span></div></div>
  <div class="a h1" data-k="t3" style="left:120px;top:340px;width:1000px;font-size:104px">The work is<br>happening.</div>
  <div class="a h1 flame" data-k="t4" style="left:120px;top:640px;width:1000px;font-size:104px">You just can't see it.</div>
  <div class="a phone" data-k="phone">
    <div style="position:absolute;left:0;right:0;top:80px;text-align:center;color:#fff"><div style="font-size:21px;opacity:.7">Friday</div><div style="font-size:116px;font-weight:300;letter-spacing:-.04em;line-height:1.1">19:40</div></div>
    <div style="position:absolute;left:0;right:0;top:290px;bottom:0;overflow:hidden">${N.map((n, i) => `<div class="notif a${n[3] ? ' hot' : ''}" data-k="n${i}"><div class="ap"><i></i>${n[0]}<span style="margin-left:auto">now</span></div><div class="tt">${n[1]}</div><div class="tx">${n[2]}</div></div>`).join('')}</div>
    <div class="dim" data-k="dim"></div></div>`;
}, update(lt, r, B, dur) {
  rise(r.t0, lt, B[0], B[1]); rise(r.t1, lt, B[1], B[2]); rise(r.t2, lt, B[2], B[3]);
  count(r.c1, lt, B[2] + .1, .7, 0, 6); count(r.c2, lt, B[2] + .9, .6, 0, 3); count(r.c3, lt, B[2] + 1.7, .4, 0, 1);
  rise(r.t3, lt, B[3] + .3); rise(r.t4, lt, B[3] + 1.5);
  const ph = P(lt, .1, .9, E.back);
  const shake = lt > B[3] ? Math.sin(lt * 45) * 3 * cl((lt - B[3]) / .8) * (1 - P(lt, dur - 1, .8)) : 0;
  st(r.phone, cl(P(lt, .1, .3)), shake, (1 - ph) * 120, .9 + .1 * ph, shake * .15);
  const times = [B[1] + .15]; const span = (B[3] + 1.2) - (B[2] + .1);
  for (let i = 1; i < 11; i++) times.push(B[2] + .1 + span * Math.pow(i / 11, .85));
  times.push(B[3] + .3);
  for (let i = 0; i < 12; i++) {
    const el = r['n' + i]; let slot = 0; for (let j = i + 1; j < 12; j++) slot += P(lt, times[j], .28);
    const pi = P(lt, times[i], .38, E.back);
    el.style.opacity = cl(P(lt, times[i], .15) * (1 - cl((slot - 5) / 1)));
    el.style.transform = `translateY(${16 + slot * 108 - (1 - pi) * 40}px) scale(${.9 + .1 * pi})`;
  }
  r.dim.style.opacity = .55 * P(lt, B[3] + 1.2, 1);
}});

/* 2. the reveal */
SC.push({html: () => `
  <div class="a" data-k="mark" style="left:410px;top:300px;width:1100px;color:#fff">${MARK}</div>
  <div class="a h2 cx" data-k="l1" style="top:700px;font-size:64px;color:rgba(255,255,255,.8);font-weight:400">One operating system for the whole agency.</div>
  ${W('home', ['day-before'])}`,
update(lt, r, B, dur) {
  const rev = P(lt, B[0], .9, E.inout);
  r.mark.style.clipPath = `inset(0 ${100 - rev * 100}% 0 0)`;
  const up = P(lt, B[1], .7, E.inout);
  st(r.mark, 1 - P(lt, B[1] + 1.2, .35), 0, -up * 180, 1 - up * .5);
  rise(r.l1, lt, B[1] + .1, B[1] + 1.4);
  const w = P(lt, B[1] + 1.2, dur - B[1] - 1.2, E.out);
  place(r.w_home, cl(P(lt, B[1] + 1.2, .3)), FULL.x, FULL.y, FULL.s, (1 - w) * 1100);
  cam(r.v_home, 720, 450, 1);
}});

/* 3. the day: mood, check in, EOD line, the blocker flags itself */
SC.push({html: () => `
  ${W('a', ['day-before', 'day-mood', 'day-after'], CURSOR + '<div class="ring" data-k="rg1"></div>')}
  ${W('b', ['day-eod'], '<div class="ring" data-k="rg2"></div>')}
  ${W('c', ['day-rules', 'command-flags'], '<div class="ring" data-k="rg3"></div><div class="ring" data-k="rg4"></div>')}
  ${CAP('c1', 'on fire', 'fl')}${CAP('c2', '<span class="k">✓</span>Verified. Mumbai office.')}
  ${WORDS('eod', ['shipped', 'next', 'blocked!'])}
  ${CAP('c3', 'It flags itself.', 'fl')}
  <div class="dim a" data-k="dim"></div>
  <div class="a h1 cx" data-k="big" style="top:440px">Nobody chases anybody.</div>`,
update(lt, r, B, dur) {
  const moodAt = B[0] + .55, inAt = B[1] + .45;
  cutIn(r.w_a, lt, [0, B[2]]);
  show(r, 'a', 3, lt < moodAt ? 0 : lt < inAt ? 1 : 2);
  camTrack(r.v_a, lt, camKeys([[0, 'day-before', 'home'], [B[0] + .45, 'day-before', 'card', 60, 1.6], [B[1] + .2, 'day-before', 'card', 60, 1.6], [B[1] + .7, 'day-after', 'in', 120, 1.85]]));
  const m = bc('day-before', 'mood'), ci = bc('day-before', 'checkin');
  cursor(r, lt, [[0, 1300, 800], [B[0] + .1, 1300, 800], [moodAt - .05, m[0], m[1]], [B[1] + .05, m[0], m[1]], [inAt - .05, ci[0], ci[1]], [inAt + .4, ci[0] + 60, ci[1] + 40]], [moodAt, inAt], [B[0], inAt + .5]);
  ring(r.rg1, lt, inAt + .5, B[2], 'day-after', 'in', 14);

/* ---------- assembly ---------- */
const stage = document.getElementById('stage');
let T0 = 0;
const scenes = SC.map((s, i) => {
  const T = SCENES_T[i];
  const el = document.createElement('div');
  el.className = 'scene' + (s.cls ? ' ' + s.cls : '');
  el.innerHTML = s.html();
  stage.appendChild(el);
  const r = {root: el};
  el.querySelectorAll('[data-k]').forEach(n => { r[n.dataset.k] = n; });
  const total = T.words.reduce((a, b) => a + b, 0);
  let acc = 0;
  const B = T.words.map(w => { const b = LEAD + acc / total * (T.dur - LEAD - TAIL); acc += w; return b; });
  const sc = {el, r, B, dur: T.dur, start: T0, update: s.update};
  T0 += T.dur;
  return sc;
});
const TOTAL = T0 + 1.0;
window.TOTAL = TOTAL;
window.seek = function (t) {
  for (let i = 0; i < scenes.length; i++) {
    const s = scenes[i], lt = t - s.start;
    const on = lt > -0.01 && lt < s.dur + XF + .05;
    if (!on) { s.el.style.opacity = 0; s.el.style.display = 'none'; continue; }
    s.el.style.display = '';
    const fin = i === 0 ? 1 : P(lt, 0, XF, E.inout);
    const fout = i === scenes.length - 1 ? 1 - P(lt, s.dur, 1, E.inout) : 1;
    s.el.style.opacity = fin * fout;
    s.el.style.zIndex = i;
    s.update(lt, s.r, s.B, s.dur);
  }
};
window.READY = false;
Promise.all(Array.from(document.images).map(im => im.decode().catch(() => null))).then(() => { window.READY = true; });
const q = new URLSearchParams(location.search);
if (!q.has('render')) {
  const scale = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); document.body.style.transform = `scale(${k})`; document.body.style.transformOrigin = '0 0'; };
  addEventListener('resize', scale); scale();
  const start = performance.now() - (+q.get('t') || 0) * 1000;
  const loop = () => { const t = (performance.now() - start) / 1000; seek(t % TOTAL); requestAnimationFrame(loop); };
  if (q.has('t') && q.has('still')) seek(+q.get('t')); else loop();
}
