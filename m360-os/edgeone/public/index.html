/* ==== 59-mic.js ==== */
/* module: mic. A talk button: tap, speak, tap again, and the words land in a field.
   Uses the browser's speech recognition where it exists; says so where it does not. */
'use strict';
(function () {
  const {html, React, UI, icons} = M;
  const {useState, useRef, useEffect} = React;
  const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;

  function MicButton({onText, label, sm}) {
    const [live, setLive] = useState(false);
    const rec = useRef(null);
    const heard = useRef('');
    useEffect(() => () => { if (rec.current) { try { rec.current.abort(); } catch (e) { /* stopped */ } } }, []);
    const stop = () => {
      if (rec.current) { try { rec.current.stop(); } catch (e) { /* stopped */ } rec.current = null; }
      setLive(false);
      if (heard.current.trim()) { onText(heard.current.trim()); M.sound.play('soft'); }
      heard.current = '';
    };
    const start = () => {
      const S = SR();
      if (!S) { M.toast('Voice is off in this browser. Type instead', true); return; }
      try {
        const r = new S();
        r.lang = 'en-IN'; r.interimResults = true; r.continuous = true;
        r.onresult = ev => { let t = ''; for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; heard.current = t; };
        r.onerror = () => { rec.current = null; setLive(false); M.toast('Voice is off here. Type instead', true); };
        r.onend = () => { if (rec.current === r) { rec.current = null; setLive(false); if (heard.current.trim()) { onText(heard.current.trim()); heard.current = ''; } } };
        rec.current = r; heard.current = ''; r.start(); setLive(true);
      } catch (e) { M.toast('Voice is off here. Type instead', true); }
    };
    return html`<button type="button" class=${'btn sec micbtn' + (sm === false ? '' : ' sm') + (live ? ' live' : '')} aria-pressed=${live} onClick=${live ? stop : start}>
      <${icons.voice}/>${live ? 'Listening, tap to stop' : (label || 'Say it')}</button>`;
  }

  M.parts.MicButton = MicButton;
})();

/* module: team. Getting people in: the join screen for anyone not on the roster yet,
   join requests the founder approves in one tap, and the invite link card. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState} = React;

  /* the published page; people open this link to join */
  M.APP_URL = 'https://claude.ai/artifact/D6nbirdVBLqU3ZD9qrA8Yq';
  const INVITE = () => window.M360_STANDALONE
    ? 'You are on m360 OS, the Mask360 workspace. Open ' + M.APP_URL + ', type your name, tap Ask to join and you are in once Kaavish lets you in.'
    : 'You are on m360 OS, the Mask360 workspace. Open ' + M.APP_URL + ', sign in to Claude, tap Ask to join and you are in once Kaavish lets you in.';

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); M.toast('Copied'); return true; }
    catch (e) { M.toast('Copy is blocked here. Select the text and copy it.', true); return false; }
  }

  M.team = {
    /* pending requests, newest first, skipping anyone already active on the roster */
    requests(ctx) {
      const map = (ctx.coll.join && ctx.coll.join.map) || {};
      return Object.keys(map)
        .filter(id => !(ctx.members[id] && ctx.members[id].active !== false))
        .map(id => ({uid: id, at: map[id].at || 0, title: String(map[id].title || '').slice(0, 60)}))
        .sort((a, b) => b.at - a.at);
    },
    clear(ctx, id) { return ctx.W.del('join/' + id).catch(() => {}); }
  };

  /* ---------- the join screen, for anyone signed in but not on the roster ---------- */
  function JoinGate() {
    const ctx = M.useCtx();
    const mine = M.useDoc(ctx.db, 'join/' + ctx.uid);
    const [title, setTitle] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState('');
    const removed = ctx.member && ctx.member.active === false;
    /* can this viewer write at all? guests from outside the organisation and view-only people cannot */
    const [locked, setLocked] = useState(null);
    React.useEffect(() => {
      let live = true;
      (async () => {
        let canWrite = null, guest = false;
        try { canWrite = ctx.user && ctx.user.can ? await ctx.user.can('data.write') : null; } catch (e) { canWrite = null; }
        try { const ps = await ctx.user.profiles([ctx.uid]); guest = !!(ps[ctx.uid] && ps[ctx.uid].guest); } catch (e) { guest = false; }
        if (live && (guest || canWrite === false)) setLocked(guest ? 'guest' : 'view');
      })();
      return () => { live = false; };
    }, [ctx.uid]);

    async function ask() {
      setBusy(true); setErr('');
      try {
        await ctx.db.doc('join/' + ctx.uid).set({at: Date.now(), title: title.trim().slice(0, 60)});
      } catch (e) {
        const code = e && e.code;
        if (code === 'invalid_argument' || code === 'not_granted') setLocked('view');
        else setErr('That did not send. Try again in a moment.');
      }
      setBusy(false);
    }
    async function cancel() {
      try { await ctx.db.doc('join/' + ctx.uid).delete(); } catch (e) { /* stays pending */ }
    }

    const sent = mine.ready && !!mine.data;
    if (locked && !sent) {
      return html`<${M.Gate} title="Almost there"
        line=${locked === 'guest'
          ? 'You are signed in with a Claude account outside the Mask360 organisation, so this page is read only for you. Kaavish adds you to the organisation, then you reload and ask to join.'
          : 'Your access to this page is view only. Kaavish sets you to Can interact in Share, then you reload and ask to join.'}>
        <div class="join-box"><div class="row" style=${{justifyContent: 'center'}}>
          <${UI.Avatar} id=${ctx.uid} size=${40}/>
          <span style=${{fontWeight: 500}}><${UI.Name} id=${ctx.uid} fallback="You"/></span>
        </div></div>
      <//>`;
    }
    const title0 = sent ? 'Request sent' : removed ? 'Your access is paused' : 'Welcome to m360';
    const line = sent
      ? 'Kaavish sees it on HQ. This page opens by itself the moment you are let in.'
      : removed ? 'Ask to come back and Kaavish can switch you on again.'
      : 'You are signed in. Ask to join and Kaavish lets you in with one tap.';

    return html`<${M.Gate} title=${title0} line=${line}>
      <div class="join-box">
        <div class="row" style=${{justifyContent: 'center', marginBottom: '14px'}}>
          <${UI.Avatar} id=${ctx.uid} size=${40}/>
          <span style=${{fontWeight: 500}}><${UI.Name} id=${ctx.uid} fallback="You"/></span>
        </div>
        ${sent ? html`<div class="stack tight" style=${{alignItems: 'center'}}>
            <${UI.Pill} kind="flame-o">waiting for approval<//>
            <button type="button" class="linky small" onClick=${cancel}>Cancel request</button>
          </div>`
          : html`<div class="stack tight">
            <${UI.Input} id="join-title" label="your role, optional" value=${title} placeholder="Designer, strategist, editor"
              onChange=${setTitle} onEnter=${ask}/>
            <${UI.Btn} onClick=${ask} disabled=${busy || !mine.ready}>${busy ? 'Sending' : 'Ask to join'}<//>
            ${err ? html`<div class="small flame-t" role="alert">${err}</div>` : null}
          </div>`}
      </div>
    <//>`;
  }

  /* ---------- founder: requests waiting ---------- */
  function JoinRequests({onApprove}) {
    const ctx = M.useCtx();
    const reqs = M.team.requests(ctx);
    if (!reqs.length) return null;
    return html`<${UI.Card} flame=${true} id="join-requests" title=${'Waiting to join'}
      action=${html`<${UI.Pill} kind="flame">${reqs.length}<//>`}>
      <div class="stack tight">
        ${reqs.map(r => html`<div class="listrow" key=${r.uid}>
          <${UI.Avatar} id=${r.uid} size=${32}/>
          <div class="grow">
            <div style=${{fontWeight: 500}}><${UI.Name} id=${r.uid}/></div>
            <div class="tiny ink62">${r.title ? r.title + ' · ' : ''}asked ${U.timeAgo(r.at)}</div>
          </div>
          <span class="row nowrap">
            <${UI.Btn} sm=${true} onClick=${() => onApprove(r)}>Let them in<//>
            <${UI.ConfirmBtn} kind="ghost" sm=${true} onConfirm=${() => M.team.clear(ctx, r.uid).then(() => M.toast('Declined'))}>Decline<//>
          </span>
        </div>`)}
      </div>
    <//>`;
  }

  /* ---------- founder: how to invite ---------- */
  function InviteCard({open}) {
    const [show, setShow] = useState(!!open);
    return html`<${UI.Card} id="invite-card" title="Invite your team"
      action=${show ? null : html`<${UI.Btn} kind="sec" sm=${true} onClick=${() => setShow(true)}>Show how<//>`}>
      ${show ? html`<div class="stack" style=${{gap: '14px'}}>
        ${window.M360_STANDALONE ? html`<ol class="steps">
          <li><b>Send them the link.</b> Copy the message below into WhatsApp or Slack.</li>
          <li><b>They ask to join.</b> They open it, type their name and tap Ask to join. Nothing to install.</li>
          <li><b>Let them in.</b> Their request lands here and on HQ, you tap Let them in. For a new phone, send them a sign-in link from the team list.</li>
        </ol>` : html`<ol class="steps">
          <li><b>Give them a seat.</b> Everyone signs in with a Claude account inside the same Claude organisation as this page. Add them as members in your Claude organisation settings. People outside it can only look.</li>
          <li><b>Share this page.</b> Open Share at the top of this page and set your organisation, or each person, to Can interact.</li>
          <li><b>Send them the link.</b> Copy the message below into WhatsApp or Slack.</li>
          <li><b>Let them in.</b> They tap Ask to join. Their request lands here and on HQ, you tap Let them in.</li>
        </ol>`}
        <div class="invite-link num">${M.APP_URL}</div>
        <div class="row">

        </div>
      </div>` : html`<p class="small ink62" style=${{margin: 0}}>Share the page, send the link, approve each request in one tap.</p>`}
    <//>`;

  /* ---------- founder: a nudge on HQ and Home ---------- */
  function JoinBanner() {
    const ctx = M.useCtx();
    if (!ctx.isFounder) return null;
    const reqs = M.team.requests(ctx);

/* ==== 61-setup.js ==== */
/* module: setup. The founder's "Get m360 ready" checklist on HQ. Every step is one tap,
   and each ticks itself off from live data. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState} = React;

  /* fixed-date public holidays; festivals move every year, so those stay manual */
  const FIXED = [['01-26', 'Republic Day'], ['05-01', 'Maharashtra Day'], ['08-15', 'Independence Day'],
    ['10-02', 'Gandhi Jayanti'], ['12-25', 'Christmas']];
  function fixedHolidays(now) {
    const y = new Date(now).getFullYear(), td = U.todayStr();
    const out = [];
    for (const yr of [y, y + 1]) for (const [md, name] of FIXED) { const d = yr + '-' + md; if (d >= td) out.push({d, name}); }
    return out;
  }

  function steps(ctx) {
    const s = ctx.settings, setup = s.setup || {};
    const clients = Object.keys(ctx.coll.clients.map).length;
    const posted = ((ctx.coll.feed.map[ctx.uid] || {}).posts || []).length > 0;
    const reqs = (M.team && M.team.requests) ? M.team.requests(ctx).length : 0;
    return [
      {k: 'office', done: !!s.office, title: 'Pin the office',
        sub: 'Check-ins within 200 metres count as verified office days.'},
      {k: 'hours', done: !!setup.hours, title: 'Confirm working hours',
        sub: 'Start ' + s.start + ' with ' + s.grace + ' minutes grace, EOD line by ' + s.eodCut + ', ' + s.wfhCap + ' WFH days a week.'},
      {k: 'holidays', done: (s.holidays || []).length > 0, title: 'Add holidays',
        sub: 'Nobody gets flagged on a holiday.'},
      {k: 'team', done: ctx.activeMembers.length > 1 && !reqs, title: reqs ? 'Let your team in' : 'Invite your team',
        sub: reqs ? reqs + (reqs === 1 ? ' person is' : ' people are') + ' waiting to join.' : (window.M360_STANDALONE ? 'Send the link, approve each request in one tap.' : 'Share the page, send the link, approve each request in one tap.')},
      {k: 'client', done: clients > 0, title: 'Add your first client', sub: 'Projects, tasks and pitches hang off clients.'},
      {k: 'hello', done: posted, title: 'Say hello on the feed', sub: 'Your first post sets the tone for the team.'}
    ];
  }

  function Step({st, children}) {
    return html`<div class=${'setup-step' + (st.done ? ' done' : '')} id=${'setup-' + st.k}>
      <span class="setup-tick" aria-hidden="true">${st.done ? '✓' : ''}</span>
      <div class="grow" style=${{minWidth: 0}}>
        <div style=${{fontWeight: 500}}>${st.title}</div>
        <div class="small ink62">${st.sub}</div>
        ${!st.done && children ? html`<div class="row" style=${{marginTop: '10px'}}>${children}</div>` : null}
      </div>
    </div>`;
  }

  function SetupCard() {
    const ctx = M.useCtx();
    const [busy, setBusy] = useState('');
    const [open, setOpen] = useState(true);
    if (!ctx.isFounder) return null;
    const list = steps(ctx);
    const left = list.filter(x => !x.done).length;
    const setup = ctx.settings.setup || {};
    if (!left || setup.dismissed) return null;

    const merge = (d, msg) => ctx.W.merge('settings/app', {...d, updated: Date.now()}).then(() => msg && M.toast(msg)).catch(() => {});
    async function pin() {
      setBusy('office');
      const loc = await M.getLoc();
      setBusy('');
      if (!loc) return M.toast('Location unavailable. Set it in Admin instead.', true);
      merge({office: {lat: loc.lat, lng: loc.lng, radius: 200, label: 'Office'}}, 'Office pinned');
    }
    const hol = fixedHolidays(ctx.now);
    const addHolidays = () => merge({holidays: Array.from(new Set((ctx.settings.holidays || []).concat(hol.map(h => h.d)))).sort()},
      hol.length + ' holidays added');
    const copyInvite = async () => {
      try { await navigator.clipboard.writeText('You are on m360 OS, the Mask360 workspace. Open ' + M.APP_URL + (window.M360_STANDALONE ? ', type your name' : ', sign in to Claude') + ', tap Ask to join and you are in once Kaavish lets you in.'); M.toast('Invite copied'); }
      catch (e) { M.nav('#admin'); }
    };

    const act = {
      office: html`<${UI.Btn} sm=${true} onClick=${pin} disabled=${busy === 'office'}>${busy === 'office' ? 'Finding you' : "I'm at the office, pin it"}<//>
        <${UI.Btn} kind="ghost" sm=${true} onClick=${() => M.intend('#admin', 'settings')}>Enter it by hand<//>`,
      hours: html`<${UI.Btn} sm=${true} onClick=${() => merge({setup: {hours: true}}, 'Hours confirmed')}>Looks right<//>
        <${UI.Btn} kind="ghost" sm=${true} onClick=${() => M.intend('#admin', 'settings')}>Change<//>`,
      holidays: html`<${UI.Btn} sm=${true} onClick=${addHolidays}>Add ${hol.length} national holidays<//>
        <span class="tiny ink62">${hol.map(h => h.name).filter((n, i, a) => a.indexOf(n) === i).join(', ')}. Add Diwali, Holi and others in Admin.</span>`,
      team: list[3].title === 'Let your team in'
        ? html`<${UI.Btn} sm=${true} onClick=${() => M.nav('#admin')}>Review requests<//>`
        : html`<${UI.Btn} sm=${true} onClick=${copyInvite}>Copy invite message<//>
          <${UI.Btn} kind="ghost" sm=${true} onClick=${() => M.nav('#admin')}>How it works<//>`,
      client: html`<${UI.Btn} sm=${true} onClick=${() => M.intend('#clients', 'client')}>Add a client<//>`,
      hello: html`<${UI.Btn} sm=${true} onClick=${() => M.intend('#feed', 'post')}>Write a post<//>`
    };

    const done = list.length - left;
    return html`<section class="card setup" id="setup-card">
      <div class="card-head">
        <div>
          <h2 class="card-title">Get m360 ready</h2>
          <div class="small ink62 num">${done} of ${list.length} done</div>
        </div>
        <div class="row nowrap">
          <button type="button" class="linky small" onClick=${() => setOpen(!open)}>${open ? 'Hide steps' : 'Show steps'}</button>
          <${UI.ConfirmBtn} kind="ghost" onConfirm=${() => merge({setup: {dismissed: true}})} label="Tap again to hide for good">Done for now<//>
        </div>
      </div>
      <${UI.Bar} a=${done} max=${list.length}/>
      ${open ? html`<div class="setup-list">
        ${list.map(st => html`<${Step} key=${st.k} st=${st}>${act[st.k]}<//>`)}
      </div>` : null}
    </section>`;
  }

  M.setup = {steps, fixedHolidays};
  M.parts.SetupCard = SetupCard;
})();

/* ==== 62-palette.js ==== */
/* module: palette. Cmd K: one box that finds anything (tasks, projects, clients, people, pages,
   handbook sections) and runs anything (check in, new task, focus, breathe, theme), or hands the
   question to m360 AI. Arrow keys move, Enter runs, Escape closes. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect, useMemo, useRef} = React;

  const SPARK = '✦';
  const PAGES = [
    ['Home', 'home', 'today'], ['My tasks', 'tasks', 'tasks'], ['Projects', 'projects', 'projects'], ['The week', 'week', 'week'],
    ['Calendar', 'calendar', 'calendar'], ['Reviews', 'reviews', 'review'], ['Clients', 'clients', 'clients'], ['Pipeline', 'pitches', 'pitches'],
    ['Feed', 'feed', 'feed'], ['Crew', 'people', 'people'], ['Pulse and ideas', 'voice', 'voice'], ['Leaderboard', 'scores', 'scores'],
    ['Me', 'me', 'people'], ['Leave', 'leave', 'leave'], ['Handbook', 'handbook', 'handbook'], ['Trophies', 'trophies', 'trophy'],
    ['HQ', 'hq', 'command', true], ['Dashboard', 'command', 'command', true], ['Hiring', 'hiring', 'hiring', true], ['Admin', 'admin', 'desk', true]
  ];

  const norm = s => String(s || '').toLowerCase();
  /* every word of the query has to appear somewhere in the text */
  const matches = (q, text) => { const t = norm(text); return q.every(w => t.includes(w)); };

  function buildItems(ctx, query, closeThen) {
    const q = norm(query).split(/\s+/).filter(Boolean);
    const out = [];
    const go = (fn, group, label, icon, sub, key) => out.push({key, group, label, icon, sub, run: () => closeThen(fn)});
    const td = U.todayStr();

    /* actions */
    const a = M.att.dayStatus(ctx, ctx.uid, td);
    const checked = a.status === 'office' || a.status === 'wfh';
    const acts = [
      [checked && !a.out ? 'Check out' : 'Check in', 'today', () => M.intend('#home', 'checkin')],
      ['New task', 'tasks', () => M.intend('#tasks', 'newtask')],
      ['Post an update', 'feed', () => M.intend('#feed', 'post')],
      ['Give kudos', 'scores', () => M.intend('#feed', 'kudos')],
      ['Request leave', 'leave', () => M.nav('#leave')],
      ['Start a focus session', 'timer', () => M.focus && M.focus.open()],
      ['Take a breather', 'breath', () => M.breathe && M.breathe.open()],
      ['Show me around', 'send', () => window.dispatchEvent(new CustomEvent('m360:tour'))],
      ['Inbox', 'bell', () => window.dispatchEvent(new CustomEvent('m360:inbox'))],
      ['Keyboard shortcuts', 'cmd', () => window.dispatchEvent(new CustomEvent('m360:keys'))],
      [M.theme.resolved() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode', M.theme.resolved() === 'dark' ? 'sun' : 'moon', () => M.theme.set(M.theme.resolved() === 'dark' ? 'light' : 'dark')],
      [M.sound.on() ? 'Turn sounds off' : 'Turn sounds on', 'play', () => M.sound.set(!M.sound.on())]
    ];
    if (window.M360_STANDALONE) acts.push(['Sign out', 'out', () => window.M360_API('logout').then(() => location.reload(), () => location.reload())]);
    acts.forEach(([label, icon, fn], i) => { if (!q.length ? i < 5 : matches(q, label)) go(fn, 'actions', label, icon, '', 'a' + i); });

    if (!q.length) {
      PAGES.filter(p => !p[3] || ctx.isFounder).slice(0, 6).forEach(p => go(() => M.nav('#' + p[1]), 'go to', p[0], p[2], '', 'p' + p[1]));
      return out;
    }

    /* pages */
    PAGES.filter(p => (!p[3] || ctx.isFounder) && matches(q, p[0])).forEach(p => go(() => M.nav('#' + p[1]), 'go to', p[0], p[2], '', 'p' + p[1]));

    /* tasks: mine first, open first */
    const tmap = ctx.coll.tasks.map;
    Object.keys(tmap).map(id => ({id, ...tmap[id]}))
      .filter(t => matches(q, t.title))
      .sort((x, y) => ((y.owner === ctx.uid) - (x.owner === ctx.uid)) || ((x.status === 'done') - (y.status === 'done')))
      .slice(0, 6)
      .forEach(t => go(() => M.nav('#tasks/' + t.id), 'tasks', t.title, 'tasks',
        (t.status === 'done' ? 'done' : t.due ? 'due ' + M.tasks.dueLabel(t.due) : (t.status || 'to do')), 't' + t.id));

    const pmap = ctx.coll.projects.map;
    Object.keys(pmap).filter(id => !pmap[id].archived && matches(q, pmap[id].name)).slice(0, 4)
      .forEach(id => go(() => M.nav('#projects/' + id), 'projects', pmap[id].name, 'projects', pmap[id].status === 'done' ? 'done' : '', 'pj' + id));

    const cmap = ctx.coll.clients.map;
    Object.keys(cmap).filter(id => matches(q, cmap[id].name)).slice(0, 4)
      .forEach(id => go(() => M.nav('#clients'), 'clients', cmap[id].name, 'clients', cmap[id].status || '', 'c' + id));

    if (ctx.isFounder) {
      const pi = ctx.coll.pitches.map;
      Object.keys(pi).filter(id => matches(q, (pi[id].name || '') + ' ' + (pi[id].client || ''))).slice(0, 4)
        .forEach(id => go(() => M.nav('#pitches'), 'pipeline', pi[id].name || 'Pitch', 'pitches', pi[id].stage || '', 'pi' + id));
    }

    const hb = ctx.coll.handbook.map;
    Object.keys(hb).filter(id => matches(q, hb[id].title + ' ' + String(hb[id].body || '').slice(0, 400))).slice(0, 3)
      .forEach(id => go(() => M.nav('#handbook/' + id), 'handbook', hb[id].title, 'handbook', '', 'h' + id));

    return out;
  }

  function Palette({onClose, onAsk}) {
    const ctx = M.useCtx();
    const [q, setQ] = useState('');
    const [sel, setSel] = useState(0);
    const inp = useRef(null);
    const names = M.useProfiles(ctx.activeMembers.map(m => m.uid));
    const closeThen = fn => { onClose(); setTimeout(fn, 20); };

    const items = useMemo(() => {
      const list = buildItems(ctx, q, closeThen);
      const words = norm(q).split(/\s+/).filter(Boolean);
      if (words.length) {
        ctx.activeMembers.filter(m => matches(words, (names[m.uid] && names[m.uid].name) || '')).slice(0, 4)
          .forEach(m => list.push({key: 'u' + m.uid, group: 'people', label: (names[m.uid] && names[m.uid].name) || 'Someone', icon: 'people',
            sub: m.title || '', uid: m.uid, run: () => closeThen(() => M.nav('#people/' + m.uid))}));
      }
      if (q.trim() && M.ai.on(ctx)) list.push({key: 'ai', group: 'ask', label: 'Ask m360: ' + q.trim(), icon: null, ai: true,
        run: () => closeThen(() => onAsk(q.trim()))});
      return list;
    }, [q, ctx, names]);

    useEffect(() => { setSel(0); }, [q]);
    useEffect(() => { if (inp.current) inp.current.focus(); }, []);

    const onKey = e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSel(s => Math.min(items.length - 1, s + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(s => Math.max(0, s - 1)); }
      else if (e.key === 'Enter') { e.preventDefault(); if (items[sel]) items[sel].run(); }
      else if (e.key === 'Escape') onClose();
    };

    let lastGroup = '';
    return html`<div class="pal-scrim" onMouseDown=${e => { if (e.target === e.currentTarget) onClose(); }}>
      <div class="pal" role="dialog" aria-label="Command palette">
        <div class="pal-in">
          <${icons.search}/>
          <input ref=${inp} id="pal-input" value=${q} placeholder="Search anything, or type what you want to do" aria-label="Search or run"
            onInput=${e => setQ(e.target.value)} onKeyDown=${onKey}/>
          <span class="kbd">esc</span>
        </div>
        <div class="pal-list" id="pal-list">
          ${items.length ? items.map((it, i) => {
            const head = it.group !== lastGroup ? html`<div class="pal-group" key=${'g' + it.group + i}>${it.group}</div>` : null;
            lastGroup = it.group;
            return html`<${React.Fragment} key=${it.key}>
              ${head}
              <button type="button" class=${'pal-item' + (i === sel ? ' on' : '') + (it.ai ? ' ai' : '')} onMouseEnter=${() => setSel(i)} onClick=${it.run}>
                ${it.ai ? html`<span class="spark">${SPARK}</span>` : it.uid ? html`<${UI.Avatar} id=${it.uid} size=${22}/>` : it.icon && icons[it.icon] ? html`<${icons[it.icon]}/>` : null}
                <span class="t">${it.label}</span>
                ${it.sub ? html`<span class="sub">${it.sub}</span>` : null}
              </button>
            <//>`;
          }) : html`<div class="pal-group">Nothing matches. Ask m360 instead.</div>`}
        </div>
        <div class="pal-foot"><span><span class="kbd">↑↓</span> move</span><span><span class="kbd">enter</span> run</span><span><span class="kbd">${M.isMac ? '⌘K' : 'Ctrl K'}</span> open this</span></div>
      </div>
    </div>`;
  }

  M.parts.Palette = Palette;
})();

/* ==== 63-inbox.js ==== */
/* module: inbox. Everything that happened to you, derived live from the data you can already see:
   tasks handed to you, work sent back or approved, kudos, mentions, leave decisions, announcements,
   people asking to join (founder). Nothing is stored except when you last looked (me/<uid>.inboxSeen). */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect} = React;

  const KEEP_DAYS = 21;

  function items(ctx) {
    const out = [];
    const me = ctx.uid, since = ctx.now - KEEP_DAYS * 86400000;
    const push = (id, kind, at, text, ref, actor, hot) => { if (at >= since) out.push({id, kind, at, text, ref, actor, hot: !!hot}); };
    const nm = id => html`<${UI.Name} id=${id}/>`;

    /* tasks */
    const tmap = ctx.coll.tasks.map;
    for (const id of Object.keys(tmap)) {
      const t = tmap[id];
      if (!t) continue;
      const mine = t.owner === me;
      if (mine && t.by && t.by !== me) push('assign:' + id, 'tasks', t.created || 0, html`${nm(t.by)} handed you ${t.title}`, '#tasks/' + id, t.by);
      if (mine && t.status === 'done' && t.doneAt && t.approvedBy && t.approvedBy !== me) push('ok:' + id, 'review', t.doneAt, html`${nm(t.approvedBy)} approved ${t.title}`, '#tasks/' + id, t.approvedBy);
      if (mine && t.sentBackAt && t.sentBackBy && t.sentBackBy !== me) push('back:' + id, 'review', t.sentBackAt, html`${nm(t.sentBackBy)} sent ${t.title} back${t.sentBackNote ? ': ' + t.sentBackNote : ''}`, '#tasks/' + id, t.sentBackBy, true);
      if (!mine && t.status === 'review' && t.reviewAt && (ctx.isFounder || (t.project && ctx.coll.projects.map[t.project] && ctx.coll.projects.map[t.project].owner === me)))
        push('rev:' + id, 'review', t.reviewAt, html`${nm(t.owner)} put ${t.title} up for review`, '#reviews', t.owner);
      const cs = t.comments || {};
      for (const cid of Object.keys(cs)) {
        const c = cs[cid];
        if (!c || c.by === me) continue;
        const mentioned = (c.mentions || []).includes(me);
        if (mentioned || mine) push('cm:' + cid, 'feed', c.at || 0, html`${nm(c.by)}${mentioned ? ' mentioned you on ' : ' commented on '}${t.title}`, '#tasks/' + id, c.by, mentioned);
      }
    }
    /* kudos to me */
    const kmap = ctx.coll.kudos.map;
    for (const giver of Object.keys(kmap)) for (const k of (kmap[giver].given || [])) {
      if (k && k.to === me && giver !== me) push('k:' + k.id, 'scores', k.at || 0, html`${nm(giver)} gave you kudos: ${k.why}`, '#feed', giver, true);
    }
    /* leave decisions on my requests */
    const dec = ((ctx.coll.leavedec.map[me] || {}).d) || {};
    const reqs = ((ctx.coll.leave.map[me] || {}).reqs) || [];
    for (const r of reqs) {
      const d = r && dec[r.id];
      if (d && d.at) push('lv:' + r.id, 'leave', d.at, html`Leave ${U.fmtDate(r.from)}${r.to !== r.from ? ' to ' + U.fmtDate(r.to) : ''} ${d.status}`, '#leave', null, d.status === 'declined');
    }
    /* announcements */
    const fmap = ctx.coll.feed.map;
    for (const author of Object.keys(fmap)) for (const p of (fmap[author].posts || [])) {
      if (p && p.kind === 'announce' && author !== me) push('an:' + p.id, 'feed', p.at || 0, html`${nm(author)} announced: ${String(p.text).slice(0, 90)}`, '#feed', author, true);
      if (p && p.kind === 'poll' && author !== me && !((p.votes || {})[me])) push('poll:' + p.id, 'feed', p.at || 0, html`${nm(author)} asked: ${String(p.text).slice(0, 80)}`, '#feed', author);
    }
    /* founder: joins and leave requests */
    if (ctx.isFounder) {
      (M.team ? M.team.requests(ctx) : []).forEach(r => push('join:' + r.uid, 'people', r.at, html`${nm(r.uid)} wants to join the team`, '#admin', r.uid, true));
      if (M.leave && M.leave.pending) M.leave.pending(ctx).forEach(({uid, req}) => push('lvr:' + req.id, 'leave', req.at || 0, html`${nm(uid)} asked for leave, ${M.leave.rangeText(req)}`, '#admin', uid));
    }
    /* celebrations */
    if (M.trophies && M.trophies.today) M.trophies.today(ctx).forEach(c => { if (c.uid !== me) push('cel:' + c.uid + c.kind, 'gift', U.parseYmd(U.todayStr()).getTime(), html`${nm(c.uid)}: ${c.text}`, '#home', c.uid); });
    out.sort((a, b) => b.at - a.at);
    return out.slice(0, 60);
  }

  const seenAt = ctx => Number(((ctx.coll.me.map[ctx.uid] || {}).inboxSeen) || 0);
  const unread = ctx => items(ctx).filter(i => i.at > seenAt(ctx)).length;

  const KIND_ICON = {tasks: 'tasks', review: 'review', feed: 'feed', scores: 'scores', leave: 'leave', people: 'people', gift: 'gift'};

  function Inbox({onClose}) {
    const ctx = M.useCtx();
    const list = items(ctx);
    const seen = seenAt(ctx);
    const [was] = useState(seen);
    useEffect(() => {
      if (list.some(i => i.at > seen)) ctx.W.merge('me/' + ctx.uid, {inboxSeen: Date.now()}).catch(() => {});
    }, []);
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Inbox">
      ${list.length ? html`<div class="stack" style=${{gap: 0}}>
        ${list.map(i => html`<button type="button" key=${i.id} class=${'inbox-item' + (i.at > was ? ' unread' : '')} onClick=${() => { onClose(); M.nav(i.ref); }}>
          ${i.actor ? html`<${UI.Avatar} id=${i.actor} size=${34}/>` : html`<span class=${'inbox-kind' + (i.hot ? ' hot' : '')}><${icons[KIND_ICON[i.kind] || 'feed']}/></span>`}
          <span class="grow">
            <div class="t">${i.text}</div>
            <div class="tiny ink62">${U.timeAgo(i.at)}</div>
          </span>
          ${i.at > was ? html`<span class="dotflame"/>` : null}
        </button>`)}
      </div>` : html`<${UI.Empty} text="Nothing yet. Assignments, kudos, mentions and decisions land here."/>`}
    <//>`;
  }

  M.inbox = {items, unread, seenAt};
  M.parts.Inbox = Inbox;
})();

/* ==== 64-focus.js ==== */
/* module: focus. A focus timer that rides in the sidebar: pick a task, pick 25, 45 or 90 minutes,
   and m360 counts you down. Finished sessions land in me/<uid>.focus as deep work hours. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect} = React;

  const LENS = [25, 45, 90];
  const KEEP = 120;
  const subs = new Set();
  let state = null;   /* {task, title, mins, start} */
  try { const s = JSON.parse(localStorage.getItem('m360.focus') || 'null'); if (s && s.start) state = s; } catch (e) { state = null; }
  const persist = () => { try { localStorage.setItem('m360.focus', JSON.stringify(state)); } catch (e) { /* private window */ } };
  const emit = () => subs.forEach(fn => fn(state));
  let openFn = null;

  const focus = M.focus = {
    get: () => state,
    subscribe: fn => { subs.add(fn); return () => subs.delete(fn); },
    open: task => { if (openFn) openFn(task || null); },
    _bind: fn => { openFn = fn; },
    start(task, title, mins) {
      state = {task: task || '', title: String(title || 'Deep work').slice(0, 80), mins: LENS.includes(mins) ? mins : 25, start: Date.now()};
      persist(); emit(); M.sound.play('start');
    },
    stop() { state = null; persist(); emit(); },
    left() { if (!state) return 0; return Math.max(0, state.mins * 60000 - (Date.now() - state.start)); },
    /* a finished session: written once, then the timer clears */
    async finish(ctx) {
      if (!state) return;
      const s = state;
      state = null; persist(); emit();
      const doc = ctx.coll.me.map[ctx.uid] || {};
      const sessions = [{task: s.task, mins: s.mins, at: Date.now()}].concat(((doc.focus || {}).sessions) || []).slice(0, KEEP);
      try { await ctx.W.merge('me/' + ctx.uid, {focus: {sessions}}); } catch (e) { /* toasted */ }
      M.burst(document.querySelector('.focus-pill') || document.body);
      M.toast('Session done. ' + s.mins + ' minutes of deep work banked.');
    },
    /* minutes of deep work in an inclusive date range */
    minutes(ctx, uid, from, to) {
      const list = (((ctx.coll.me.map[uid] || {}).focus || {}).sessions) || [];
      return list.filter(x => { const d = U.ymd(new Date(x.at)); return d >= from && d <= to; }).reduce((n, x) => n + (x.mins || 0), 0);
    },
    sessions(ctx, uid) { return (((ctx.coll.me.map[uid] || {}).focus || {}).sessions) || []; }
  };

  function useFocus() {
    const [s, set] = useState(state);
    const now = M.useClock();
    useEffect(() => focus.subscribe(set), []);
    return {s, left: s ? Math.min(s.mins * 60000, Math.max(0, s.mins * 60000 - (now - s.start))) : 0};
  }
  const mmss = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

  /* the sidebar pill and the phone chip */
  function FocusPill({compact}) {
    const ctx = M.useCtx();
    const {s, left} = useFocus();
    useEffect(() => { if (s && left <= 0) focus.finish(ctx); }, [s, left <= 0]);
    if (!s) return null;
    const total = s.mins * 60000, k = 1 - left / total;
    if (compact) return html`<button type="button" class="focus-chip" onClick=${() => focus.open()}><${icons.timer}/><span class="num">${mmss(left)}</span></button>`;
    const r = 24, C = 2 * Math.PI * r;
    return html`<div class="focus-pill" id="focus-pill">
      <svg class="focus-ring" viewBox="0 0 56 56" aria-hidden="true"><circle class="bg" cx="28" cy="28" r=${r}/><circle class="fg" cx="28" cy="28" r=${r} stroke-dasharray=${C} stroke-dashoffset=${C * (1 - k)}/></svg>
      <div class="grow" style=${{minWidth: 0}}>
        <div class="num">${mmss(left)}</div>
        <div class="l">${s.title}</div>
      </div>
      <button type="button" class="iconbtn" aria-label="Stop focus" onClick=${() => { focus.stop(); M.toast('Focus stopped'); }}><${icons.stop}/></button>
    </div>`;
  }

  /* the picker: which task, how long */
  function FocusDrawer({task, onClose}) {
    const ctx = M.useCtx();
    const {s, left} = useFocus();
    const open = M.tasks.open(ctx).filter(t => t.owner === ctx.uid).slice(0, 12);
    const [pick, setPick] = useState(task || (open[0] ? open[0].id : ''));
    const [mins, setMins] = useState(25);
    const wk = U.periodRange('week', new Date(ctx.now));
    const banked = focus.minutes(ctx, ctx.uid, wk.from, wk.to);
    const title = pick ? ((ctx.coll.tasks.map[pick] || {}).title || 'Deep work') : 'Deep work';
    const r = 100, C = 2 * Math.PI * r;
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Focus">
      ${s ? html`<div class="focus-big">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true"><circle class="bg" cx="110" cy="110" r=${r}/><circle class="fg" cx="110" cy="110" r=${r} stroke-dasharray=${C} stroke-dashoffset=${C * (left / (s.mins * 60000))}/></svg>
        <div class="time num">${mmss(left)}</div>
        <div style=${{fontWeight: 500}}>${s.title}</div>
        <div class="row">
          <${UI.Btn} kind="sec" onClick=${() => { focus.stop(); M.toast('Focus stopped'); }}>Stop<//>
          <${UI.Btn} onClick=${() => { focus.finish(ctx); onClose(); }}>Done early<//>
        </div>
      </div>` : html`<div class="stack">
        <p class="small ink62" style=${{margin: 0}}>Pick what you are on. m360 keeps the time, quietly, and banks it as deep work.</p>
        ${open.length ? html`<${UI.Select} id="focus-task" label="on" value=${pick} onChange=${setPick}
          options=${[{v: '', label: 'Deep work, no task'}].concat(open.map(t => ({v: t.id, label: t.title})))}/>` : null}
        <${UI.Field} label="for">
          <div class="lens">${LENS.map(m => html`<button key=${m} type="button" class=${m === mins ? 'on' : ''} onClick=${() => setMins(m)}>${m} min</button>`)}</div>
        <//>
        <${UI.Btn} onClick=${() => { focus.start(pick, title, mins); onClose(); }}><${icons.play}/>Start ${mins} minutes<//>
      </div>`}
      <hr class="hair"/>
      <div class="row between"><span class="small ink62">Deep work this week</span><span class="num" style=${{fontWeight: 600}}>${Math.round(banked / 6) / 10}h</span></div>
    <//>`;
  }

  function FocusHost() {
    const [open, setOpen] = useState(null);
    useEffect(() => { focus._bind(task => setOpen({task})); return () => focus._bind(null); }, []);
    return open ? html`<${FocusDrawer} task=${open.task} onClose=${() => setOpen(null)}/>` : null;
  }

  M.parts.FocusPill = FocusPill;
  M.parts.FocusHost = FocusHost;
})();

/* ==== 65-reviews.js ==== */
/* module: reviews. The creative approval queue: everything in review, with Approve and Send back.
   The founder reviews all of it; a project owner reviews their project's tasks; everyone sees
   where their own work stands. A send back counts a revision and lands in the owner's inbox. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState} = React;

  const canReview = (ctx, t) => ctx.isFounder || (t.project && ctx.coll.projects.map[t.project] && ctx.coll.projects.map[t.project].owner === ctx.uid);

  function queue(ctx) {
    const map = ctx.coll.tasks.map;
    return Object.keys(map).map(id => ({id, ...map[id]})).filter(t => t.status === 'review')
      .sort((a, b) => (a.reviewAt || a.updated || 0) - (b.reviewAt || b.updated || 0));
  }

  function Row({t, onOpen}) {
    const ctx = M.useCtx();
    const [note, setNote] = useState('');
    const [back, setBack] = useState(false);
    const mine = canReview(ctx, t);
    const href = t.link && /^https?:/i.test(t.link) ? t.link : (t.link ? 'https://' + t.link : null);
    const approve = async () => {
      const now = Date.now();
      await ctx.W.update('tasks/' + t.id, {status: 'done', doneAt: now, approvedBy: ctx.uid, approvedAt: now, updated: now}).catch(() => {});
      M.burst(document.getElementById('rev-' + t.id));
      M.toast('Approved. Shipped.');
    };
    const sendBack = async () => {
      const now = Date.now();
      const revisions = (Number(t.revisions) || 0) + 1;
      const patch = {status: 'doing', revisions, sentBackAt: now, sentBackBy: ctx.uid, sentBackNote: note.trim().slice(0, 240), updated: now};
      if (note.trim()) patch.comments = {[U.uid()]: {by: ctx.uid, t: 'Sent back: ' + note.trim(), at: now}};
      await ctx.W.update('tasks/' + t.id, patch).catch(() => {});
      M.sound.play('soft');
      M.toast('Sent back, revision ' + revisions);
    };
    const pName = t.project && ctx.coll.projects.map[t.project] ? ctx.coll.projects.map[t.project].name : '';
    return html`<div class="rev-row" id=${'rev-' + t.id}>
      <${UI.Avatar} id=${t.owner} size=${34}/>
      <div class="grow" style=${{minWidth: 0}}>
        <div class="row" style=${{gap: '8px'}}>
          <button type="button" class="linky t" onClick=${() => onOpen(t.id)}>${t.title}</button>
          ${Number(t.revisions) > 0 ? html`<span class="pill flame-o">${t.revisions} rev</span>` : null}
          ${t.shown20 ? html`<span class="pill">20% shown</span>` : null}
        </div>
        <div class="tiny ink62"><${UI.Name} id=${t.owner}/>${pName ? ' · ' + pName : ''} · waiting ${U.timeAgo(t.reviewAt || t.updated || ctx.now)}${href ? html` · <a class="linky" href=${href} target="_blank" rel="noopener noreferrer">open the output</a>` : ''}</div>
        ${mine && back ? html`<div class="row" style=${{marginTop: '8px'}}>
          <input class="input" style=${{maxWidth: '360px', minHeight: '38px'}} placeholder="What to change, one line" value=${note} onInput=${e => setNote(e.target.value)} aria-label="Send back note"/>
          <${UI.Btn} kind="flame" sm=${true} onClick=${sendBack}>Send back<//>
          <${UI.Btn} kind="ghost" sm=${true} onClick=${() => setBack(false)}>Cancel<//>
        </div>` : null}
      </div>
      ${mine && !back ? html`<span class="row nowrap">
        <${UI.Btn} sm=${true} onClick=${approve}><${icons.check}/>Approve<//>
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => setBack(true)}>Send back<//>
      </span>` : null}
    </div>`;
  }

  function Reviews({compact}) {
    const ctx = M.useCtx();
    const [open, setOpen] = useState(null);
    const all = queue(ctx);
    const mine = all.filter(t => canReview(ctx, t));
    const theirs = all.filter(t => !canReview(ctx, t) && t.owner === ctx.uid);
    const list = compact ? mine : all;
    const D = M.parts.TaskDrawer;
    if (compact && !mine.length) return null;
    return html`<${UI.Card} id="reviews" title=${compact ? 'Waiting on your review' : 'Reviews'}
      action=${html`<span class=${'pill ' + (mine.length ? 'flame' : 'warm')}>${mine.length} on you</span>`}>
      ${!compact ? html`<p class="small ink62" style=${{marginTop: 0}}>Work in review, oldest first. Approve ships it, send back counts a revision and tells the owner why.</p>` : null}
      ${list.length ? list.map(t => html`<${Row} key=${t.id} t=${t} onOpen=${setOpen}/>`)
        : html`<${UI.Empty} text=${theirs.length ? 'Nothing waiting on you. ' + theirs.length + ' of yours ' + (theirs.length === 1 ? 'is' : 'are') + ' with the reviewers.' : 'Nothing in review right now.'}/>`}
      ${open && D ? html`<${D} taskId=${open} onClose=${() => setOpen(null)}/>` : null}
    <//>`;
  }

  M.reviews = {queue, canReview};
  M.parts.Reviews = Reviews;
})();

/* ==== 66-calendar.js ==== */
/* module: calendar. A month of everything with a date: task due dates, project deadlines,
   approved leave, holidays, birthdays and work anniversaries. Tap a day for the list. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useMemo} = React;

  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  /* {ymd: [{kind, text, ref, hot, uid}]} for one month plus padding days */
  function events(ctx, first, last, mineOnly) {
    const out = {};
    const add = (d, e) => { if (d >= first && d <= last) (out[d] = out[d] || []).push(e); };
    const td = U.todayStr();
    const tmap = ctx.coll.tasks.map;
    for (const id of Object.keys(tmap)) {
      const t = tmap[id];
      if (!t || !t.due || (mineOnly && t.owner !== ctx.uid)) continue;
      add(t.due, {kind: 'task', text: t.title, ref: '#tasks/' + id, hot: t.status !== 'done' && t.due < td, done: t.status === 'done', uid: t.owner});
    }
    const pmap = ctx.coll.projects.map;
    for (const id of Object.keys(pmap)) {
      const p = pmap[id];
      if (p && p.due && !p.archived && (!mineOnly || p.owner === ctx.uid || (p.members || []).includes(ctx.uid))) add(p.due, {kind: 'project', text: p.name + ' due', ref: '#projects/' + id, hot: p.status !== 'done' && p.due < td});
    }
    for (const uid of Object.keys(ctx.leaveMap || {})) {
      if (mineOnly && uid !== ctx.uid) continue;
      ctx.leaveMap[uid].forEach(d => add(d, {kind: 'leave', text: '', uid, ref: '#leave'}));
    }
    (ctx.settings.holidays || []).forEach(d => add(d, {kind: 'holiday', text: 'Holiday', ref: '#admin'}));
    if (M.trophies && M.trophies.celebrations) {
      let d = U.parseYmd(first);
      const end = U.parseYmd(last);
      while (d <= end) { const s = U.ymd(d); M.trophies.celebrations(ctx, s).forEach(c => add(s, {kind: 'bday', text: c.text, uid: c.uid, ref: '#people/' + c.uid})); d = U.addDays(d, 1); }
    }
    return out;
  }

  function Calendar() {
    const ctx = M.useCtx();
    const [m, setM] = useState(() => { const d = new Date(ctx.now); return new Date(d.getFullYear(), d.getMonth(), 1); });
    const [mine, setMine] = useState(!ctx.isFounder);
    const [day, setDay] = useState(null);
    const td = U.todayStr();
    const start = U.mondayOf(m);
    const monthEnd = new Date(m.getFullYear(), m.getMonth() + 1, 0);
    const cells = [];
    for (let d = new Date(start); cells.length < 42; d = U.addDays(d, 1)) { cells.push(U.ymd(d)); if (d > monthEnd && d.getDay() === 0) break; }
    const ev = useMemo(() => events(ctx, cells[0], cells[cells.length - 1], mine), [ctx, cells[0], cells[cells.length - 1], mine]);
    const mid = U.monthId(m);
    const title = U.MONTHS[m.getMonth()] + ' ' + m.getFullYear();
    const names = M.useProfiles(Object.values(ev).flat().map(e => e.uid).filter(Boolean));
    const label = e => e.kind === 'leave' ? ((names[e.uid] && names[e.uid].name) || 'Someone') + ' on leave' : e.text;
    const dayList = day ? (ev[day] || []) : [];

    return html`<div class="stack" style=${{gap: '14px'}}>
      <${UI.PageHead} micro="everything with a date" title=${title}>
        <${UI.Seg} options=${[{v: 'mine', label: 'Mine'}, {v: 'all', label: 'Everyone'}]} value=${mine ? 'mine' : 'all'} onChange=${v => setMine(v === 'mine')} ariaLabel="Whose calendar"/>
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => setM(new Date(m.getFullYear(), m.getMonth() - 1, 1))} ariaLabel="Previous month"><${icons.chevL}/><//>
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => { const d = new Date(ctx.now); setM(new Date(d.getFullYear(), d.getMonth(), 1)); }}>Today<//>
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => setM(new Date(m.getFullYear(), m.getMonth() + 1, 1))} ariaLabel="Next month"><${icons.chevR}/><//>
      <//>
      <${UI.Card}>
        <div class="cal" id="calendar">
          ${DOW.map(d => html`<div key=${d} class="cal-dow">${d}</div>`)}
          ${cells.map(d => {
            const list = ev[d] || [];
            const pad = !d.startsWith(mid);
            const off = !ctx.isWorkingDay(d);
            const shown = list.slice(0, 3);
            return html`<button type="button" key=${d} class=${'cal-day' + (pad ? ' pad' : '') + (off ? ' off' : '') + (d === td ? ' today' : '')} onClick=${() => setDay(d)}>
              <span class="d"><span>${Number(d.slice(8))}</span>${list.length > 3 ? html`<span class="pill">${list.length}</span>` : null}</span>
              ${shown.map((e, i) => html`<span key=${i} class=${'cal-ev ' + (e.hot ? 'hot' : '') + (e.kind === 'leave' || e.kind === 'holiday' ? ' leave' : '') + (e.kind === 'bday' ? ' bday' : '')}
                style=${e.done ? {textDecoration: 'line-through', opacity: .6} : null}>${label(e)}</span>`)}
              ${list.length > 3 ? html`<span class="cal-more">+${list.length - 3} more</span>` : null}
              <span class="dots">${list.slice(0, 5).map((e, i) => html`<i key=${i} class=${e.hot ? 'hot' : ''}/>`)}</span>
            </button>`;
          })}
        </div>
      <//>
      ${day ? html`<${UI.Drawer} open=${true} onClose=${() => setDay(null)} title=${U.fmtDay(day) + (day === td ? ', today' : '')}>
        ${dayList.length ? html`<div class="stack tight">${dayList.map((e, i) => html`<button type="button" key=${i} class="listrow rowbtn" onClick=${() => { setDay(null); M.nav(e.ref); }}>
          ${e.uid ? html`<${UI.Avatar} id=${e.uid} size=${26}/>` : html`<span class="dotflame"/>`}
          <span class="grow" style=${e.done ? {textDecoration: 'line-through', color: 'var(--ink62)'} : null}>${label(e)}</span>
          <span class="pill">${e.kind}</span>
        </button>`)}</div>` : html`<${UI.Empty} text="Nothing on this day."/>`}
        <div class="row" style=${{marginTop: '8px'}}><${UI.Btn} sm=${true} onClick=${() => { setDay(null); M.intend('#tasks', 'newtask:' + day); }}>New task due this day<//></div>
      <//>` : null}
    </div>`;
  }

  M.pages.Calendar = Calendar;
})();

/* ==== 67-badges.js ==== */
/* module: badges. The trophy case (earned from real work, never handed out) and the celebrations:
   birthdays from each person's profile and work anniversaries from the roster. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect} = React;

  /* ---------- trophies ---------- */
  const DEFS = [
    {id: 'first-in', name: 'First light', desc: 'Your first check-in.', icon: 'today', test: s => s.checkins >= 1},
    {id: 'streak-5', name: 'Five alive', desc: 'Five working days in a row.', icon: 'flame', test: s => s.streak >= 5},
    {id: 'streak-20', name: 'Twenty deep', desc: 'Twenty working days in a row.', icon: 'flame', test: s => s.streak >= 20},
    {id: 'early', name: 'Early bird', desc: 'Checked in before 9:30.', icon: 'sun', test: s => s.early >= 1},
    {id: 'eod-10', name: 'Sign off', desc: 'Ten EOD lines.', icon: 'edit', test: s => s.eods >= 10},
    {id: 'ship-10', name: 'Shipped ten', desc: 'Ten tasks done.', icon: 'tasks', test: s => s.done >= 10},
    {id: 'ship-50', name: 'Shipped fifty', desc: 'Fifty tasks done.', icon: 'tasks', test: s => s.done >= 50},
    {id: 'clean', name: 'Clean pass', desc: 'A task approved with zero revisions.', icon: 'review', test: s => s.cleanPass >= 1},
    {id: 'kudos-give', name: 'Good egg', desc: 'Gave your first kudos.', icon: 'scores', test: s => s.kudosGiven >= 1},
    {id: 'kudos-5', name: 'Magnet', desc: 'Received five kudos.', icon: 'scores', test: s => s.kudosGot >= 5},
    {id: 'focus-10', name: 'Deep worker', desc: 'Ten focus sessions.', icon: 'timer', test: s => s.focus >= 10},
    {id: 'reader', name: 'By the book', desc: 'Read the whole handbook.', icon: 'handbook', test: s => s.readAll},
    {id: 'poll', name: 'Pollster', desc: 'Asked the team a poll.', icon: 'feed', test: s => s.polls >= 1},
    {id: 'night', name: 'Night owl', desc: 'An EOD line after 21:00.', icon: 'moon', test: s => s.night >= 1}
  ];

  function stats(ctx, uid) {
    const days = (ctx.coll.checkin.map[uid] || {}).days || {};
    const eods = (ctx.coll.eod.map[uid] || {}).days || {};
    const ins = Object.keys(days).filter(d => days[d] && days[d].in);
    const early = ins.filter(d => { const t = new Date(days[d].in); return t.getHours() * 60 + t.getMinutes() < 9 * 60 + 30; }).length;
    const night = Object.keys(eods).filter(d => eods[d] && eods[d].at && new Date(eods[d].at).getHours() >= 21).length;
    const tmap = ctx.coll.tasks.map;
    let done = 0, cleanPass = 0;
    for (const id of Object.keys(tmap)) { const t = tmap[id]; if (t && t.owner === uid && t.status === 'done') { done++; if (t.approvedBy && !(Number(t.revisions) > 0)) cleanPass++; } }
    let kudosGot = 0;
    for (const g of Object.keys(ctx.coll.kudos.map)) for (const k of (ctx.coll.kudos.map[g].given || [])) if (k && k.to === uid) kudosGot++;
    const kudosGiven = ((ctx.coll.kudos.map[uid] || {}).given || []).length;
    const polls = ((ctx.coll.feed.map[uid] || {}).posts || []).filter(p => p && p.kind === 'poll').length;
    const unread = M.handbook && M.handbook.unread ? M.handbook.unread(ctx, uid) : [];
    const streak = M.home ? M.home.streak(ctx, uid, d => !!(days[d] && days[d].in)) : 0;
    return {checkins: ins.length, streak, early, eods: Object.keys(eods).length, done, cleanPass, kudosGot, kudosGiven,
      focus: M.focus ? M.focus.sessions(ctx, uid).length : 0, readAll: Object.keys(ctx.coll.handbook.map).length > 0 && unread.length === 0, polls, night};
  }
  function earned(ctx, uid) {
    const s = stats(ctx, uid);
    return DEFS.map(d => ({...d, got: !!d.test(s)}));
  }

  /* ---------- celebrations ---------- */
  const mmdd = s => String(s || '').slice(5);
  function celebrations(ctx, ymd) {
    const out = [];
    const md = mmdd(ymd), y = Number(ymd.slice(0, 4));
    ctx.activeMembers.forEach(m => {
      const bd = (ctx.coll.me.map[m.uid] || {}).birthday;
      if (bd && bd === md) out.push({uid: m.uid, kind: 'birthday', text: 'birthday today'});
      if (m.joined && mmdd(m.joined) === md) {
        const n = y - Number(m.joined.slice(0, 4));
        if (n >= 1) out.push({uid: m.uid, kind: 'anniversary', text: n + (n === 1 ? ' year' : ' years') + ' at Mask360 today'});
      }
    });
    return out;
  }
  const today = ctx => celebrations(ctx, U.todayStr());

  /* ---------- the celebration card, on Home ---------- */
  function Celebrate() {
    const ctx = M.useCtx();
    const list = today(ctx);
    if (!list.length) return null;
    const wish = async c => {
      const given = [{id: U.uid(), to: c.uid, why: c.kind === 'birthday' ? 'Happy birthday. Have the best one.' : 'Happy work anniversary. Thank you for everything.', at: Date.now()}]
        .concat(((ctx.coll.kudos.map[ctx.uid] || {}).given) || []).slice(0, 60);
      await ctx.W.merge('kudos/' + ctx.uid, {given}).catch(() => {});
      M.burst(document.getElementById('celebrate'));
      M.toast('Sent');
    };
    return html`<section class="card flame" id="celebrate">
      ${list.map(c => html`<div class="celebrate" key=${c.uid + c.kind}>
        <span class="cake"><${icons.gift}/></span>
        <div class="grow"><div style=${{fontWeight: 500}}><${UI.Name} id=${c.uid}/></div><div class="small ink62">${c.uid === ctx.uid ? (c.kind === 'birthday' ? 'Happy birthday from all of us.' : 'Happy work anniversary.') : c.text}</div></div>
        ${c.uid !== ctx.uid ? html`<${UI.Btn} sm=${true} onClick=${() => wish(c)}>Send wishes<//>` : null}
      </div>`)}
    </section>`;
  }

  /* ---------- the trophy case, on Me ---------- */
  function Trophies({uid}) {
    const ctx = M.useCtx();
    const who = uid || ctx.uid;
    const list = earned(ctx, who);
    const got = list.filter(t => t.got);
    const seen = ((ctx.coll.me.map[ctx.uid] || {}).badgesSeen) || [];
    const fresh = who === ctx.uid ? got.filter(t => !seen.includes(t.id)).map(t => t.id) : [];
    useEffect(() => {
      if (!fresh.length) return;
      M.burst(document.getElementById('trophies'));
      ctx.W.merge('me/' + ctx.uid, {badgesSeen: seen.concat(fresh)}).catch(() => {});
    }, [fresh.join(',')]);
    return html`<${UI.Card} id="trophies" title="Trophy case" action=${html`<span class="pill ink">${got.length} of ${list.length}</span>`}>
      <div class="trophies">
        ${list.map(t => html`<div key=${t.id} class=${'trophy' + (t.got ? '' : ' locked') + (fresh.includes(t.id) ? ' new' : '')}>
          <span class="ic"><${icons[t.icon] || icons.trophy}/></span>
          <b>${t.name}</b><span class="small">${t.desc}</span>
        </div>`)}
      </div>
    <//>`;
  }

  /* ---------- about you: birthday and a fun fact ---------- */
  function AboutCard() {
    const ctx = M.useCtx();
    const me = ctx.coll.me.map[ctx.uid] || {};
    const [bd, setBd] = useState(me.birthday ? '2000-' + me.birthday : '');
    const [fact, setFact] = useState(me.fact || '');
    useEffect(() => { setBd(me.birthday ? '2000-' + me.birthday : ''); setFact(me.fact || ''); }, [me.birthday, me.fact]);
    const save = () => ctx.W.merge('me/' + ctx.uid, {birthday: bd ? bd.slice(5) : '', fact: fact.trim().slice(0, 120)}).then(() => M.toast('Saved')).catch(() => {});
    return html`<${UI.Card} id="about-card" title="About you">
      <div class="grid2">
        <${UI.Input} label="birthday" type="date" value=${bd} onChange=${setBd} hint="Only the day and month show. The team gets a nudge to wish you."/>
        <${UI.Input} label="one fun fact" value=${fact} onChange=${setFact} placeholder="Makes a mean filter coffee"/>
      </div>
      <div class="row" style=${{marginTop: '10px'}}><${UI.Btn} sm=${true} onClick=${save}>Save<//></div>
    <//>`;
  }

  M.trophies = {DEFS, stats, earned, celebrations, today};
  M.parts.Celebrate = Celebrate;
  M.parts.Trophies = Trophies;
  M.parts.AboutCard = AboutCard;
})();

/* ==== 68-breathe.js ==== */
/* module: breathe. Sixty seconds of box breathing, full screen, in ink and flame.
   Four in, four hold, four out, four hold. Escape or Done ends it. */
'use strict';
(function () {
  const {html, React} = M;
  const {useState, useEffect} = React;

  const PHASES = [['Breathe in', .95], ['Hold', .95], ['Breathe out', .45], ['Hold', .45]];
  const STEP = 4000, TOTAL = 60000;
  let openFn = null;
  M.breathe = {open: () => { if (openFn) openFn(); }, _bind: fn => { openFn = fn; }};

  function Breathe({onClose}) {
    const [t0] = useState(() => Date.now());
    const now = M.useClock();
    const el = Math.min(TOTAL, now - t0);
    const phase = Math.floor(el / STEP) % 4;
    const left = Math.max(0, Math.ceil((TOTAL - el) / 1000));
    const done = el >= TOTAL;
    useEffect(() => { const esc = e => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', esc); return () => window.removeEventListener('keydown', esc); }, []);
    useEffect(() => { if (done) M.sound.play('chime'); }, [done]);
    return html`<div class="breathe" role="dialog" aria-label="Breathe" id="breathe">
      <div class="micro">${done ? 'done' : left + ' seconds'}</div>
      <div class="orb" style=${{'--k': done ? .7 : PHASES[phase][1]}}><span>${done ? 'Nice' : PHASES[phase][0]}</span></div>
      <h2>${done ? 'Back to it.' : 'Slow down for a minute.'}</h2>
      <button type="button" class="linky" onClick=${onClose}>${done ? 'Done' : 'Skip'}</button>
    </div>`;
  }

  function BreatheHost() {
    const [open, setOpen] = useState(false);
    useEffect(() => { M.breathe._bind(() => setOpen(true)); return () => M.breathe._bind(null); }, []);
    return open ? html`<${Breathe} onClose=${() => setOpen(false)}/>` : null;
  }

  M.parts.BreatheHost = BreatheHost;
})();

/* ==== 69-tape.js ==== */
/* module: tape. HQ's live tape (everything that happened today, newest first) and the mood
   heatmap (the last three weeks of check-in moods, one row per person). Founder only. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState} = React;

  function tape(ctx) {
    const td = U.todayStr(), start = U.parseYmd(td).getTime();
    const out = [];
    const nm = id => html`<${UI.Name} id=${id}/>`;
    const push = (at, text, hot, uid) => { if (at >= start) out.push({at, text, hot: !!hot, uid}); };
    ctx.activeMembers.forEach(m => {
      const e = ((ctx.coll.checkin.map[m.uid] || {}).days || {})[td];
      if (e && e.in) push(e.in, html`${nm(m.uid)} checked in, ${e.mode === 'wfh' ? 'WFH' : 'office'}${e.mood ? ', feeling ' + ['', 'drained', 'low', 'okay', 'good', 'on fire'][e.mood] : ''}`, e.late, m.uid);
      if (e && e.out) push(e.out, html`${nm(m.uid)} checked out`, false, m.uid);
      const eod = ((ctx.coll.eod.map[m.uid] || {}).days || {})[td];
      if (eod && eod.at) push(eod.at, html`${nm(m.uid)} posted an EOD line: ${String(eod.shipped).slice(0, 80)}`, false, m.uid);
    });
    const tmap = ctx.coll.tasks.map;
    for (const id of Object.keys(tmap)) {
      const t = tmap[id];
      if (!t) continue;
      if (t.doneAt) push(t.doneAt, html`${nm(t.owner)} shipped ${t.title}`, false, t.owner);
      if (t.reviewAt) push(t.reviewAt, html`${nm(t.owner)} sent ${t.title} for review`, false, t.owner);
      if (t.sentBackAt) push(t.sentBackAt, html`${nm(t.sentBackBy)} sent ${t.title} back`, true, t.sentBackBy);
      if (t.created && t.by) push(t.created, html`${nm(t.by)} created ${t.title}${t.owner && t.owner !== t.by ? html` for ${nm(t.owner)}` : ''}`, false, t.by);
    }
    for (const a of Object.keys(ctx.coll.feed.map)) for (const p of (ctx.coll.feed.map[a].posts || [])) if (p) push(p.at, html`${nm(a)} posted ${p.kind === 'poll' ? 'a poll' : p.kind === 'announce' ? 'an announcement' : p.kind === 'win' ? 'a win' : 'an update'}: ${String(p.text).slice(0, 70)}`, p.kind === 'announce', a);
    for (const g of Object.keys(ctx.coll.kudos.map)) for (const k of (ctx.coll.kudos.map[g].given || [])) if (k) push(k.at, html`${nm(g)} gave kudos to ${nm(k.to)}`, false, g);
    for (const u of Object.keys(ctx.coll.leave.map)) for (const r of (ctx.coll.leave.map[u].reqs || [])) if (r && r.at) push(r.at, html`${nm(u)} asked for leave`, false, u);
    (M.team ? M.team.requests(ctx) : []).forEach(r => push(r.at, html`${nm(r.uid)} asked to join`, true, r.uid));
    out.sort((a, b) => b.at - a.at);
    return out.slice(0, 40);
  }

  function Tape() {
    const ctx = M.useCtx();
    const [all, setAll] = useState(false);
    const list = tape(ctx);
    const shown = all ? list : list.slice(0, 8);
    return html`<${UI.Card} id="tape" title="The tape" action=${html`<span class="small ink62 num">${list.length} today</span>`}>
      ${list.length ? html`<div class="tape">
        ${shown.map((e, i) => html`<div class="tape-row" key=${i}>
          <span class="tm num">${U.hhmm(e.at)}</span>
          <span class="nd"><i class=${e.hot ? 'hot' : ''}/></span>
          <span class="tx">${e.text}</span>
        </div>`)}
      </div>` : html`<${UI.Empty} text="Quiet so far today."/>`}
      ${list.length > 8 ? html`<button type="button" class="linky small" style=${{marginTop: '8px'}} onClick=${() => setAll(!all)}>${all ? 'Show less' : 'Show all ' + list.length}</button>` : null}
    <//>`;
  }

  function MoodHeat() {
    const ctx = M.useCtx();
    const days = [];
    for (let i = 20; i >= 0; i--) { const d = U.addDays(new Date(ctx.now), -i); if (d.getDay() !== 0) days.push(U.ymd(d)); }
    const rows = ctx.activeMembers.map(m => ({uid: m.uid, cells: days.map(d => { const e = ((ctx.coll.checkin.map[m.uid] || {}).days || {})[d]; return e && e.mood ? e.mood : (e && e.in ? 3 : 0); })}));
    const avg = days.map(d => { const v = ctx.activeMembers.map(m => (((ctx.coll.checkin.map[m.uid] || {}).days || {})[d] || {}).mood).filter(Boolean); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
    return html`<${UI.Card} id="moodheat" title="Mood, three weeks" action=${html`<${UI.Spark} values=${avg} width=${120} height=${28}/>`}>
      <div class="heat" style=${{'--n': days.length}}>
        <div class="heat-row"><span/>${days.map(d => html`<span key=${d} class="heat-dow">${U.DAYS_S[U.parseYmd(d).getDay()][0]}</span>`)}</div>
        ${rows.map(r => html`<div class="heat-row" key=${r.uid}>
          <span class="nm"><${UI.Name} id=${r.uid}/></span>
          ${r.cells.map((c, i) => html`<span key=${i} class=${'heat-cell ' + (c ? 'm' + c : 'none')} title=${days[i]}/>`)}
        </div>`)}
      </div>
      <div class="tiny ink62" style=${{marginTop: '10px'}}>Flame is low, ink is high, an empty box is a day off or no check-in.</div>
    <//>`;
  }

  M.tape = {tape};
  M.parts.Tape = Tape;
  M.parts.MoodHeat = MoodHeat;
})();

/* ==== 70-standalone.js ==== */
/* module: standalone. Only in the EdgeOne build: first-run setup, sign in by name,
   sign-in links for other devices, sign out, and the founder's AI key. */
'use strict';
(function () {
  const {html, React, UI} = M;
  const {useState, useEffect} = React;
  if (!window.M360_STANDALONE) return;
  const api = window.M360_API;

  /* the address people open; an anonymous preview keeps its access token in the query */
  M.APP_URL = location.origin + location.pathname + location.search;
  const linkFor = code => M.APP_URL + '#login=' + code;

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); M.toast('Copied'); }
    catch (e) { M.toast('Copy is blocked here. Select the text and copy it.', true); }
  }

  /* ---------- sign in: set up, or join by name ---------- */
  function SignIn() {
    const [info, setInfo] = useState(null);
    const [name, setName] = useState('');
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState(window.M360_LOGIN_ERR || '');
    useEffect(() => { api('me').then(setInfo, () => setInfo({uid: null, setup: false, down: true})); }, []);
    if (!info) return html`<${M.Gate} title="Signing you in" line="One moment."/>`;
    if (info.down) return html`<${M.Gate} title="Workspace unavailable" line="The workspace could not load. Reload in a moment."/>`;

    const first = !!info.setup;
    async function go() {
      if (!name.trim()) return;
      setBusy(true); setErr('');
      try { await api(first ? 'setup' : 'signup', {name: name.trim()}); location.reload(); }
      catch (e) {
        setErr(e && e.code === 'taken' ? 'Someone set this workspace up a moment ago. Reload and ask to join.' : 'That did not work. Try again in a moment.');
        setBusy(false);
      }
    }
    return html`<${M.Gate} title=${first ? 'Set up m360 OS' : 'Welcome to m360'}
      line=${first ? 'You are the first one here, so this workspace is yours. You get HQ, Admin and every number.'
        : 'Type your name to get started. Kaavish lets you in with one tap.'}>
      <div class="join-box stack tight">
        <${UI.Input} id="signin-name" label="your name" value=${name} placeholder="First and last name"
          onChange=${setName} onEnter=${go}/>
        <${UI.Btn} onClick=${go} disabled=${busy || !name.trim()}>${busy ? 'One moment' : first ? 'Set up the workspace' : 'Continue'}<//>
        ${err ? html`<div class="small flame-t" role="alert">${err}</div>` : null}
        ${first ? null : html`<p class="small ink62" style=${{margin: '6px 0 0'}}>Already on the team? Open the sign-in link from your other device or from Kaavish.</p>`}
      </div>
    <//>`;
  }

  /* ---------- a sign-in link for a person (the founder) or for yourself ---------- */
  function LinkDrawer({uid, onClose}) {
    const ctx = M.useCtx();
    const [link, setLink] = useState('');
    const [err, setErr] = useState('');
    const self = !uid || uid === ctx.uid;
    useEffect(() => {
      api('mklink', self ? {} : {uid}).then(r => setLink(linkFor(r.code)), () => setErr('That did not work. Try again in a moment.'));
    }, [uid]);
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${self ? 'Sign in on another device' : 'Sign-in link'}>
      <div class="stack" style=${{gap: '14px'}}>
        <div class="row"><${UI.Avatar} id=${uid || ctx.uid} size=${34}/><span style=${{fontWeight: 500}}><${UI.Name} id=${uid || ctx.uid}/></span></div>
        <p class="small ink62" style=${{margin: 0}}>${self
          ? 'Open this link on your phone or laptop and you are signed in there too. It works once, for 7 days.'
          : 'Send this to them. It signs them in on any device, works once, for 7 days.'}</p>
        ${link ? html`<div class="invite-link num" id="signin-link">${link}</div>
          <div class="row"><${UI.Btn} sm=${true} onClick=${() => copy(link)}>Copy link<//></div>`
          : err ? html`<div class="small flame-t">${err}</div>` : html`<${UI.Empty} text="Making the link."/>`}
      </div>
    <//>`;
  }

  /* ---------- Me: devices and sign out ---------- */
  function DeviceCard() {
    const [open, setOpen] = useState(false);
    const [canInstall, setCanInstall] = useState(!!window.M360_INSTALL);
    useEffect(() => { const on = () => setCanInstall(true); window.addEventListener('m360:installable', on); return () => window.removeEventListener('m360:installable', on); }, []);
    const install = async () => { const e = window.M360_INSTALL; if (!e) return; e.prompt(); try { await e.userChoice; } catch (x) { /* dismissed */ } window.M360_INSTALL = null; setCanInstall(false); };
    return html`<${UI.Card} title="This account" id="device-card">
      <div class="row">
        ${canInstall ? html`<${UI.Btn} sm=${true} onClick=${install}>Add m360 to this phone<//>` : null}
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => setOpen(true)}>Sign in on another device<//>
        <${UI.ConfirmBtn} kind="ghost" onConfirm=${() => api('logout').then(() => location.reload(), () => location.reload())}
          label="Tap again to sign out">Sign out<//>
      </div>
      ${open ? html`<${LinkDrawer} onClose=${() => setOpen(false)}/>` : null}
    <//>`;
  }

  /* ---------- Admin: the AI key ---------- */
  function AiKeyCard() {
    const ctx = M.useCtx();
    const [on, setOn] = useState(null);
    const [key, setKey] = useState('');
    const [busy, setBusy] = useState(false);
    useEffect(() => { api('aistatus').then(r => setOn(!!r.on), () => setOn(false)); }, []);
    if (!ctx.isFounder || on === null) return null;
    async function save(k) {
      setBusy(true);
      try {
        const r = await api('aikey', {key: k});
        setOn(!!r.on); setKey('');
        M.toast(k ? 'AI is on. Reload to use it.' : 'Key removed');
      } catch (e) { M.toast((e && e.message) || 'That did not save.', true); }
      setBusy(false);
    }
    return html`<${UI.Card} id="ai-key" title="m360 AI"
      action=${on ? html`<span class="pill ink">on</span>` : html`<span class="pill flame-o">off</span>`}>
      <p class="small ink62" style=${{marginTop: 0}}>${on
        ? 'Brief me, Ask m360, the cursor buddy and every AI button run on your Anthropic key. The key stays on the server and never reaches a page.'
        : 'Paste an Anthropic API key to switch on Brief me, Ask m360, the cursor buddy and every AI button. It stays on the server and never reaches a page.'}</p>
      <div class="row">
        <input class="input" type="password" autocomplete="off" style=${{maxWidth: '360px'}} placeholder="sk-ant-..."
          aria-label="Anthropic API key" value=${key} onInput=${e => setKey(e.target.value)}/>
        <${UI.Btn} sm=${true} disabled=${busy || !key.trim()} onClick=${() => save(key.trim())}>Save key<//>
        ${on ? html`<${UI.ConfirmBtn} kind="ghost" onConfirm=${() => save('')} label="Tap again to remove">Remove<//>` : null}
      </div>
    <//>`;
  }

  M.parts.SignIn = SignIn;
  M.parts.LinkDrawer = LinkDrawer;
  M.parts.DeviceCard = DeviceCard;
  M.parts.AiKeyCard = AiKeyCard;
})();

/* ==== 99-app.js ==== */
/* m360 OS root: boot gate, roster gate, mount. */
'use strict';
(function () {
  const {html, React} = M;

  function RosterGate() {
    const ctx = M.useCtx();
    if (!ctx.ready) return M.GateFor('boot');
    const onRoster = ctx.member && ctx.member.active !== false;
    if (!ctx.isFounder && !onRoster) return M.parts.JoinGate ? html`<${M.parts.JoinGate}/>` : M.GateFor('roster');
    return html`<${M.Shell}/>`;
  }

  function Root() {
    const [boot, setBoot] = React.useState(null);
    React.useEffect(() => {
      let live = true;
      M.boot().then(b => { if (live) setBoot(b); });
      return () => { live = false; };
    }, []);
    if (!boot) return M.GateFor('boot');
    if (boot.mode !== 'ok') return M.GateFor(boot.mode);
    return html`<${M.AppState} boot=${boot}><${RosterGate}/><//>`;
  }

  const rootEl = document.getElementById('root');
  ReactDOM.createRoot(rootEl).render(html`<${Root}/>`);
})();

</script>
</body></html>
