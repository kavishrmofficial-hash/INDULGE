          <div class="row" style=${{marginTop: '20px', gap: '8px'}}>

    return html`<section class="card flame">
      <div class="row"><span class="pill flame">announcement</span><${UI.Avatar} id=${au} size=${22}/>
        <span class="small" style=${{fontWeight: 500}}><${UI.Name} id=${au}/></span><span class="tiny ink62">${U.timeAgo(post.at)}</span></div>
      <p style=${{whiteSpace: 'pre-wrap', margin: '10px 0 14px', fontSize: '16px'}}>${post.text}</p>
      <${UI.Btn} sm=${true} onClick=${() => ctx.W.merge('acks/' + ctx.uid, {s: {[ackKey]: Date.now()}})}>Got it<//>
    </section>`;
  }

  /* ---------- EOD with an AI draft ---------- */
  function Wrap() {
    const ctx = M.useCtx();
    const td = U.todayStr();
    const eods = (ctx.coll.eod.map[ctx.uid] || {}).days || {};
    const posted = eods[td];
    const [edit, setEdit] = useState(false);
    const [f, setF] = useState(() => ({shipped: (posted && posted.shipped) || '', next: (posted && posted.next) || '', blocked: (posted && posted.blocked) || ''}));
    const r = M.ai.useRun();
    const set = (k, v) => setF(x => ({...x, [k]: v}));
    async function draft() {
      const slice = await M.ai.meSlice(ctx);
      const out = await r.run(o => M.ai.json(ctx,
        'Draft this person\'s end of day line from their work data below. Reply with only JSON: ' +
        '{"shipped": "what went out today, one or two short lines", "next": "what they pick up tomorrow", "blocked": "a real blocker or empty string"}. ' +
        'Only claim what the data supports. Keep each field under 160 characters.\n\n' + slice, {signal: o.signal, tier: 'quick', cache: false}));
      if (out && typeof out === 'object') setF({shipped: String(out.shipped || ''), next: String(out.next || ''), blocked: String(out.blocked || '')});
    }
    async function post() {
      if (!f.shipped.trim()) return;
      const days = U.clone(eods);
      days[td] = {shipped: f.shipped.trim(), next: f.next.trim(), blocked: f.blocked.trim(), at: Date.now()};
      await ctx.W.merge('eod/' + ctx.uid, {days: U.pruneDays(days)});
      setEdit(false);
      M.toast('Posted');
    }
    if (posted && !edit) {
      return html`<section class="card">
        <div class="card-head"><h2 class="card-title">EOD line</h2>
          <${UI.Btn} kind="sec" sm=${true} onClick=${() => { setF({shipped: posted.shipped, next: posted.next || '', blocked: posted.blocked || ''}); setEdit(true); }}>Edit<//></div>
        <div class="stack tight">
          <div><span class="micro plain">shipped</span>${posted.shipped}</div>
          ${posted.next ? html`<div><span class="micro plain">next</span>${posted.next}</div>` : null}
          ${posted.blocked ? html`<div class="flame-t"><span class="micro plain">blocked</span>${posted.blocked}</div>` : null}
        </div>
      </section>`;
    }
    const late = new Date(ctx.now).getHours() >= 18;
    const thinking = r.state === 'thinking' || r.state === 'streaming';
    return html`<section class=${'card' + (late ? ' flame' : '')}>
      <div class="card-head">
        <div class="grow"><h2 class="card-title">EOD line</h2>
          <div class="small ink62">${late ? html`<span class="flame-t">Due at 19:00.</span>` : 'Three lines before ' + ctx.settings.eodCut + '. Let m360 draft it, then tweak.'}</div></div>
        ${M.ai.on(ctx) ? html`<button type="button" class="btn sec sm" disabled=${thinking} onClick=${draft}>
          ${thinking ? html`<${M.Thinking} label="Drafting"/>` : html`<span class="spark">${SPARK}</span> Write it for me`}</button>` : null}
      </div>
      ${r.state === 'error' ? html`<div class="small flame-t">${M.ai.errCopy(r.err)}</div>` : null}
      <div class="stack tight">
        <${UI.TextArea} id="wrap-shipped" label="shipped" rows=${2} value=${f.shipped} onChange=${v => set('shipped', v)} placeholder="What went out today"/>
        <${UI.Input} id="wrap-next" label="next" value=${f.next} onChange=${v => set('next', v)} placeholder="What you pick up tomorrow"/>
        <${UI.Input} id="wrap-blocked" label="blocked" value=${f.blocked} onChange=${v => set('blocked', v)} placeholder="Leave empty when nothing is in the way"/>
        <div class="row"><${UI.Btn} disabled=${!f.shipped.trim()} onClick=${post}>Post EOD line<//>
          ${edit ? html`<${UI.Btn} kind="ghost" sm=${true} onClick=${() => setEdit(false)}>Cancel<//>` : null}</div>
      </div>
    </section>`;
  }

  /* ---------- AI brief ---------- */
  function Brief() {
    const ctx = M.useCtx();
    const cache = M.ai.useCache(ctx);
    const r = M.ai.useRun();
    const cached = cache.data && cache.data.brief && cache.data.brief.date === U.todayStr() ? cache.data.brief.text : '';
    const text = r.text || cached;
    if (!M.ai.on(ctx)) return null;
    async function go() {
      const slice = await M.ai.meSlice(ctx);
      const out = await r.run(o => M.ai.text(ctx,
        'Write this person a short plan for the rest of today from their data below. Format: one bold opening line ' +
        'with the single most important thing, then 3 to 5 bullets in priority order (overdue first, then what is due soonest, ' +
        'then this week\'s outcomes), then one line of encouragement. Under 110 words. Mention real task names.\n\n' + slice,
        {signal: o.signal, onText: o.onText, cache: false}));
      if (typeof out === 'string' && out) M.ai.saveCache(ctx, 'brief', {text: out});
    }
    const busy = r.state === 'thinking' || r.state === 'streaming';
    return html`<section class="ai-card">
      <div class="card-head">
        <div class="grow"><${UI.Micro}>m360 ai<//><h2 class="card-title" style=${{marginTop: '4px'}}>Your day, sorted</h2></div>
        <button type="button" class=${'btn sm ' + (text ? 'sec' : '')} disabled=${busy} onClick=${go}>
          ${busy ? html`<${M.Thinking}/>` : html`<span class="spark">${SPARK}</span> ${text ? 'Refresh' : 'Brief me'}`}</button>
      </div>
      ${text ? html`<${M.AIText} text=${text}/>`
        : html`<div class="small ink62">${busy ? 'Reading your tasks, outcomes and flags.' : 'One tap and m360 lines up your day from your tasks, deadlines and this week\'s outcomes.'}</div>`}
      ${r.state === 'error' ? html`<div class="small flame-t" style=${{marginTop: '8px'}}>${M.ai.errCopy(r.err)}</div>` : null}
    </section>`;
  }

  /* ---------- focus list ---------- */
  function Focus({onOpen}) {
    const ctx = M.useCtx();
    const td = U.todayStr();
    const [q, setQ] = useState('');
    const [busy, setBusy] = useState(false);
    const rows = useMemo(() => {
      const map = ctx.coll.tasks.map;
      const mine = Object.keys(map).map(id => ({id, ...map[id]})).filter(t => t.owner === ctx.uid);
      const open = mine.filter(t => t.status !== 'done').sort((a, b) => {
        const ao = a.due && a.due < td ? 0 : 1, bo = b.due && b.due < td ? 0 : 1;
        if (ao !== bo) return ao - bo;
        if ((a.due || '9') !== (b.due || '9')) return String(a.due || '9') < String(b.due || '9') ? -1 : 1;
        return (a.priority === 'high' ? 0 : 1) - (b.priority === 'high' ? 0 : 1);
      });
      const doneToday = mine.filter(t => t.status === 'done' && t.doneAt && U.ymd(new Date(t.doneAt)) === td);
      return {open: open.slice(0, 6), more: Math.max(0, open.length - 6), doneToday};
    }, [ctx.coll.tasks.map, ctx.uid, td]);

    const complete = t => ctx.W.update('tasks/' + t.id, {status: 'done', doneAt: Date.now(), updated: Date.now()}).then(() => M.toast('Done. Nice'));
    const reopen = t => ctx.W.update('tasks/' + t.id, {status: 'doing', doneAt: null, updated: Date.now()});

    async function add() {
      const text = q.trim();
      if (!text) return;
      setBusy(true);
      let task = {title: text, owner: ctx.uid, due: '', priority: 'normal'};
      if (M.ai.on(ctx)) {
        try {
          const nm = await M.ai.names(ctx);
          const roster = ctx.activeMembers.map(m => (nm[m.uid] || '') + ' (' + (m.title || '') + ')').join(', ');
          const out = await M.ai.json(ctx, 'Turn this note into one task. Team: ' + roster + '. Today is ' + td + ' (' + U.DAYS[new Date().getDay()] + '). ' +
            'Reply with only JSON {"title": "short task starting with a verb", "owner": "first name or me", "due": "YYYY-MM-DD or empty", "priority": "low|normal|high"}.\n\nNote: ' + text,
            {tier: 'quick', cache: false});
          if (out && out.title) task = {title: String(out.title).slice(0, 140), owner: M.ai.findMember(ctx, nm, out.owner) || ctx.uid,
            due: /^\d{4}-\d{2}-\d{2}$/.test(String(out.due || '')) ? out.due : '', priority: ['low', 'normal', 'high'].indexOf(out.priority) >= 0 ? out.priority : 'normal'};
        } catch (e) { if (e && e.code && !M.ai.isOff(e.code)) M.toast(M.ai.errCopy(e.code), true); }
      }
      await ctx.W.set('tasks/' + U.uid(), {...task, client: '', project: '', section: '', status: 'todo', link: '', revisions: 0, shown20: false,
        subtasks: {}, comments: {}, by: ctx.uid, created: Date.now(), updated: Date.now(), doneAt: null}).catch(() => {});
      setQ(''); setBusy(false);
      M.toast(task.owner === ctx.uid ? 'Added to your list' : 'Task sent');
    }

    return html`<section class="card">
      <div class="card-head"><h2 class="card-title">Today's focus</h2>
        <${UI.Btn} kind="sec" sm=${true} onClick=${() => M.nav('#tasks')}>Board<//></div>
      ${rows.open.length ? rows.open.map(t => {
        const over = t.due && t.due < td;
        return html`<div class="focus" key=${t.id}>
          <button type="button" class="tick" aria-label=${'Mark ' + t.title + ' done'} onClick=${() => complete(t)}/>
          <button type="button" class="rowbtn grow" onClick=${() => onOpen(t.id)}>
            <div class="ft" style=${{fontWeight: 500}}>${t.title}</div>
            <div class="row" style=${{gap: '6px', marginTop: '5px'}}>
              ${t.due ? html`<span class=${'pill ' + (over ? 'flame' : '')}>${over ? 'overdue, ' : 'due '}${U.fmtDay(t.due)}</span>` : null}
              ${t.priority === 'high' ? html`<span class="pill flame-o">high</span>` : null}
              ${t.status === 'review' ? html`<span class="pill warm">in review</span>` : t.status === 'doing' ? html`<span class="pill">doing</span>` : null}
            </div>
          </button>
        </div>`;
      }) : html`<div class="focus"><span class="grow">Nothing open on you. Pick something from the board.</span></div>`}
      ${rows.more ? html`<div class="small ink62" style=${{marginTop: '10px'}}>${rows.more} more on your board</div>` : null}
      ${rows.doneToday.length ? html`<div style=${{marginTop: '14px'}}>
        <div class="micro" style=${{marginBottom: '8px'}}>done today, ${rows.doneToday.length}</div>
        ${rows.doneToday.slice(0, 4).map(t => html`<div class="focus done" key=${t.id}>
          <button type="button" class="tick done" aria-label=${'Reopen ' + t.title} onClick=${() => reopen(t)}>✓</button>
          <span class="ft grow">${t.title}</span></div>`)}
      </div>` : null}
      <div class="ask-in" style=${{marginTop: '14px'}}>
        <input id="quick-add" class="input" value=${q} aria-label="Add a task"
          placeholder=${M.ai.on(ctx) ? 'Add a task. Try: ask Aanya to cut the teaser by Friday' : 'Add a task'}
          onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') add(); }}/>
        <${UI.Btn} disabled=${busy || !q.trim()} onClick=${add}>${busy ? 'Adding' : 'Add'}<//>
      </div>
    </section>`;
  }

  /* ---------- my numbers ---------- */
  function Numbers() {
    const ctx = M.useCtx();
    const wk = U.periodRange('week', new Date(ctx.now));
    const map = ctx.coll.tasks.map;
    const mine = Object.keys(map).map(id => map[id]).filter(t => t.owner === ctx.uid);
    const doneWk = mine.filter(t => t.status === 'done' && t.doneAt && U.ymd(new Date(t.doneAt)) >= wk.from);
    const pts = (M.points && M.points.pointsFor) ? M.points.pointsFor(ctx, ctx.uid, wk.from, wk.to) : {total: 0};
    const board = (M.points && M.points.leaderboard) ? M.points.leaderboard(ctx, 'week', new Date(ctx.now)) : [];
    const rank = board.findIndex(r => r.uid === ctx.uid) + 1;
    const wkId = U.isoWeek(new Date(ctx.now));
    const plan = (((ctx.coll.plan.map[ctx.uid] || {}).weeks || {})[wkId] || {}).items || [];
    const marks = ((((ctx.coll.review.map[ctx.uid] || {}).weeks || {})[wkId]) || {}).marks || {};
    const hit = Object.values(marks).filter(x => x === 'hit').length;
    const overdue = mine.filter(t => t.status !== 'done' && t.due && t.due < U.todayStr()).length;
    const tile = (v, l, to, hot) => html`<button type="button" class=${'stat' + (hot ? ' hot' : '')} onClick=${() => M.nav(to)}>
      <span class="v num">${typeof v === 'number' ? html`<${UI.Num} value=${v}/>` : v}</span><span class="l">${l}</span></button>`;
    return html`<div class="grid4 two">
      ${tile(doneWk.length, 'shipped this week', '#tasks')}
      ${tile(overdue, 'overdue on you', '#tasks', overdue > 0)}
      ${tile(pts.total, rank ? 'points, rank ' + rank : 'points this week', '#scores')}
      ${tile(hit + '/' + plan.length, 'outcomes hit', '#week')}
    </div>`;
  }

  /* ---------- the crew right now ---------- */
  function Crew() {
    const ctx = M.useCtx();
    const td = U.todayStr();
    const people = ctx.activeMembers;
    const inCount = people.filter(m => { const a = M.att.dayStatus(ctx, m.uid, td); return a.status === 'office' || a.status === 'wfh'; }).length;
    const onlineCount = Object.keys(ctx.online || {}).length;
    return html`<section class="card">
      <div class="card-head"><h2 class="card-title">Who's in today</h2>
        <span class="small ink62 num">${inCount} of ${people.length} in${onlineCount ? ', ' + onlineCount + ' online' : ''}</span></div>
      <div class="stack tight">
        ${people.map(m => {
          const a = M.att.dayStatus(ctx, m.uid, td);
          const st = todayStatus(ctx, m.uid);
          const where = a.status === 'office' ? 'In office' : a.status === 'wfh' ? 'WFH' : a.status === 'leave' ? 'On leave' : 'Not in yet';
          return html`<button type="button" class="listrow rowbtn" key=${m.uid} onClick=${() => M.nav('#people/' + m.uid)}>
            <span class="av-wrap"><${UI.Avatar} id=${m.uid} size=${30}/>${ctx.online && ctx.online[m.uid] ? html`<span class="live" title="online now"/>` : null}</span>
            <span class="grow"><span style=${{fontWeight: 500}}><${UI.Name} id=${m.uid}/></span>
              <div class="tiny ink62">${st ? st.text : where}${a.in ? ', ' + U.hhmm(a.in) : ''}</div></span>
            ${a.late && ctx.canSee(m.uid) ? html`<span class="pill flame-o">late</span>` : null}
            <span class=${'pill ' + (a.status === 'office' ? 'ink' : a.status === 'leave' ? 'warm' : '')}>${where}</span>
          </button>`;
        })}
      </div>
    </section>`;
  }

  function Nudges() {
    const ctx = M.useCtx();
    const unread = (M.handbook && M.handbook.unread) ? M.handbook.unread(ctx, ctx.uid) : [];
    const evals = (M.hiring && M.hiring.assignedToMe) ? M.hiring.assignedToMe(ctx) : [];
    if (!unread.length && !evals.length) return null;
    return html`<section class="card warm" style=${{padding: '14px 18px'}}>
      <div class="stack tight">
        ${evals.length ? html`<button type="button" class="rowbtn row" onClick=${() => M.nav('#hiring')}>
          <span class="dotflame"/><span class="grow" style=${{fontWeight: 500}}>${evals.length} ${evals.length === 1 ? 'evaluation' : 'evaluations'} assigned to you</span><span aria-hidden="true">→</span></button>` : null}
        ${unread.length ? html`<button type="button" class="rowbtn row" onClick=${() => M.nav('#handbook/' + unread[0])}>
          <span class="dotflame"/><span class="grow" style=${{fontWeight: 500}}>${unread.length} handbook ${unread.length === 1 ? 'section' : 'sections'} to read</span><span aria-hidden="true">→</span></button>` : null}
      </div>
    </section>`;
  }

  /* ---------- quick actions ---------- */
  function Quick({onTask}) {
    const ctx = M.useCtx();
    const items = [
      {k: 'task', label: 'New task', icon: 'tasks', go: onTask},
      {k: 'focus', label: 'Focus', icon: 'timer', go: () => M.focus && M.focus.open()},
      {k: 'post', label: 'Post an update', icon: 'feed', go: () => M.intend('#feed', 'post')},
      {k: 'kudos', label: 'Give kudos', icon: 'scores', go: () => M.intend('#feed', 'kudos')},
      {k: 'breathe', label: 'Breathe', icon: 'breath', go: () => M.breathe && M.breathe.open()},
      ctx.isFounder ? {k: 'pitch', label: 'New pitch', icon: 'pitches', go: () => M.intend('#pitches', 'pitch')}
        : {k: 'leave', label: 'Request leave', icon: 'leave', go: () => M.nav('#leave')}
    ];
    return html`<nav class="quick" aria-label="Quick actions">
      ${items.map(it => html`<button key=${it.k} type="button" class="quick-btn" onClick=${it.go}>
        <${M.icons[it.icon]}/><span>${it.label}</span></button>`)}
    </nav>`;
  }

  /* ---------- my week: attendance and EOD, Monday to Saturday ---------- */
  function MyWeek() {
    const ctx = M.useCtx();
    const td = U.todayStr();
    const days = U.weekDays(U.mondayOf(new Date(ctx.now)));
    const eods = (ctx.coll.eod.map[ctx.uid] || {}).days || {};
    let onTime = 0, worked = 0, eodN = 0;
    const cells = days.map(d => {
      const a = M.att.dayStatus(ctx, ctx.uid, d);
      const future = d > td;
      const inDay = a.status === 'office' || a.status === 'wfh';
      if (inDay) { worked++; if (!a.late) onTime++; }
      if (eods[d]) eodN++;
      const cls = future ? 'future' : a.status === 'leave' || a.status === 'holiday' ? 'off'
        : inDay ? (a.late ? 'late' : a.status) : d === td ? 'today' : 'miss';
      const label = future ? '' : a.status === 'leave' ? 'leave' : a.status === 'holiday' ? 'holiday'
        : inDay ? (a.status === 'wfh' ? 'WFH' : 'in') + (a.in ? ' ' + U.hhmm(a.in) : '') : d === td ? 'not in yet' : 'no check-in';
      return {d, cls, label, eod: !!eods[d], today: d === td};
    });
    return html`<section class="card" id="my-week">
      <div class="card-head"><h2 class="card-title">My week</h2>
        <span class="small ink62 num">${onTime} of ${worked} on time · ${eodN} EOD</span></div>
      <div class="week-strip">
        ${cells.map(c => html`<div key=${c.d} class=${'wk-day ' + c.cls + (c.today ? ' is-today' : '')} title=${c.label}>
          <span class="wk-dow">${U.fmtDay(c.d).split(' ')[0]}</span>
          <span class="wk-dot"/>
          <span class="wk-eod">${c.eod ? '\u2713 EOD' : ''}</span>
        </div>`)}
      </div>
      <div class="wk-key tiny ink62">
        <span><i class="k office"/>office</span><span><i class="k wfh"/>WFH</span><span><i class="k late"/>late</span><span><i class="k off"/>leave</span>
      </div>
    </section>`;
  }

  /* ---------- my projects ---------- */
  function MyProjects() {
    const ctx = M.useCtx();
    const map = ctx.coll.projects.map;
    const mine = Object.keys(map).map(id => ({id, ...map[id]}))
      .filter(p => !p.archived && p.status !== 'done' && (p.owner === ctx.uid || (p.members || []).includes(ctx.uid)))
      .sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')));
    const ST = (M.projects && M.projects.STATUS) || {};
    return html`<section class="card" id="my-projects">
      <div class="card-head"><h2 class="card-title">My projects</h2>
        <button type="button" class="linky small" onClick=${() => M.nav('#projects')}>All projects</button></div>
      ${mine.length ? html`<div class="stack tight">
        ${mine.slice(0, 4).map(p => {
          const pr = (M.projects && M.projects.progress) ? M.projects.progress(ctx, p.id) : {done: 0, total: 0, overdue: 0};
          const st = ST[p.status] || {label: 'On track', pill: 'ink'};
          const client = p.client && ctx.coll.clients.map[p.client] ? ctx.coll.clients.map[p.client].name : '';
          return html`<button type="button" class="listrow rowbtn proj-row" key=${p.id} onClick=${() => M.nav('#projects/' + p.id)}>
            <span class="grow">
              <span class="row between nowrap"><b style=${{fontWeight: 500}}>${p.name}</b><span class=${'pill ' + st.pill}>${st.label}</span></span>
              <span class="tiny ink62">${client ? client + ' · ' : ''}${pr.done} of ${pr.total} done${pr.overdue ? ', ' + pr.overdue + ' overdue' : ''}${p.due ? ' · due ' + U.fmtDay(p.due) : ''}</span>
              <${UI.Bar} a=${pr.done} max=${pr.total || 1} thin=${true}/>
            </span>
          </button>`;
        })}
      </div>` : html`<div class="small ink62">Nothing on you right now. <button type="button" class="linky small" onClick=${() => M.intend('#projects', 'project')}>Start a project</button></div>`}
    </section>`;
  }

  /* ---------- latest on the feed, and this week's top three ---------- */
  function Buzz() {
    const ctx = M.useCtx();
    const items = (M.feed && M.feed.stream) ? M.feed.stream(ctx).filter(i => !i.pinned).slice(0, 3) : [];
    const board = (M.points && M.points.leaderboard) ? M.points.leaderboard(ctx, 'week', new Date(ctx.now)).slice(0, 3) : [];
    return html`<section class="card" id="buzz">
      <div class="card-head"><h2 class="card-title">Around the studio</h2>
        <button type="button" class="linky small" onClick=${() => M.nav('#feed')}>Open feed</button></div>
      ${items.length ? html`<div class="stack tight">
        ${items.map(it => html`<button type="button" class="listrow rowbtn" key=${it.key} onClick=${() => M.nav('#feed')}>
          <${UI.Avatar} id=${it.type === 'kudos' ? it.giver : it.author} size=${28}/>
          <span class="grow" style=${{minWidth: 0}}>
            <span class="small"><b style=${{fontWeight: 500}}><${UI.Name} id=${it.type === 'kudos' ? it.giver : it.author}/></b>
              ${it.type === 'kudos' ? html` gave kudos to <${UI.Name} id=${it.to}/>` : it.kind === 'win' ? ' shared a win' : ''}</span>
            <span class="tiny ink62 clamp1">${it.type === 'kudos' ? it.why : it.text}</span>
          </span>
          <span class="tiny ink62 nowrap">${U.timeAgo(it.at)}</span>
        </button>`)}
      </div>` : html`<div class="small ink62">Quiet so far. <button type="button" class="linky small" onClick=${() => M.intend('#feed', 'post')}>Post the first update</button></div>`}
      ${board.length ? html`<div class="topthree">
        <div class="micro plain" style=${{marginBottom: '8px'}}>top this week</div>
        ${board.map((r, i) => html`<button type="button" class="top-row rowbtn" key=${r.uid} onClick=${() => M.nav('#scores')}>
          <span class=${'rank num' + (i === 0 ? ' first' : '')}>${i + 1}</span>
          <${UI.Avatar} id=${r.uid} size=${24}/><span class="grow small"><${UI.Name} id=${r.uid}/></span>
          <span class="num small">${r.total} pts</span>
        </button>`)}
      </div>` : null}
    </section>`;
  }

  /* ---------- page ---------- */
  function Home() {
    const ctx = M.useCtx();
    const [task, setTask] = useState(null);
    const [status, setStatus] = useState(false);
    const td = U.todayStr();
    const a = M.att.dayStatus(ctx, ctx.uid, td);
    const hour = new Date(ctx.now).getHours();
    const eodPosted = !!(((ctx.coll.eod.map[ctx.uid] || {}).days || {})[td]);
    const working = a.status !== 'leave' && a.status !== 'holiday' && a.status !== 'sunday';
    const eodFirst = working && (hour >= 16 || !!a.out || eodPosted);
    const Drawer = M.parts.TaskDrawer, Outcomes = M.parts.OutcomesCard, Day = M.parts.YourDay, Onboard = M.parts.Onboarding;
    M.useIntent('checkin', () => setTimeout(() => { const el = document.getElementById('tapin') || document.getElementById('home-hero'); if (el) el.scrollIntoView({block: 'center', behavior: M.reduced() ? 'auto' : 'smooth'}); const b = el && el.querySelector('.btn'); if (b) b.focus(); }, 80));
    const Celebrate = M.parts.Celebrate, Reviews = M.parts.Reviews;
    const newHire = (M.people && M.people.isNewHire) ? M.people.isNewHire(ctx, ctx.uid) : false;

    return html`<div class="stack" style=${{gap: '18px'}}>
      <${Hero} onStatus=${() => setStatus(true)}/>
      ${M.parts.JoinBanner ? html`<${M.parts.JoinBanner}/>` : null}
      <${Announcement}/>
      ${Celebrate ? html`<${Celebrate}/>` : null}
      <${Quick} onTask=${() => setTask('new')}/>
      <div class="split">
        <div class="stack" style=${{gap: '18px'}}>
          ${eodFirst ? html`<${Wrap}/>` : null}
          <${Focus} onOpen=${setTask}/>
          ${Reviews ? html`<${Reviews} compact=${true}/>` : null}
          <${Brief}/>
          <${MyProjects}/>
          ${Outcomes ? html`<${Outcomes}/>` : null}
          ${!eodFirst && working ? html`<${Wrap}/>` : null}
          ${newHire && Onboard ? html`<${Onboard} uid=${ctx.uid} compact=${true}/>` : null}
        </div>
        <div class="stack" style=${{gap: '18px'}}>
          <${Numbers}/>
          <${MyWeek}/>
          <${HeadsUp}/>
          <${Nudges}/>
          <${Crew}/>
          <${Buzz}/>
          ${Day ? html`<${Day}/>` : null}
        </div>
      </div>
      ${task && Drawer ? html`<${Drawer} taskId=${task === 'new' ? null : task} defaults=${{owner: ctx.uid}} onClose=${() => setTask(null)}/>` : null}
      ${status ? html`<${StatusPicker} onClose=${() => setStatus(false)}/>` : null}
    </div>`;
  }

  M.pages.Home = Home;
})();

/* ==== 51-sections.js ==== */
/* module: sections. Work, Accounts, Vibe, Me and Admin: a colourful hero with live numbers,
   simple tabs, and the working screens underneath. Plus the AI tools that deploy work. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo} = React;

  const Embed = ({page, id}) => {
    const P = M.pages[page];
    return P ? html`<div class="embedded"><${P} id=${id || null}/></div>` : null;
  };
  const Mini = ({v, l, hot}) => html`<span class="chipline"><b class=${'num' + (hot ? ' flame-t' : '')}>${v}</b> ${l}</span>`;
  const SPARK = '\u2726';

  /* ---------- AI: turn a brief into assigned tasks ---------- */
  function BriefToTasks({onClose}) {
    const ctx = M.useCtx();
    const [brief, setBrief] = useState('');
    const [project, setProject] = useState('');
    const [rows, setRows] = useState(null);
    const [busy, setBusy] = useState(false);
    const r = M.ai.useRun();
    const projects = Object.keys(ctx.coll.projects.map).map(id => ({id, ...ctx.coll.projects.map[id]})).filter(p => !p.archived && p.status !== 'done');
    const people = ctx.activeMembers;
    const profs = M.useProfiles(people.map(m => m.uid));

    async function breakDown() {
      const nm = await M.ai.names(ctx);
      const tasks = ctx.coll.tasks.map;
      const load = people.map(m => {
        const open = Object.keys(tasks).filter(id => tasks[id].owner === m.uid && tasks[id].status !== 'done').length;
        return '- ' + nm[m.uid] + ', ' + (m.title || m.role) + (m.pod ? ', ' + m.pod : '') + ', ' + open + ' open tasks' + (ctx.onLeave(m.uid, U.todayStr()) ? ', on leave today' : '');
      }).join('\n');
      const p = project ? ctx.coll.projects.map[project] : null;
      const out = await r.run(o => M.ai.json(ctx,
        'Break this brief into 4 to 10 concrete tasks a boutique luxury agency team would ship. Assign each to the best fit ' +
        'by role and current load (spread the work, never pile onto one person). Set realistic due dates from today (' + U.todayStr() + '), ' +
        'working days are Monday to Saturday. ' + (p ? 'Use these project sections where they fit: ' + (p.sections || []).map(s => s.name).join(', ') + '. ' : '') +
        'Reply with only a JSON array of {"title": "starts with a verb", "owner": "first name", "due": "YYYY-MM-DD", "section": "section name or empty", "why": "under 12 words"}.\n\n' +
        'TEAM AND LOAD:\n' + load + '\n\nBRIEF:\n' + brief.slice(0, 6000), {signal: o.signal, cache: false}));
      if (Array.isArray(out)) {
        setRows(out.slice(0, 12).map((t, i) => {
          const owner = M.ai.findMember(ctx, nm, t.owner) || ctx.uid;
          const sec = p ? ((p.sections || []).find(s => String(s.name).toLowerCase() === String(t.section || '').toLowerCase()) || (p.sections || [])[0] || {}).id || '' : '';
          return {k: i, on: true, title: String(t.title || '').slice(0, 140), owner, due: /^\d{4}-\d{2}-\d{2}$/.test(String(t.due || '')) ? t.due : '', section: sec, why: String(t.why || '')};
        }).filter(x => x.title));
      }
    }
    async function create(ev) {
      const pick = (rows || []).filter(x => x.on);
      if (!pick.length) return;
      setBusy(true);
      const p = project ? ctx.coll.projects.map[project] : null;
      for (const t of pick) {
        await ctx.W.set('tasks/' + U.uid(), {title: t.title, owner: t.owner, client: (p && p.client) || '', project: project || '', section: t.section || '',
          due: t.due, status: 'todo', priority: 'normal', link: '', revisions: 0, shown20: false, subtasks: {}, comments: {},
          by: ctx.uid, created: Date.now(), updated: Date.now(), doneAt: null}).catch(() => {});
      }
      setBusy(false);
      M.toast(pick.length + ' tasks sent to the team');
      onClose();
    }
    const upd = (k, patch) => setRows(rs => rs.map(x => x.k === k ? {...x, ...patch} : x));
    const thinking = r.state === 'thinking' || r.state === 'streaming';

    return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Brief to tasks"
      footer=${rows ? html`<${UI.Btn} disabled=${busy || !rows.some(x => x.on)} onClick=${create}>Send ${rows.filter(x => x.on).length} tasks<//>` : null}>
      ${!rows ? html`<div class="stack">
        <div class="small" style=${{fontWeight: 500}}>Paste a client brief, a call summary or a WhatsApp dump. m360 breaks it into tasks, picks owners by role and workload, and sets dates. You review before anything is sent.</div>
        <${UI.TextArea} id="brief-text" label="the brief" rows=${8} value=${brief} onChange=${setBrief}
          placeholder="Swisse wants 10 more reels for Diwali, live by 20 Oct. Hindi and English. Two creators, one studio day..."/>
        <${UI.Select} label="project, optional" value=${project} onChange=${setProject}
          options=${[{v: '', label: 'No project'}].concat(projects.map(p => ({v: p.id, label: p.name})))}/>
        <button type="button" class="btn" disabled=${thinking || brief.trim().length < 12} onClick=${breakDown}>
          ${thinking ? html`<${M.Thinking} label="Breaking it down"/>` : html`<span class="spark">${SPARK}</span> Break it down`}</button>
        ${r.state === 'error' ? html`<div class="small flame-t">${M.ai.errCopy(r.err)}</div>` : null}
      </div>` : html`<div class="stack tight">
        <div class="small" style=${{fontWeight: 500}}>Untick anything you don't want. Change owners or dates, then send.</div>
        ${rows.map(t => html`<div class="focus" key=${t.k} style=${{alignItems: 'flex-start', flexWrap: 'wrap'}}>
          <input type="checkbox" checked=${t.on} onChange=${e => upd(t.k, {on: e.target.checked})} style=${{width: '20px', height: '20px', marginTop: '3px', accentColor: '#111'}} aria-label="Include"/>
          <div class="grow" style=${{minWidth: '200px'}}>
            <input class="input" value=${t.title} onInput=${e => upd(t.k, {title: e.target.value})} style=${{minHeight: '38px', fontWeight: 600}} aria-label="Task title"/>
            <div class="row" style=${{marginTop: '6px', gap: '6px'}}>
              <select class="input" value=${t.owner} onChange=${e => upd(t.k, {owner: e.target.value})} style=${{minHeight: '34px', width: 'auto'}} aria-label="Owner">
                ${people.map(m => html`<option key=${m.uid} value=${m.uid}>${(profs[m.uid] && profs[m.uid].name) || m.title || 'Teammate'}</option>`)}
              </select>
              <input class="input" type="date" value=${t.due} onInput=${e => upd(t.k, {due: e.target.value})} style=${{minHeight: '34px', width: 'auto'}} aria-label="Due"/>
            </div>
            ${t.why ? html`<div class="tiny ink62" style=${{marginTop: '4px'}}>${t.why}</div>` : null}
          </div>
        </div>`)}
        <${UI.Btn} kind="ghost" sm=${true} onClick=${() => setRows(null)}>Start over<//>
      </div>`}
    <//>`;
  }
  M.parts.BriefToTasks = BriefToTasks;

  /* ---------- Work ---------- */
  function Work({tab, id}) {
    const ctx = M.useCtx();
    const [b2t, setB2t] = useState(false);
    const td = U.todayStr();
    const wkEnd = U.periodRange('week').to;
    const map = ctx.coll.tasks.map;
    const all = Object.keys(map).map(k => map[k]);
    const mineOpen = all.filter(t => t.owner === ctx.uid && t.status !== 'done');
    const over = mineOpen.filter(t => t.due && t.due < td).length;
    const dueWk = mineOpen.filter(t => t.due && t.due >= td && t.due <= wkEnd).length;
    const review = all.filter(t => t.status === 'review').length;
    const t = tab || 'tasks';
    return html`<div class="stack" style=${{gap: '20px'}}>
      <${M.SectionHero} micro="work" title="Work"
        right=${M.ai.on(ctx) ? html`<button type="button" class="btn" onClick=${() => setB2t(true)}><span class="spark">${SPARK}</span> Brief to tasks</button>` : null}>
        <div class="row" style=${{gap: '8px'}}>
          <${Mini} v=${mineOpen.length} l="open on you"/>
          <${Mini} v=${over} l="overdue" hot=${over > 0}/>
          <${Mini} v=${dueWk} l="due this week"/>
          <${Mini} v=${review} l="in review across the team"/>
        </div>
      <//>
      <${M.SectionTabs} section="work" active=${t}/>
      ${t === 'projects' ? html`<${Embed} page="Projects" id=${id}/>` : t === 'week' ? html`<${Embed} page="Week"/>`
        : t === 'calendar' ? html`<${Embed} page="Calendar"/>` : t === 'reviews' ? (M.parts.Reviews ? html`<${M.parts.Reviews}/>` : null) : html`<${Embed} page="Tasks" id=${id}/>`}
      ${b2t ? html`<${BriefToTasks} onClose=${() => setB2t(false)}/>` : null}
    </div>`;
  }

  /* ---------- Accounts ---------- */
  function Accounts({tab}) {
    const ctx = M.useCtx();
    const clients = Object.keys(ctx.coll.clients.map).map(k => ctx.coll.clients.map[k]);
    const live = clients.filter(c => c.status === 'live').length;
    const pitches = Object.keys(ctx.coll.pitches.map).map(k => ctx.coll.pitches.map[k]);
    const inPlay = pitches.filter(p => p.stage !== 'won' && p.stage !== 'lost').length;
    const pm = ctx.isFounder && M.pitches && M.pitches.metrics ? M.pitches.metrics(ctx) : null;
    const sh = ctx.isFounder && M.clients && M.clients.shares ? M.clients.shares(ctx) : [];
    const mrr = sh.reduce((n, r) => n + (r.monthly || 0), 0);
    const t = tab || 'clients';
    return html`<div class="stack" style=${{gap: '20px'}}>
      <${M.SectionHero} micro="accounts" title="Accounts">
        <div class="row" style=${{gap: '8px'}}>
          <${Mini} v=${live} l="live clients"/>
          <${Mini} v=${inPlay} l="pitches in play"/>
          ${pm ? html`<${Mini} v=${U.inr(pm.weighted)} l="weighted pipeline"/>` : null}
          ${ctx.isFounder ? html`<${Mini} v=${U.inr(mrr)} l="monthly revenue"/>` : null}
        </div>
      <//>
      <${M.SectionTabs} section="accounts" active=${t}/>
      ${t === 'pipeline' ? html`<${Embed} page="Pitches"/>` : html`<${Embed} page="Clients"/>`}
    </div>`;
  }

  /* ---------- Vibe: weekly wrapped by AI ---------- */
  function Wrapped() {
    const ctx = M.useCtx();
    const r = M.ai.useRun();
    const cache = M.ai.useCache(ctx);
    const wk = U.isoWeek(new Date());
    const cached = cache.data && cache.data.wrapped && cache.data.wrapped.week === wk ? cache.data.wrapped.text : '';
    const text = r.text || cached;
    if (!M.ai.on(ctx)) return null;
    async function go() {
      const nm = await M.ai.names(ctx);
      const from = U.periodRange('week').from;
      const fromMs = U.parseYmd(from).getTime();
      const posts = [];
      Object.keys(ctx.coll.feed.map).forEach(u => ((ctx.coll.feed.map[u] || {}).posts || []).forEach(p => { if (p.at >= fromMs) posts.push('- ' + (nm[u] || 'someone') + ' (' + p.kind + '): ' + String(p.text).slice(0, 200)); }));
      const kudos = [];
      Object.keys(ctx.coll.kudos.map).forEach(u => ((ctx.coll.kudos.map[u] || {}).given || []).forEach(k => { if (k.at >= fromMs) kudos.push('- ' + (nm[u] || 'someone') + ' to ' + (nm[k.to] || 'someone') + ': ' + String(k.why).slice(0, 160)); }));
      const map = ctx.coll.tasks.map;
      const shipped = {};
      Object.keys(map).forEach(id => { const t = map[id]; if (t.status === 'done' && t.doneAt >= fromMs) shipped[t.owner] = (shipped[t.owner] || 0) + 1; });
      const ship = Object.keys(shipped).map(u => '- ' + (nm[u] || 'someone') + ': ' + shipped[u] + ' tasks shipped');
      const out = await r.run(o => M.ai.text(ctx,
        'Write this week\'s team "Wrapped" for the agency feed, in the style of Spotify Wrapped. Fun, specific, celebratory, ' +
        'no emoji. Structure: a bold headline, then 4 to 6 bullets (biggest wins, shoutouts by name, who shipped most, a fun stat), ' +
        'then one line hyping next week. Under 140 words. Only use facts below.\n\nPOSTS:\n' + (posts.join('\n') || '- none') +
        '\n\nKUDOS:\n' + (kudos.join('\n') || '- none') + '\n\nSHIPPED:\n' + (ship.join('\n') || '- none'),
        {signal: o.signal, onText: o.onText, cache: false}));
      if (typeof out === 'string' && out) M.ai.saveCache(ctx, 'wrapped', {text: out, week: wk});
    }
    const busy = r.state === 'thinking' || r.state === 'streaming';
    return html`<section class="ai-card">
      <div class="row between">
        <div class="grow"><${UI.Micro}>m360 ai<//><div class="card-title" style=${{marginTop: '4px'}}>This week, wrapped</div></div>
        <button type="button" class=${'btn sm ' + (text ? 'sec' : '')} disabled=${busy} onClick=${go}>${busy ? html`<${M.Thinking}/>` : html`<span class="spark">${SPARK}</span> ${text ? 'Write it again' : 'Wrap the week'}`}</button>
      </div>
      <div style=${{marginTop: '12px'}}>
        ${text ? html`<${M.AIText} text=${text}/>` : html`<div class="small" style=${{fontWeight: 500}}>Wins, shoutouts and who shipped the most, written up by m360.</div>`}
        ${r.state === 'error' ? html`<div class="small flame-t" style=${{marginTop: '8px'}}>${M.ai.errCopy(r.err)}</div>` : null}
      </div>
    </section>`;
  }

  function Vibe({tab, id}) {
    const ctx = M.useCtx();
    const from = U.parseYmd(U.periodRange('week').from).getTime();
    let posts = 0, kudos = 0;
    Object.keys(ctx.coll.feed.map).forEach(u => ((ctx.coll.feed.map[u] || {}).posts || []).forEach(p => { if (p.at >= from) posts++; }));
    Object.keys(ctx.coll.kudos.map).forEach(u => ((ctx.coll.kudos.map[u] || {}).given || []).forEach(k => { if (k.at >= from) kudos++; }));

    return html`<div class="stack" style=${{gap: '20px'}}>
      <${M.SectionHero} micro="vibe" title="Vibe">
        <div class="row" style=${{gap: '8px'}}>
          <${Mini} v=${posts} l="posts this week"/>

        right=${html`<${UI.Avatar} id=${ctx.uid} size=${72}/>`}>
        <div class="row" style=${{gap: '8px'}}>
          <${Mini} v=${'Level ' + level} l=${pts.total + ' points this quarter'}/>

        : t === 'hiring' ? html`<${Embed} page="Hiring" id=${id}/>` : t === 'trophies' ? (M.parts.Trophies ? html`<${M.parts.Trophies}/>` : null) : html`<${Embed} page="People" id=${ctx.uid}/>`}
      ${t === 'profile' && M.parts.AboutCard ? html`<${M.parts.AboutCard}/>` : null}
      ${t === 'profile' ? html`<${Prefs}/>` : null}
      ${t === 'profile' && M.parts.DeviceCard ? html`<${M.parts.DeviceCard}/>` : null}
    </div>`;

  /* ---------- Me: how the OS behaves for you ---------- */
  function Prefs() {

            ${[['auto', 'Auto'], ['light', 'Paper'], ['dark', 'Ink']].map(([v, l]) => html`<button key=${v} type="button" class=${theme === v ? 'on' : ''} aria-pressed=${theme === v} onClick=${() => M.theme.set(v)}>${l}</button>`)}

})();

/* ==== 55-hq.js ==== */
/* module: hq. The founder's power screen: live numbers, the daily AI intelligence brief with
   one tap actions, workload balancing, who is online, and ask anything about the company. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo} = React;

  const PAGE_NAMES = {home: 'Home', today: 'Home', work: 'Work', tasks: 'Tasks', projects: 'Projects', week: 'The week',
    accounts: 'Accounts', clients: 'Clients', pitches: 'Pipeline', vibe: 'Vibe', feed: 'Feed', people: 'Crew', voice: 'Pulse',
    scores: 'Leaderboard', me: 'Me', leave: 'Leave', handbook: 'Handbook', hiring: 'Hiring', hq: 'HQ', command: 'HQ', admin: 'Admin', desk: 'Admin'};

  const SPARK = '\u2726';
  function Tile({v, l, to, hot}) {
    return html`<button type="button" class=${'stat glass' + (hot ? ' hot' : '')} onClick=${() => to && M.nav(to)}>
      <span class="v num" style=${hot ? {color: 'var(--flame)'} : null}>${v}</span><span class="l">${l}</span></button>`;
  }

  function useNumbers(ctx) {
    return useMemo(() => {
      const td = U.todayStr();
      const people = ctx.activeMembers;
      const att = people.map(m => M.att.dayStatus(ctx, m.uid, td));
      const inNow = att.filter(a => a.status === 'office' || a.status === 'wfh');
      const late = inNow.filter(a => a.late).length;
      const map = ctx.coll.tasks.map;
      const overdue = Object.keys(map).filter(id => map[id].status !== 'done' && map[id].due && map[id].due < td).length;
      const pm = (M.pitches && M.pitches.metrics) ? M.pitches.metrics(ctx) : {weighted: 0};
      const sh = (M.clients && M.clients.shares) ? M.clients.shares(ctx) : [];
      const mrr = sh.reduce((n, r) => n + (r.monthly || 0), 0);
      const en = (M.voice && M.voice.energyByWeek) ? M.voice.energyByWeek(ctx, 8) : [];
      const lastEn = en.slice().reverse().find(e => e && e.avg != null);
      const moods = people.map(m => ((((ctx.coll.checkin.map[m.uid] || {}).days || {})[td]) || {}).mood).filter(Boolean);
      const moodAvg = moods.length ? moods.reduce((a, b) => a + b, 0) / moods.length : null;
      return {people, inNow: inNow.length, late, overdue, pm, mrr, lastEn, moodAvg, high: ctx.flags.filter(f => f.severity === 'high').length};
    }, [ctx]);
  }

  /* ---------- the daily intelligence brief ---------- */
  function IntelBrief() {
    const ctx = M.useCtx();
    const cache = M.ai.useCache(ctx);
    const r = M.ai.useRun();
    const [assigned, setAssigned] = useState({});
    const cached = cache.data && cache.data.hq && cache.data.hq.date === U.todayStr() ? cache.data.hq.data : null;
    const data = (r.state === 'done' && r.data) || cached;
    const busy = r.state === 'thinking' || r.state === 'streaming';
    if (!M.ai.on(ctx)) return html`<section class="card"><div class="card-title">Intelligence brief</div>
      <div class="small ink62" style=${{marginTop: '8px'}}>AI is off for this page. Everything below still updates live.</div></section>`;

    async function go() {
      const slice = await M.ai.teamSlice(ctx);
      const out = await r.run(o => M.ai.json(ctx,
        'You are briefing Kaavish, the founder, at the start of his day. Read the company data and tell him what matters. ' +
        'Be specific: names, clients, numbers. Prioritise what needs his decision or a nudge today. ' +
        'Reply with only JSON: {"headline": "one punchy sentence", "pulse": "one line on attendance and mood", ' +
        '"risks": [{"title": "short", "detail": "one sentence"}] (up to 4), "wins": ["short"] (up to 3), ' +
        '"people": [{"name": "first name", "note": "nudge, praise or help, one sentence"}] (up to 4), "money": ["short"] (up to 3), ' +
        '"actions": [{"title": "task starting with a verb", "owner": "first name", "due": "YYYY-MM-DD", "why": "short"}] (up to 4)}.\n\n' + slice,
        {signal: o.signal, cache: false}));
      if (out && typeof out === 'object') M.ai.saveCache(ctx, 'hq', {data: out});
    }
    async function assign(a, i, ev) {
      const nm = await M.ai.names(ctx);
      const owner = M.ai.findMember(ctx, nm, a.owner) || ctx.uid;
      await ctx.W.set('tasks/' + U.uid(), {title: String(a.title).slice(0, 140), owner, client: '', project: '', section: '',
        due: /^\d{4}-\d{2}-\d{2}$/.test(String(a.due || '')) ? a.due : '', status: 'todo', priority: 'high', link: '', revisions: 0,
        shown20: false, subtasks: {}, comments: {}, by: ctx.uid, created: Date.now(), updated: Date.now(), doneAt: null});
      setAssigned(x => ({...x, [i]: true}));
      M.toast('Sent to ' + (nm[owner] || 'the team'));
    }
    const list = (arr) => Array.isArray(arr) ? arr : [];

    return html`<section class="ai-card dark">
      <div class="row between">
        <div class="row"><div>
          <${UI.Micro}>m360 ai<//><div class="card-title" style=${{color: '#fff', marginTop: '4px'}}>Today's intelligence</div>
          <div class="tiny ink62">${cached && !r.data ? 'generated ' + U.timeAgo(cache.data.hq.at) : 'reads every task, check-in, EOD, pitch and pulse'}</div></div></div>
        <button type="button" class=${'btn sm on-dark' + (data ? ' sec' : '')} disabled=${busy} onClick=${go}>${busy ? html`<${M.Thinking} label="Reading the company"/>` : html`<span class="spark">${SPARK}</span> ${data ? 'Refresh' : 'Brief me'}`}</button>
      </div>
      ${r.state === 'error' ? html`<div class="small" style=${{marginTop: '10px', color: 'var(--flame)'}}>${M.ai.errCopy(r.err)}</div>` : null}
      ${!data && !busy ? html`<div style=${{marginTop: '14px', fontWeight: 500}}>One tap and m360 reads the whole company: who's slipping, which client needs love, where the money is, and what to hand out today.</div>` : null}
      ${busy && !data ? html`<div class="small ink62" style=${{marginTop: '14px'}}>Scanning attendance, workload, blockers, pipeline and team energy…</div>` : null}
      ${data ? html`<div class="stack" style=${{marginTop: '16px', gap: '16px'}}>
        <div class="display" style=${{fontSize: '30px'}}>${data.headline || ''}</div>
        ${data.pulse ? html`<div style=${{fontWeight: 500}}>${data.pulse}</div>` : null}
        <div class="grid2">
          ${list(data.risks).length ? html`<div><div class="micro" style=${{marginBottom: '8px'}}>risks</div>
            ${list(data.risks).map((x, i) => html`<div key=${i} style=${{marginBottom: '8px'}}><b><span class="dotflame" style=${{marginRight: '8px', verticalAlign: 'middle'}}/>${x.title}</b><div class="small ink62">${x.detail}</div></div>`)}</div>` : null}
          ${list(data.people).length ? html`<div><div class="micro" style=${{marginBottom: '8px'}}>people</div>
            ${list(data.people).map((x, i) => html`<div key=${i} style=${{marginBottom: '8px'}}><b>${x.name}</b><div class="small ink62">${x.note}</div></div>`)}</div>` : null}
          ${list(data.wins).length ? html`<div><div class="micro" style=${{marginBottom: '8px'}}>wins</div>
            ${list(data.wins).map((x, i) => html`<div key=${i} class="small" style=${{marginBottom: '6px'}}>${x}</div>`)}</div>` : null}
          ${list(data.money).length ? html`<div><div class="micro" style=${{marginBottom: '8px'}}>money</div>
            ${list(data.money).map((x, i) => html`<div key=${i} class="small" style=${{marginBottom: '6px'}}>${x}</div>`)}</div>` : null}
        </div>
        ${list(data.actions).length ? html`<div><div class="micro" style=${{marginBottom: '10px'}}>hand these out today</div>
          <div class="stack tight">${list(data.actions).map((a, i) => html`<div key=${i} class="focus" style=${{background: 'rgba(255,255,255,.06)', color: '#fff'}}>
            <div class="grow"><div style=${{fontWeight: 700}}>${a.title}</div>
              <div class="tiny ink62">${a.owner || 'someone'}${a.due ? ' · by ' + U.fmtDay(a.due) : ''}${a.why ? ' · ' + a.why : ''}</div></div>
            ${assigned[i] ? html`<span class="pill on-dark">sent</span>` : html`<button type="button" class="btn on-dark sm" onClick=${e => assign(a, i, e)}>Assign</button>`}
          </div>`)}</div></div>` : null}
      </div>` : null}
    </section>`;
  }

  /* ---------- workload and one tap rebalancing ---------- */
  function Workload() {
    const ctx = M.useCtx();
    const r = M.ai.useRun();
    const [moves, setMoves] = useState(null);
    const [done, setDone] = useState({});
    const td = U.todayStr(), wkEnd = U.periodRange('week').to;
    const map = ctx.coll.tasks.map;
    const rows = ctx.activeMembers.map(m => {
      const open = Object.keys(map).map(id => ({id, ...map[id]})).filter(t => t.owner === m.uid && t.status !== 'done');
      return {m, open: open.length, over: open.filter(t => t.due && t.due < td).length,
        week: open.filter(t => t.due && t.due >= td && t.due <= wkEnd).length, a: M.att.dayStatus(ctx, m.uid, td)};
    }).sort((a, b) => (b.open + b.over * 2) - (a.open + a.over * 2));
    const max = Math.max(4, ...rows.map(x => x.open));

    async function rebalance() {
      const slice = await M.ai.teamSlice(ctx);
      const out = await r.run(o => M.ai.json(ctx,
        'Suggest up to 5 task moves that balance the team\'s workload. Only move OPEN tasks away from people who are overloaded ' +
        '(many open or overdue tasks, or on leave) to people with capacity and a fitting role. Keep client relationships in mind. ' +
        'Reply with only a JSON array of {"task": "exact task title from the data", "to": "first name", "why": "under 12 words"}. ' +
        'Reply [] if the load is already fair.\n\n' + slice, {signal: o.signal, cache: false}));
      if (Array.isArray(out)) setMoves(out.slice(0, 5));
    }
    async function apply(mv, i, ev) {
      const nm = await M.ai.names(ctx);
      const to = M.ai.findMember(ctx, nm, mv.to);
      const q = String(mv.task || '').toLowerCase();
      const id = Object.keys(map).find(k => String(map[k].title).toLowerCase() === q) || Object.keys(map).find(k => String(map[k].title).toLowerCase().indexOf(q) >= 0);
      if (!to || !id) { M.toast('Could not find that task or person', true); return; }
      await ctx.W.update('tasks/' + id, {owner: to, updated: Date.now()});
      setDone(x => ({...x, [i]: true}));
      M.toast('Moved to ' + nm[to]);
    }
    const busy = r.state === 'thinking' || r.state === 'streaming';

    return html`<section class="card">
      <div class="card-head">
        <h2 class="card-title">Workload</h2>
        ${M.ai.on(ctx) ? html`<button type="button" class="btn sec sm" disabled=${busy} onClick=${rebalance}>${busy ? html`<${M.Thinking} label="Balancing"/>` : html`<span class="spark">${SPARK}</span> Rebalance`}</button>` : null}
      </div>
      <div class="stack tight">
        ${rows.map(x => html`<div class="listrow" key=${x.m.uid}>
          <span class="av-wrap"><${UI.Avatar} id=${x.m.uid} size=${30}/>${ctx.online[x.m.uid] ? html`<span class="live"/>` : null}</span>
          <span style=${{minWidth: '120px', fontWeight: 600}}><${UI.Name} id=${x.m.uid}/></span>
          <span class="grow" style=${{minWidth: '120px'}}><span class="bar"><i class=${x.over ? 'hot' : ''} style=${{width: Math.min(100, 100 * x.open / max) + '%'}}/></span></span>
          <span class="small num" style=${{minWidth: '150px', textAlign: 'right'}}>${x.open} open · ${x.week} this wk${x.over ? html` · <b class="flame-t">${x.over} late</b>` : ''}</span>
        </div>`)}
      </div>
      ${r.state === 'error' ? html`<div class="small flame-t" style=${{marginTop: '10px'}}>${M.ai.errCopy(r.err)}</div>` : null}
      ${moves ? html`<div style=${{marginTop: '14px'}}>
        ${moves.length ? moves.map((mv, i) => html`<div class="focus" key=${i}>
          <div class="grow"><div style=${{fontWeight: 700}}>${mv.task} → ${mv.to}</div><div class="tiny ink62">${mv.why}</div></div>
          ${done[i] ? html`<span class="pill ink">moved</span>` : html`<${UI.Btn} sm=${true} onClick=${e => apply(mv, i, e)}>Move it<//>`}
        </div>`) : html`<div class="focus"><span style=${{fontWeight: 500}}>Load looks fair. Nothing to move.</span></div>`}
      </div>` : null}
    </section>`;
  }

  /* ---------- who is online and where ---------- */
  function LiveNow() {
    const ctx = M.useCtx();
    const on = Object.keys(ctx.online || {}).filter(u => ctx.members[u]);
    return html`<section class="card">
      <div class="card-head"><h2 class="card-title">Live now</h2>
        <span class="pill ink"><span class="dotflame"/>${on.length} online</span></div>
      ${on.length ? html`<div class="stack tight">${on.map(u => html`<div class="listrow" key=${u}>
        <${UI.Avatar} id=${u} size=${28}/><span class="grow" style=${{fontWeight: 600}}><${UI.Name} id=${u}/></span>
        <span class="pill">${PAGE_NAMES[ctx.online[u].page] || 'm360'}</span></div>`)}</div>`
        : html`<div class="small ink62">Nobody has m360 open right now.</div>`}
    </section>`;
  }

  function Embed({page, id}) {
    const P = M.pages[page];
    return P ? html`<div class="embedded"><${P} id=${id || null}/></div>` : null;
  }

  /* ---------- page ---------- */
  function HQ({tab, id}) {
    const ctx = M.useCtx();
    const n = useNumbers(ctx);
    const t = tab || 'brief';
    const Panel = M.parts.AskPanel;
    return html`<div class="stack" style=${{gap: '20px'}}>
      <header class="hero ink">
        <span class="ring" style=${{width: '380px', height: '380px', right: '-140px', top: '-190px'}}/>
        <span class="ring" style=${{width: '240px', height: '240px', right: '-70px', top: '-120px'}}/>
        <span class="dot" style=${{right: '110px', top: '48px'}}/>
        <div style=${{position: 'relative'}}>
          <${UI.Micro}>${U.dateLabel(new Date(ctx.now))}<//>
          <h1 class="hi">HQ</h1>
          <div class="sub" style=${{marginTop: '10px'}}>Everything at Mask360, live.</div>
        </div>
        <div class="grid4" style=${{marginTop: '20px', position: 'relative'}}>

          <${Tile} v=${U.inr(n.pm.weighted)} l="weighted pipeline" to="#pitches"/>

        <${IntelBrief}/>
        <div class="split">
          <div class="stack" style=${{gap: '20px'}}>
            <${Workload}/>
            ${M.parts.MoodHeat ? html`<${M.parts.MoodHeat}/>` : null}
            ${Panel && M.ai.on(ctx) ? html`<section class="card"><div class="card-head"><h2 class="card-title">Ask HQ anything</h2></div><${Panel} inline=${true}/></section>` : null}
          </div>
          <div class="stack" style=${{gap: '20px'}}>

/* ==== 57-ask.js ==== */
/* module: ask. "Ask m360": a chat with Claude that knows your work and can act on it.
   It can create tasks, move them, and for the founder reassign them. Each answer is built
   from the data this viewer may see, so members never get teammates' private detail. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useRef, useEffect} = React;

  const MEMBER_CHIPS = ['What should I do next?', "What's overdue on me?", 'Summarise my week', 'Add a task for me to follow up with the client tomorrow'];
  const FOUNDER_CHIPS = ["Who's overloaded right now?", "What's slipping this week?", 'Which client needs love?', "Draft Monday's plan meeting agenda", "Who's been late this week?"];

  function instructions(ctx, nmMe) {
    return 'INSTRUCTIONS: You are chatting inside m360 with ' + nmMe + (ctx.isFounder ? ', the founder' : ', a team member') + '. ' +
      'Answer from the data below only. Be brief: under 120 words unless asked for more, use short bullets when listing. ' +
      'You can act with your tools: create tasks and assign them, move a task\'s status' + (ctx.isFounder ? ', and reassign tasks' : ' (their own tasks)') + '. ' +
      'When asked to do something, do it with a tool, then confirm in one line. When the data does not say, say so plainly.';
  }

  function AskPanel({inline, initial}) {
    const ctx = M.useCtx();
    const [turns, setTurns] = useState([]);   /* {role, content, act?} for display */
    const [q, setQ] = useState('');
    const [busy, setBusy] = useState(false);
    const [live, setLive] = useState('');
    const ctl = useRef(null);
    const endRef = useRef(null);
    const sentInitial = useRef(false);

    useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
    useEffect(() => { if (endRef.current && endRef.current.scrollIntoView) endRef.current.scrollIntoView({block: 'nearest'}); }, [turns, live]);
    useEffect(() => { if (initial && !sentInitial.current) { sentInitial.current = true; send(initial); } }, [initial]);

    async function send(text) {
      const msg = String(text || q).trim();
      if (!msg || busy) return;
      setQ('');
      const history = turns.filter(t => !t.act);
      const next = [...turns, {role: 'user', content: msg}];
      setTurns(next); setBusy(true); setLive('');
      const c = new AbortController(); ctl.current = c;
      try {
        const nm = await M.ai.names(ctx);
        const data = ctx.isFounder ? await M.ai.teamSlice(ctx) : (await M.ai.meSlice(ctx)) + '\n\n' + (await M.ai.teamSlice(ctx));
        const lim = ctx.sample.limits ? await ctx.sample.limits().catch(() => null) : null;
        const actions = [];
        const tools = lim && lim.tools ? M.ai.tools(ctx, nm, a => { actions.push(a); setTurns(ts => [...ts, {role: 'assistant', content: a, act: true}]); }) : undefined;
        const lead = M.ai.VOICE + instructions(ctx, nm[ctx.uid] || 'a teammate') + '\n\nDATA:\n' + data.slice(0, 40000);
        /* the page keeps the chat; Claude sees the lead turn, the recent turns and the new message */
        const convo = [{role: 'user', content: lead}];
        history.slice(-8).forEach(t => convo.push({role: t.role, content: t.content}));
        convo.push({role: 'user', content: msg});
        const out = await ctx.sample(convo, {signal: c.signal, tools, onText: ({text: t}) => setLive(t), ...(tools ? {} : {cache: false})});
        setTurns(ts => [...ts, {role: 'assistant', content: out.text.replace(/\u2014|\u2013/g, ', ')}]);
      } catch (e) {
        const code = (e && e.code) || 'upstream_error';
        if (code !== 'cancelled') setTurns(ts => [...ts, {role: 'assistant', content: (e && e.text ? e.text + '\n\n' : '') + M.ai.errCopy(code), err: true}]);
      }
      setLive(''); setBusy(false);
    }

    const chips = ctx.isFounder ? FOUNDER_CHIPS : MEMBER_CHIPS;
    return html`<div class="stack" style=${{gap: '12px'}}>
      ${turns.length === 0 && !busy ? html`<div class="stack tight">
        <div style=${{fontWeight: 600}}>${ctx.isFounder ? 'Ask about anyone, any client, any number. Or tell it to hand out work.' : 'Ask about your work, or tell it to add and move tasks for you.'}</div>
        <div class="row" style=${{gap: '8px'}}>${chips.map(c => html`<button key=${c} type="button" class="chip" onClick=${() => send(c)}>${c}</button>`)}</div>
      </div>` : null}
      <div class="stack" style=${{gap: '10px', maxHeight: inline ? '420px' : 'none', overflowY: inline ? 'auto' : 'visible'}}>
        ${turns.map((t, i) => t.act
          ? html`<div key=${i} class="bubble act">${t.content}</div>`
          : html`<div key=${i} class=${'bubble ' + (t.role === 'user' ? 'me' : 'ai')} style=${t.err ? {borderColor: 'var(--flame)'} : null}>
              ${t.role === 'user' ? t.content : html`<${M.AIText} text=${t.content}/>`}</div>`)}
        ${busy ? html`<div class="bubble ai">${live ? html`<${M.AIText} text=${live}/>` : html`<${M.Thinking}/>`}</div>` : null}
        <div ref=${endRef}/>
      </div>
      <div class="ask-in">
        <input id=${inline ? 'ask-inline' : 'ask-input'} class="input" value=${q} placeholder=${ctx.isFounder ? 'Ask HQ anything…' : 'Ask m360 anything…'}
          onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') send(); }} aria-label="Ask m360"/>
        ${busy ? html`<${UI.Btn} kind="sec" onClick=${() => ctl.current && ctl.current.abort()}>Stop<//>`
          : html`<button type="button" class="btn" disabled=${!q.trim()} onClick=${() => send()}>Ask</button>`}
      </div>
      ${turns.length ? html`<button type="button" class="linky tiny" style=${{alignSelf: 'flex-start'}} onClick=${() => setTurns([])}>Clear chat</button>` : null}
    </div>`;
  }

  function Ask({onClose, initial}) {
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Ask m360">
      <${AskPanel} initial=${initial || ''}/>
      <div class="hint">Runs on your own Claude account. It sees what you can see in m360, and nothing else.</div>
    <//>`;
  }

  M.parts.AskPanel = AskPanel;
  M.parts.Ask = Ask;
})();

/* ==== 58-buddy.js ==== */
/* module: buddy. The m360 cursor buddy: a flame pointer that rides next to your cursor.
   Hold Ctrl + Option (Ctrl + Alt) and talk, or tap Ask m360 and type. Claude reads a map of
   what is on screen plus your work data, answers in a bubble (out loud when you spoke), and
   flies the pointer to the exact control you need. It can open another section to show you,
   and create or move tasks. It never clicks anything for you. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useEffect, useRef, useCallback} = React;

  const SPARK = '✦';
  const store = {
    get: k => { try { return localStorage.getItem('m360.' + k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem('m360.' + k, v); } catch (e) { /* private window */ } }
  };
  const coarse = () => { try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
  const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;

  /* the guided tour: where things live, in order */
  const TOUR = [
    {sel: '.side-item, .tabbar .tab-item', say: 'Home is your day: check in, your focus, your numbers.'},
    {sel: '.sidebar .new-trigger, .topbar .new-trigger', say: 'New makes anything: a task, a post, kudos, a project.'},
    {sel: '.side-ask, .topbar .iconbtn[aria-label="Search"]', say: 'Search or do anything from here. Cmd K opens it too.'},
    {sel: '.bellbtn', say: 'Your inbox: assignments, kudos, mentions and decisions.'},
    {sel: '.side-tools .iconbtn[aria-label="Focus timer"], .quick-btn', say: 'Focus runs a timer on a task and banks deep work.'},
    {sel: '.side-item:nth-child(2), .tabbar .tab-item:nth-child(2)', say: 'Work: tasks, projects, the calendar and reviews.'},
    {sel: '.buddy-home', say: 'And that is me. Hold Ctrl and Option to talk, or tap here. Enjoy.'}
  ];

  const SECTIONS = ['home', 'tasks', 'projects', 'week', 'clients', 'pitches', 'feed', 'people', 'voice', 'scores', 'me', 'leave', 'handbook', 'hiring', 'hq', 'command', 'admin'];

  /* ---------- the screen, as Claude sees it ---------- */
  function scan() {
    const sel = 'button, a[href], input, select, textarea, [role="tab"], h1, h2, .card-title, .stat, .tcard';
    const W = window.innerWidth, H = window.innerHeight;
    const out = [];
    let n = 0;
    document.querySelectorAll('[data-ai]').forEach(el => el.removeAttribute('data-ai'));
    for (const el of document.querySelectorAll(sel)) {
      if (el.closest('.buddy-bubble, .buddy-home, .tabbar')) continue;
      const r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4 || r.bottom < 0 || r.top > H * 2.2 || r.right < 0 || r.left > W) continue;
      const cs = getComputedStyle(el);
      if (cs.visibility === 'hidden' || cs.display === 'none' || Number(cs.opacity) === 0) continue;
      let label = el.getAttribute('aria-label') || (el.innerText || '').replace(/\s+/g, ' ').trim() || el.getAttribute('placeholder') || el.value || '';
      label = String(label).slice(0, 70);
      if (!label) continue;
      const tag = el.matches('h1, h2, .card-title') ? 'heading' : el.matches('input, textarea, select') ? 'field'
        : el.getAttribute('role') === 'tab' || el.classList.contains('tab') ? 'tab' : el.tagName === 'A' ? 'link' : 'button';
      const box = el.closest('section, header, .card, .drawer, aside, nav');
      const head = box ? (box.querySelector('.card-title, h1, h2, .drawer-head h2') || {}).innerText || '' : '';
      const id = 'e' + (++n);
      el.setAttribute('data-ai', id);
      out.push(id + ' | ' + tag + ' | ' + label + (head && head !== label ? ' | in: ' + String(head).replace(/\s+/g, ' ').slice(0, 40) : '') + (r.top > H ? ' | below the fold' : ''));
      if (n >= 150) break;
    }
    return out.join('\n');
  }
  const findEl = id => document.querySelector('[data-ai="' + String(id).replace(/[^a-z0-9]/gi, '') + '"]');

  /* ---------- the pointer ---------- */
  const Pointer = () => html`<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 3.2 19.6 10c.9.4.8 1.7-.1 2l-6.3 1.9-2.6 6.1c-.4.9-1.7.9-2-.1L3.1 4.4c-.3-.8.3-1.5.9-1.2Z" fill="#F53901" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;

  function Buddy({onOpenChat}) {
    const ctx = M.useCtx();
    const on = M.ai.on(ctx);
    const [hidden, setHidden] = useState(() => store.get('buddyHidden') === '1');
    const [mode, setMode] = useState('idle');          /* idle, asking, listening, thinking, answer */
    const [q, setQ] = useState('');
    const [heard, setHeard] = useState('');
    const [answer, setAnswer] = useState('');
    const [acts, setActs] = useState([]);
    const [err, setErr] = useState('');
    const [anchor, setAnchor] = useState(null);         /* {x, y} the bubble sits by */
    const [ring, setRing] = useState(null);             /* {left, top, width, height} */
    const [step, setStep] = useState(-1);               /* tour step, or -1 */
    const pointerRef = useRef(null);
    const mouse = useRef({x: window.innerWidth - 90, y: window.innerHeight - 90});
    const pos = useRef({x: window.innerWidth - 90, y: window.innerHeight - 90});
    const pinned = useRef(false);
    const target = useRef(null);
    const ctl = useRef(null);
    const rec = useRef(null);
    const spoke = useRef(false);
    const homeRef = useRef(null);
    const askRef = useRef(null);

    /* follow the cursor with a little lag; stays put while pointing */
    useEffect(() => {
      if ((!on && mode !== 'tour') || hidden) return;
      let raf = 0;
      const move = e => { mouse.current = {x: e.clientX + 16, y: e.clientY + 14}; };
      const tick = () => {
        if (!pinned.current && !coarse()) {
          const p = pos.current, m = mouse.current;
          p.x += (m.x - p.x) * .22; p.y += (m.y - p.y) * .22;
        }
        if (target.current) {
          const el = target.current;
          const r = el.getBoundingClientRect();
          setRing(prev => (prev && Math.abs(prev.left - r.left) < .5 && Math.abs(prev.top - r.top) < .5) ? prev
            : {left: r.left - 6, top: r.top - 6, width: r.width + 12, height: r.height + 12});
        }
        if (pointerRef.current) pointerRef.current.style.transform = 'translate3d(' + pos.current.x + 'px,' + pos.current.y + 'px,0)';
        raf = requestAnimationFrame(tick);
      };
      window.addEventListener('pointermove', move, {passive: true});
      raf = requestAnimationFrame(tick);
      return () => { cancelAnimationFrame(raf); window.removeEventListener('pointermove', move); };
    }, [on, hidden, mode === 'tour']);


    const fly = useCallback((x, y) => new Promise(res => {
      pinned.current = true;
      const el = pointerRef.current;
      if (!el || reduced()) { pos.current = {x, y}; res(); return; }
      el.classList.add('flying');
      pos.current = {x, y};
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      setTimeout(() => { el.classList.remove('flying'); res(); }, 660);
    }), []);

    const reset = useCallback(() => {
      if (ctl.current) ctl.current.abort();
      if (rec.current) { try { rec.current.abort(); } catch (e) { /* stopped */ } rec.current = null; }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { /* no voice */ }
      pinned.current = false; target.current = null;
      setRing(null); setMode('idle'); setAnswer(''); setActs([]); setErr(''); setHeard(''); setQ('');
    }, []);

    /* ---------- the tour ---------- */
    const showStep = useCallback(async i => {
      let j = i;
      let el = null;
      while (j < TOUR.length && !el) { el = Array.from(document.querySelectorAll(TOUR[j].sel)).find(x => x.getBoundingClientRect().width > 0) || null; if (!el) j++; }
      if (!el) { reset(); M.toast('That is the tour. Hold Ctrl and Option to ask me anything'); return; }
      setStep(j); setMode('tour'); setAnswer(TOUR[j].say); setErr(''); setActs([]);
      el.scrollIntoView({block: 'center', behavior: reduced() ? 'auto' : 'smooth'});
      await new Promise(r => setTimeout(r, reduced() ? 30 : 260));
      const r = el.getBoundingClientRect();
      target.current = el;
      pinned.current = true;
      await fly(Math.min(window.innerWidth - 30, r.left + Math.min(r.width * .5, 60)), r.top + r.height * .6);
      setAnchor({x: pos.current.x, y: pos.current.y});
    }, [fly]);
    useEffect(() => {
      const start = () => { setHidden(false); store.set('buddyHidden', '0'); setTimeout(() => showStep(0), 60); };
      window.addEventListener('m360:tour', start);
      return () => window.removeEventListener('m360:tour', start);
    }, [showStep]);

    const speak = t => {
      if (!spoke.current || store.get('buddyVoice') === '0') return;
      try {
        const u = new SpeechSynthesisUtterance(String(t).replace(/\*\*/g, '').slice(0, 400));
        u.rate = 1.05; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      } catch (e) { /* no voice here */ }
    };

    const openAt = (x, y) => {
      setAnchor({x, y}); setMode('asking'); setAnswer(''); setActs([]); setErr('');
    };

    /* ---------- ask ---------- */
    async function ask(text) {
      const question = String(text || '').trim();
      if (!question) { setMode('asking'); return; }
      setMode('thinking'); setAnswer(''); setActs([]); setErr(''); setRing(null); target.current = null;
      const c = new AbortController(); ctl.current = c;
      try {
        const nm = await M.ai.names(ctx);
        const data = ctx.isFounder ? await M.ai.teamSlice(ctx) : await M.ai.meSlice(ctx);
        const here = M.resolveRoute ? M.resolveRoute(M.parseHash().page, null, ctx.isFounder) : {s: ''};
        let screen = scan();
        const log = a => setActs(xs => [...xs, a]);
        const tools = [{
          name: 'point_at',
          description: 'Fly the cursor buddy to one element on screen and ring it, with a short caption. Use it to show the person exactly where to look or click. Returns "pointed".',
          inputSchema: {type: 'object', properties: {id: {type: 'string', description: 'An element id from the SCREEN list, like e12'}, say: {type: 'string', description: 'Caption under 12 words'}}, required: ['id']},
          execute: async (input) => {
            const el = findEl(input.id);
            if (!el) throw new Error('no element with that id on screen now');
            el.scrollIntoView({block: 'center', behavior: reduced() ? 'auto' : 'smooth'});
            await new Promise(r => setTimeout(r, reduced() ? 30 : 320));
            const r = el.getBoundingClientRect();
            target.current = el;
            await fly(Math.min(window.innerWidth - 30, r.left + Math.min(r.width * .5, 60)), r.top + r.height * .6);
            setAnchor({x: pos.current.x, y: pos.current.y});
            if (input.say) setAnswer(String(input.say));
            return 'pointed';
          }
        }, {
          name: 'go_to',
          description: 'Open another part of m360 so you can point at something there. Returns the new SCREEN list.',
          inputSchema: {type: 'object', properties: {section: {type: 'string', enum: SECTIONS}}, required: ['section']},
          execute: async (input) => {
            const s = String(input.section || '');
            if (SECTIONS.indexOf(s) < 0) throw new Error('unknown section');
            if (!ctx.isFounder && ['hq', 'command', 'admin'].indexOf(s) >= 0) throw new Error('that section is for Kaavish only');
            M.nav('#' + s);
            await new Promise(r => setTimeout(r, 450));
            screen = scan();
            return screen.slice(0, 9000);
          }
        }].concat(M.ai.tools(ctx, nm, log));
        const lim = ctx.sample.limits ? await ctx.sample.limits().catch(() => null) : null;
        const prompt = M.ai.VOICE +
          'You are the m360 cursor buddy. You live next to the person\'s mouse cursor inside the m360 OS and help them use it. ' +
          'They are ' + (nm[ctx.uid] || 'a teammate') + (ctx.isFounder ? ', the founder' : '') + '. They are on the ' + (here.s || 'home') + ' section.\n' +
          'Rules: answer in one to three short spoken sentences. When the answer lives on screen, or they ask where or how, call point_at FIRST with the best element id, ' +
          'then answer. If it lives in another section, call go_to, then point_at. Never invent ids. You never click for them. ' +
          'When they ask you to create or move a task, use those tools and confirm in one line.\n\n' +
          'SCREEN (id | kind | label | area):\n' + screen.slice(0, 9000) + '\n\nTHEIR DATA:\n' + data.slice(0, 16000) + '\n\nTHEY SAID: ' + question;
        const out = await ctx.sample(prompt, {signal: c.signal, modelTier: 'quick', tools: lim && lim.tools ? tools : undefined,
          onText: ({text: t}) => setAnswer(t.replace(/\u2014|\u2013/g, ', '))});
        const final = out.text.replace(/\u2014|\u2013/g, ', ');
        setAnswer(final); setMode('answer'); speak(final);
      } catch (e) {
        const code = (e && e.code) || 'upstream_error';
        if (code === 'cancelled') return;
        setErr(M.ai.errCopy(code)); setMode('answer');
      }
    }

    askRef.current = ask;

    /* ---------- voice: hold Ctrl + Option (Ctrl + Alt) ---------- */
    useEffect(() => {
      if (!on || hidden) return;
      let holding = false, finalText = '';
      const start = () => {
        holding = true; finalText = ''; spoke.current = true;
        reset();
        pinned.current = true;
        setAnchor({x: pos.current.x, y: pos.current.y});
        const S = SR();
        if (!S) { spoke.current = false; openAt(pos.current.x, pos.current.y); return; }
        try {
          const r = new S();
          r.lang = 'en-IN'; r.interimResults = true; r.continuous = true;
          r.onresult = ev => {
            let t = '';
            for (let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
            finalText = t; setHeard(t);
          };
          r.onerror = ev => {
            if (ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture')) {
              spoke.current = false; rec.current = null; openAt(pos.current.x, pos.current.y);
              M.toast('Voice is off here. Type instead');
            }
          };
          rec.current = r; r.start(); setMode('listening');
        } catch (e) { spoke.current = false; openAt(pos.current.x, pos.current.y); }
      };
      const stop = () => {
        if (!holding) return;
        holding = false;
        if (rec.current) {
          try { rec.current.stop(); } catch (e) { /* stopped */ }
          rec.current = null;
          setTimeout(() => { if (finalText.trim()) askRef.current(finalText); else setMode('asking'); }, 250);
        }
      };
      const down = e => { if (e.ctrlKey && e.altKey && !holding && !e.repeat && (e.key === 'Control' || e.key === 'Alt')) { e.preventDefault(); start(); } };
      const up = e => { if (holding && (e.key === 'Control' || e.key === 'Alt')) stop(); };
      const esc = e => { if (e.key === 'Escape') reset(); };
      window.addEventListener('keydown', down); window.addEventListener('keyup', up); window.addEventListener('keydown', esc);
      return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); window.removeEventListener('keydown', esc); };
    }, [on, hidden, reset]);

    if (!on && mode !== 'tour') return null;

    const tapHome = () => {
      if (mode !== 'idle') { reset(); return; }
      spoke.current = false;

    return html`<div>

        <div class="row between" style=${{marginBottom: '8px'}}>

          <button type="button" class="iconbtn" style=${{color: '#fff', width: '26px', height: '26px'}} aria-label="Close" onClick=${reset}><${M.icons.x}/></button>
        </div>
        ${mode === 'listening' ? html`<div style=${{fontWeight: 500, minHeight: '22px'}}>${heard || 'Go ahead, I\'m listening.'}</div>` : null}
        ${mode === 'asking' ? html`<div class="stack tight">
          <input id="buddy-input" class="input" value=${q} autoFocus=${true} placeholder="Where do I check in? What's overdue?"
            onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') ask(q); }} aria-label="Ask m360"/>
          <div class="row between"><span class="tiny" style=${{color: 'rgba(255,255,255,.6)'}}>Hold Ctrl + Option to talk</span>
            <button type="button" class="btn on-dark sm" disabled=${!q.trim()} onClick=${() => ask(q)}>Ask</button></div>
        </div>` : null}
        ${mode === 'thinking' && !answer ? html`<${M.Thinking} label="Looking at your screen"/>` : null}
        ${mode === 'tour' ? html`<div class="row between" style=${{marginTop: '10px'}}>
          <span class="tiny" style=${{color: 'rgba(255,255,255,.6)'}}>${step + 1} of ${TOUR.length}</span>
          <span class="row nowrap">
            <button type="button" class="linky tiny" onClick=${reset}>Skip</button>
            <button type="button" class="btn on-dark sm" onClick=${() => step + 1 < TOUR.length ? showStep(step + 1) : (reset(), M.toast('Enjoy m360'))}>${step + 1 < TOUR.length ? 'Next' : 'Done'}</button>
          </span>
        </div>` : null}
        ${answer ? html`<${M.AIText} text=${answer}/>` : null}
        ${acts.map((a, i) => html`<div key=${i} class="tiny" style=${{marginTop: '6px'}}><span class="spark">${SPARK}</span> ${a}</div>`)}
        ${err ? html`<div class="small flame-t" style=${{marginTop: '6px'}}>${err}</div>` : null}
        ${mode === 'answer' ? html`<div class="row" style=${{marginTop: '10px', gap: '14px'}}>
          <button type="button" class="linky tiny" onClick=${() => { setQ(''); setMode('asking'); }}>Ask another</button>
