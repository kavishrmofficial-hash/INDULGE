        <//>
        <${UI.Card} title="Kudos received" id="person-kudos">
          ${kudos.length ? kudos.map(k => html`<div class="listrow" key=${k.id} style=${{alignItems: 'flex-start'}}>
            <${UI.Avatar} id=${k.giver} size=${28}/>
            <div class="grow">
              <div class="row"><b>${nameIn(names, k.giver)}</b>${k.at ? html`<span class="tiny sub">${U.timeAgo(k.at)}</span>` : null}</div>
              <div>${k.why}</div>
            </div>
          </div>`) : html`<${UI.Empty} text="No kudos yet."/>`}
        <//>
      </div>
    <//>`;
  }

  /* ---------- person page: scorecard ---------- */
  function Scorecard({uid}) {
    const ctx = M.useCtx();
    const now = nowDate(ctx);
    const mon0 = U.mondayOf(now);
    const P = M.points;
    const rows = [0, 1, 2, 3].map(i => {
      const mon = U.addDays(mon0, -7 * i);
      let s = null;
      if (P && typeof P.scoreFor === 'function') {
        try { s = P.scoreFor(ctx, uid, mon); } catch (e) { s = null; }
      }
      return {week: U.isoWeek(mon), s};
    });
    const num = (v, suffix) => (typeof v === 'number' && isFinite(v)) ? v + (suffix || '') : 'n/a';
    const hitText = s => {
      if (!s) return 'n/a';
      const t = (s.hit || 0) + (s.miss || 0);
      return t > 0 ? (s.hit || 0) + ' of ' + t : 'n/a';
    };
    let lad = null;
    if (P && typeof P.ladder === 'function') {
      try { lad = P.ladder(ctx, uid, now); } catch (e) { lad = null; }
    }
    const misses = lad ? (lad.misses || 0) : 0;
    return html`<${React.Fragment}>
      <${UI.Card} title="Scorecard, last 4 weeks" id="scorecard">
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>week</th><th>on time</th><th>revisions per task</th><th>quality</th><th>outcomes hit</th></tr></thead>
          <tbody>
            ${rows.map(r => html`<tr key=${r.week}>
              <td class="num">${r.week}</td>
              <td class="num">${num(r.s && r.s.onTimePct, '%')}</td>
              <td class="num">${num(r.s && r.s.revPerTask)}</td>
              <td class="num">${num(r.s && r.s.quality)}</td>
              <td class="num">${hitText(r.s)}</td>
            </tr>`)}
          </tbody>
        </table></div>
      <//>
      <${UI.Card} title="Ladder, last 30 days" id="ladder">
        ${lad ? html`<div class="row">
          <${UI.Pill} kind=${LADDER_KIND[lad.level] || 'flame-o'}>${lad.level}<//>
          <span class="small num">${misses} ${misses === 1 ? 'miss' : 'misses'} in the last 30 days</span>
        </div>` : html`<${UI.Empty} text="n/a"/>`}
      <//>
    <//>`;
  }

  /* ---------- onboarding ---------- */
  function Onboarding({uid, compact}) {
    const ctx = M.useCtx();
    if (!ctx || !uid) return null;
    const items = onboardItems(ctx, uid);
    const done = items.filter(i => i.done).length;
    const self = ctx.uid === uid;
    const doneMap = docOf(ctx, 'onboard', uid).done || {};
    const toggle = (key, on) => {
      if (on) { ctx.W.merge('onboard/' + uid, {done: {[key]: Date.now()}}).catch(() => {}); return; }
      const map = U.clone(doneMap) || {};
      delete map[key];
      ctx.W.set('onboard/' + uid, {done: map}).catch(() => {});
    };
    const count = html`<${CountText} done=${done} total=${ONBOARD_TOTAL}/>`;
    if (compact) {
      const open = items.filter(i => !i.done).slice(0, 3);
      return html`<${UI.Card} title="Onboarding" id="onboarding" action=${count}>
        <div class="stack tight">
          <${UI.Bar} a=${done} max=${ONBOARD_TOTAL}/>
          ${open.length ? open.map(i => html`<div key=${i.key} class="row nowrap small"><span class="dotflame"/><span>${i.label}</span></div>`)
            : html`<div class="sub small">All 13 done.</div>`}
        </div>
      <//>`;
    }
    const line = i => (i.manual && self)
      ? html`<${UI.Check} key=${i.key} label=${i.label} checked=${i.done} onChange=${on => toggle(i.key, on)}/>`
      : html`<${ReadCheck} key=${i.key} label=${i.label} checked=${i.done}/>`;
    return html`<${UI.Card} title="Onboarding" id="onboarding" action=${count}>
      <div class="stack">
        <${UI.Bar} a=${done} max=${ONBOARD_TOTAL}/>
        <div class="stack tight">
          <${UI.Micro} plain>from the data<//>
          ${items.filter(i => !i.manual).map(line)}
        </div>
        <div class="stack tight">
          <${UI.Micro} plain>${self ? 'tick these yourself' : 'ticked by hand'}<//>
          ${items.filter(i => i.manual).map(line)}
        </div>
      </div>
    <//>`;
  }

  /* ---------- access register ---------- */
  function AccessRegister({uid}) {
    const ctx = M.useCtx();
    const [name, setName] = useState('');
    const [kind, setKind] = useState(KINDS[0].v);
    const [risk, setRisk] = useState('normal');
    const [xfer, setXfer] = useState(false);
    const [busy, setBusy] = useState(false);
    if (!ctx || !uid) return null;
    const items = accessItems(ctx, uid);
    const canAdd = ctx.uid === uid || !!ctx.isFounder;
    const canSend = !!name.trim() && !busy;
    const add = () => {
      if (!canSend) return;
      setBusy(true);
      const id = U.uid();
      const item = {name: name.trim(), kind, risk, xfer: !!xfer, added: Date.now(), by: ctx.uid, revoked: false, revokedAt: null};
      ctx.W.merge('access/' + uid, {items: {[id]: item}})
        .then(() => { M.toast('Added'); setName(''); setRisk('normal'); setXfer(false); })
        .catch(() => {})
        .then(() => setBusy(false));
    };
    const revoke = id => {
      ctx.W.update('access/' + uid, {items: {[id]: {revoked: true, revokedAt: Date.now()}}})
        .then(() => M.toast('Marked revoked')).catch(() => {});
    };
    const open = items.filter(i => !i.revoked).length;
    return html`<${UI.Card} title="Access register" id="access-register"
        action=${items.length ? html`<${UI.Pill}>${open} open<//>` : null}>
      <div class="stack">
        ${items.length ? html`<div>
          ${items.map(it => html`<div class="listrow" key=${it.id}>
            <div class="grow">
              <div style=${it.revoked ? {textDecoration: 'line-through'} : null}>${String(it.name || '')}</div>
              <div class="row" style=${{marginTop: '4px'}}>
                <${UI.Pill}>${String(it.kind || 'other')}<//>
                ${it.risk === 'high' ? html`<${UI.Pill} kind="flame">high<//>` : null}
                ${it.xfer ? html`<${UI.Pill}>transfer<//>` : null}
                ${it.revoked ? html`<${UI.Pill} kind="warm">revoked<//>` : null}
              </div>
            </div>
            ${!it.revoked && ctx.isFounder ? html`<${UI.Btn} kind="ghost" sm onClick=${() => revoke(it.id)}>Mark revoked<//>` : null}
          </div>`)}
        </div>` : html`<${UI.Empty} text="No access items yet."/>`}
        ${canAdd ? html`<${React.Fragment}>
          <hr class="hair" style=${{margin: '2px 0'}}/>
          <${UI.Input} id="access-name" label="name" value=${name} onChange=${setName} onEnter=${add}
            placeholder="Swisse client WhatsApp group" hint="Names only. Never passwords or codes."/>
          <div class="grid2">
            <${UI.Select} id="access-kind" label="kind" value=${kind} onChange=${setKind} options=${KINDS}/>
            <${UI.Field} label="risk">
              <div class="row"><${UI.Seg} sm options=${RISKS} value=${risk} onChange=${setRisk} ariaLabel="Risk"/></div>
            <//>
          </div>
          <${UI.Check} label="Ownership transfer needed" checked=${xfer} onChange=${setXfer}/>
          <div class="row"><${UI.Btn} disabled=${!canSend} onClick=${add}>Add item<//></div>
        <//>` : null}
      </div>
    <//>`;
  }

  /* ---------- offboarding ---------- */
  function StartOffboarding({uid}) {
    const ctx = M.useCtx();
    const [lastDay, setLastDay] = useState('');
    const ok = okDate(lastDay);
    const start = () => {
      ctx.W.merge('access/' + uid, {offboard: {started: Date.now(), lastDay, steps: {}}})
        .then(() => M.toast('Offboarding started')).catch(() => {});
    };
    return html`<${UI.Card} title="Start offboarding" id="start-offboarding">
      <div class="stack">
        <${UI.Input} id="offboard-lastday" label="last working day" type="date" value=${lastDay} onChange=${setLastDay}/>
        <div class="row">
          ${ok ? html`<${UI.ConfirmBtn} kind="sec" sm=${false} onConfirm=${start}>Start offboarding<//>`
            : html`<${UI.Btn} kind="sec" disabled>Start offboarding<//>`}
        </div>
        <div class="sub small">The checklist replaces onboarding on this page. History stays.</div>
      </div>
    <//>`;
  }

  function Offboarding({uid}) {
    const ctx = M.useCtx();
    if (!ctx || !uid) return null;
    const doc = docOf(ctx, 'access', uid);
    const ob = doc.offboard;
    if (!ob) return html`<${UI.Card} title="Offboarding" id="offboarding"><${UI.Empty} text="Offboarding has not started."/><//>`;
    const steps = ob.steps || {};
    const started = typeof ob.started === 'number' ? ob.started : 0;
    const founder = !!ctx.isFounder;
    const member = ctx.members[uid];
    const active = !!member && member.active !== false;
    /* every item open when offboarding began stays on the list, ticked once revoked */
    const items = accessItems(ctx, uid).filter(it => !it.revoked || !!steps['item:' + it.id] || (typeof it.revokedAt === 'number' && it.revokedAt >= started));
    const lines = items.map(it => ({key: 'item:' + it.id, label: 'Revoke or transfer: ' + String(it.name || ''), done: !!it.revoked || !!steps['item:' + it.id], item: it.id}))
      .concat(STEPS.map(s => ({key: s.key, label: s.label, done: !!steps[s.key], item: null})));
    const done = lines.filter(l => l.done).length;
    const total = lines.length;

    const untick = line => {
      const next = U.clone(doc) || {};
      next.offboard = next.offboard || {};
      next.offboard.steps = next.offboard.steps || {};
      delete next.offboard.steps[line.key];
      if (line.item && next.items && next.items[line.item]) { next.items[line.item].revoked = false; next.items[line.item].revokedAt = null; }
      ctx.W.set('access/' + uid, next).catch(() => {});
    };
    const toggle = (line, on) => {
      if (!on) { untick(line); return; }
      const at = Date.now();
      if (line.item) {
        ctx.W.update('access/' + uid, {items: {[line.item]: {revoked: true, revokedAt: at}}, offboard: {steps: {[line.key]: at}}}).catch(() => {});
      } else {
        ctx.W.merge('access/' + uid, {offboard: {steps: {[line.key]: at}}}).catch(() => {});
      }
    };
    const finish = () => {
      ctx.W.update('roster/team', {members: {[uid]: {active: false}}, updated: Date.now()})
        .then(() => M.toast('Offboarding finished')).catch(() => {});
    };
    return html`<${UI.Card} title="Offboarding" id="offboarding" action=${html`<${CountText} done=${done} total=${total}/>`}>
      <div class="stack">
        <div class="row between">
          <div class="small">Last working day: <span class="num">${okDate(ob.lastDay) ? U.fmtDate(ob.lastDay) : 'n/a'}</span></div>
          ${active ? null : html`<${UI.Pill} kind="warm">off the roster<//>`}
        </div>
        <${UI.Bar} a=${done} max=${total}/>
        <div class="stack tight">
          ${lines.map(l => founder
            ? html`<${UI.Check} key=${l.key} label=${l.label} checked=${l.done} onChange=${on => toggle(l, on)}/>`
            : html`<${ReadCheck} key=${l.key} label=${l.label} checked=${l.done}/>`)}
        </div>
        ${founder && active ? html`<div class="row">
          <${UI.ConfirmBtn} kind="sec" sm=${false} onConfirm=${finish}>Finish offboarding<//>
          <span class="sub small">Sets the roster entry to inactive. History stays.</span>
        </div>` : null}
      </div>
    <//>`;
  }

  /* ---------- person page ---------- */
  function Person({uid}) {
    const ctx = M.useCtx();
    const [tab, setTab] = useState('overview');
    const names = useNames(ctx, [uid]);
    const m = ctx.members[uid];
    const back = html`<${UI.Btn} kind="sec" sm onClick=${() => M.nav('#people')}>All people<//>`;
    if (!m) {
      return html`<${React.Fragment}>
        <${UI.PageHead} micro="team" title="People">${back}<//>
        <${UI.Card}><${UI.Empty} text="Nobody with this id on the roster."/><//>
      <//>`;
    }
    const canSee = !!ctx.canSee(uid);
    const offboarding = !!docOf(ctx, 'access', uid).offboard;
    const opts = [{v: 'overview', label: 'Overview'}];
    if (canSee) {
      opts.push({v: 'scorecard', label: 'Scorecard'}, {v: 'access', label: 'Access'},
        {v: 'board', label: offboarding ? 'Offboarding' : 'Onboarding'});
    }
    const cur = opts.some(o => o.v === tab) ? tab : 'overview';
    const inactive = m.active === false;
    const st = statusOf(ctx, uid, todayOf(ctx));
    const isFounderMember = m.role === 'founder' || uid === ctx.founderUid;
    const line = [m.title, m.pod].filter(Boolean).join(' · ');
    return html`<${React.Fragment}>
      <${UI.PageHead} micro="team" title="People">${back}<//>
      <${UI.Card} id="person-head">
        <div class="row nowrap" style=${{alignItems: 'flex-start'}}>
          <${UI.Avatar} id=${uid} size=${56}/>
          <div class="grow stack tight" style=${{gap: '3px'}}>
            <div class="row">
              <h2 class="card-title">${nameIn(names, uid)}</h2>
              ${inactive ? html`<${UI.Pill} kind="warm">off the roster<//>` : html`<${UI.Pill} kind=${st.kind}>${st.label}<//>`}
              ${!inactive && isNewHire(ctx, uid) ? html`<${UI.Pill} kind="warm">new hire<//>` : null}
            </div>
            <div class="small sub"><span class="num">${m.empId || ''}</span>${line ? (m.empId ? ' · ' : '') + line : ''}</div>
            <div class="small sub">${okDate(m.joined) ? 'Joined ' + U.fmtDate(m.joined) : 'Joined date missing'}</div>
          </div>
        </div>
      <//>
      ${opts.length > 1 ? html`<div class="row"><${UI.Seg} options=${opts} value=${cur} onChange=${setTab} ariaLabel="Person sections"/></div>` : null}
      ${cur === 'overview' ? html`<${Overview} uid=${uid}/>` : null}
      ${cur === 'scorecard' ? html`<${Scorecard} uid=${uid}/>` : null}
      ${cur === 'access' ? html`<${AccessRegister} uid=${uid}/>` : null}
      ${cur === 'board' && !offboarding ? html`<${React.Fragment}>
        <${Onboarding} uid=${uid}/>
        ${ctx.isFounder && !isFounderMember && !inactive ? html`<${StartOffboarding} uid=${uid}/>` : null}
      <//>` : null}
      ${cur === 'board' && offboarding ? html`<${Offboarding} uid=${uid}/>` : null}
    <//>`;
  }

  function People({id}) {
    if (!id) return html`<${Directory}/>`;
    return html`<${Person} key=${id} uid=${id}/>`;
  }

  M.pages.People = People;
  M.parts.Onboarding = Onboarding;
  M.parts.AccessRegister = AccessRegister;
  M.parts.Offboarding = Offboarding;
  M.people = {isNewHire, onboardingProgress, onboardItems, accessItems, kudosFor, statusOf,
    AUTO_ITEMS, MANUAL_ITEMS, STEPS, KINDS, ONBOARD_TOTAL};
})();

/* ==== 33-hiring.js ==== */
/* module: hiring */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect} = React;

  const STAGES = [
    {v: 'screen', label: 'Screen'},
    {v: 'test', label: 'Test'},
    {v: 'panel', label: 'Panel'},
    {v: 'offer', label: 'Offer'},
    {v: 'hired', label: 'Hired'},
    {v: 'rejected', label: 'Rejected'}
  ];
  const STAGE_LABEL = Object.fromEntries(STAGES.map(s => [s.v, s.label]));
  const CRITERIA = [
    {k: 'craft', label: 'Quality of work', short: 'quality'},
    {k: 'thinking', label: 'Thinking and logic', short: 'thinking'},
    {k: 'comms', label: 'Communication', short: 'communication'},
    {k: 'ownership', label: 'Ownership (finishes things)', short: 'ownership'},
    {k: 'culture', label: 'Culture add', short: 'culture add'}
  ];
  const GWC = [
    {k: 'g', q: 'Gets it?', label: 'Gets it'},
    {k: 'w', q: 'Wants it?', label: 'Wants it'},
    {k: 'c', q: 'Capacity to do it?', label: 'Capacity to do it'}
  ];
  const VERDICTS = [
    {v: 'strong-no', label: 'Strong no'},
    {v: 'no', label: 'No'},
    {v: 'yes', label: 'Yes'},
    {v: 'strong-yes', label: 'Strong yes'}
  ];
  const VERDICT_LABEL = Object.fromEntries(VERDICTS.map(v => [v.v, v.label]));
  const YESNO = [{v: 'yes', label: 'Yes'}, {v: 'no', label: 'No'}];
  const SCORES = [1, 2, 3, 4, 5].map(n => ({v: n, label: String(n)}));
  const POD_Q = 'Would you want them in your pod?';
  const NOTE = 'Your evaluation goes to Kaavish only. Nobody else on the panel sees it. Write what you would say to his face.';

  /* ---------- pure helpers ---------- */
  const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && U.ymd(U.parseYmd(s)) === s;
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const candMap = ctx => collMap(ctx, 'candidates');
  const evaluatorsOf = c => Array.isArray(c && c.evaluators) ? c.evaluators.filter(u => typeof u === 'string' && u) : [];
  const evalOf = (ctx, u, cid) => {
    const e = ((collMap(ctx, 'evals')[u] || {}).e || {})[cid];
    return e && typeof e === 'object' ? e : null;
  };
  /* evaluators whose evaluation is visible to the viewer: every one for the founder, my own for a member */
  const submittedOf = (ctx, c) => evaluatorsOf(c).filter(u => evalOf(ctx, u, c.id));
  const decided = c => !!(c && c.decision);
  const stageKind = s => s === 'hired' ? 'ink' : s === 'rejected' ? 'flame' : undefined;
  const yesNo = v => v === 'yes' || v === 'no';
  const scoreOk = n => Number.isInteger(n) && n >= 1 && n <= 5;
  const safeHref = link => {
    const s = String(link || '').trim();
    if (!s) return null;
    return /^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, '');
  };
  const linksOf = c => String((c && c.links) || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean)
    .map(s => ({text: s, href: safeHref(s)}));
  const evalWord = n => n === 1 ? 'evaluation' : 'evaluations';
  const dueText = c => okDate(c && c.deadline) ? 'due ' + U.fmtDate(c.deadline) : 'no deadline';
  const dayOf = ts => ts ? U.fmtDate(U.ymd(new Date(ts))) : '';

  /* every candidate: open ones first, soonest deadline first; decided ones after, newest decision first */
  function candidatesOf(ctx) {
    const m = candMap(ctx);
    const list = Object.keys(m).filter(id => m[id] && typeof m[id] === 'object').map(id => ({...m[id], id}));
    list.sort((a, b) => {
      const da = decided(a) ? 1 : 0, db = decided(b) ? 1 : 0;
      if (da !== db) return da - db;
      if (da) return (b.decidedAt || 0) - (a.decidedAt || 0);
      return String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')) || (a.created || 0) - (b.created || 0);
    });
    return list;
  }

  function panel(ctx) {
    return candidatesOf(ctx).filter(c => !decided(c)).map(c => ({
      id: c.id, candidate: String(c.name || 'Candidate'), submitted: submittedOf(ctx, c).length, total: evaluatorsOf(c).length
    }));
  }

  function assignedToMe(ctx) {
    const me = ctx && ctx.uid;
    if (!me) return [];
    return candidatesOf(ctx).filter(c => !decided(c) && evaluatorsOf(c).includes(me) && !evalOf(ctx, me, c.id)).map(c => c.id);
  }

  /* founder summary over the submitted evaluations */
  function summary(ctx, c) {
    const subs = submittedOf(ctx, c).map(u => ({uid: u, e: evalOf(ctx, u, c.id)}));
    const n = subs.length;
    const avg = CRITERIA.map(cr => {
      const vals = subs.map(x => Number(x.e.s && x.e.s[cr.k])).filter(scoreOk);
      return {k: cr.k, short: cr.short, n: vals.length, avg: vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : null};
    });
    const gwc = GWC.map(g => ({k: g.k, label: g.label, yes: subs.filter(x => x.e.gwc && x.e.gwc[g.k] === 'yes').length, n}));
    const tally = VERDICTS.slice().reverse()
      .map(v => ({v: v.v, label: v.label, n: subs.filter(x => x.e.verdict === v.v).length}))
      .filter(t => t.n > 0);
    const pod = subs.filter(x => x.e.pod === 'yes').length;
    const whys = subs.filter(x => String(x.e.why || '').trim()).map(x => ({uid: x.uid, text: String(x.e.why).trim()}));
    const risks = subs.filter(x => String(x.e.risk || '').trim()).map(x => ({uid: x.uid, text: String(x.e.risk).trim()}));
    return {subs, n, avg, gwc, tally, pod, whys, risks};
  }
  const tallyText = t => t.length ? t.map(x => x.label + ' ' + x.n).join(', ') : 'No verdicts yet';

  /* names resolved inside this module. M.useProfiles re-renders only the component whose fetch filled the
     shared cache, so this hook keeps its own copy and re-renders once the fetch settles. */
  function useNames(ctx, ids) {
    const key = (ids || []).filter(Boolean).sort().join(',');
    const [ps, setPs] = useState({});
    useEffect(() => {
      const user = ctx && ctx.user;
      if (!user || !key || typeof user.profiles !== 'function') return undefined;
      let live = true;
      Promise.resolve().then(() => user.profiles(key.split(','))).then(r => { if (live && r) setPs(r); }).catch(() => {});
      return () => { live = false; };
    }, [ctx && ctx.user, key]);
    return ps;
  }
  const nameIn = (names, u) => (names[u] && names[u].name) || 'Someone';

  /* ---------- small parts ---------- */
  const StagePill = ({stage}) => html`<${UI.Pill} kind=${stageKind(stage)}>${(STAGE_LABEL[stage] || 'Screen').toLowerCase()}<//>`;
  const VerdictPill = ({v}) => html`<${UI.Pill} kind=${v === 'yes' || v === 'strong-yes' ? 'ink' : 'flame-o'}>${(VERDICT_LABEL[v] || 'No verdict').toLowerCase()}<//>`;
  const YesPill = ({label, v}) => html`<${UI.Pill} kind=${v === 'yes' ? 'ink' : 'flame-o'}>${label}: ${v === 'yes' ? 'yes' : 'no'}<//>`;
  const Links = ({c}) => {
    const links = linksOf(c);
    if (!links.length) return html`<${UI.Empty} text="No links yet."/>`;
    return html`<div class="stack tight">
      ${links.map((l, i) => html`<a key=${i} class="linky small" href=${l.href} target="_blank" rel="noopener noreferrer"
        style=${{overflowWrap: 'anywhere', alignSelf: 'flex-start'}}>${l.text}</a>`)}
    </div>`;
  };
  /* one submitted evaluation, rendered as text and pills */
  const EvalView = ({e}) => html`<div class="stack tight">
    <div class="row">${GWC.map(g => html`<${YesPill} key=${g.k} label=${g.label.toLowerCase()} v=${e.gwc && e.gwc[g.k]}/>`)}</div>
    <div class="row small num">${CRITERIA.map(cr => {
      const v = Number(e.s && e.s[cr.k]);
      return html`<span key=${cr.k}><span class="sub">${cr.short}</span> <b>${scoreOk(v) ? v : '?'}</b></span>`;
    })}</div>
    <div class="row"><${YesPill} label="pod" v=${e.pod}/><${VerdictPill} v=${e.verdict}/></div>
    <div class="small"><span class="sub">reason to hire:</span> ${String(e.why || '')}</div>
    <div class="small"><span class="sub">risk:</span> ${String(e.risk || '')}</div>
  </div>`;

  /* ---------- founder: candidate list card ---------- */
  function CandidateCard({c, ctx, selected}) {
    const subs = submittedOf(ctx, c).length, total = evaluatorsOf(c).length;
    return html`<button type="button" class="rowbtn" id=${'cand-' + c.id} style=${{fontWeight: 300}} aria-pressed=${!!selected}
      aria-label=${'Open ' + (c.name || 'candidate')} onClick=${() => M.nav('#hiring/' + encodeURIComponent(c.id))}>
      <div class="card stack tight">
        <div class="row between nowrap"><b class="grow">${c.name || 'Candidate'}</b><${StagePill} stage=${c.stage}/></div>
        ${c.role ? html`<div class="sub small">${c.role}</div>` : null}
        <div class="row small num">
          <span class="sub">${dueText(c)}</span>
          <span>${subs} of ${total} ${evalWord(total)}</span>
        </div>
      </div>
    </button>`;
  }

  /* ---------- founder: new or edit candidate ---------- */
  const fromCandidate = c => ({
    name: String((c && c.name) || ''), role: String((c && c.role) || ''),
    stage: STAGE_LABEL[c && c.stage] ? c.stage : 'screen',
    links: String((c && c.links) || ''), notes: String((c && c.notes) || ''),
    evaluators: evaluatorsOf(c), deadline: okDate(c && c.deadline) ? c.deadline : ''
  });

  function CandidateDrawer({candidateId, onClose}) {
    const ctx = M.useCtx();
    const isNew = !candidateId;
    const cur = isNew ? null : candMap(ctx)[candidateId];
    const [f, setF] = useState(() => fromCandidate(cur));
    const [busy, setBusy] = useState(false);
    const members = (ctx.activeMembers || []).filter(m => m.uid !== ctx.founderUid && m.role !== 'founder' && m.uid !== ctx.uid);
    const names = useNames(ctx, members.map(m => m.uid));
    const W = ctx.W;
    const set = k => v => setF(x => ({...x, [k]: v}));
    const toggle = (u, on) => setF(x => ({...x, evaluators: on
      ? (x.evaluators.includes(u) ? x.evaluators : [...x.evaluators, u])
      : x.evaluators.filter(y => y !== u)}));

    const save = async () => {
      const name = f.name.trim();
      if (!name) { M.toast('Give the candidate a name.', true); return; }
      setBusy(true);
      const now = Date.now();
      const fin = f.stage === 'hired' || f.stage === 'rejected';
      const decision = fin ? (f.stage === 'hired' ? 'hire' : 'reject') : '';
      const body = {name, role: f.role.trim(), stage: f.stage, links: f.links.trim(), notes: f.notes.trim(),
        evaluators: f.evaluators.slice(), deadline: okDate(f.deadline) ? f.deadline : ''};
      let ok = false, newId = null;
      try {
        if (isNew) {
          newId = U.uid();
          await W.set('candidates/' + newId, {...body, decision, decidedAt: fin ? now : null, created: now});
          M.toast('Candidate added');
        } else {
          const keep = cur && cur.decision === decision && cur.decidedAt;
          await W.update('candidates/' + candidateId, {...body, decision, decidedAt: fin ? (keep || now) : null});
          M.toast('Saved');
        }
        ok = true;
      } catch (e) { /* the write layer toasts the failure */ }
      setBusy(false);
      if (ok) { onClose(); if (newId) M.nav('#hiring/' + encodeURIComponent(newId)); }
    };
    const del = async () => {
      try {
        await W.del('candidates/' + candidateId);
        M.toast('Candidate deleted');
        onClose();
        M.nav('#hiring');
      } catch (e) { /* the write layer toasts the failure */ }
    };

    if (!isNew && !cur) {
      return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Candidate">
        <${UI.Empty} text="This candidate is gone."/>
      <//>`;
    }
    const footer = html`<${React.Fragment}>
      ${isNew ? null : html`<div class="grow"><${UI.ConfirmBtn} onConfirm=${del}>Delete candidate<//></div>`}
      <${UI.Btn} disabled=${busy} onClick=${save}>${isNew ? 'Add candidate' : 'Save candidate'}<//>
    <//>`;
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${isNew ? 'New candidate' : 'Edit candidate'} footer=${footer}>
      <${UI.Input} id="cand-name" label="name" value=${f.name} onChange=${set('name')} placeholder="Full name"/>
      <${UI.Input} id="cand-role" label="role" value=${f.role} onChange=${set('role')} placeholder="Brand strategist"/>
      <div class="grid2">
        <${UI.Select} id="cand-stage" label="stage" value=${f.stage} onChange=${set('stage')} options=${STAGES}/>
        <${UI.Input} id="cand-deadline" label="deadline" type="date" value=${f.deadline} onChange=${set('deadline')}/>
      </div>
      <${UI.TextArea} id="cand-links" label="links" value=${f.links} onChange=${set('links')} placeholder="https://"
        hint="Links, one per line: portfolio, the paid two-hour test brief, the submission"/>
      <${UI.TextArea} id="cand-notes" label="notes" value=${f.notes} onChange=${set('notes')} placeholder="What the panel should look for"/>
      <${UI.Field} label="evaluators" hint=${members.length ? 'Each evaluator sees the candidate and their own evaluation only.' : 'Add people to the roster from the Desk first.'}>
        <div class="stack tight">
          ${members.map(m => html`<div key=${m.uid} id=${'cand-ev-' + m.uid}>
            <${UI.Check} label=${nameIn(names, m.uid) + (m.title ? ', ' + m.title : '')} checked=${f.evaluators.includes(m.uid)}
              onChange=${on => toggle(m.uid, on)}/>
          </div>`)}
        </div>
      <//>
    <//>`;
  }

  /* ---------- founder: candidate page (inline section under the list) ---------- */
  function CandidateSection({id, onEdit}) {
    const ctx = M.useCtx();
    const c = candMap(ctx)[id];
    const [busy, setBusy] = useState(false);
    const evaluators = evaluatorsOf(c);
    const names = useNames(ctx, evaluators);
    if (!c) {
      return html`<${UI.Card} title="Candidate" id="hiring-candidate">
        <${UI.Empty} text=${ctx.coll.candidates.ready ? 'This candidate is gone.' : 'Loading.'}/>
      <//>`;
    }
    const cand = {...c, id};
    const sum = summary(ctx, cand);
    const all = sum.n >= evaluators.length;
    const isDec = decided(c);

    const decide = async d => {
      setBusy(true);
      try {
        await ctx.W.update('candidates/' + id, {decision: d, decidedAt: Date.now(), stage: d === 'hire' ? 'hired' : 'rejected'});
        M.toast(d === 'hire' ? 'Marked hired' : 'Marked rejected');
      } catch (e) { /* the write layer toasts the failure */ }
      setBusy(false);
    };
    const decision = isDec
      ? html`<div class="row" id="hiring-decision">
          <${StagePill} stage=${c.stage}/>
          <span class="sub small num">decided ${dayOf(c.decidedAt) || 'earlier'}</span>
        </div>`
      : all
        ? html`<div class="row" id="hiring-decision">
            <${UI.Btn} disabled=${busy} onClick=${() => decide('hire')}>Hire<//>
            <${UI.Btn} kind="sec" disabled=${busy} onClick=${() => decide('reject')}>Reject<//>
          </div>`
        : html`<div class="row" id="hiring-decision">
            <${UI.ConfirmBtn} kind="sec" sm=${false} label="Decide without all evaluations" onConfirm=${() => decide('hire')}>Hire<//>
            <${UI.ConfirmBtn} kind="sec" sm=${false} label="Decide without all evaluations" onConfirm=${() => decide('reject')}>Reject<//>
            <span class="sub small num">${sum.n} of ${evaluators.length} ${evalWord(evaluators.length)} in</span>
          </div>`;

    const action = html`<div class="row nowrap">
      <${StagePill} stage=${c.stage}/>
      <${UI.Btn} kind="sec" sm onClick=${onEdit}><${icons.edit}/>Edit<//>
    </div>`;

    return html`<${UI.Card} title=${c.name || 'Candidate'} id="hiring-candidate" action=${action}>
      <div class="stack">
        <div class="sub small num">${c.role ? c.role + ' · ' : ''}${dueText(c)}</div>
        <${UI.Micro} plain>links<//>
        <${Links} c=${c}/>
        ${c.notes ? html`<${React.Fragment}>
          <${UI.Micro} plain>notes<//>
          <div class="small" style=${{whiteSpace: 'pre-wrap', overflowWrap: 'anywhere'}}>${String(c.notes)}</div>
        <//>` : null}

        <hr class="hair" style=${{margin: '4px 0'}}/>
        <${UI.Micro} plain>${sum.n} of ${evaluators.length} ${evalWord(evaluators.length)}<//>
        <div class="stack" id="hiring-evals">
          ${evaluators.length ? evaluators.map(u => {
            const e = evalOf(ctx, u, id);
            return html`<div key=${u} class="stack tight" id=${'hiring-eval-' + u}>
              <div class="row">
                <${UI.Avatar} id=${u} size=${28}/>
                <b>${nameIn(names, u)}</b>
                ${e ? html`<${UI.Pill} kind="ink">submitted ${U.timeAgo(e.at || 0)}<//>` : html`<${UI.Pill} kind="flame-o">not submitted<//>`}
              </div>
              ${e ? html`<${EvalView} e=${e}/>` : null}
            </div>`;
          }) : html`<${UI.Empty} text="No evaluators yet. Edit the candidate to pick the panel."/>`}
        </div>

        <hr class="hair" style=${{margin: '4px 0'}}/>
        <${UI.Micro} plain>summary<//>
        ${sum.n ? html`<${React.Fragment}>
          <div class="kpi-rail" id="hiring-avg">
            ${sum.avg.map(a => html`<div class="kpi" key=${a.k}><div class="v num">${a.avg == null ? '0.0' : a.avg}</div><div class="l">${a.short}</div></div>`)}
          </div>
          <div class="row" id="hiring-gwc">
            ${sum.gwc.map(g => html`<${UI.Pill} key=${g.k} kind=${g.n && g.yes === g.n ? 'ink' : 'flame-o'}>${g.label} ${g.yes} of ${g.n}<//>`)}
          </div>
          <div class="row small">
            <span><span class="sub">verdicts:</span> <span class="num" id="hiring-tally">${tallyText(sum.tally)}</span></span>
            <span><span class="sub">pod yes:</span> <span class="num">${sum.pod} of ${sum.n}</span></span>
          </div>
          <div class="grid2">
            <div class="stack tight" id="hiring-whys">
              <${UI.Micro} plain>reasons to hire<//>
              ${sum.whys.length ? sum.whys.map(w => html`<div key=${w.uid} class="small" style=${{overflowWrap: 'anywhere'}}>${w.text} <span class="sub">· ${nameIn(names, w.uid)}</span></div>`)
                : html`<${UI.Empty} text="None given."/>`}
            </div>
            <div class="stack tight" id="hiring-risks">
              <${UI.Micro} plain>risks<//>
              ${sum.risks.length ? sum.risks.map(r => html`<div key=${r.uid} class="small" style=${{overflowWrap: 'anywhere'}}>${r.text} <span class="sub">· ${nameIn(names, r.uid)}</span></div>`)
                : html`<${UI.Empty} text="None given."/>`}
            </div>
          </div>
        <//>` : html`<${UI.Empty} text="No evaluations yet."/>`}

        <hr class="hair" style=${{margin: '4px 0'}}/>
        ${decision}
      </div>
    <//>`;
  }

  /* ---------- evaluator: assigned candidate card ---------- */
  function MyCard({c, ctx, onOpen}) {
    const e = evalOf(ctx, ctx.uid, c.id);
    const isDec = decided(c);
    return html`<button type="button" class="rowbtn" id=${'cand-' + c.id} style=${{fontWeight: 300}}
      aria-label=${'Open ' + (c.name || 'candidate')} onClick=${onOpen}>
      <div class="card stack tight">
        <div class="row between nowrap">
          <b class="grow">${c.name || 'Candidate'}</b>
          ${e ? html`<${UI.Pill} kind="ink">submitted<//>`
            : isDec ? html`<${StagePill} stage=${c.stage}/>`
            : html`<span class="row nowrap small flame-t"><span class="dotflame"/>evaluation due</span>`}
        </div>
        ${c.role ? html`<div class="sub small">${c.role}</div>` : null}
        <div class="row small num"><span class="sub">${dueText(c)}</span>${e && isDec ? html`<${StagePill} stage=${c.stage}/>` : null}</div>
      </div>
    </button>`;
  }

  /* ---------- evaluator: the evaluation drawer ---------- */
  const emptyEval = () => ({gwc: {g: '', w: '', c: ''}, s: {craft: 0, thinking: 0, comms: 0, ownership: 0, culture: 0}, pod: '', verdict: '', why: '', risk: ''});
  const fromEval = e => {
    const f = emptyEval();
    if (!e) return f;
    GWC.forEach(g => { const v = e.gwc && e.gwc[g.k]; if (yesNo(v)) f.gwc[g.k] = v; });
    CRITERIA.forEach(c => { const v = Number(e.s && e.s[c.k]); if (scoreOk(v)) f.s[c.k] = v; });
    if (yesNo(e.pod)) f.pod = e.pod;
    if (VERDICT_LABEL[e.verdict]) f.verdict = e.verdict;
    f.why = String(e.why || '');
    f.risk = String(e.risk || '');
    return f;
  };
  const complete = f => GWC.every(g => yesNo(f.gwc[g.k])) && CRITERIA.every(c => scoreOk(f.s[c.k]))
    && yesNo(f.pod) && !!VERDICT_LABEL[f.verdict] && !!f.why.trim() && !!f.risk.trim();

  function EvalDrawer({candidateId, onClose}) {
    const ctx = M.useCtx();
    const uid = ctx && ctx.uid;
    const c = ctx && candidateId ? candMap(ctx)[candidateId] : null;
    const mine = c && uid ? evalOf(ctx, uid, candidateId) : null;
    const seed = mine ? (mine.at || 0) : -1;
    const [f, setF] = useState(() => fromEval(mine));
    const [dirty, setDirty] = useState(false);
    const [busy, setBusy] = useState(false);
    useEffect(() => { setF(fromEval(mine)); setDirty(false); }, [candidateId]);
    /* the stored evaluation arrives or changes: refill the form while nothing has been typed */
    useEffect(() => { if (!dirty) setF(fromEval(mine)); }, [seed]);
    if (!ctx) return null;

    const upd = fn => { setDirty(true); setF(fn); };
    const setG = (k, v) => upd(x => ({...x, gwc: {...x.gwc, [k]: v}}));
    const setS = (k, v) => upd(x => ({...x, s: {...x.s, [k]: v}}));
    const set = k => v => upd(x => ({...x, [k]: v}));

    const submit = async () => {
      if (!complete(f) || busy || !c) return;
      setBusy(true);
      let ok = false;
      try {
        await ctx.W.merge('evals/' + uid, {e: {[candidateId]: {
          gwc: {g: f.gwc.g, w: f.gwc.w, c: f.gwc.c},
          s: {craft: f.s.craft, thinking: f.s.thinking, comms: f.s.comms, ownership: f.s.ownership, culture: f.s.culture},
          pod: f.pod, verdict: f.verdict, why: f.why.trim(), risk: f.risk.trim(), at: Date.now()
        }}});
        ok = true;
      } catch (e) { /* the write layer toasts the failure */ }
      setBusy(false);
      if (ok) { setDirty(false); M.toast('Evaluation sent to Kaavish'); onClose(); }
    };

    if (!c) {
      return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Candidate">
        <${UI.Empty} text=${ctx.coll.candidates.ready ? 'This candidate is gone.' : 'Loading.'}/>
      <//>`;
    }
    const title = c.name || 'Candidate';
    const meta = html`<div class="sub small num">${c.role ? c.role + ' · ' : ''}${dueText(c)}</div>`;

    if (decided(c)) {
      return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${title} head=${html`<${StagePill} stage=${c.stage}/>`}>
        <div class="small" id="eval-decided"><b>Decided.</b> Your evaluation is on record with Kaavish.</div>
        ${meta}
        <${UI.Micro} plain>links<//>
        <${Links} c=${c}/>
        <hr class="hair" style=${{margin: '2px 0'}}/>
        <${UI.Micro} plain>your evaluation<//>
        ${mine ? html`<${EvalView} e=${mine}/>` : html`<${UI.Empty} text="You did not submit one."/>`}
      <//>`;
    }

    const footer = html`<${UI.Btn} disabled=${!complete(f) || busy} onClick=${submit}>Submit evaluation<//>`;
    const segRow = (q, seg) => html`<div class="row between nowrap" style=${{gap: '12px'}}>
      <span class="small">${q}</span><span style=${{flex: 'none'}}>${seg}</span>
    </div>`;
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${title} footer=${footer}>
      <div class="small" id="eval-note">${NOTE}</div>
      ${meta}
      <${UI.Micro} plain>links<//>
      <${Links} c=${c}/>

      <hr class="hair" style=${{margin: '2px 0'}}/>
      <${UI.Micro} plain>gets it, wants it, capacity<//>
      ${GWC.map(g => html`<div key=${g.k}>${segRow(g.q, html`<${UI.Seg} sm options=${YESNO} value=${f.gwc[g.k]} onChange=${v => setG(g.k, v)} ariaLabel=${g.q}/>`)}</div>`)}

      <hr class="hair" style=${{margin: '2px 0'}}/>
      <${UI.Micro} plain>scores, 1 to 5<//>
      ${CRITERIA.map(cr => html`<div key=${cr.k}>${segRow(cr.label, html`<${UI.Seg} sm options=${SCORES} value=${f.s[cr.k]} onChange=${v => setS(cr.k, v)} ariaLabel=${cr.label}/>`)}</div>`)}

      <hr class="hair" style=${{margin: '2px 0'}}/>
      ${segRow(POD_Q, html`<${UI.Seg} sm options=${YESNO} value=${f.pod} onChange=${set('pod')} ariaLabel=${POD_Q}/>`)}
      <${UI.Field} label="verdict">
        <${UI.Seg} options=${VERDICTS} value=${f.verdict} onChange=${set('verdict')} ariaLabel="Verdict"/>
      <//>
      <${UI.Input} id="eval-why" label="one reason to hire" value=${f.why} onChange=${set('why')} placeholder="Required"/>
      <${UI.Input} id="eval-risk" label="one risk" value=${f.risk} onChange=${set('risk')} placeholder="Required"/>
      ${mine ? html`<div class="sub small">Submitted ${U.timeAgo(mine.at || 0)}. Submit again to replace it.</div>`
        : html`<div class="sub small">Every field is required. It stays editable until Kaavish decides.</div>`}
    <//>`;
  }

  /* ---------- page ---------- */
  function Hiring({id}) {
    const ctx = M.useCtx();
    const [drawer, setDrawer] = useState(null);
    const [openId, setOpenId] = useState(id || null);
    useEffect(() => { if (id) setOpenId(id); }, [id]);
    if (!ctx) return null;
    const list = candidatesOf(ctx);
    const ready = !!(ctx.coll.candidates && ctx.coll.candidates.ready);

    if (ctx.isFounder) {
      const open = list.filter(c => !decided(c)).length;
      return html`<${React.Fragment}>
        <${UI.PageHead} micro="team" title="Hiring">
          <${UI.Btn} onClick=${() => setDrawer({candidateId: null})}><${icons.plus}/>New candidate<//>
        <//>
        <${UI.Card} title="Candidates" id="hiring-list" action=${open ? html`<${UI.Pill}>${open} open<//>` : null}>
          ${list.length ? html`<div class="stack tight">
            ${list.map(c => html`<${CandidateCard} key=${c.id} c=${c} ctx=${ctx} selected=${c.id === id}/>`)}
          </div>` : html`<${UI.Empty} text=${ready ? 'No candidates yet.' : 'Loading.'}/>`}
        <//>
        ${id ? html`<${CandidateSection} key=${id} id=${id} onEdit=${() => setDrawer({candidateId: id})}/>` : null}
        ${drawer ? html`<${CandidateDrawer} candidateId=${drawer.candidateId} onClose=${() => setDrawer(null)}/>` : null}
      <//>`;
    }

    const mine = list.filter(c => evaluatorsOf(c).includes(ctx.uid));
    const due = assignedToMe(ctx).length;
    const close = () => { setOpenId(null); if (id) M.nav('#hiring'); };
    return html`<${React.Fragment}>
      <${UI.PageHead} micro="team" title="Hiring"/>
      <${UI.Card} title="Your panel" id="hiring-mine" action=${due ? html`<${UI.Pill} kind="flame-o">${due} due<//>` : null}>
        ${mine.length ? html`<div class="stack tight">
          ${mine.map(c => html`<${MyCard} key=${c.id} c=${c} ctx=${ctx} onOpen=${() => setOpenId(c.id)}/>`)}
        </div>` : html`<${UI.Empty} text=${ready ? 'No evaluations assigned to you.' : 'Loading.'}/>`}
      <//>
      ${openId ? html`<${EvalDrawer} key=${openId} candidateId=${openId} onClose=${close}/>` : null}
    <//>`;
  }

  M.pages.Hiring = Hiring;
  M.parts.EvalDrawer = EvalDrawer;
  M.hiring = {panel, assignedToMe, STAGES, CRITERIA, GWC, VERDICTS, candidatesOf, summary};
})();

/* ==== 34-handbook.js ==== */
/* module: handbook (BRIEF 7.14). Sections, markdown-lite reader, live tokens, live rules. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo, useEffect} = React;

  const TOKENS = ['start', 'grace', 'eodCut', 'mondayCut', 'wfhCap', 'revCap', 'ackHours', 'blockerDays'];

  function sections(ctx) {
    const map = (ctx.coll && ctx.coll.handbook && ctx.coll.handbook.map) || {};
    return Object.keys(map).map(id => ({id, ...map[id]}))
      .sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.title || '').localeCompare(String(b.title || '')));
  }

  function readsOf(ctx, uid) {
    return ((ctx.coll.acks.map[uid] || {}).s) || {};
  }
  function unread(ctx, uid) {
    const r = readsOf(ctx, uid);
    return sections(ctx).filter(s => (r[s.id] || 0) < (s.updated || 0)).map(s => s.id);
  }

  /* live tokens replaced from settings on every render */
  function fillTokens(text, settings) {
    return String(text == null ? '' : text).replace(/\{\{(\w+)\}\}/g, (m, k) =>
      (TOKENS.indexOf(k) >= 0 && settings[k] != null && settings[k] !== '') ? String(settings[k]) : m);
  }

  /* **bold** runs, as React children (user text never becomes HTML) */
  function inline(text, key) {
    const out = [];
    const parts = String(text).split(/(\*\*[^*]+\*\*)/g);
    parts.forEach((p, i) => {
      if (!p) return;
      if (p.length > 4 && p.slice(0, 2) === '**' && p.slice(-2) === '**') {
        out.push(html`<b key=${key + 'b' + i}>${p.slice(2, -2)}</b>`);
      } else out.push(p);
    });
    return out;
  }

  function HandbookBody({body}) {
    const ctx = M.useCtx();
    const src = fillTokens(body, ctx.settings);
    const lines = src.split('\n');
    const nodes = [];
    let para = [], list = [], n = 0;
    const flushPara = () => {
      if (!para.length) return;
      const t = para.join(' ');
      nodes.push(html`<p key=${'p' + (n++)}>${inline(t, 'p' + n)}</p>`);
      para = [];
    };
    const flushList = () => {
      if (!list.length) return;
      const items = list.slice();
      nodes.push(html`<ul key=${'u' + (n++)}>${items.map((it, i) =>
        html`<li key=${i}><span>${inline(it, 'l' + n + i)}</span></li>`)}</ul>`);
      list = [];
    };
    for (const raw of lines) {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) { flushList(); flushPara(); continue; }
      if (line.slice(0, 3) === '## ') { flushList(); flushPara(); nodes.push(html`<h2 key=${'h' + (n++)}>${inline(line.slice(3), 'h' + n)}</h2>`); continue; }
      if (line.slice(0, 2) === '# ') { flushList(); flushPara(); nodes.push(html`<h1 key=${'h' + (n++)}>${inline(line.slice(2), 'h' + n)}</h1>`); continue; }
      if (line.slice(0, 2) === '- ') { flushPara(); list.push(line.slice(2)); continue; }
      flushList(); para.push(line.trim());
    }
    flushList(); flushPara();
    return html`<div class="hb">${nodes}</div>`;
  }

  function LiveRules({sectionId}) {
    const ctx = M.useCtx();
    if (!M.rules || !M.rules.SECTION_RULES) return null;
    const ids = M.rules.SECTION_RULES(sectionId) || [];
    const names = M.rules.NAMES || {};
    const relevant = f => f.rule !== 'R11' || f.section === sectionId;
    return html`<div style=${{marginTop: '18px'}}>
      <${UI.Micro}>live rules<//>
      <div class="stack tight" style=${{marginTop: '10px'}}>
        ${ids.map(rid => {
          const all = (ctx.flags || []).filter(f => f.rule === rid && relevant(f));
          const mine = all.filter(f => f.uid === ctx.uid);
          const who = ctx.isFounder ? all : mine;
          const uids = Array.from(new Set(all.map(f => f.uid)));
          return html`<div class="listrow" key=${rid}>
            <span class="grow">${names[rid] || rid}</span>
            ${ctx.isFounder
              ? (uids.length
                ? html`<span class="row"><span class="small ink62">${uids.map((u, i) => html`<span key=${u}>${i ? ', ' : ''}<${UI.Name} id=${u}/></span>`)}</span>
                    <${UI.Pill} kind="flame">${all.length} ${all.length === 1 ? 'flag' : 'flags'}<//></span>`
                : html`<${UI.Pill} kind="ink">All clear<//>`)
              : (who.length
                ? html`<${UI.Pill} kind="flame">${who.length} ${who.length === 1 ? 'flag' : 'flags'}<//>`
                : html`<${UI.Pill} kind="ink">All clear<//>`)}
          </div>`;
        })}
      </div>
    </div>`;
  }

  function slugOf(title, taken) {
    let base = String(title || 'section').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
    let s = base, i = 2;
    while (taken.indexOf(s) >= 0) { s = base + '-' + i; i++; }
    return s;
  }

  function EditDrawer({section, onClose}) {
    const ctx = M.useCtx();
    const list = sections(ctx);
    const [f, setF] = useState(() => ({
      title: (section && section.title) || '',
      order: (section && section.order) || (list.length + 1),
      body: (section && section.body) || ''
    }));
    const set = (k, v) => setF(x => ({...x, [k]: v}));
    async function save() {
      if (!f.title.trim()) return;
      const id = section ? section.id : slugOf(f.title, list.map(s => s.id));
      await ctx.W.set('handbook/' + id, {title: f.title.trim(), body: f.body,
        order: Number(f.order) || list.length + 1, updated: Date.now()});
      M.toast('Saved');
      onClose();
      if (!section) M.nav('#handbook/' + id);
    }
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${section ? 'Edit section' : 'New section'}
      footer=${html`<${UI.Btn} onClick=${save} disabled=${!f.title.trim()}>Save section<//>`}>
      <${UI.Input} id="hb-title" label="title" value=${f.title} onChange=${v => set('title', v)}/>
      <${UI.Input} label="position" type="number" value=${f.order} onChange=${v => set('order', v)}/>
      <${UI.TextArea} label="body" rows=${16} value=${f.body} onChange=${v => set('body', v)}
        hint="Use # for a heading, ## for a subheading, - for a list item, and double asterisks for bold."/>
    <//>`;
  }

  function Handbook({id}) {
    const ctx = M.useCtx();
    const [edit, setEdit] = useState(null); /* 'new' or a section object */
    const list = sections(ctx);
    const current = useMemo(() => list.find(s => s.id === id) || list[0] || null, [list, id]);
    const reads = readsOf(ctx, ctx.uid);
    const [wide, setWide] = useState(() => (typeof window !== 'undefined' ? window.innerWidth > 860 : true));
    useEffect(() => {
      const on = () => setWide(window.innerWidth > 860);
      window.addEventListener('resize', on);
      return () => window.removeEventListener('resize', on);
    }, []);

    const isUnread = s => (reads[s.id] || 0) < (s.updated || 0);
    const readers = current ? ctx.activeMembers.filter(m => m.uid !== ctx.founderUid
      && (readsOf(ctx, m.uid)[current.id] || 0) >= (current.updated || 0)) : [];
    const others = ctx.activeMembers.filter(m => m.uid !== ctx.founderUid);
    const meRead = current && !isUnread(current);

    return html`<div class="stack" style=${{gap: '18px'}}>
      <${UI.PageHead} micro="the source of truth" title="Handbook">
        ${ctx.isFounder ? html`<${UI.Btn} onClick=${() => setEdit('new')}>New section<//>` : null}
      <//>
      <div class="grid2" style=${wide ? {gridTemplateColumns: '260px minmax(0,1fr)'} : null}>
        <${UI.Card}>
          <div class="stack tight">
            ${list.length ? list.map(s => html`<button type="button" key=${s.id}
              class=${'side-item' + (current && s.id === current.id ? ' active' : '')}
              onClick=${() => M.nav('#handbook/' + s.id)}>
              <span class="grow">${s.title}</span>
              ${isUnread(s) ? html`<span class="dotflame"/>` : null}
            </button>`) : html`<${UI.Empty} text="No sections yet."/>`}
          </div>
        <//>

        ${current ? html`<${UI.Card}>
          <div class="row between">
            <div>
              <h2 class="pgt" style=${{fontSize: '26px'}}>${current.title}</h2>
              <div class="tiny ink62">updated ${current.updated ? U.timeAgo(current.updated) : 'never'}</div>
            </div>
            ${ctx.isFounder ? html`<div class="row nowrap">
              <${UI.Btn} kind="sec" sm=${true} onClick=${() => setEdit(current)}>Edit<//>
              <${UI.ConfirmBtn} onConfirm=${() => ctx.W.del('handbook/' + current.id).then(() => { M.toast('Deleted'); M.nav('#handbook'); })}>Delete<//>
            </div>` : null}
          </div>
          <hr class="hair"/>
          <${HandbookBody} body=${current.body}/>
          <${LiveRules} sectionId=${current.id}/>
          <hr class="hair"/>
          <div class="row between">
            ${meRead
              ? html`<${UI.Pill} kind="ink">Read<//>`
              : html`<${UI.Btn} onClick=${() => ctx.W.merge('acks/' + ctx.uid, {s: {[current.id]: Date.now()}})
                  .then(() => M.toast('Marked as read'))}>I've read this<//>`}
            ${ctx.isFounder ? html`<div class="row">
              <span class="tiny ink62 num">Read by ${readers.length} of ${others.length}</span>
              ${readers.length ? html`<${UI.AvatarRow} ids=${readers.map(r => r.uid)}/>` : null}
            </div>` : null}
          </div>
        <//>` : html`<${UI.Card}><${UI.Empty} text="No sections yet."/><//>`}
      </div>
      ${edit ? html`<${EditDrawer} section=${edit === 'new' ? null : edit} onClose=${() => setEdit(null)}/>` : null}
    </div>`;
  }

  M.pages.Handbook = Handbook;
  M.parts.HandbookBody = HandbookBody;
  M.handbook = {unread, sections, fillTokens};
})();

/* ==== 35-voice.js ==== */
/* module: voice. Anonymous weekly pulse, the founder's team energy view, and an attributed ideas box with votes. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState} = React;

  const STATUS = [
    {v: 'open', label: 'Open', pill: undefined},
    {v: 'doing', label: 'Doing', pill: 'ink'},
    {v: 'done', label: 'Done', pill: 'ink'},
    {v: 'parked', label: 'Parked', pill: 'warm'}
  ];
  const pillFor = s => { const o = STATUS.find(x => x.v === s); return o ? o.pill : undefined; };
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

  /* ---------- pure helpers, exported as M.voice ---------- */

  /* the last n ISO weeks, oldest first: [{week, avg or null, n}] */
  function energyByWeek(ctx, n) {
    const count = Math.max(1, Number(n) || 8);
    const base = new Date((ctx && ctx.now) || Date.now());
    const sums = {};
    for (const p of Object.values(collMap(ctx, 'pulse'))) {
      if (!p || !p.week) continue;
      const e = Number(p.energy);
      if (!(e >= 1 && e <= 5)) continue;
      const s = sums[p.week] || (sums[p.week] = {sum: 0, n: 0});
      s.sum += e; s.n += 1;
    }
    const out = [];
    for (let i = count - 1; i >= 0; i--) {
      const week = U.isoWeek(U.addDays(base, -7 * i));
      const s = sums[week];
      out.push({week, avg: s ? Math.round(10 * s.sum / s.n) / 10 : null, n: s ? s.n : 0});
    }
    return out;
  }

  /* the newest n pulse responses; every response when n is missing */
  function latest(ctx, n) {
    const m = collMap(ctx, 'pulse');
    const list = Object.keys(m).map(id => ({id, ...(m[id] || {})}))
      .filter(p => p.week || p.at)
      .sort((a, b) => (b.at || 0) - (a.at || 0));
    return n ? list.slice(0, n) : list;
  }

  /* ---------- pulse card: anonymous, once per ISO week ---------- */
  function PulseCard() {
    const ctx = M.useCtx();
    const {W, uid} = ctx;
    const weekId = U.isoWeek(new Date(ctx.now || Date.now()));
    const st = (ctx.priv && ctx.priv.state && ctx.priv.state.data) || {};
    const flagged = !!(st.pulse && st.pulse[weekId]);
    const [energy, setEnergy] = useState(0);
    const [working, setWorking] = useState('');
    const [broken, setBroken] = useState('');
    const [change, setChange] = useState('');
    const [busy, setBusy] = useState(false);
    const [sentWeek, setSentWeek] = useState('');
    const sent = flagged || sentWeek === weekId;

    const send = async () => {
      if (!energy || busy) return;
      setBusy(true);
      try {
        await W.set('pulse/' + U.uid(), {
          at: Date.now(), week: weekId, energy,
          working: working.trim(), broken: broken.trim(), change: change.trim()
        });
        await W.merge('data/users/' + uid + '/state', {pulse: {[weekId]: true}});
        setSentWeek(weekId);
        M.toast('Pulse sent');
      } catch (e) { /* the write layer already toasted the failure */ }
      setBusy(false);
    };

    return html`<${UI.Card} title="Pulse" id="pulse-card">
      <div class="stack">
        <div class="sub">Anonymous. Your name is never stored with it.</div>
        ${sent ? html`<div class="stack tight">
            <div class="row"><${UI.Pill} kind="ink">sent<//><span>Sent for this week.</span></div>
            <div class="sub small">The next pulse opens on Monday.</div>
          </div>` : html`<div class="stack">
            <${UI.Field} label="energy this week" hint="1 to 5. 5 means full.">
              <${UI.Seg} ariaLabel="Energy this week" value=${energy} onChange=${setEnergy}
                options=${[1, 2, 3, 4, 5].map(v => ({v, label: String(v)}))}/>
            <//>
            <${UI.TextArea} id="pulse-working" label="What's working" rows=${2} value=${working} onChange=${setWorking} placeholder="One line is enough"/>
            <${UI.TextArea} id="pulse-broken" label="What's broken" rows=${2} value=${broken} onChange=${setBroken} placeholder="One line is enough"/>
            <${UI.TextArea} id="pulse-change" label="One thing Kaavish should change" rows=${2} value=${change} onChange=${setChange} placeholder="One line is enough"/>
            <div class="row between">
              <span class="sub small">${energy ? 'Energy ' + energy + ' of 5.' : 'Pick your energy to send.'}</span>
              <${UI.Btn} disabled=${!energy || busy} onClick=${send}>Send pulse<//>
            </div>
          </div>`}
      </div>
    <//>`;
  }

  /* ---------- founder: team energy over 8 weeks plus every response ---------- */
  function Response({r}) {
    const e = Number(r.energy) || 0;
    const fields = [['working', r.working], ['broken', r.broken], ['change', r.change]]
      .filter(f => f[1] && String(f[1]).trim());
    return html`<div class="listrow"><div class="grow stack tight">
      <div class="row between">
        <${UI.Pill} kind=${e && e < 3 ? 'flame' : undefined}>energy ${e}<//>
        <span class="tiny sub num">${U.timeAgo(r.at || 0)}</span>
      </div>
      ${fields.map(([k, v]) => html`<div key=${k}>
        <${UI.Micro} plain>${k}<//>
        <div style=${{overflowWrap: 'anywhere'}}>${String(v)}</div>
      </div>`)}
      ${fields.length ? null : html`<div class="sub small">Energy only.</div>`}
    </div></div>`;
  }

  function TeamEnergyCard() {
    const ctx = M.useCtx();
    const weeks = energyByWeek(ctx, 8);
    const responses = latest(ctx);
    const cur = weeks[weeks.length - 1];
    const weekNo = w => Number(String(w).split('-W')[1]) || '';
    return html`<${UI.Card} title="Team energy" id="team-energy-card"
      action=${html`<${UI.Pill}>${plural(responses.length, 'response', 'responses')}<//>`}>
      <div class="stack">
        <${UI.Micro}>average energy, last 8 weeks<//>
        <div>
          <div class="vbars" role="img" aria-label="Average energy per week, last 8 weeks">
            ${weeks.map(w => html`<div key=${w.week}
              class=${'vb' + (w.avg != null && w.avg < 3 ? ' low' : '')}
              title=${w.week + (w.avg == null ? ': no responses' : ': ' + w.avg + ' average from ' + plural(w.n, 'response', 'responses'))}
              style=${w.avg == null ? {height: '6px', opacity: .3} : {height: Math.max(6, Math.round(100 * w.avg / 5)) + '%'}}/>`)}
          </div>
          <div style=${{display: 'flex', gap: '7px', marginTop: '5px'}}>
            ${weeks.map(w => html`<div key=${w.week} class="tiny sub num" style=${{flex: 1, minWidth: '8px', textAlign: 'center'}}>${weekNo(w.week)}</div>`)}
          </div>
        </div>
        <div class="sub small">${cur.n
          ? 'This week: ' + cur.avg + ' average from ' + plural(cur.n, 'response.', 'responses.')
          : 'No responses this week yet.'}</div>
        <${UI.Micro}>responses, newest first<//>
        ${responses.length
          ? html`<div>${responses.map(r => html`<${Response} key=${r.id} r=${r}/>`)}</div>`
          : html`<${UI.Empty} text="No pulse responses yet."/>`}
      </div>
    <//>`;
  }

  /* ---------- ideas box: attributed, one +1 per person, founder sets status ---------- */

  /* Author profiles resolved once per card into local state, so every row shows the name as soon as it arrives.
     M.useProfiles wakes only the first subscriber of an id within one commit, so a second subscriber of the
     same id (an avatar next to a name) can keep its fallback until an unrelated re-render. */
  function useAuthors(ctx, ids) {
    const key = Array.from(new Set(ids)).sort().join(',');
    const user = ctx && ctx.user;
    const [profs, setProfs] = useState({});
    React.useEffect(() => {
      if (!key || !user || typeof user.profiles !== 'function') return;
      let live = true;
      Promise.resolve().then(() => user.profiles(key.split(','))).then(ps => {
        if (!live || !ps) return;
        setProfs(prev => {
          const out = {...prev};
          for (const id of Object.keys(ps)) {
            const p = ps[id] || {};
            out[id] = {name: p.name || '', avatarUrl: p.avatarUrl || ''};
          }
          return out;
        });
      }).catch(() => {});
      return () => { live = false; };
    }, [user, key]);
    return profs;
  }

  function IdeaRow({it, p, isFounder, onVote, onStatus}) {
    const name = (p && p.name) || '';
    return html`<div class="listrow" data-idea=${it.key}>
      <img class="av" width="30" height="30" style=${{width: '30px', height: '30px'}}
        src=${(p && p.avatarUrl) || M.AV_FALLBACK} alt=${name || 'avatar'} title=${name}/>
      <div class="grow stack tight">
        <div style=${{overflowWrap: 'anywhere'}}>${it.t}</div>
        <div class="row between">
          <div class="row">
            <span class="small">${name || 'Someone'}</span>
            <span class="tiny sub num">${U.timeAgo(it.at)}</span>
            <${UI.Pill} kind=${pillFor(it.status)}>${it.status}<//>
          </div>
          <div class="row nowrap">
            <span class="tiny sub num">${plural(it.votes, 'vote', 'votes')}</span>
            <button type="button" class=${'emoji-btn' + (it.voted ? ' on' : '')} aria-pressed=${it.voted}
              aria-label=${it.voted ? 'Remove your +1' : 'Give +1'} onClick=${onVote}>+1</button>
          </div>
        </div>
        ${isFounder ? html`<${UI.Seg} sm ariaLabel="Idea status" value=${it.status} onChange=${onStatus}
          options=${STATUS.map(s => ({v: s.v, label: s.label}))}/>` : null}
      </div>
    </div>`;
  }

  function IdeasCard() {
    const ctx = M.useCtx();
    const {W, uid, isFounder} = ctx;
    const [text, setText] = useState('');
    const [busy, setBusy] = useState(false);
    const ideasMap = collMap(ctx, 'ideas');
    const votesMap = collMap(ctx, 'votes');
    const mine = (votesMap[uid] || {}).v || {};

    const counts = {};
    for (const voter of Object.keys(votesMap)) {
      const v = (votesMap[voter] || {}).v || {};
      for (const k of Object.keys(v)) if (v[k]) counts[k] = (counts[k] || 0) + 1;
    }
    const list = [];
    for (const author of Object.keys(ideasMap)) {
      const items = (ideasMap[author] || {}).items || {};
      for (const id of Object.keys(items)) {
        const it = items[id];
        if (!it || !it.t) continue;
        const key = author + ':' + id;
        list.push({key, author, id, t: String(it.t), at: it.at || 0, status: it.status || 'open',
          votes: counts[key] || 0, voted: !!mine[key]});
      }
    }
    list.sort((a, b) => (b.votes - a.votes) || (b.at - a.at));
    const profs = useAuthors(ctx, list.map(it => it.author));

    const post = async () => {
      const t = text.trim();
      if (!t || busy) return;
      setBusy(true);
      try {
        await W.merge('ideas/' + uid, {items: {[U.uid()]: {t, at: Date.now(), status: 'open'}}});
        setText('');
        M.toast('Idea posted');
      } catch (e) { /* the write layer already toasted the failure */ }
      setBusy(false);
    };
    const toggle = it => {
      if (it.voted) {
        const v = {...mine};
        delete v[it.key];
        W.set('votes/' + uid, {v});
      } else {
        W.merge('votes/' + uid, {v: {[it.key]: true}});
      }
    };
    const setStatus = (it, status) => {
      if (status === it.status) return;
      W.update('ideas/' + it.author, {items: {[it.id]: {status}}});
    };

    return html`<${UI.Card} title="Ideas box" id="ideas-card"
      action=${html`<${UI.Pill}>${plural(list.length, 'idea', 'ideas')}<//>`}>
      <div class="stack">
        <div class="row nowrap">
          <div class="grow"><${UI.Input} id="idea-text" placeholder="One idea in one line" value=${text} onChange=${setText} onEnter=${post}/></div>
          <${UI.Btn} disabled=${!text.trim() || busy} onClick=${post}>Post idea<//>
        </div>
        <div class="sub small">One +1 per person per idea. Kaavish sets the status.</div>
        ${list.length
          ? html`<div>${list.map(it => html`<${IdeaRow} key=${it.key} it=${it} p=${profs[it.author]} isFounder=${isFounder}
              onVote=${() => toggle(it)} onStatus=${s => setStatus(it, s)}/>`)}</div>`
          : html`<${UI.Empty} text="No ideas yet."/>`}
      </div>
    <//>`;
  }

  /* ---------- page ---------- */
  function Voice() {
    const ctx = M.useCtx();
    return html`<${React.Fragment}>
      <${UI.PageHead} micro="pulse and ideas" title="Voice"/>
      <${PulseCard}/>
      ${ctx.isFounder ? html`<${TeamEnergyCard}/>` : null}
      <${IdeasCard}/>
    <//>`;
  }

  M.pages.Voice = Voice;
  M.voice = {energyByWeek, latest};
})();

/* ==== 36-leave.js ==== */
/* module: leave */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState} = React;

  const TYPES = [
    {v: 'casual', label: 'Casual'},
    {v: 'sick', label: 'Sick'},
    {v: 'swap', label: 'WFH swap'},
    {v: 'other', label: 'Other'}
  ];
  const TYPE_LABEL = Object.fromEntries(TYPES.map(t => [t.v, t.label]));
  const STATUS_KIND = {pending: 'flame-o', approved: 'ink', declined: 'flame'};
  /* each person keeps their newest 60 requests; older ones fall off on the next write */
  const KEEP = 60;

  /* ---------- pure helpers ---------- */
  const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && U.ymd(U.parseYmd(s)) === s;
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const reqsOf = (ctx, uid) => ((collMap(ctx, 'leave')[uid] || {}).reqs || []).filter(r => r && r.id);
  const decOf = (ctx, uid) => (collMap(ctx, 'leavedec')[uid] || {}).d || {};
  const statusOf = (ctx, uid, id) => {
    const d = decOf(ctx, uid)[id];
    return d && (d.status === 'approved' || d.status === 'declined') ? d.status : 'pending';
  };
  const dayCount = r => (okDate(r.from) && okDate(r.to) && r.to >= r.from) ? U.daysBetween(r.from, r.to) + 1 : 0;
  const rangeText = r => {
    if (!okDate(r.from) || !okDate(r.to)) return '';
    return r.from === r.to ? U.fmtDate(r.from) : U.fmtDate(r.from) + ' to ' + U.fmtDate(r.to);
  };
  const dayText = n => n === 1 ? '1 day' : n + ' days';

  /* every request with no decision yet, across every leave document, soonest first */
  function pending(ctx) {
    const out = [];
    const leave = collMap(ctx, 'leave');
    for (const uid of Object.keys(leave)) {
      for (const req of reqsOf(ctx, uid)) if (statusOf(ctx, uid, req.id) === 'pending') out.push({uid, req});
    }
    out.sort((a, b) => String(a.req.from || '').localeCompare(String(b.req.from || '')) || (a.req.at || 0) - (b.req.at || 0));
    return out;
  }

  /* names resolved inside this module. M.useProfiles re-renders only the component whose fetch filled
     the shared cache, so a UI.Name next to a UI.Avatar for the same id can keep its fallback until the
     next tree render. This hook holds its own copy and always re-renders once the fetch settles. */
  function useNames(ctx, ids) {
    const key = (ids || []).filter(Boolean).sort().join(',');
    const [ps, setPs] = useState({});
    React.useEffect(() => {
      const user = ctx && ctx.user;
      if (!user || !key || typeof user.profiles !== 'function') return undefined;
      let live = true;
      Promise.resolve().then(() => user.profiles(key.split(','))).then(r => { if (live && r) setPs(r); }).catch(() => {});
      return () => { live = false; };
    }, [ctx && ctx.user, key]);
    return ps;
  }

  /* ---------- small parts ---------- */
  const TypePill = ({t}) => html`<${UI.Pill}>${(TYPE_LABEL[t] || 'Other').toLowerCase()}<//>`;
  const StatusPill = ({s}) => html`<${UI.Pill} kind=${STATUS_KIND[s] || 'flame-o'}>${s}<//>`;
  const ReqLine = ({req, tail}) => {
    const n = dayCount(req);
    return html`<div class="sub small num">${rangeText(req)}${n ? ' · ' + dayText(n) : ''}${tail ? ' · ' + tail : ''}</div>`;
  };

  /* ---------- founder: pending requests with Approve and Decline inline ---------- */
  function LeaveApprovals() {
    const ctx = M.useCtx();
    const [busy, setBusy] = useState(null);
    const list = ctx && ctx.isFounder ? pending(ctx) : [];
    const names = useNames(ctx, list.map(x => x.uid));
    if (!ctx || !ctx.isFounder) return null;
    const nameOf = uid => (names[uid] && names[uid].name) || 'Someone';
    const decide = (uid, id, status) => {
      setBusy(id);
      ctx.W.merge('leavedec/' + uid, {d: {[id]: {status, at: Date.now()}}})
        .then(() => M.toast(status === 'approved' ? 'Approved' : 'Declined'))
        .catch(() => {})
        .then(() => setBusy(null));
    };
    return html`<${UI.Card} title="Approvals" id="leave-approvals"
        action=${list.length ? html`<${UI.Pill} kind="flame-o">${list.length} pending<//>` : null}>
      ${list.length ? list.map(({uid, req}) => html`<div class="listrow" key=${uid + ':' + req.id}>
        <div class="row between grow">
          <div class="row nowrap">
            <${UI.Avatar} id=${uid} size=${32}/>
            <div>
              <div class="row"><b>${nameOf(uid)}</b><${TypePill} t=${req.type}/></div>
              <${ReqLine} req=${req} tail=${req.at ? 'asked ' + U.timeAgo(req.at) : ''}/>
            </div>
          </div>
          <div class="row nowrap">
            <${UI.Btn} sm disabled=${busy === req.id} onClick=${() => decide(uid, req.id, 'approved')}>Approve<//>
            <${UI.Btn} kind="sec" sm disabled=${busy === req.id} onClick=${() => decide(uid, req.id, 'declined')}>Decline<//>
          </div>
        </div>
      </div>`) : html`<${UI.Empty} text="No leave requests waiting."/>`}
    <//>`;
  }

  /* ---------- page ---------- */
  function Leave() {
    const ctx = M.useCtx();
    const [from, setFrom] = useState('');
    const [to, setTo] = useState('');
    const [type, setType] = useState('casual');
    const [busy, setBusy] = useState(false);
    const uid = ctx.uid;
    const today = U.todayStr();
    const member = ctx.member;
    const probation = member && okDate(member.probationEnd) && member.probationEnd > today ? member.probationEnd : null;
    const mine = reqsOf(ctx, uid).slice().sort((a, b) => (b.at || 0) - (a.at || 0));
    const canSend = okDate(from) && okDate(to) && to >= from && !busy;

    /* the to date follows the from date until the person picks a later one */
    const onFrom = v => {
      setFrom(v);
      if (!okDate(to) || (okDate(v) && to < v)) setTo(v);
    };
    const send = () => {
      if (!canSend) return;
      setBusy(true);
      const req = {id: U.uid(), from, to, type, at: Date.now()};
      const reqs = [req, ...U.clone(reqsOf(ctx, uid))].slice(0, KEEP);
      ctx.W.merge('leave/' + uid, {reqs})
        .then(() => { M.toast('Requested'); setFrom(''); setTo(''); setType('casual'); })
        .catch(() => {})
        .then(() => setBusy(false));
    };
    const withdraw = id => {
      const reqs = U.clone(reqsOf(ctx, uid)).filter(r => r.id !== id);
      ctx.W.merge('leave/' + uid, {reqs}).then(() => M.toast('Withdrawn')).catch(() => {});
    };

    const Approvals = M.parts.LeaveApprovals;
    return html`<${React.Fragment}>
      <${UI.PageHead} micro="team" title="Leave"/>
      ${ctx.isFounder && Approvals ? html`<${Approvals}/>` : null}
      <div class="grid2">
        <${UI.Card} title="Request leave" id="leave-request">
          ${probation ? html`<div class="row nowrap small" style=${{alignItems: 'flex-start', marginBottom: '12px'}}>
            <span class="dotflame" style=${{marginTop: '7px'}}/>
            <span>You're in probation until ${U.fmtDate(probation)}. Leave in probation is loss of pay.</span>
          </div>` : null}
          <div class="stack">
            <div class="grid2">
              <${UI.Input} id="leave-from" label="from" type="date" value=${from} onChange=${onFrom}/>
              <${UI.Input} id="leave-to" label="to" type="date" value=${to} min=${okDate(from) ? from : undefined} onChange=${setTo}/>
            </div>
            <${UI.Select} id="leave-type" label="type" value=${type} onChange=${setType} options=${TYPES}/>
            <div class="row">
              <${UI.Btn} disabled=${!canSend} onClick=${send}>Request leave<//>
            </div>
            <div class="sub small">Details go to Kaavish directly.</div>
          </div>
        <//>
        <${UI.Card} title="Your requests" id="leave-mine">
          ${mine.length ? mine.map(r => {
            const s = statusOf(ctx, uid, r.id);
            const d = decOf(ctx, uid)[r.id];
            const tail = s === 'pending' ? (r.at ? 'asked ' + U.timeAgo(r.at) : '')
              : (d && d.at ? 'decided ' + U.fmtDate(U.ymd(new Date(d.at))) : '');
            return html`<div class="listrow" key=${r.id}>
              <div class="row between grow">
                <div>
                  <div class="row"><span class="num">${rangeText(r)}</span><${TypePill} t=${r.type}/><${StatusPill} s=${s}/></div>
                  <div class="sub small">${dayText(dayCount(r))}${tail ? ' · ' + tail : ''}</div>
                </div>
                ${s === 'pending' ? html`<${UI.ConfirmBtn} onConfirm=${() => withdraw(r.id)}>Withdraw<//>` : null}
              </div>
            </div>`;
          }) : html`<${UI.Empty} text="No requests yet."/>`}
        <//>
      </div>
    <//>`;
  }

  M.pages.Leave = Leave;
  M.parts.LeaveApprovals = LeaveApprovals;
  M.leave = {pending, TYPES, okDate, dayCount, rangeText};
})();

/* module: home. Every person's own dashboard. The dark hero carries the greeting and the one
   thing to do right now; below it, focus, the AI brief, numbers and the crew. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo} = React;

  const SPARK = '✦';
  const MOODS = [{v: 1, t: 'drained'}, {v: 2, t: 'low'}, {v: 3, t: 'okay'}, {v: 4, t: 'good'}, {v: 5, t: 'on fire'}];
  const STATUSES = ['Deep work', 'On a shoot', 'In a meeting', 'Travelling', 'At lunch', 'Free to chat', 'Under the weather'];
  const PLACES = [{v: 'Office', mode: 'office'}, {v: 'Client site', mode: 'office'}, {v: 'Home', mode: 'wfh'}, {v: 'Travelling', mode: 'wfh'}];

  /* consecutive working days, back from today, where `has(date)` holds */
  function streak(ctx, uid, has) {
    let d = new Date(), n = 0, guard = 0;
    if (!has(U.ymd(d))) d = U.addDays(d, -1);
    while (guard++ < 90) {
      const s = U.ymd(d);
      if (ctx.isWorkingDay(s, uid)) { if (has(s)) n++; else break; }
      d = U.addDays(d, -1);
    }
    return n;
  }
  function todayStatus(ctx, uid) {
    const s = ((ctx.coll.me.map[uid] || {}).status) || null;
    return s && s.at && s.text && U.ymd(new Date(s.at)) === U.todayStr() ? s : null;
  }
  function level(ctx, uid) {
    const q = U.periodRange('quarter');
    const pts = (M.points && M.points.pointsFor) ? M.points.pointsFor(ctx, uid, q.from, q.to) : {total: 0, badges: []};
    return {pts, lvl: 1 + Math.floor(Math.max(0, pts.total) / 60)};
  }
  M.home = {streak, status: todayStatus, level};

  /* ---------- status ---------- */
  function StatusPicker({onClose}) {
    const ctx = M.useCtx();
    const set = t => ctx.W.merge('me/' + ctx.uid, {status: t ? {text: t, at: Date.now()} : null})
      .then(() => { M.toast(t ? 'Status set' : 'Status cleared'); onClose(); });
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Set your status">
      <div class="stack tight">
        ${STATUSES.map(s => html`<button key=${s} type="button" class="focus rowbtn" onClick=${() => set(s)}>
          <span class="dotflame"/><span class="grow" style=${{fontWeight: 500}}>${s}</span></button>`)}
      </div>
      <div class="row"><${UI.Btn} kind="sec" sm=${true} onClick=${() => set(null)}>Clear status<//></div>
      <div class="hint">Your status shows next to your name until the end of today.</div>
    <//>`;
  }

  /* ---------- the one thing to do right now ---------- */
  function TapIn() {
    const ctx = M.useCtx();
    const [mode, setMode] = useState('office');
    const [mood, setMood] = useState(0);
    const [busy, setBusy] = useState(false);
    const [pick, setPick] = useState(false);
    const cap = Number(ctx.settings.wfhCap) || 0;
    const used = (M.att && M.att.wfhUsed) ? M.att.wfhUsed(ctx, ctx.uid, new Date()) : 0;
    const wfhFull = used >= cap;

    async function save(loc, m) {
      const days = U.clone((ctx.coll.checkin.map[ctx.uid] || {}).days || {});
      const entry = {in: Date.now(), out: null, mode: m, loc, outLoc: null};
      if (mood) entry.mood = mood;
      days[U.todayStr()] = entry;
      await ctx.W.merge('checkin/' + ctx.uid, {days: U.pruneDays(days)});
      M.burst(document.getElementById('tapin'));
      M.toast('Checked in at ' + U.hhmm(entry.in));
    }
    async function tap() {
      setBusy(true);
      const pos = await M.getLoc();
      if (!pos) { setBusy(false); setPick(true); return; }
      await save(M.att.locFrom(pos, ctx.settings.office), mode).catch(() => {});
      setBusy(false);
    }
    async function manual(p) {
      setBusy(true);
      await save({lat: null, lng: null, acc: null, dist: null, verified: false, place: p.v, src: 'self'}, mode).catch(() => {});
      setBusy(false); setPick(false);
    }
    return html`<div class="stack" id="tapin" style=${{gap: '14px'}}>
      <div class="row between">
        <div style=${{fontWeight: 500}}>Start is ${ctx.startFor(ctx.uid)}. How's today?</div>
        <${UI.Seg} options=${[{v: 'office', label: 'Office'}, {v: 'wfh', label: 'WFH'}]} value=${mode} ariaLabel="Where"
          onChange=${v => { if (v === 'wfh' && wfhFull) { M.toast('WFH days used up this week', true); return; } setMode(v); }}/>
      </div>
      <div class="moods">${MOODS.map(m => html`<button key=${m.v} type="button" class=${'mood' + (mood === m.v ? ' on' : '')}
        aria-pressed=${mood === m.v} onClick=${() => setMood(mood === m.v ? 0 : m.v)}>${m.t}</button>`)}</div>
      ${pick ? html`<div>
        <div style=${{fontWeight: 500, marginBottom: '8px'}}>Where are you checking in from?</div>
        <div class="row">${PLACES.map(p => html`<button key=${p.v} type="button" class="btn on-dark sec sm" disabled=${busy} onClick=${() => manual(p)}>${p.v}</button>`)}</div>
      </div>` : html`<div><button type="button" class="btn xl on-dark" disabled=${busy} onClick=${tap}>
        ${busy ? 'Checking in' : (mode === 'wfh' ? 'Check in, WFH' : 'Check in, office')}</button></div>`}
      <div class="tiny" style=${{color: 'rgba(255,255,255,.6)'}}>WFH days used this week: ${used} of ${cap}. Checking in records the time and your location at that moment. Kaavish can see both.</div>
    </div>`;
  }

  function InNow() {
    const ctx = M.useCtx();
    const a = M.att.dayStatus(ctx, ctx.uid, U.todayStr());
    const [busy, setBusy] = useState(false);
    async function out() {
      setBusy(true);
      const pos = await M.getLoc();
      const days = U.clone((ctx.coll.checkin.map[ctx.uid] || {}).days || {});
      const e = days[U.todayStr()] || {};
      e.out = Date.now(); e.outLoc = pos ? M.att.locFrom(pos, ctx.settings.office) : null;
      days[U.todayStr()] = e;
      await ctx.W.merge('checkin/' + ctx.uid, {days: U.pruneDays(days)}).catch(() => {});
      setBusy(false);
      M.sound.play('done');
      M.toast('Checked out. See you tomorrow');
    }
    return html`<div class="row between" style=${{alignItems: 'flex-end'}}>
      <div>
        <div class="display" style=${{fontSize: '26px'}}>${a.out ? 'Done for today' : 'In since ' + U.hhmm(a.in)}</div>
        <div class="small" style=${{color: 'rgba(255,255,255,.7)', marginTop: '6px'}}>
          ${a.out ? 'In ' + U.hhmm(a.in) + ', out ' + U.hhmm(a.out) + ', ' + U.durText(a.out - a.in) + '. ' : ''}${a.status === 'wfh' ? 'WFH' : 'Office'}, ${(a.place || 'no location').replace(/\.$/, '')}${a.verified ? ', verified' : ''}.
          ${a.late ? html` <span class="flame-t">Late.</span>` : null}

      ${a.out ? null : html`<button type="button" class="btn on-dark sec sm" disabled=${busy} onClick=${out}>Check out</button>`}

  /* ---------- hero ---------- */
  function Hero({onStatus}) {
    const ctx = M.useCtx();
    const now = new Date(ctx.now);
    const first = U.firstName(ctx.me.name) || 'there';
    const td = U.todayStr();
