      key: rule + ':' + u + (key ? ':' + key : '')
    });

    const members = Array.isArray(ctx.activeMembers) ? ctx.activeMembers : [];
    for (const m of members) {
      const u = m && m.uid;
      if (!u) continue;
      const joined = m.joined || '';
      /* a broken document for one person never blocks the others */
      const run = (id, fn) => { if (!on(id)) return; try { fn(); } catch (e) { console.warn('rules ' + id + ' skipped for ' + u, e); } };

      /* R01: a working day, past start plus grace, no check-in today */
      run('R01', () => {
        if (!isWD(today, u)) return;
        const startMin = U.minutes(startOf(u));
        const cut = startMin + grace;
        if (nowMin <= cut) return;
        const ci = dayOf(checkin, u, today);
        if (ci && ci.in) return;
        push('R01', u, nowMin - cut >= 120 ? 'high' : 'medium',
          'No check-in yet, ' + U.durText((nowMin - startMin) * 60000) + ' past ' + startOf(u));
      });

      /* R02: today's check-in landed after start plus grace */
      run('R02', () => {
        if (!isWD(today, u)) return;
        const ci = dayOf(checkin, u, today);
        if (!ci || !ci.in) return;
        const startMin = U.minutes(startOf(u));
        const inMin = minsOf(new Date(Number(ci.in)));
        if (inMin <= startMin + grace) return;
        push('R02', u, 'medium', 'Checked in ' + U.hhmm(Number(ci.in)) + ', ' + U.durText((inMin - startMin) * 60000) + ' late');
      });

      /* R03: an office check-in today with an unverified location */
      run('R03', () => {
        const ci = dayOf(checkin, u, today);
        if (!ci || !ci.in || ci.mode !== 'office') return;
        if (ci.loc && ci.loc.verified === true) return;
        push('R03', u, 'medium', 'Office check-in ' + U.hhmm(Number(ci.in)) + ', location unverified');
      });

      /* R04: past eodCut with no EOD today, or the previous working day has no EOD */
      run('R04', () => {
        const missing = [];
        const prev = prevWorkingDay(today, u, joined);
        if (prev && !hasEod(u, prev)) missing.push(U.fmtDay(prev));
        if (isWD(today, u) && nowMin > U.minutes(S.eodCut) && !hasEod(u, today)) missing.push('today');
        if (!missing.length) return;
        const what = missing.length === 1 && missing[0] === 'today' ? 'today' : 'for ' + missing.join(' or ');
        push('R04', u, 'medium', 'No EOD line ' + what + ', due by ' + S.eodCut);
      });

      /* R05: no plan this week, once Monday's cut has passed */
      run('R05', () => {
        if (dow === 0) return;
        if (dow === 1 && nowMin <= U.minutes(S.mondayCut)) return;
        const wk = U.isoWeek(now);
        const doc = plan[u];
        const p = doc && doc.weeks && doc.weeks[wk];
        const items = (p && Array.isArray(p.items)) ? p.items : [];
        if (items.some(i => i && String(i.text || '').trim())) return;
        /* a week with no working day so far for this person asks for no plan yet */
        const mon = U.mondayOf(now);
        let any = false;
        for (let i = 0; i < dow; i++) if (isWD(U.ymd(U.addDays(mon, i)), u)) any = true;
        if (!any) return;
        push('R05', u, 'medium', 'No outcomes for week ' + Number(wk.split('-W')[1]) + ' yet, due Monday by ' + S.mondayCut);
      });

      /* R06: WFH check-ins this week over the cap */
      run('R06', () => {
        const cap = Number(S.wfhCap);
        if (!(cap >= 0)) return;
        let n = 0;
        for (const d of U.weekDays(U.mondayOf(now))) {
          const ci = dayOf(checkin, u, d);
          if (ci && ci.in && ci.mode === 'wfh') n++;
        }
        if (n <= cap) return;
        push('R06', u, 'low', n + ' WFH check-ins this week, cap is ' + cap);
      });

      /* R07: open tasks past due, soonest due first */
      run('R07', () => {
        const list = (tasksBy[u] || []).filter(x => x.d.status !== 'done' && x.d.due && x.d.due < today)
          .sort((a, b) => (a.d.due < b.d.due ? -1 : a.d.due > b.d.due ? 1 : 0));
        for (const {id, d: t} of list) {
          const n = U.daysBetween(t.due, today);
          if (!(n > 0)) continue;
          push('R07', u, n > 3 ? 'high' : 'medium', trunc(t.title, 60) + ', ' + plural(n, 'day', 'days') + ' overdue', null, null, id);
        }
      });

      /* R08: reached review or done in the last 14 days with the 20% check unticked */
      run('R08', () => {
        for (const {id, d: t} of (tasksBy[u] || [])) {
          if (t.status !== 'review' && t.status !== 'done') continue;
          if (t.shown20) continue;
          const at = Number(t.doneAt || t.updated || t.created || 0);
          if (!at || at < nowMs - 14 * DAY) continue;
          push('R08', u, 'medium', trunc(t.title, 60) + ' reached ' + (t.status === 'done' ? 'done' : 'review') + ', 20% check unticked', null, null, id);
        }
      });

      /* R09: revisions at or above the cap, on open tasks and tasks done in the last 14 days */
      run('R09', () => {
        const cap = Number(S.revCap);
        if (!(cap > 0)) return;
        for (const {id, d: t} of (tasksBy[u] || [])) {
          const rev = Number(t.revisions) || 0;
          if (rev < cap) continue;
          if (t.status === 'done') {
            const at = Number(t.doneAt || t.updated || 0);
            if (!at || at < nowMs - 14 * DAY) continue;
          }
          push('R09', u, 'medium', trunc(t.title, 60) + ', ' + plural(rev, 'revision', 'revisions') + ', cap is ' + cap, null, null, id);
        }
      });

      /* R10: a blocker line on blockerDays working days in a row, ending today or the last working day */
      run('R10', () => {
        const need = Number(S.blockerDays);
        if (!(need > 0)) return;
        const end = (isWD(today, u) && hasEod(u, today)) ? today : prevWorkingDay(today, u, joined);
        if (!end) return;
        let n = 0, d = U.parseYmd(end);
        for (let guard = 0; guard < 60; guard++) {
          const s = U.ymd(d);
          if (isWD(s, u)) {
            if (!blockedOn(u, s)) break;
            n++;
          }
          d = U.addDays(d, -1);
        }
        if (n < need) return;
        push('R10', u, 'high', 'Blocker reported ' + plural(n, 'working day', 'working days') + ' in a row: ' + trunc(blockedOn(u, end), 80));
      });

      /* R11: a section updated more than ackHours ago with no read since */
      run('R11', () => {
        const reads = (acks[u] && acks[u].s) || {};
        for (const s of sections) {
          const upd = Number(s.doc.updated);
          if (!(upd < nowMs - ackMs)) continue;
          if (Number(reads[s.id] || 0) >= upd) continue;
          push('R11', u, 'low', 'Unread: ' + trunc(s.doc.title || s.id, 60) + ', updated ' + agoText(upd, nowMs), s.id, '#handbook/' + s.id, s.id);
        }
      });

      /* R12: missed outcomes in weeks whose Monday falls within the last 30 days */
      run('R12', () => {
        const weeks = (review[u] && review[u].weeks) || {};
        let n = 0;
        for (const wk of Object.keys(weeks)) {
          if (!/^\d{4}-W\d{1,2}$/.test(wk)) continue;
          const mon = U.mondayOfWeekId(wk);
          if (isNaN(mon.getTime())) continue;
          const my = U.ymd(mon);
          if (my < back30 || my > today) continue;
          const marks = (weeks[wk] && weeks[wk].marks) || {};
          for (const k of Object.keys(marks)) if (marks[k] === 'miss') n++;
        }
        if (n < 1) return;
        const step = n >= 3 ? 'Exit' : n === 2 ? 'A formal warning' : 'A written note';
        push('R12', u, n >= 2 ? 'high' : 'medium', plural(n, 'missed outcome', 'missed outcomes') + ' in 30 days. ' + step, null, '#people/' + u);
      });

      /* R13: a pitch with its next step date in the past, still in play */
      run('R13', () => {
        const list = (pitchesBy[u] || []).filter(x => {
          const st = String(x.d.stage || '').toLowerCase();
          return st !== 'won' && st !== 'lost' && x.d.nextDate && x.d.nextDate < today;
        }).sort((a, b) => (a.d.nextDate < b.d.nextDate ? -1 : 1));
        for (const {id, d: p} of list) {
          const n = U.daysBetween(p.nextDate, today);
          if (!(n > 0)) continue;
          push('R13', u, 'medium', trunc(p.brand || 'Pitch', 50) + ', next step due ' + U.fmtDay(p.nextDate) + ', ' + plural(n, 'day', 'days') + ' overdue', null, null, id);
        }
      });

      /* R14: a project off track, or due within 3 days with progress under 70% */
      run('R14', () => {
        for (const {id, d: p} of (projectsBy[u] || [])) {
          if (p.archived || p.status === 'done') continue;
          const pr = progress[id] || {done: 0, total: 0};
          const pct = U.pct(pr.done, pr.total);
          let text = null;
          if (p.status === 'off') text = trunc(p.name || 'Project', 50) + ' is off track, ' + pct + '% done';
          else if (p.due && U.daysBetween(today, p.due) <= 3 && pct < 70) text = trunc(p.name || 'Project', 50) + ', due ' + U.fmtDay(p.due) + ', ' + pct + '% done';
          if (!text) continue;
          push('R14', u, 'medium', text, null, '#projects/' + id, id);
        }
      });

      /* R15: a live client with an empty brain field, or untouched for 60 days */
      run('R15', () => {
        for (const {id, d: c} of (clientsBy[u] || [])) {
          if (c.status !== 'live') continue;
          const empty = [];
          if (!String(c.memory || '').trim()) empty.push('memory');
          if (!String(c.approvals || '').trim()) empty.push('approvals');
          if (!String(c.never || '').trim()) empty.push('lines never to cross');
          const upd = Number(c.updated) || 0;
          const stale = upd > 0 && upd < nowMs - 60 * DAY;
          if (!empty.length && !stale) continue;
          const parts = [];
          if (empty.length) parts.push(joinList(empty) + (empty.length === 1 ? ' is empty' : ' are empty'));
          if (stale) parts.push('last updated ' + Math.floor((nowMs - upd) / DAY) + ' days ago');
          push('R15', u, 'low', trunc(c.name || 'Client', 50) + ': ' + parts.join(', '), null, null, id);
        }
      });

      /* R16: an evaluation still missing after the candidate deadline.
         Another evaluator's document is hidden from a member, so a member computes this for themselves only. */
      run('R16', () => {
        if (!(ctx.isFounder || u === ctx.uid)) return;
        const mine = (evals[u] && evals[u].e) || {};
        for (const id of candidateIds) {
          const c = candidates[id];
          if (!c || !Array.isArray(c.evaluators) || c.evaluators.indexOf(u) < 0) continue;
          if (c.decision || c.stage === 'hired' || c.stage === 'rejected') continue;
          if (!c.deadline || c.deadline >= today) continue;
          if (mine[id]) continue;
          push('R16', u, 'medium', trunc(c.name || 'Candidate', 50) + ', evaluation was due ' + U.fmtDay(c.deadline), null, null, id);
        }
      });
    }
    return out;
  }

  M.rules = {evaluate, NAMES, SECTION_RULES, name, TEMPLATES, SECTION_OF, RULE_IDS: Object.keys(TEMPLATES)};
})();

/* ==== 06-points.js ==== */
/* module: points. Points, scorecard, ladder and leaderboard (BRIEF sections 9 and 7.12).
   Pure functions only. Nothing here renders and nothing here writes. Every number is
   derived from ctx.coll at call time; nothing is stored. */
'use strict';
(function () {
  const {U} = M;

  /* every weight key from settings.points, in breakdown order */
  const KEYS = ['checkinOnTime', 'eod', 'planOnTime', 'planLate', 'outcomeHit', 'outcomeMiss',
    'taskOnTime', 'taskLate', 'revision', 'shown20', 'qualityMult', 'kudos', 'rockDone', 'overdueOpen'];
  const OUTPUT_KEYS = ['outcomeHit', 'outcomeMiss', 'taskOnTime', 'taskLate', 'revision', 'shown20',
    'qualityMult', 'kudos', 'rockDone', 'overdueOpen'];
  const DISCIPLINE_KEYS = ['checkinOnTime', 'eod', 'planOnTime', 'planLate'];
  const KUDOS_WEEK_CAP = 5;
  const EOD_NEXT_DAY_CUT = '10:00';

  /* ---------- small helpers ---------- */
  const isNum = x => typeof x === 'number' && isFinite(x);
  const toDate = x => x instanceof Date ? x : (isNum(x) ? new Date(x) : (typeof x === 'string' && x ? U.parseYmd(x) : null));
  const nowDate = (ctx, now) => toDate(now) || new Date((ctx && isNum(ctx.now)) ? ctx.now : Date.now());
  const ymdOf = ts => U.ymd(new Date(ts));
  /* epoch ms of "HH:MM" on a local date */
  const cutMs = (ymd, hhmm) => U.parseYmd(ymd).getTime() + U.minutes(hhmm) * 60000;
  const inRange = (ymd, from, to) => !!ymd && ymd >= from && ymd <= to;
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const docOf = (ctx, name, uid) => collMap(ctx, name)[uid] || {};
  const weightsOf = ctx => ({...M.POINTS_DEFAULTS, ...(((ctx && ctx.settings) || {}).points || {})});
  const settingOf = (ctx, key) => {
    const s = (ctx && ctx.settings) || {};
    return s[key] != null ? s[key] : M.SETTINGS_DEFAULTS[key];
  };
  const zeroMap = () => { const o = {}; KEYS.forEach(k => { o[k] = 0; }); return o; };

  /* Mondays (as Date) whose ymd falls inside [from, to] */
  function mondaysIn(from, to) {
    const out = [];
    if (!from || !to || from > to) return out;
    let d = U.mondayOf(U.parseYmd(from));
    if (U.ymd(d) < from) d = U.addDays(d, 7);
    let guard = 0;
    while (U.ymd(d) <= to && guard++ < 120) { out.push(d); d = U.addDays(d, 7); }
    return out;
  }

  /* working days for uid from `from` up to `to` (both inclusive) */
  function workingDays(ctx, uid, from, to) {
    const out = [];
    if (!from || !to || from > to) return out;
    const isWorking = (ctx && typeof ctx.isWorkingDay === 'function') ? ctx.isWorkingDay : (d => U.parseYmd(d).getDay() !== 0);
    let d = U.parseYmd(from);
    let guard = 0;
    while (U.ymd(d) <= to && guard++ < 400) {
      const s = U.ymd(d);
      if (isWorking(s, uid)) out.push(s);
      d = U.addDays(d, 1);
    }
    return out;
  }

  /* tasks owned by uid, as [{id, ...task}] */
  function ownedTasks(ctx, uid) {
    const map = collMap(ctx, 'tasks');
    const out = [];
    for (const id of Object.keys(map)) {
      const t = map[id];
      if (t && t.owner === uid) out.push({id, ...t});
    }
    return out;
  }
  const isDone = t => t.status === 'done';
  const doneYmd = t => isNum(t.doneAt) ? ymdOf(t.doneAt) : null;
  /* a done task is on time when it has no due date, or its done day is on or before the due day */
  const doneOnTime = t => !t.due || !doneYmd(t) || doneYmd(t) <= t.due;

  /* quarters fully covered by [from, to], as quarter ids */
  function wholeQuartersIn(from, to) {
    const out = [];
    if (!from || !to || from > to) return out;
    let d = U.parseYmd(from);
    let guard = 0;
    while (U.ymd(d) <= to && guard++ < 40) {
      const qStart = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
      const qEnd = new Date(qStart.getFullYear(), qStart.getMonth() + 3, 0);
      if (U.ymd(qStart) >= from && U.ymd(qEnd) <= to) out.push(U.quarterId(qStart));
      d = new Date(qStart.getFullYear(), qStart.getMonth() + 3, 1);
    }
    return out;
  }

  /* ---------- pointsFor ---------- */
  /* {total, output, discipline, parts, counts, badges}. parts[key] = weights[key] * counts[key] for every
     weight key. counts.qualityMult is the sum of weekly quality scores in range. */
  function pointsFor(ctx, uid, fromYmd, toYmd) {
    const w = weightsOf(ctx);
    const counts = zeroMap();
    const parts = zeroMap();
    const badges = [];
    const from = String(fromYmd || '');
    const to = String(toYmd || '');
    const finish = () => {
      KEYS.forEach(k => { parts[k] = (Number(w[k]) || 0) * counts[k]; });
      const sum = keys => keys.reduce((n, k) => n + parts[k], 0);
      const output = sum(OUTPUT_KEYS);
      const discipline = sum(DISCIPLINE_KEYS);
      return {total: output + discipline, output, discipline, parts, counts, badges};
    };
    if (!ctx || !uid || !from || !to || from > to) return finish();

    const today = U.ymd(nowDate(ctx));
    const end = to < today ? to : today;           /* never beyond today */
    const grace = Number(settingOf(ctx, 'grace')) || 0;
    const mondayCut = settingOf(ctx, 'mondayCut') || '12:00';
    const start = (typeof ctx.startFor === 'function' && ctx.startFor(uid)) || settingOf(ctx, 'start') || '10:30';

    /* discipline: check-ins and EOD lines per working day, up to today */
    const days = workingDays(ctx, uid, from, end);
    const checkDays = docOf(ctx, 'checkin', uid).days || {};
    const eodDays = docOf(ctx, 'eod', uid).days || {};
    let eodExists = 0;
    for (const d of days) {
      const c = checkDays[d];
      if (c && isNum(c.in) && c.in <= cutMs(d, start) + grace * 60000) counts.checkinOnTime++;
      const e = eodDays[d];
      if (e) {
        eodExists++;
        if (isNum(e.at) && e.at < cutMs(U.ymd(U.addDays(U.parseYmd(d), 1)), EOD_NEXT_DAY_CUT)) counts.eod++;
      }
    }
    if (days.length > 0 && eodExists === days.length) badges.push('Every EOD');

    /* per ISO week whose Monday is in range: plan timing, outcome marks, quality */
    const planWeeks = docOf(ctx, 'plan', uid).weeks || {};
    const reviewWeeks = docOf(ctx, 'review', uid).weeks || {};
    let marks = 0;
    for (const mon of mondaysIn(from, to)) {
      const wk = U.isoWeek(mon);
      const p = planWeeks[wk];
      if (p && isNum(p.at)) {
        if (p.at <= cutMs(U.ymd(mon), mondayCut)) counts.planOnTime++;
        else counts.planLate++;
      }
      const r = reviewWeeks[wk];
      if (r) {
        for (const v of Object.values(r.marks || {})) {
          if (v === 'hit') { counts.outcomeHit++; marks++; }
          else if (v === 'miss') { counts.outcomeMiss++; marks++; }
        }
        if (isNum(r.quality)) counts.qualityMult += r.quality;
      }
    }
    if (marks > 0 && counts.outcomeMiss === 0) badges.push('Clean sweep');

    /* tasks owned: done in range, revisions on those, 20% shown, open overdue at the end */
    let dueInRangeDone = 0, dueInRangeLate = 0;
    for (const t of ownedTasks(ctx, uid)) {
      const done = isDone(t);
      const dy = doneYmd(t);
      if (done && inRange(dy, from, to)) {
        if (doneOnTime(t)) counts.taskOnTime++; else counts.taskLate++;
        counts.revision += Math.max(0, Math.round(Number(t.revisions) || 0));
      }
      if ((done || t.status === 'review') && t.shown20) {
        const ref = (done && isNum(t.doneAt)) ? t.doneAt : (isNum(t.updated) ? t.updated : t.created);
        if (isNum(ref) && inRange(ymdOf(ref), from, to)) counts.shown20++;
      }
      if (!done && t.due && t.due < end) counts.overdueOpen++;
      if (done && inRange(t.due, from, to)) {
        dueInRangeDone++;
        if (!doneOnTime(t)) dueInRangeLate++;
      }
    }
    if (dueInRangeDone > 0 && dueInRangeLate === 0) badges.push('On time');

    /* kudos received, 5 counted per ISO week at most */
    const perWeek = {};
    const kudosMap = collMap(ctx, 'kudos');
    for (const giver of Object.keys(kudosMap)) {
      for (const k of ((kudosMap[giver] || {}).given || [])) {
        if (!k || k.to !== uid || !isNum(k.at)) continue;
        if (!inRange(ymdOf(k.at), from, to)) continue;
        const wk = U.isoWeek(new Date(k.at));
        perWeek[wk] = (perWeek[wk] || 0) + 1;
      }
    }
    for (const wk of Object.keys(perWeek)) counts.kudos += Math.min(KUDOS_WEEK_CAP, perWeek[wk]);

    /* rocks marked done, only when the range covers a whole quarter */
    const rockQ = docOf(ctx, 'rocks', uid).q || {};
    for (const qid of wholeQuartersIn(from, to)) {
      for (const r of (rockQ[qid] || [])) if (r && r.state === 'done') counts.rockDone++;
    }

    return finish();
  }

  /* ---------- scoreFor: one ISO week ---------- */
  /* {due, onTimePct, revPerTask, quality, hit, miss, planned, weekId}. The week runs Monday to Sunday. */
  function scoreFor(ctx, uid, mondayDate) {
    const d = toDate(mondayDate) || nowDate(ctx);
    const mon = U.mondayOf(d);
    const weekId = U.isoWeek(mon);
    const from = U.ymd(mon);
    const to = U.ymd(U.addDays(mon, 6));
    const out = {due: 0, onTimePct: null, revPerTask: null, quality: null, hit: 0, miss: 0, planned: 0, weekId};
    if (!ctx || !uid) return out;

    let dueOnTime = 0, doneN = 0, revs = 0;
    for (const t of ownedTasks(ctx, uid)) {
      if (inRange(t.due, from, to)) {
        out.due++;
        if (isDone(t) && doneOnTime(t)) dueOnTime++;
      }
      if (isDone(t) && inRange(doneYmd(t), from, to)) {
        doneN++;
        revs += Math.max(0, Math.round(Number(t.revisions) || 0));
      }
    }
    if (out.due > 0) out.onTimePct = U.pct(dueOnTime, out.due);
    if (doneN > 0) out.revPerTask = Math.round(100 * revs / doneN) / 100;

    const r = (docOf(ctx, 'review', uid).weeks || {})[weekId];
    if (r) {
      if (isNum(r.quality)) out.quality = r.quality;
      for (const v of Object.values(r.marks || {})) {
        if (v === 'hit') out.hit++;
        else if (v === 'miss') out.miss++;
      }
    }
    const p = (docOf(ctx, 'plan', uid).weeks || {})[weekId];
    out.planned = (p && Array.isArray(p.items)) ? p.items.length : 0;
    return out;
  }

  /* ---------- ladder: misses in weeks whose Monday falls within the last 30 days ---------- */
  function ladder(ctx, uid, now) {
    const today = U.ymd(nowDate(ctx, now));
    const cut = U.ymd(U.addDays(U.parseYmd(today), -30));
    let misses = 0;
    const weeks = (ctx && uid) ? (docOf(ctx, 'review', uid).weeks || {}) : {};
    for (const wk of Object.keys(weeks)) {
      if (!/^\d{4}-W\d{2}$/.test(wk)) continue;
      const mon = U.ymd(U.mondayOfWeekId(wk));
      if (mon < cut || mon > today) continue;
      for (const v of Object.values((weeks[wk] || {}).marks || {})) if (v === 'miss') misses++;
    }
    const level = misses >= 3 ? 'exit' : misses === 2 ? 'warning' : misses === 1 ? 'note' : 'clear';
    return {misses, level};
  }

  /* ---------- leaderboard ---------- */
  /* [{uid, total, output, discipline, badges, parts, counts}] ranked by total, then output.
     The founder is left out unless settings.leaderboardIncludesFounder. */
  function leaderboard(ctx, period, now) {
    if (!ctx) return [];
    const range = U.periodRange(period || 'week', nowDate(ctx, now));
    const withFounder = !!settingOf(ctx, 'leaderboardIncludesFounder');
    const members = Array.isArray(ctx.activeMembers) ? ctx.activeMembers : [];
    const rows = [];
    for (const m of members) {
      if (!m || !m.uid) continue;
      const founder = m.role === 'founder' || m.uid === ctx.founderUid;
      if (founder && !withFounder) continue;
      const p = pointsFor(ctx, m.uid, range.from, range.to);
      rows.push({uid: m.uid, total: p.total, output: p.output, discipline: p.discipline, badges: p.badges, parts: p.parts, counts: p.counts});
    }
    const order = {};
    members.forEach((m, i) => { if (m && m.uid) order[m.uid] = i; });
    rows.sort((a, b) => (b.total - a.total) || (b.output - a.output) || (order[a.uid] - order[b.uid]));
    return rows;
  }

  M.points = {pointsFor, scoreFor, ladder, leaderboard, KEYS, OUTPUT_KEYS, DISCIPLINE_KEYS};
})();

/* ==== 11-checkin.js ==== */
/* module: checkin */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useEffect, useRef} = React;

  const PLACES = ['Office', 'Client site', 'Home', 'Travelling'];
  const MODE_LABEL = {office: 'office', wfh: 'WFH'};
  const CONSENT = 'Checking in records the time and your location at that moment. Kaavish can see both.';
  const DEFAULT_RADIUS = 200;
  const MAX_ACC = 1000;

  /* ---------- pure helpers ---------- */
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const daysOf = (ctx, uid) => (collMap(ctx, 'checkin')[uid] || {}).days || {};
  const settingsOf = ctx => (ctx && ctx.settings) || {};

  /* epoch ms of start plus grace on the given date, for this person */
  function cutoffMs(ctx, uid, ymd) {
    const s = settingsOf(ctx);
    const start = (ctx && typeof ctx.startFor === 'function' && ctx.startFor(uid)) || s.start || '10:30';
    const grace = Number(s.grace) || 0;
    return U.parseYmd(ymd).getTime() + (U.minutes(start) + grace) * 60000;
  }

  /* a check-in is late when it lands after start plus grace on its own date */
  function isLate(ctx, uid, inMs) {
    if (!inMs) return false;
    return inMs > cutoffMs(ctx, uid, U.ymd(new Date(inMs)));
  }

  /* one day of attendance for one person, with the special day precedence applied */
  function dayStatus(ctx, uid, ymd) {
    const entry = daysOf(ctx, uid)[ymd] || null;
    const mode = entry && (entry.mode === 'office' || entry.mode === 'wfh') ? entry.mode : null;
    let status = 'none';
    if (ctx && typeof ctx.onLeave === 'function' && ctx.onLeave(uid, ymd)) status = 'leave';
    else if (ctx && ctx.holidays && typeof ctx.holidays.has === 'function' && ctx.holidays.has(ymd)) status = 'holiday';
    else if (U.parseYmd(ymd).getDay() === 0) status = 'sunday';
    else if (mode) status = mode;
    const inMs = entry && entry.in ? entry.in : null;
    const out = entry && entry.out ? entry.out : null;
    const loc = (entry && entry.loc) || null;
    const outLoc = (entry && entry.outLoc) || null;
    const working = status === 'office' || status === 'wfh';
    return {
      status,
      in: inMs,
      out,
      late: working && isLate(ctx, uid, inMs),
      verified: !!(loc && loc.verified),
      place: (loc && loc.place) || '',
      loc,
      outLoc,
      hours: inMs && out ? Math.max(0, out - inMs) : null,
      entry
    };
  }

  /* WFH check-ins Monday to Saturday of the week that holds mondayDate */
  function wfhUsed(ctx, uid, mondayDate) {
    const days = daysOf(ctx, uid);
    const mon = U.mondayOf(mondayDate || new Date());
    return U.weekDays(mon).filter(d => days[d] && days[d].mode === 'wfh').length;
  }

  /* metres to a short distance: '640 m away' or '3.4 km away' */
  function distText(m) {
    const r = Math.round(m);
    return r < 1000 ? r + ' m away' : (m / 1000).toFixed(1) + ' km away';
  }

  /* a Loc from a gps fix, judged against the office when one is set */
  function locFrom(pos, office) {
    const hasOffice = !!(office && isFinite(office.lat) && isFinite(office.lng));
    const dist = hasOffice ? U.haversine(pos, office) : null;
    const verified = hasOffice && dist <= (Number(office.radius) || DEFAULT_RADIUS) && pos.acc <= MAX_ACC;
    const place = verified ? (office.label || 'Office')
      : hasOffice ? 'Outside office, ' + distText(dist)
      : 'Location captured';
    return {lat: pos.lat, lng: pos.lng, acc: pos.acc, dist: dist == null ? null : Math.round(dist), verified, place, src: 'gps'};
  }

  const selfLoc = place => ({lat: null, lng: null, acc: null, dist: null, verified: false, place, src: 'self'});

  /* the sentence after the time: 'Verified at Mumbai office.' or 'Outside office, 3.4 km away.' */
  function placeText(loc) {
    if (!loc) return 'No location.';
    if (loc.verified) return 'Verified at ' + (loc.place || 'the office') + '.';
    if (loc.src === 'self') return (loc.place || 'Somewhere') + ', self reported.';
    return (loc.place || 'Location captured') + '.';
  }

  const modeLabel = mode => MODE_LABEL[mode] || String(mode || '');

  /* ---------- the card ---------- */
  function CheckinCard() {
    const ctx = M.useCtx();
    const ctxRef = useRef(ctx);
    ctxRef.current = ctx;
    const live = useRef(true);
    useEffect(() => () => { live.current = false; }, []);
    const [busy, setBusy] = useState(false);
    const [pick, setPick] = useState(null);
    if (!ctx || !ctx.uid) return null;

    const uid = ctx.uid;
    const today = U.todayStr();
    const ds = dayStatus(ctx, uid, today);
    const cap = Number(ctx.settings.wfhCap) || 0;
    const used = wfhUsed(ctx, uid, new Date());
    const atCap = used >= cap;

    const done = () => { if (live.current) setBusy(false); };
    const writeDay = (entry, msg) => {
      const c = ctxRef.current;
      const days = U.pruneDays({...U.clone(daysOf(c, uid)), [today]: entry});
      return c.W.merge('checkin/' + uid, {days}).then(() => M.toast(msg)).catch(() => {});
    };
    const checkIn = mode => {
      if (busy) return;
      setBusy(true);
      M.getLoc().then(pos => {
        if (!live.current) return;
        if (!pos) { setPick(mode); done(); return; }
        const loc = locFrom(pos, ctxRef.current.settings.office);
        return writeDay({in: Date.now(), out: null, mode, loc, outLoc: null}, 'Checked in').then(done);
      });
    };
    const pickPlace = place => {
      if (busy || !pick) return;
      setBusy(true);
      writeDay({in: Date.now(), out: null, mode: pick, loc: selfLoc(place), outLoc: null}, 'Checked in')
        .then(() => { if (live.current) setPick(null); done(); });
    };
    const checkOut = () => {
      if (busy) return;
      const current = daysOf(ctxRef.current, uid)[today];
      if (!current || !current.in) return;
      setBusy(true);
      M.getLoc().then(pos => {
        if (!live.current) return;
        const outLoc = pos ? locFrom(pos, ctxRef.current.settings.office) : null;
        const entry = {...U.clone(current), out: Date.now(), outLoc};
        return writeDay(entry, 'Checked out').then(done);
      });
    };

    const consent = html`<div class="sub small">${CONSENT}</div>`;
    const finding = busy ? html`<div class="sub small">Finding your location.</div>` : null;
    const latePill = ds.late ? html`<${UI.Pill} kind="flame">late<//>` : null;

    let body;
    if (ds.status === 'leave') {
      body = html`<div>You're on approved leave today.</div>`;
    } else if (ds.status === 'holiday') {
      body = html`<div>Today is a holiday.</div>`;
    } else if (ds.status === 'sunday') {
      body = html`<div>Sunday. The OS rests too.</div>`;
    } else if (!ds.in) {
      body = html`<div class="stack">
        ${pick ? html`<div class="stack tight" id="checkin-picker">
          <div>Where are you checking in from?</div>
          <div class="row">
            ${PLACES.map(p => html`<${UI.Btn} key=${p} kind="sec" sm disabled=${busy} onClick=${() => pickPlace(p)}>${p}<//>`)}
            <${UI.Btn} kind="ghost" sm disabled=${busy} onClick=${() => setPick(null)}>Cancel<//>
          </div>
          <div class="sub small">Location could not be captured. The place you pick is saved as self reported.</div>
        </div>` : html`<div class="row">
          <${UI.Btn} disabled=${busy} onClick=${() => checkIn('office')}>Check in, office<//>
          <${UI.Btn} kind="sec" disabled=${busy || atCap} onClick=${() => checkIn('wfh')}>Check in, WFH<//>
        </div>`}
        <div class="sub small num">WFH days used this week: ${used} of ${cap}</div>
        ${finding}
        ${consent}
      </div>`;
    } else if (!ds.out) {
      body = html`<div class="stack">
        <div class="row">
          <span class="num">Checked in at ${U.hhmm(ds.in)}, ${modeLabel(ds.entry.mode)}. ${placeText(ds.loc)}</span>
          ${latePill}
        </div>
        <div class="row"><${UI.Btn} disabled=${busy} onClick=${checkOut}>Check out<//></div>
        ${finding}
        ${consent}
      </div>`;
    } else {
      body = html`<div class="stack">
        <div class="row">
          <span class="num">In ${U.hhmm(ds.in)}, out ${U.hhmm(ds.out)}, ${U.durText(ds.hours)}.</span>
          ${latePill}
        </div>
        <div class="sub small">${U.cap(modeLabel(ds.entry.mode))}. ${placeText(ds.loc)}</div>
        ${consent}
      </div>`;
    }

    return html`<${UI.Card} title="Check in" id="checkin-card">${body}<//>`;
  }

  M.parts.CheckinCard = CheckinCard;
  M.att = {dayStatus, isLate, wfhUsed, locFrom, placeText, distText, modeLabel, PLACES};
})();

/* ==== 12-eod.js ==== */
/* module: eod (EOD line and this week's outcomes) */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useEffect, useRef} = React;

  const OUTCOME_LINE = 'Three outcomes that will exist by Saturday.';
  const LOCK_LINE = 'Reviewed on Friday.';
  const DUE_LINE = 'Due at 19:00.';
  const DUE_HOUR = 18;
  const MAX_OUTCOMES = 3;
  const MARK_PILL = {hit: 'ink', miss: 'flame'};

  /* ---------- pure helpers ---------- */
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const eodDays = (ctx, uid) => (collMap(ctx, 'eod')[uid] || {}).days || {};
  const planWeeks = (ctx, uid) => (collMap(ctx, 'plan')[uid] || {}).weeks || {};
  const reviewWeek = (ctx, uid, weekId) => {
    const doc = collMap(ctx, 'review')[uid];
    return (doc && doc.weeks && doc.weeks[weekId]) || null;
  };
  const trim = s => String(s || '').trim();

  /* user text as text, one div per line so line breaks survive */
  function Lines({text, className, id}) {
    const parts = String(text || '').split('\n');
    return html`<div id=${id} class=${className}>
      ${parts.map((p, i) => html`<div key=${i}>${p || ' '}</div>`)}
    </div>`;
  }

  /* a mounted flag so a write that lands after unmount never sets state */
  function useLive() {
    const live = useRef(true);
    useEffect(() => () => { live.current = false; }, []);
    return live;
  }

  /* ---------- EOD line ---------- */
  function EodCard() {
    const ctx = M.useCtx();
    const ctxRef = useRef(ctx);
    ctxRef.current = ctx;
    const live = useLive();
    const [editing, setEditing] = useState(false);
    const [busy, setBusy] = useState(false);
    const [shipped, setShipped] = useState('');
    const [next, setNext] = useState('');
    const [blocked, setBlocked] = useState('');
    if (!ctx || !ctx.uid) return null;

    const uid = ctx.uid;
    const now = new Date(ctx.now || Date.now());
    const today = U.ymd(now);
    const entry = eodDays(ctx, uid)[today] || null;
    const working = typeof ctx.isWorkingDay === 'function' ? ctx.isWorkingDay(today, uid) : true;
    const due = !entry && working && now.getHours() >= DUE_HOUR;
    const showForm = !entry || editing;

    const startEdit = () => {
      setShipped(entry ? entry.shipped || '' : '');
      setNext(entry ? entry.next || '' : '');
      setBlocked(entry ? entry.blocked || '' : '');
      setEditing(true);
    };
    const post = () => {
      if (busy || !trim(shipped)) return;
      setBusy(true);
      const c = ctxRef.current;
      const days = U.clone(eodDays(c, uid));
      const old = days[today] || null;
      const at = old && old.at ? old.at : Date.now();
      days[today] = {shipped: trim(shipped), next: trim(next), blocked: trim(blocked), at, updated: Date.now()};
      c.W.merge('eod/' + uid, {days: U.pruneDays(days)})
        .then(() => { M.toast('Posted'); if (live.current) setEditing(false); })
        .catch(() => {})
        .then(() => { if (live.current) setBusy(false); });
    };

    let body;
    if (showForm) {
      body = html`<div class="stack">
        ${due ? html`<div class="flame-t small">${DUE_LINE}</div>` : null}
        <${UI.TextArea} id="eod-shipped" label="shipped" rows=${2} value=${shipped} onChange=${setShipped}
          placeholder="What went out today" hint="Required."/>
        <${UI.TextArea} id="eod-next" label="next" rows=${2} value=${next} onChange=${setNext}
          placeholder="What you pick up tomorrow"/>
        <${UI.TextArea} id="eod-blocked" label="blocked" rows=${2} value=${blocked} onChange=${setBlocked}
          placeholder="What is in the way, if anything"/>
        <div class="row">
          <${UI.Btn} disabled=${busy || !trim(shipped)} onClick=${post}>Post EOD line<//>
          ${entry ? html`<${UI.Btn} kind="ghost" disabled=${busy} onClick=${() => setEditing(false)}>Cancel<//>` : null}
        </div>
      </div>`;
    } else {
      const hasBlocker = !!trim(entry.blocked);
      body = html`<div class="stack">
        <div class="stack tight">
          <${UI.Micro} plain>shipped<//>
          <${Lines} id="eod-line-shipped" text=${entry.shipped}/>
        </div>
        <div class="stack tight">
          <${UI.Micro} plain>next<//>
          ${trim(entry.next) ? html`<${Lines} id="eod-line-next" text=${entry.next}/>`
            : html`<div id="eod-line-next" class="sub small">None.</div>`}
        </div>
        <div class="stack tight">
          <${UI.Micro} plain>blocked<//>
          ${hasBlocker ? html`<${Lines} id="eod-line-blocked" className="flame-t" text=${entry.blocked}/>`
            : html`<div id="eod-line-blocked" class="sub small">None.</div>`}
        </div>
        <div class="sub small num">Posted at ${U.hhmm(entry.at)}.</div>
      </div>`;
    }

    const Mic = M.parts.MicButton;
    const action = !showForm ? html`<${UI.Btn} kind="sec" sm onClick=${startEdit}>Edit<//>`
      : (Mic ? html`<${Mic} label="Say it" onText=${t => setShipped(x => (x ? x + ' ' : '') + t)}/>` : null);
    return html`<${UI.Card} title="EOD line" id="eod-card" flame=${due} action=${action}>${body}<//>`;
  }

  /* ---------- this week's outcomes ---------- */
  const emptyRow = () => ({id: null, text: '', orig: ''});
  const rowsFrom = items => {
    const rows = (items || []).slice(0, MAX_OUTCOMES).map(it => ({id: it.id || null, text: it.text || '', orig: trim(it.text)}));
    while (rows.length < MAX_OUTCOMES) rows.push(emptyRow());
    return rows;
  };

  function OutcomesCard() {
    const ctx = M.useCtx();
    const ctxRef = useRef(ctx);
    ctxRef.current = ctx;
    const live = useLive();
    const [editing, setEditing] = useState(false);
    const [busy, setBusy] = useState(false);
    const [rows, setRows] = useState(() => rowsFrom([]));
    if (!ctx || !ctx.uid) return null;

    const uid = ctx.uid;
    const weekId = U.isoWeek(new Date(ctx.now || Date.now()));
    const weeks = planWeeks(ctx, uid);
    const plan = weeks[weekId] || null;
    const items = (plan && Array.isArray(plan.items)) ? plan.items : [];
    const review = reviewWeek(ctx, uid, weekId);
    const locked = !!(review && review.at);
    const marks = (review && review.marks) || {};
    const showForm = !locked && (items.length === 0 || editing);
    const canSave = rows.some(r => trim(r.text));

    const setText = (i, text) => setRows(rs => rs.map((r, j) => j === i ? {...r, text} : r));
    const startEdit = () => { setRows(rowsFrom(items)); setEditing(true); };
    const save = () => {
      if (busy || !canSave) return;
      setBusy(true);
      const c = ctxRef.current;
      const all = U.clone(planWeeks(c, uid));
      const old = all[weekId] || null;
      /* unchanged rows keep their id; new or rewritten rows get a fresh one */
      const next = rows.filter(r => trim(r.text)).map(r => ({
        id: r.id && trim(r.text) === r.orig ? r.id : U.uid(),
        text: trim(r.text)
      }));
      const at = old && old.at ? old.at : Date.now();
      all[weekId] = {items: next, at, updated: Date.now()};
      c.W.merge('plan/' + uid, {weeks: U.pruneWeeks(all)})
        .then(() => { M.toast('Saved'); if (live.current) setEditing(false); })
        .catch(() => {})
        .then(() => { if (live.current) setBusy(false); });
    };

    let body;
    if (showForm) {
      body = html`<div class="stack">
        <div>${OUTCOME_LINE}</div>
        ${rows.map((r, i) => html`<${UI.Input} key=${i} id=${'outcome-' + (i + 1)} label=${'outcome ' + (i + 1)}
          value=${r.text} onChange=${t => setText(i, t)} placeholder="Something that will exist by Saturday"/>`)}
        <div class="row">
          <${UI.Btn} disabled=${busy || !canSave} onClick=${save}>Save outcomes<//>
          ${items.length ? html`<${UI.Btn} kind="ghost" disabled=${busy} onClick=${() => setEditing(false)}>Cancel<//>` : null}
        </div>
      </div>`;
    } else {
      body = html`<div class="stack tight">
        <div class="sub small">${OUTCOME_LINE}</div>
        ${items.length ? html`<div id="outcomes-list">
          ${items.map(it => {
            const mark = MARK_PILL[marks[it.id]] ? marks[it.id] : 'open';
            return html`<div key=${it.id} class="listrow" data-mark=${mark}>
              <span class="grow">${it.text}</span>
              <${UI.Pill} kind=${MARK_PILL[mark]}>${mark}<//>
            </div>`;
          })}
        </div>` : html`<${UI.Empty} text="No outcomes were posted this week."/>`}
        ${locked ? html`<div id="outcomes-lock" class="sub small">${LOCK_LINE}</div>` : null}
      </div>`;
    }

    const action = (!showForm && !locked) ? html`<${UI.Btn} kind="sec" sm onClick=${startEdit}>Edit<//>` : null;
    return html`<${UI.Card} title="This week's outcomes" id="outcomes-card" action=${action}>${body}<//>`;
  }

  M.parts.EodCard = EodCard;
  M.parts.OutcomesCard = OutcomesCard;
})();

/* ==== 13-yourday.js ==== */
/* module: yourday */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect, useMemo, useRef, useCallback} = React;

  /* ---------- connector inputs, fixed references so each watch registers once ---------- */
  const MAIL_INPUT = {query: 'is:unread in:inbox', pageSize: 3, view: 'THREAD_VIEW_MINIMAL'};
  const DRIVE_INPUT = {orderBy: 'recency', pageSize: 5, excludeContentSnippets: true};
  const REFETCH_CAL = 300000;
  const REFETCH_MAIL = 300000;
  const REFETCH_DRIVE = 600000;
  const ICON = {width: '16px', height: '16px', flex: 'none'};
  const WRAP = {overflowWrap: 'anywhere'};

  /* today 00:00 to tomorrow 00:00, local ISO with offset */
  function calendarInput(ymd) {
    const start = U.parseYmd(ymd);
    return {startTime: U.isoLocal(start), endTime: U.isoLocal(U.addDays(start, 1)), orderBy: 'startTime', pageSize: 10};
  }

  /* ---------- pure helpers ---------- */
  const DENY_TEXT = {
    needs_reauth: s => 'Reconnect ' + s + ' in claude.ai Settings, Connectors.',
    server_not_connected: s => 'Add ' + s + ' in claude.ai Settings, Connectors to see it here.',
    not_in_manifest: () => 'Turned off for this page.',
    blocked_by_policy: () => 'Blocked by your organisation.',
    approval_required: () => 'Blocked by your organisation.',
    selection_required: s => 'Choose which ' + s + ' to use when Claude asks.',
    not_granted: s => 'Allow ' + s + ' for this page to see it here.',
    consent_required: s => 'Allow ' + s + ' for this page to see it here.',
    capability_disabled: () => 'Connectors are switched off for this page.',
    capability_removed: () => 'Connectors are switched off for this page.'
  };
  const NEUTRAL = ['not_in_manifest', 'selection_required', 'capability_disabled', 'capability_removed'];

  /* the one line a section shows in place of data, or null when data can render */
  function stateText(server, w) {
    if (!w || w.state === 'ok') return null;
    if (w.state === 'loading' || w.state === 'none') return {text: 'Loading', flame: false};
    const code = w.code || '';
    if (w.state === 'denied') {
      const f = DENY_TEXT[code];
      return {text: f ? f(server) : server + ' is unavailable on this page.', flame: !NEUTRAL.includes(code)};
    }
    if (code === 'tool_error') return {text: w.msg || server + ' returned an error.', flame: true};
    if (code === 'server_unavailable') return {text: server + ' is unreachable right now.', flame: true};
    return {text: w.msg || server + ' failed to load.', flame: true};
  }

  /* "10:30" from start.dateTime, "all day" when only start.date is set */
  function eventTime(ev) {
    const st = (ev && ev.start) || {};
    if (st.dateTime) {
      const t = Date.parse(st.dateTime);
      return isNaN(t) ? '' : U.hhmm(t);
    }
    return 'all day';
  }

  /* only http and https links are rendered as anchors */
  const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;

  /* "15m ago" from an ISO stamp, or "" when it cannot be parsed */
  function agoText(iso) {
    if (!iso) return '';
    const t = Date.parse(iso);
    return isNaN(t) ? '' : U.timeAgo(t);
  }

  const line = (text, flame) => html`<div class=${'small' + (flame ? ' flame-t' : ' sub')}>${text}</div>`;

  /* ---------- section views ---------- */
  function CalendarView({data}) {
    const events = Array.isArray(data && data.events) ? data.events : [];
    if (!events.length) return html`<${UI.Empty} text="Nothing on the calendar today."/>`;
    return html`<div>${events.map((ev, i) => {
      const join = safeUrl(ev && ev.conferenceUrl);
      return html`<div key=${(ev && ev.id) || 'e' + i} class="listrow">
        <span class="num sub small" style=${{width: '56px', flex: 'none'}}>${eventTime(ev)}</span>
        <span class="grow" style=${WRAP}>${(ev && ev.summary) || 'Untitled event'}</span>
        ${join ? html`<a class="linky" href=${join} target="_blank" rel="noopener">Join</a>` : null}
      </div>`;
    })}</div>`;
  }

  function MailView({data}) {
    const threads = Array.isArray(data && data.threads) ? data.threads : [];
    const est = data ? data.resultCountEstimate : null;
    const count = (est == null || est === '') ? String(threads.length) : String(est);
    if (!threads.length && !(Number(count) > 0)) return html`<${UI.Empty} text="No unread mail."/>`;
    return html`<div>
      <div class="num">${count} unread</div>
      ${threads.slice(0, 3).map((t, i) => {
        const m = (t && Array.isArray(t.messages) && t.messages[0]) || {};
        const ago = agoText(m.date);
        return html`<div key=${(t && t.id) || 'm' + i} class="listrow">
          <div class="grow" style=${WRAP}>
            <div>${m.subject || 'No subject'}</div>
            <div class="sub tiny">${m.sender || 'Unknown sender'}</div>
          </div>
          ${ago ? html`<span class="sub tiny num">${ago}</span>` : null}
        </div>`;
      })}
    </div>`;
  }

  function DriveView({data}) {
    const files = Array.isArray(data && data.files) ? data.files : [];
    if (!files.length) return html`<${UI.Empty} text="No recent files."/>`;
    return html`<div>${files.slice(0, 5).map((f, i) => {
      const url = safeUrl(f && f.viewUrl);
      const ago = agoText(f && f.modifiedTime);
      return html`<div key=${(f && f.id) || 'f' + i} class="listrow">
        <span class="grow" style=${WRAP}>${(f && f.title) || 'Untitled file'}</span>
        ${ago ? html`<span class="sub tiny num">${ago}</span>` : null}
        ${url ? html`<a class="linky" href=${url} target="_blank" rel="noopener">Open</a>` : null}
      </div>`;
    })}</div>`;
  }

  /* ---------- permission state, read once per section ---------- */
  function usePerm(permissions, server) {
    const [state, setState] = useState(permissions ? null : 'none');
    const [busy, setBusy] = useState(false);
    const live = useRef(true);
    useEffect(() => { live.current = true; return () => { live.current = false; }; }, []);
    const read = useCallback(() => {
      if (!permissions || typeof permissions.state !== 'function') { setState('none'); return; }
      let p;
      try { p = Promise.resolve(permissions.state('mcp:' + server)); } catch (e) { setState('unknown'); return; }
      p.then(s => { if (live.current) setState(typeof s === 'string' ? s : 'unknown'); })
        .catch(() => { if (live.current) setState('unknown'); });
    }, [permissions, server]);
    useEffect(() => { read(); }, [read]);
    /* one request per tap, then a fresh read of the state */
    const request = () => {
      if (busy || !permissions || typeof permissions.request !== 'function') return;
      setBusy(true);
      let p;
      try { p = Promise.resolve(permissions.request(['mcp:' + server])); } catch (e) { p = Promise.reject(e); }
      p.catch(() => {}).then(() => { if (!live.current) return; setBusy(false); read(); });
    };
    return {state, busy, request};
  }

  /* ---------- one connector section ---------- */
  function Live({server, tool, input, ms, view}) {
    const ctx = M.useCtx();
    const w = M.useWatch(ctx && ctx.mcp, server, tool, input, ms);
    const st = stateText(server, w);
    if (st) return line(st.text, st.flame);
    const View = view;
    return html`<div class="stack tight">
      <${View} data=${w.data || {}}/>
      ${w.stale ? html`<div class="sub tiny num">updated ${U.timeAgo(w.at || Date.now())}</div>` : null}
    </div>`;
  }

  function Section({id, server, tool, input, ms, label, icon, view}) {
    const ctx = M.useCtx();
    const perm = usePerm(ctx && ctx.permissions, server);
    let body;
    if (perm.state === null) body = line('Loading', false);
    else if (perm.state === 'prompt') body = html`<div class="stack tight">
      <div class="sub small">Connect ${server} to see it here.</div>
      <div><${UI.Btn} kind="sec" sm disabled=${perm.busy} onClick=${perm.request}>Connect<//></div>
    </div>`;
    else body = html`<${Live} server=${server} tool=${tool} input=${input} ms=${ms} view=${view}/>`;
    const Icon = icon;
    return html`<div class="stack tight" id=${id}>
      <div class="row nowrap ink62" style=${{gap: '7px'}}><${Icon} style=${ICON}/><${UI.Micro} plain>${label}<//></div>
      ${body}
    </div>`;
  }

  /* ---------- the card ---------- */
  function YourDay() {
    const ctx = M.useCtx();
    const today = U.todayStr();
    const calInput = useMemo(() => calendarInput(today), [today]);
    if (!ctx || !ctx.mcp) return null;
    return html`<${UI.Card} title="Your day" id="yourday-card">
      <${Section} id="yourday-calendar" server="Google Calendar" tool="list_events" input=${calInput} ms=${REFETCH_CAL}
        label="calendar" icon=${icons.cal} view=${CalendarView}/>
      <hr class="hair"/>
      <${Section} id="yourday-mail" server="Gmail" tool="search_threads" input=${MAIL_INPUT} ms=${REFETCH_MAIL}
        label="mail" icon=${icons.mail} view=${MailView}/>
      <hr class="hair"/>
      <${Section} id="yourday-drive" server="Google Drive" tool="list_recent_files" input=${DRIVE_INPUT} ms=${REFETCH_DRIVE}
        label="drive" icon=${icons.drive} view=${DriveView}/>
    <//>`;
  }

  M.parts.YourDay = YourDay;
  M.yourday = {calendarInput, eventTime, stateText, agoText, safeUrl, MAIL_INPUT, DRIVE_INPUT};
})();

/* ==== 20-feed.js ==== */
/* module: feed. Updates, wins, questions and announcements from everyone, plus kudos, in one stream. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState} = React;

  const KINDS = [
    {v: 'update', label: 'Update'},
    {v: 'win', label: 'Win'},
    {v: 'question', label: 'Question'},
    {v: 'poll', label: 'Poll'}
  ];
  const ANNOUNCE = {v: 'announce', label: 'Announcement'};
  const KIND_TEXT = {announce: 'announcement', win: 'win', question: 'question', update: 'update', poll: 'poll'};
  const KIND_PILL = {announce: 'flame', win: 'ink'};
  const FILTERS = [
    {v: 'all', label: 'All'},
    {v: 'announce', label: 'Announcements'},
    {v: 'win', label: 'Wins'},
    {v: 'kudos', label: 'Kudos'}
  ];
  const EMPTY = {all: 'Nothing posted yet.', announce: 'No announcements yet.', win: 'No wins yet.', kudos: 'No kudos yet.'};
  const EMOJIS = ['👍', '🔥', '👀', '✅'];
  const KEEP_POSTS = 80;
  const KEEP_KUDOS = 60;
  const STREAM_CAP = 120;
  const KUDOS_CAP = 3;

  /* ---------- pure helpers ---------- */
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const postsOf = (ctx, uid) => ((collMap(ctx, 'feed')[uid] || {}).posts || []).filter(p => p && p.id);
  const givenOf = (ctx, uid) => ((collMap(ctx, 'kudos')[uid] || {}).given || []).filter(g => g && g.id);
  const myReacts = (ctx, uid) => (collMap(ctx, 'reacts')[uid] || {}).r || {};
  /* only the founder's pinned field is read */
  const pinnedKey = ctx => (ctx.founderUid && (collMap(ctx, 'feed')[ctx.founderUid] || {}).pinned) || null;
  const kindOf = p => KIND_TEXT[p.kind] ? p.kind : 'update';

  /* kudos sent by uid inside the ISO week that holds `now` */
  function kudosThisWeek(ctx, uid, now) {
    const week = U.isoWeek(new Date(now || Date.now()));
    return givenOf(ctx, uid).filter(g => g.at && U.isoWeek(new Date(g.at)) === week).length;
  }

  /* every post and every kudos in one list: the pinned post first, then newest first, capped */
  function stream(ctx) {
    const pinned = pinnedKey(ctx);
    const out = [];
    const feed = collMap(ctx, 'feed');
    for (const author of Object.keys(feed)) {
      for (const p of postsOf(ctx, author)) {
        const key = author + ':' + p.id;
        out.push({key, type: 'post', author, id: p.id, kind: kindOf(p), text: String(p.text || ''), options: p.options || [],
          at: Number(p.at) || 0, pinned: key === pinned});
      }
    }
    const kudos = collMap(ctx, 'kudos');
    for (const giver of Object.keys(kudos)) {
      for (const g of givenOf(ctx, giver)) {
        out.push({key: 'k:' + giver + ':' + g.id, type: 'kudos', giver, id: g.id, to: g.to || '',
          why: String(g.why || ''), at: Number(g.at) || 0, pinned: false});
      }
    }
    out.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || (b.at - a.at));
    return out.slice(0, STREAM_CAP);
  }

  /* reaction counts from every reacts document: {[postKey]: {[emoji]: n}} */
  function reactCounts(ctx) {
    const counts = {};
    const reacts = collMap(ctx, 'reacts');
    for (const who of Object.keys(reacts)) {
      const r = (reacts[who] || {}).r || {};
      for (const key of Object.keys(r)) {
        const e = r[key];
        if (!EMOJIS.includes(e)) continue;
        const c = counts[key] || (counts[key] = {});
        c[e] = (c[e] || 0) + 1;
      }
    }
    return counts;
  }

  /* Display names for a set of ids, held in page state. M.useProfiles re-renders only the first subscriber
     of an id per commit, so a UI.Name next to a UI.Avatar for the same id can keep its fallback until the
     next tree render. This hook re-renders the page once the fetch settles and feeds UI.Name a fallback. */
  function useNames(ctx, ids) {
    const key = Array.from(new Set((ids || []).filter(Boolean))).sort().join(',');
    const user = ctx && ctx.user;
    const [names, setNames] = useState({});
    React.useEffect(() => {
      if (!key || !user || typeof user.profiles !== 'function') return undefined;
      let live = true;
      Promise.resolve().then(() => user.profiles(key.split(','))).then(ps => {
        if (!live || !ps) return;
        setNames(prev => {
          const out = {...prev};
          for (const id of Object.keys(ps)) out[id] = (ps[id] && ps[id].name) || '';
          return out;
        });
      }).catch(() => {});
      return () => { live = false; };
    }, [user, key]);
    return names;
  }

  /* ---------- composer ---------- */
  function Composer() {
    const ctx = M.useCtx();
    const {W, uid, isFounder} = ctx;
    const [text, setText] = useState('');
    const [kind, setKind] = useState('update');
    const [busy, setBusy] = useState(false);
    const [opts, setOpts] = useState(['', '']);
    const options = isFounder ? [...KINDS, ANNOUNCE] : KINDS;
    const pollOk = kind !== 'poll' || opts.filter(o => o.trim()).length >= 2;
    const canPost = !!text.trim() && !busy && pollOk;

    const post = async () => {
      const t = text.trim();
      if (!t || busy) return;
      const k = (kind === 'announce' && !isFounder) ? 'update' : (KIND_TEXT[kind] ? kind : 'update');
      setBusy(true);
      try {
        const id = U.uid();
        const mine = collMap(ctx, 'feed')[uid] || {};
        const post = {id, kind: k, text: t, at: Date.now()};
        if (k === 'poll') post.options = opts.map(o => o.trim()).filter(Boolean).slice(0, 4);
        const posts = [post, ...U.clone(postsOf(ctx, uid))].slice(0, KEEP_POSTS);
        const pinned = k === 'announce' ? uid + ':' + id : (mine.pinned || null);
        await W.merge('feed/' + uid, {posts, pinned});
        setText('');
        setKind('update'); setOpts(['', '']);
        M.sound.play('soft');
        M.toast('Posted');
      } catch (e) { /* the write layer already toasted the failure */ }
      setBusy(false);
    };

    return html`<${UI.Card} id="feed-composer">
      <div class="stack">
        <${UI.TextArea} id="feed-text" placeholder=${kind === 'poll' ? 'Ask the team something' : 'Share an update, a win or a question'} rows=${3} value=${text} onChange=${setText}/>
        ${kind === 'poll' ? html`<div class="stack tight" id="poll-options">
          ${opts.map((o, i) => html`<${UI.Input} key=${i} value=${o} placeholder=${'Option ' + (i + 1)} onChange=${v => setOpts(x => x.map((y, j) => j === i ? v : y))}/>`)}
          ${opts.length < 4 ? html`<button type="button" class="linky small" style=${{alignSelf: 'flex-start'}} onClick=${() => setOpts(x => x.concat(['']))}>Add an option</button>` : null}
        </div>` : null}
        <div class="row between">
          <${UI.Seg} ariaLabel="Post kind" value=${kind} onChange=${setKind} options=${options}/>
          <${UI.Btn} disabled=${!canPost} onClick=${post}>Post<//>
        </div>
        ${kind === 'announce' ? html`<div class="sub small">Announcements pin to the top of the feed and show on everyone's Today.</div>` : null}
      </div>
    <//>`;
  }

  /* ---------- kudos drawer ---------- */
  function KudosDrawer({open, onClose, names}) {
    const ctx = M.useCtx();
    const {W, uid} = ctx;
    const [to, setTo] = useState('');
    const [why, setWhy] = useState('');
    const [busy, setBusy] = useState(false);
    const people = (ctx.activeMembers || []).filter(m => m.uid !== uid);
    const options = people.map(m => ({v: m.uid, label: names[m.uid] || m.empId || 'Someone'}));
    const toId = options.some(o => o.v === to) ? to : (options[0] ? options[0].v : '');
    const used = kudosThisWeek(ctx, uid, ctx.now);
    const left = Math.max(0, KUDOS_CAP - used);
    const canSend = !!toId && !!why.trim() && left > 0 && !busy;

    const send = async () => {
      if (!canSend) return;
      setBusy(true);
      try {
        const given = [{id: U.uid(), to: toId, why: why.trim(), at: Date.now()}, ...U.clone(givenOf(ctx, uid))].slice(0, KEEP_KUDOS);
        await W.merge('kudos/' + uid, {given});
        setWhy('');
        setTo('');
        M.toast('Kudos sent');
        onClose();
      } catch (e) { /* the write layer already toasted the failure */ }
      setBusy(false);
    };

    const footer = html`<${UI.Btn} disabled=${!canSend} onClick=${send}>Send kudos<//>`;
    return html`<${UI.Drawer} open=${open} onClose=${onClose} title="Give kudos" footer=${footer}>
      ${people.length
        ? html`<${UI.Select} id="kudos-to" label="to" value=${toId} onChange=${setTo} options=${options}/>`
        : html`<${UI.Empty} text="No one else on the roster yet."/>`}
      <${UI.Input} id="kudos-why" label="why" placeholder="One line on what they did" value=${why} onChange=${setWhy} onEnter=${send}/>
      <div id="kudos-left" class=${'small num' + (left ? ' sub' : ' flame-t')}>${left} of ${KUDOS_CAP} left this week</div>
      <div class="sub small">Kudos show in the feed and count for points. The count resets on Monday.</div>
    <//>`;
  }

  /* ---------- cards ---------- */
  function PostCard({it, counts, mine, names}) {
    const ctx = M.useCtx();
    const {uid, isFounder, founderUid, W} = ctx;
    const c = counts[it.key] || {};
    const isAuthor = it.author === uid;

    const react = e => {
      const r = myReacts(ctx, uid);
      if (r[it.key] === e) {
        const next = {...r};
        delete next[it.key];
        W.set('reacts/' + uid, {r: next}).catch(() => {});
      } else {
        W.merge('reacts/' + uid, {r: {[it.key]: e}}).catch(() => {});
      }
    };
    const togglePin = () => {
      if (!founderUid) return;
      W.merge('feed/' + founderUid, {pinned: it.pinned ? null : it.key})
        .then(() => M.toast(it.pinned ? 'Unpinned' : 'Pinned')).catch(() => {});
    };
    /* polls: each vote lives in the voter's own votes document */
    const pollVotes = it.kind === 'poll' ? (() => {
      const vm = collMap(ctx, 'votes');
      const tally = {}, who = {};
      let mineVote = null, total = 0;
      for (const v of Object.keys(vm)) {
        const choice = ((vm[v] || {}).polls || {})[it.key];
        if (choice == null) continue;
        tally[choice] = (tally[choice] || 0) + 1; total++;
        (who[choice] = who[choice] || []).push(v);
        if (v === uid) mineVote = choice;
      }
      return {tally, total, mineVote, who};
    })() : null;
    const vote = i => { W.merge('votes/' + uid, {polls: {[it.key]: i}}).then(() => M.sound.play('tick')).catch(() => {}); };
    const remove = () => {
      const mineDoc = collMap(ctx, 'feed')[uid] || {};
      const posts = U.clone(postsOf(ctx, uid)).filter(p => p.id !== it.id);
      const doc = {posts};
      if (mineDoc.pinned === it.key) doc.pinned = null;
      W.merge('feed/' + uid, doc).then(() => M.toast('Deleted')).catch(() => {});
    };

    return html`<section class=${'card' + (it.pinned ? ' flame' : '')} data-key=${it.key} data-kind=${it.kind}>
      <div class="row between">
        <div class="row nowrap grow">
          <${UI.Avatar} id=${it.author} size=${32}/>
          <div class="grow">
            <div class="row">
              <b><${UI.Name} id=${it.author} fallback=${names[it.author] || undefined}/></b>
              <${UI.Pill} kind=${KIND_PILL[it.kind]}>${KIND_TEXT[it.kind]}<//>
              ${it.pinned ? html`<${UI.Pill}><${icons.pin}/>pinned<//>` : null}
            </div>
            <div class="tiny sub num">${U.timeAgo(it.at)}</div>
          </div>
        </div>
        ${(isFounder || isAuthor) ? html`<div class="row nowrap">
          ${isFounder ? html`<${UI.Btn} kind="ghost" sm onClick=${togglePin}><${icons.pin}/>${it.pinned ? 'Unpin' : 'Pin'}<//>` : null}
          ${isAuthor ? html`<${UI.ConfirmBtn} onConfirm=${remove}>Delete<//>` : null}
        </div>` : null}
      </div>
      <div style=${{whiteSpace: 'pre-wrap', overflowWrap: 'anywhere', margin: '12px 0'}}>${it.text}</div>
      ${pollVotes ? html`<div class="poll" role="group" aria-label="Poll">
        ${(it.options || []).map((o, i) => {
          const n = pollVotes.tally[i] || 0, pct = pollVotes.total ? Math.round(100 * n / pollVotes.total) : 0;
          return html`<button type="button" key=${i} class=${'poll-opt' + (pollVotes.mineVote === i ? ' on' : '')} aria-pressed=${pollVotes.mineVote === i} onClick=${() => vote(i)}>
            <i style=${{width: pct + '%'}}/><span>${o}</span>
            ${pollVotes.total ? html`<span class="pct num">${pct}%</span>` : null}
          </button>`;
        })}
        <div class="tiny ink62 num">${pollVotes.total} ${pollVotes.total === 1 ? 'vote' : 'votes'}${pollVotes.total && (isAuthor || isFounder) ? html`. ${Object.keys(pollVotes.who).map(i => html`<span key=${i}>${(it.options || [])[i]}: <${UI.AvatarRow} ids=${pollVotes.who[i]} size=${16}/> </span>`)}` : ''}</div>
      </div>` : null}
      <div class="row" role="group" aria-label="Reactions">
        ${EMOJIS.map(e => html`<button key=${e} type="button" class=${'emoji-btn' + (mine === e ? ' on' : '')}
          aria-pressed=${mine === e} aria-label=${'React ' + e} onClick=${() => react(e)}>
          <span>${e}</span>${c[e] ? html`<span class="num">${c[e]}</span>` : null}</button>`)}
      </div>
    </section>`;
  }

  function KudosCard({it, names}) {
    return html`<section class="card" data-key=${it.key} data-kind="kudos">
      <div class="row nowrap">
        <${UI.Avatar} id=${it.giver} size=${32}/>
        <div class="grow">
          <div class="row">
            <b>Kudos to <${UI.Name} id=${it.to} fallback=${names[it.to] || undefined}/></b>
            <${UI.Pill} kind="ink">kudos<//>
          </div>
          <div class="tiny sub">from <${UI.Name} id=${it.giver} fallback=${names[it.giver] || undefined}/><span class="num"> · ${U.timeAgo(it.at)}</span></div>
        </div>
      </div>
      <div style=${{overflowWrap: 'anywhere', marginTop: '12px'}}>${it.why}</div>
    </section>`;
  }

  /* ---------- page ---------- */
  function Feed() {
    const ctx = M.useCtx();
    const [filter, setFilter] = useState('all');
    const [kudosOpen, setKudosOpen] = useState(false);
    M.useIntent('kudos', () => setKudosOpen(true));
    M.useIntent('post', () => setTimeout(() => { const el = document.getElementById('feed-text'); if (el) el.focus(); }, 60));
    const items = stream(ctx);
    const counts = reactCounts(ctx);
    const mine = myReacts(ctx, ctx.uid);
    const ids = [];
    for (const it of items) {
      if (it.type === 'post') ids.push(it.author);
      else { ids.push(it.giver); ids.push(it.to); }
    }
    for (const m of (ctx.activeMembers || [])) ids.push(m.uid);
    const names = useNames(ctx, ids);
    const shown = items.filter(it => filter === 'all'
      || (filter === 'kudos' ? it.type === 'kudos' : (it.type === 'post' && it.kind === filter)));
    const ready = !!(ctx.coll && ctx.coll.feed && ctx.coll.feed.ready && ctx.coll.kudos && ctx.coll.kudos.ready);

    return html`<${React.Fragment}>
      <${UI.PageHead} micro="updates, wins and kudos" title="Feed">
        <${UI.Btn} kind="sec" onClick=${() => setKudosOpen(true)}>Give kudos<//>
      <//>
      <${Composer}/>
      <div class="row between">
        <${UI.Seg} ariaLabel="Filter" value=${filter} onChange=${setFilter} options=${FILTERS}/>
        <span class="tiny sub num">${shown.length} shown</span>
      </div>
      <div class="stack" id="feed-stream">
        ${shown.length ? shown.map(it => it.type === 'kudos'
          ? html`<${KudosCard} key=${it.key} it=${it} names=${names}/>`
          : html`<${PostCard} key=${it.key} it=${it} counts=${counts} mine=${mine[it.key]} names=${names}/>`)
          : html`<${UI.Empty} text=${ready ? EMPTY[filter] : 'Loading the feed.'}/>`}
      </div>
      <${KudosDrawer} open=${kudosOpen} onClose=${() => setKudosOpen(false)} names=${names}/>
    <//>`;
  }

  M.pages.Feed = Feed;
  M.feed = {stream, reactCounts};
})();

/* ==== 21-tasks.js ==== */
/* module: tasks. The board, the task drawer and the task helpers. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect, useMemo, useRef} = React;

  const STATUSES = [
    {v: 'todo', label: 'To do'},
    {v: 'doing', label: 'Doing'},
    {v: 'review', label: 'In review'},
    {v: 'done', label: 'Done'}
  ];
  const PRIORITIES = [{v: 'low', label: 'Low'}, {v: 'normal', label: 'Normal'}, {v: 'high', label: 'High'}];
  const WHO = [{v: 'mine', label: 'Mine'}, {v: 'all', label: 'Everyone'}];
  const DONE_WINDOW_MS = 14 * 86400000;
  const SEL_STYLE = {flex: '1 1 160px', maxWidth: '260px'};

  /* ---------- pure helpers ---------- */
  const isOverdue = (task, todayYmd) =>
    !!(task && task.due && task.status !== 'done' && task.due < (todayYmd || U.todayStr()));

  const byDue = (a, b) => {
    const da = a.due || '9999-12-31', db = b.due || '9999-12-31';
    if (da !== db) return da < db ? -1 : 1;
    return (a.created || 0) - (b.created || 0);
  };

  const allTasks = ctx => {
    const map = (ctx && ctx.coll && ctx.coll.tasks && ctx.coll.tasks.map) || {};
    return Object.keys(map).filter(id => map[id]).map(id => ({id, ...map[id]}));
  };

  /* open tasks with id, soonest due first */
  const open = ctx => allTasks(ctx).filter(t => t.status !== 'done').sort(byDue);

  const progress = (ctx, projectId) => {
    const today = U.todayStr();
    const out = {done: 0, total: 0, overdue: 0};
    for (const t of allTasks(ctx)) {
      if (t.project !== projectId) continue;
      out.total++;
      if (t.status === 'done') out.done++;
      else if (isOverdue(t, today)) out.overdue++;
    }
    return out;
  };

  /* "22 Sep" */
  const dueLabel = ymd => U.fmtDay(ymd).split(' ').slice(1).join(' ');

  const subCount = task => {
    const s = (task && task.subtasks) || {};
    const keys = Object.keys(s);
    return {total: keys.length, done: keys.filter(k => s[k] && s[k].done).length};
  };

  const nameOf = (map, id) => (id && map && map[id] && map[id].name) || '';

  const sortedOpts = map => Object.keys(map || {})
    .filter(id => map[id] && !map[id].archived)
    .map(id => ({v: id, label: map[id].name || id}))
    .sort((a, b) => a.label.localeCompare(b.label));

  /* user text becomes a plain https link, so the href only ever carries http or https */
  const safeHref = link => {
    const s = String(link || '').trim();
    if (!s) return null;
    return /^https?:\/\//i.test(s) ? s : 'https://' + s.replace(/^\/+/, '');
  };

  const revNote = n => n > 0 ? n + (n === 1 ? ' revision' : ' revisions') : 'No revisions yet';

  /* one status change, with the bookkeeping every path shares: review time, revisions, done time */
  function statusPatch(task, status, uid) {
    const now = Date.now();
    const prev = (task && task.status) || 'todo';
    const patch = {status, updated: now};
    let msg = 'Moved to ' + (STATUSES.find(x => x.v === status) || {label: status}).label.toLowerCase();
    if (prev === 'review' && (status === 'doing' || status === 'todo')) {
      patch.revisions = (Number(task && task.revisions) || 0) + 1;
      patch.sentBackAt = now; patch.sentBackBy = uid;
      msg = 'Sent back, revision ' + patch.revisions;
    }
    if (status === 'review' && prev !== 'review') patch.reviewAt = now;
    if (status === 'done') { if (prev !== 'done' || !(task && task.doneAt)) patch.doneAt = now; msg = 'Shipped'; }
    else patch.doneAt = null;
    return {patch, msg};
  }
  async function moveTask(ctx, task, status, el) {
    if (!task || task.status === status) return;
    const {patch, msg} = statusPatch(task, status, ctx.uid);
    await ctx.W.update('tasks/' + task.id, patch).catch(() => {});
    if (status === 'done') M.burst(el || document.body); else M.sound.play('tick');
    M.toast(msg);
  }

  /* @mentions: names in a comment become ids the inbox can use */
  function useMentions(text, setText) {
    const ctx = M.useCtx();
    const ids = ctx.activeMembers.map(m => m.uid);
    const profs = M.useProfiles(ids);
    const people = ids.map(id => ({id, name: (profs[id] && profs[id].name) || (ctx.members[id] || {}).empId || 'Someone'}));
    const at = /(^|\s)@([\w ]{0,24})$/.exec(text || '');
    const q = at ? at[2].toLowerCase() : null;
    const hits = q == null ? [] : people.filter(p => p.name.toLowerCase().startsWith(q)).slice(0, 5);
    const pick = p => setText(String(text).replace(/(^|\s)@([\w ]{0,24})$/, '$1@' + p.name + ' '));
    const mentionsIn = t => people.filter(p => String(t || '').includes('@' + p.name)).map(p => p.id);
    return {hits, pick, mentionsIn};
  }
  function MentionMenu({hits, pick}) {
    if (!hits.length) return null;
    return html`<div class="mention-menu" style=${{position: 'relative', marginTop: '-4px'}}>
      ${hits.map((p, i) => html`<button type="button" key=${p.id} class=${i === 0 ? 'on' : ''} onMouseDown=${e => { e.preventDefault(); pick(p); }}>
        <${UI.Avatar} id=${p.id} size=${20}/>${p.name}</button>`)}
    </div>`;
  }
  /* comment text with @Name runs shown in flame */
  function CommentText({text, names}) {
    const parts = String(text || '').split(/(@[A-Z][\w]*(?: [A-Z][\w]*)?)/g);
    return html`<span>${parts.map((p, i) => p.startsWith('@') && names.some(n => p === '@' + n) ? html`<span key=${i} class="mention">${p}</span>` : p)}</span>`;
  }

  /* ---------- card ---------- */
  function TaskCard({task, projects, clients, today, onOpen, onDrag}) {
    const pName = nameOf(projects, task.project);
    const cName = nameOf(clients, task.client);
    const overdue = isOverdue(task, today);
    const sc = subCount(task);
    const rev = Number(task.revisions) || 0;
    const down = useRef(null);
    const onDown = e => { if (e.button !== 0 || e.target.closest('.grip')) return; down.current = {x: e.clientX, y: e.clientY, el: e.currentTarget}; };
    const onMove = e => {
      const d = down.current;
      if (!d || !onDrag || e.pointerType !== 'mouse') return;
      if (Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) > 6) { down.current = null; onDrag(task, e, d.el); }
    };
    const onUp = () => { down.current = null; };
    return html`<button type="button" class="tcard" data-task=${task.id} onClick=${() => onOpen(task.id)}
      onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}>
      <div class="row between nowrap" style=${{gap: '6px', alignItems: 'flex-start'}}>
        <div class="t grow">${task.title || 'Untitled'}</div>
        ${onDrag ? html`<span class="grip" aria-label="Drag" onPointerDown=${e => { e.stopPropagation(); onDrag(task, e, e.currentTarget.closest('.tcard')); }}><${icons.grip}/></span>` : null}
      </div>
      ${(pName || cName) ? html`<div class="row" style=${{gap: '6px', overflow: 'hidden'}}>
        ${pName ? html`<${UI.Pill} kind="warm">${pName}<//>` : null}
        ${cName ? html`<${UI.Pill} kind="warm">${cName}<//>` : null}
      </div>` : null}
      <div class="row between nowrap" style=${{gap: '6px'}}>
        <div class="row grow" style=${{gap: '6px'}}>
          ${task.due ? html`<${UI.Pill} kind=${overdue ? 'flame' : undefined}>due ${dueLabel(task.due)}<//>` : null}
          ${task.priority === 'high' ? html`<${UI.Pill} kind="flame">high<//>` : null}
          ${rev > 0 ? html`<${UI.Pill} kind="flame-o">${rev} rev<//>` : null}
          ${task.shown20 ? html`<${UI.Pill}>20% shown<//>` : null}
          ${sc.total > 0 ? html`<${UI.Pill} kind=${sc.done === sc.total ? 'ink' : undefined}>${sc.done} of ${sc.total}<//>` : null}
        </div>
        ${task.owner ? html`<${UI.Avatar} id=${task.owner} size=${22}/>` : null}
      </div>
    </button>`;
  }

  /* ---------- drawer ---------- */
  function TaskDrawer({taskId, onClose, defaults}) {
    const ctx = M.useCtx();
    const {W, uid} = ctx;
    const tasksMap = (ctx.coll.tasks && ctx.coll.tasks.map) || {};
    const projects = (ctx.coll.projects && ctx.coll.projects.map) || {};
    const clients = (ctx.coll.clients && ctx.coll.clients.map) || {};
    const task = taskId ? tasksMap[taskId] : null;
    const isNew = !taskId;
    const d = defaults || {};
    const path = 'tasks/' + taskId;

    const init = () => ({
      title: task ? (task.title || '') : '',
      status: task ? (task.status || 'todo') : 'todo',
      owner: task ? (task.owner || '') : (d.owner || uid),
      due: task ? (task.due || '') : (d.due || ''),
      priority: task ? (task.priority || 'normal') : 'normal',
      project: task ? (task.project || '') : (d.project || ''),
      section: task ? (task.section || '') : (d.section || ''),
      client: task ? (task.client || '') : (d.client || ''),
      link: task ? (task.link || '') : '',
      shown20: task ? !!task.shown20 : false
    });
    const [f, setF] = useState(init);
    const [localSubs, setLocalSubs] = useState({});
    const [subText, setSubText] = useState('');
    const [comment, setComment] = useState('');
    const [busy, setBusy] = useState(false);
    const mention = useMentions(comment, setComment);
    const memberNames = Object.values(M.useProfiles(ctx.activeMembers.map(m => m.uid))).map(p => p.name).filter(Boolean);
    const mounted = useRef(false);
    const hasTask = !!task;
    useEffect(() => {
      if (!mounted.current) { mounted.current = true; return; }
      setF(init());
      setLocalSubs({});
      setSubText('');
    }, [taskId, hasTask]);

    const set = k => v => setF(x => ({...x, [k]: v}));

    /* owner options: active members, plus the current owner and me when missing */
    const memberIds = ctx.activeMembers.map(m => m.uid);
    if (f.owner && !memberIds.includes(f.owner)) memberIds.push(f.owner);
    if (!memberIds.includes(uid)) memberIds.push(uid);
    const profs = M.useProfiles(memberIds);
    const ownerOpts = [{v: '', label: 'No owner'}].concat(memberIds.map(id => ({
      v: id, label: (profs[id] && profs[id].name) || (ctx.members[id] || {}).empId || 'Someone'
    })));
    const projOpts = [{v: '', label: 'No project'}].concat(sortedOpts(projects));
    const clientOpts = [{v: '', label: 'No client'}].concat(sortedOpts(clients));
    const secs = ((projects[f.project] || {}).sections) || [];
    const secOpts = [{v: '', label: 'No section'}].concat(secs.map(s => ({v: s.id, label: s.name || s.id})));

    const onProject = pid => setF(x => {
      const p = projects[pid];
      const list = (p && p.sections) || [];
      const section = list.some(s => s.id === x.section) ? x.section : '';
      const client = x.client || (p && p.client) || '';
      return {...x, project: pid, section, client};
    });

    /* subtasks stay in local state until the task exists, then every change writes live */
    const subs = isNew ? localSubs : ((task && task.subtasks) || {});
    const subList = Object.keys(subs).filter(k => subs[k]).map(k => ({id: k, ...subs[k]})).sort((a, b) => (a.o || 0) - (b.o || 0));
    const addSub = text => {
      const t = String(text || '').trim();
      if (!t) return;
      const id = U.uid();
      const entry = {t, done: false, o: Date.now()};
      setSubText('');
      if (isNew) setLocalSubs(x => ({...x, [id]: entry}));
      else W.update(path, {subtasks: {[id]: entry}, updated: Date.now()}).catch(() => {});
    };
    const tickSub = (id, done) => {
      if (isNew) setLocalSubs(x => ({...x, [id]: {...x[id], done}}));
      else W.update(path, {subtasks: {[id]: {done}}, updated: Date.now()}).catch(() => {});
    };
    const delSub = id => {
      if (isNew) { setLocalSubs(x => { const y = {...x}; delete y[id]; return y; }); return; }
      const cur = tasksMap[taskId];
      if (!cur) return;
      const doc = U.clone(cur);
      doc.subtasks = doc.subtasks || {};
      delete doc.subtasks[id];
      doc.updated = Date.now();
      W.set(path, doc).catch(() => {});
    };

    /* comments, oldest first */
    const comments = (task && task.comments) || {};
    const cList = Object.keys(comments).filter(k => comments[k]).map(k => ({id: k, ...comments[k]})).sort((a, b) => (a.at || 0) - (b.at || 0));
    const addComment = async () => {
      const t = comment.trim();
      if (!t || isNew) return;
      setBusy(true);
      try {
        await W.update(path, {comments: {[U.uid()]: {by: uid, t, at: Date.now(), mentions: mention.mentionsIn(t)}}, updated: Date.now()});
        setComment('');
        M.sound.play('soft');
        M.toast('Comment added');
      } catch (e) { /* the write layer toasts the failure */ }
      setBusy(false);
    };

    const save = async () => {
      const title = f.title.trim();
      if (!title) { M.toast('Give the task a title.', true); return; }
      setBusy(true);
      const now = Date.now();
      let ok = false;
      try {
        if (isNew) {
          const id = U.uid();
          await W.set('tasks/' + id, {
            title, owner: f.owner, client: f.client, project: f.project, section: f.section, due: f.due,
            status: f.status, priority: f.priority, link: f.link.trim(), revisions: 0, shown20: !!f.shown20,
            subtasks: localSubs, comments: {}, by: uid, created: now, updated: now,
            doneAt: f.status === 'done' ? now : null
          });
          M.toast('Task created');
        } else {
          const prev = (task && task.status) || 'todo';
          const sp = prev === f.status ? {patch: {doneAt: (task && task.doneAt) || null}, msg: 'Saved'} : statusPatch(task, f.status, uid);
          await W.update(path, {
            title, owner: f.owner, client: f.client, project: f.project, section: f.section, due: f.due,
            status: f.status, priority: f.priority, link: f.link.trim(), shown20: !!f.shown20, ...sp.patch, updated: now
          });
          if (f.status === 'done' && prev !== 'done') M.burst(document.querySelector('.drawer-foot'));
          M.toast(sp.msg);
        }
        ok = true;
      } catch (e) { /* the write layer toasts the failure */ }
      setBusy(false);
      if (ok) onClose();
    };
