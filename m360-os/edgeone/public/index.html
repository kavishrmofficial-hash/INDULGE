    const canDelete = !isNew && !!task && (task.by === uid || ctx.isFounder);
    const delTask = async () => {
      try {
        await W.del(path);
        M.toast('Task deleted');
        onClose();
      } catch (e) { /* the write layer toasts the failure */ }
    };

    const href = safeHref(f.link);
    const rev = Number(task && task.revisions) || 0;

    const footer = html`<${React.Fragment}>
      ${canDelete ? html`<div class="grow"><${UI.ConfirmBtn} onConfirm=${delTask}>Delete<//></div>` : null}
      <${UI.Btn} disabled=${busy} onClick=${save}>${isNew ? 'Create task' : 'Save'}<//>
    <//>`;

    if (!isNew && !task) {
      return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Task">
        <${UI.Empty} text="This task is gone."/>
      <//>`;
    }

    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${isNew ? 'New task' : 'Task'} footer=${footer}>
      <${UI.Input} id="task-title" label="title" value=${f.title} onChange=${set('title')} placeholder="What needs to happen"/>
      <${UI.Field} label="status">
        <${UI.Seg} options=${STATUSES} value=${f.status} onChange=${set('status')} ariaLabel="Status"/>
      <//>
      <div class="grid2">
        <${UI.Select} id="task-owner" label="owner" value=${f.owner} onChange=${set('owner')} options=${ownerOpts}/>
        <${UI.Input} id="task-due" label="due" type="date" value=${f.due} onChange=${set('due')}/>
      </div>
      <div class="grid2">
        <${UI.Select} id="task-priority" label="priority" value=${f.priority} onChange=${set('priority')} options=${PRIORITIES}/>
        <${UI.Select} id="task-project" label="project" value=${f.project} onChange=${onProject} options=${projOpts}/>
      </div>
      <div class="grid2">
        <${UI.Select} id="task-section" label="section" value=${f.section} onChange=${set('section')} options=${secOpts}/>
        <${UI.Select} id="task-client" label="client" value=${f.client} onChange=${set('client')} options=${clientOpts}/>
      </div>
      <${UI.Input} id="task-link" label="link to the output" value=${f.link} onChange=${set('link')} placeholder="https://"/>
      <${UI.Check} label="Rough direction shown at the 20% check" checked=${f.shown20} onChange=${set('shown20')}/>
      <div class="row between small">
        <span class="sub">${revNote(rev)}</span>
        ${!isNew && M.focus && f.owner === uid && f.status !== 'done' ? html`<button type="button" class="linky" onClick=${() => { onClose(); M.focus.open(taskId); }}>Start focus</button>` : null}
        ${href ? html`<a class="linky" href=${href} target="_blank" rel="noopener noreferrer">Open the output</a>` : null}
      </div>

      <hr class="hair" style=${{margin: '2px 0'}}/>
      <${UI.Micro} plain>subtasks<//>
      <div class="stack tight">
        ${subList.length ? subList.map(s => html`<div key=${s.id} class="row between nowrap">
          <${UI.Check} label=${s.t} checked=${!!s.done} onChange=${v => tickSub(s.id, v)}/>
          <button type="button" class="iconbtn" aria-label="Delete subtask" title="Delete subtask" onClick=${() => delSub(s.id)}><${icons.trash}/></button>
        </div>`) : html`<${UI.Empty} text="No subtasks yet."/>`}
        <${UI.Input} id="task-subtask" value=${subText} onChange=${setSubText} onEnter=${addSub} placeholder="Add a subtask and press Enter"/>
      </div>

      <hr class="hair" style=${{margin: '2px 0'}}/>
      <${UI.Micro} plain>comments<//>
      ${isNew ? html`<${UI.Empty} text="Comments open once the task exists."/>` : html`<div class="stack tight">
        ${cList.length ? cList.map(c => html`<div key=${c.id} class="row nowrap" style=${{alignItems: 'flex-start'}}>
          <${UI.Avatar} id=${c.by} size=${26}/>
          <div class="grow">
            <div class="row" style=${{gap: '8px'}}>
              <b class="small"><${UI.Name} id=${c.by}/></b>
              <span class="sub tiny">${U.timeAgo(c.at || 0)}</span>
            </div>
            <div class="small" style=${{whiteSpace: 'pre-wrap', overflowWrap: 'anywhere'}}><${CommentText} text=${c.t} names=${memberNames}/></div>
          </div>
        </div>`) : html`<${UI.Empty} text="No comments yet."/>`}
        <${UI.TextArea} id="task-comment" value=${comment} onChange=${setComment} rows=${2} placeholder="Write a comment. @ mentions a teammate"/>
        <${MentionMenu} hits=${mention.hits} pick=${mention.pick}/>
        <div class="row" style=${{justifyContent: 'flex-end'}}>
          <${UI.Btn} kind="sec" sm disabled=${busy || !comment.trim()} onClick=${addComment}>Add comment<//>
        </div>
      </div>`}
    <//>`;
  }

  /* ---------- page ---------- */
  function Tasks({id}) {
    const ctx = M.useCtx();
    const [who, setWho] = useState('mine');
    const [proj, setProj] = useState('');
    const [client, setClient] = useState('');
    const [drawer, setDrawer] = useState(() => (id ? {id} : null));
    useEffect(() => { if (id) setDrawer({id}); }, [id]);
    M.useIntent('newtask', () => setDrawer({id: null}));
    const [dueDefault, setDueDefault] = useState('');
    useEffect(() => {
      const on = () => { const m = /^newtask:(\d{4}-\d{2}-\d{2})$/.exec(M._intentPeek ? M._intentPeek() : ''); if (m) { M._intentTake(); setDueDefault(m[1]); setDrawer({id: null}); } };
      on(); window.addEventListener('m360:intent', on);
      return () => window.removeEventListener('m360:intent', on);
    }, []);

    /* drag a card between columns */
    const [over, setOver] = useState(null);
    const drag = useRef(null);
    const onDrag = (task, e, cardEl) => {
      const ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.innerHTML = cardEl ? cardEl.outerHTML : '';
      document.body.appendChild(ghost);
      const move = ev => {
        ghost.style.left = (ev.clientX + 8) + 'px'; ghost.style.top = (ev.clientY + 8) + 'px';
        const col = document.elementsFromPoint(ev.clientX, ev.clientY).map(x => x.closest && x.closest('.colm[data-status]')).find(Boolean);
        setOver(col ? col.getAttribute('data-status') : null);
        drag.current = {task, status: col ? col.getAttribute('data-status') : null};
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        ghost.remove();
        const d = drag.current; drag.current = null;
        setOver(null);
        if (cardEl) cardEl.classList.remove('dragging');
        if (d && d.status && d.status !== task.status) moveTask(ctx, task, d.status, document.querySelector('.colm[data-status="' + d.status + '"]'));
        suppressClick.current = Date.now();
      };
      if (cardEl) cardEl.classList.add('dragging');
      drag.current = {task, status: null};
      move(e);
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    };
    const suppressClick = useRef(0);

    const projects = (ctx.coll.projects && ctx.coll.projects.map) || {};
    const clients = (ctx.coll.clients && ctx.coll.clients.map) || {};
    const today = U.todayStr();
    const tasks = useMemo(() => allTasks(ctx), [ctx.coll.tasks]);

    const projOpts = [{v: '', label: 'All projects'}].concat(sortedOpts(projects));
    const clientOpts = [{v: '', label: 'All clients'}].concat(sortedOpts(clients));

    const filtered = tasks.filter(t =>
      (who === 'all' || t.owner === ctx.uid) &&
      (!proj || t.project === proj) &&
      (!client || t.client === client));
    const cols = STATUSES.map(s => {
      let list = filtered.filter(t => (t.status || 'todo') === s.v);
      if (s.v === 'done') {
        list = list.filter(t => t.doneAt && ctx.now - t.doneAt <= DONE_WINDOW_MS).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      } else list.sort(byDue);
      return {...s, list};
    });

    const mine = tasks.filter(t => t.owner === ctx.uid && t.status !== 'done');
    const myOverdue = mine.filter(t => isOverdue(t, today)).length;
    const micro = mine.length + ' open' + (myOverdue ? ', ' + myOverdue + ' overdue' : '');

    const closeDrawer = () => { setDrawer(null); setDueDefault(''); if (id) M.nav('#tasks'); };
    const openTask = tid => { if (Date.now() - suppressClick.current < 300) return; setDrawer({id: tid}); };

    return html`<${React.Fragment}>
      <${UI.PageHead} micro=${micro} title="My tasks">
        <${UI.Btn} onClick=${() => setDrawer({id: null})}><${icons.plus}/>New task<//>
      <//>
      <div class="row between">
        <${UI.Seg} options=${WHO} value=${who} onChange=${setWho} ariaLabel="Whose tasks"/>
        <div class="row grow" style=${{justifyContent: 'flex-end'}}>
          <div style=${SEL_STYLE}><${UI.Select} id="task-filter-project" value=${proj} onChange=${setProj} options=${projOpts}/></div>
          <div style=${SEL_STYLE}><${UI.Select} id="task-filter-client" value=${client} onChange=${setClient} options=${clientOpts}/></div>
        </div>
      </div>
      <${UI.Card}>
        <div class="board-wrap"><div class="board">
          ${cols.map(c => html`<div key=${c.v} class=${'colm' + (over === c.v ? ' over' : '')} data-status=${c.v}>
            <div class="col-head"><span>${c.label}</span><span class="num">${c.list.length}</span></div>
            ${c.list.length
              ? c.list.map(t => html`<${TaskCard} key=${t.id} task=${t} projects=${projects} clients=${clients} today=${today} onOpen=${openTask} onDrag=${onDrag}/>`)
              : html`<div style=${{padding: '2px 6px 6px'}}><${UI.Empty} text="Nothing here."/></div>`}
          </div>`)}
        </div></div>
      <//>
      ${drawer ? html`<${TaskDrawer} key=${drawer.id || 'new'} taskId=${drawer.id} onClose=${closeDrawer}
        defaults=${{project: proj, client, owner: ctx.uid, due: dueDefault}}/>` : null}
    <//>`;
  }

  M.pages.Tasks = Tasks;
  M.parts.TaskDrawer = TaskDrawer;
  M.tasks = {isOverdue, progress, open, STATUSES, PRIORITIES, dueLabel, revNote, moveTask, statusPatch};
})();

/* ==== 22-projects.js ==== */
/* module: projects */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect, useMemo, useRef} = React;

  const TEMPLATES = {
    campaign: {label: 'Campaign', sections: ['Brief', 'Strategy', 'Creative', 'Production', 'Live', 'Report']},
    retainer: {label: 'Retainer month', sections: ['Plan', 'Create', 'Approve', 'Publish', 'Report']},
    pitch: {label: 'Pitch', sections: ['Research', 'Diagnostic', 'Strategy', 'Proposal', 'Follow-up']},
    internal: {label: 'Internal', sections: ['To do', 'Doing', 'Done']}
  };
  const STATUS = {
    on: {label: 'On track', pill: 'ink'},
    risk: {label: 'At risk', pill: 'flame-o'},
    off: {label: 'Off track', pill: 'flame'},
    done: {label: 'Done', pill: 'warm'}
  };
  const STATUS_OPTS = ['on', 'risk', 'off', 'done'].map(v => ({v, label: STATUS[v].label}));
  const KINDS = [{v: 'client', label: 'Client'}, {v: 'pitch', label: 'Pitch'}, {v: 'internal', label: 'Internal'}];
  const KIND_FILTER = [{v: 'all', label: 'All'}].concat(KINDS);
  const SCOPES = [{v: 'active', label: 'Active'}, {v: 'done', label: 'Done'}, {v: 'all', label: 'All'}];
  const TABS = [{v: 'list', label: 'List'}, {v: 'board', label: 'Board'}, {v: 'overview', label: 'Overview'}];
  const TASK_STATUS = {
    todo: {label: 'To do', pill: 'outline'},
    doing: {label: 'Doing', pill: 'warm'},
    review: {label: 'In review', pill: 'flame-o'},
    done: {label: 'Done', pill: 'ink'}
  };
  const TPL_OPTS = Object.keys(TEMPLATES).map(k => ({v: k, label: TEMPLATES[k].label}));

  /* ids of projects whose first write is still in flight, so the page shows a loading line */
  const fresh = new Set();

  /* swallow a rejected write: the core already toasts the failure */
  const after = (p, msg) => p.then(() => { if (msg) M.toast(msg); }, () => {});

  /* a checkbox shows the tapped state while its write is in flight, then follows the document */
  function useOptimistic(value) {
    const [opt, setOpt] = useState(null);
    useEffect(() => { setOpt(null); }, [value]);
    return [opt == null ? value : opt, setOpt];
  }

  function create(ctx, {name, kind, template, client, pitch, owner, due}) {
    const id = U.uid();
    const k = KINDS.some(x => x.v === kind) ? kind : 'internal';
    const tpl = TEMPLATES[template] || TEMPLATES[k] || TEMPLATES.campaign;
    const own = owner || ctx.uid;
    const doc = {
      name: String(name || '').trim(), kind: k,
      client: k === 'client' ? (client || '') : '',
      pitch: k === 'pitch' ? (pitch || '') : '',
      owner: own, members: [own], status: 'on', start: U.todayStr(), due: due || '', desc: '',
      sections: tpl.sections.map(n => ({id: U.uid(), name: n})),
      updates: {}, archived: false, by: ctx.uid, created: Date.now()
    };
    fresh.add(id);
    const settle = () => fresh.delete(id);
    ctx.W.set('projects/' + id, doc).then(settle, settle);
    return id;
  }

  /* ---------- task helpers, with fallbacks while the tasks module is absent ---------- */
  const tasksOf = (ctx, pid) => Object.keys(ctx.coll.tasks.map)
    .map(id => ({id, ...ctx.coll.tasks.map[id]}))
    .filter(t => t.project === pid);
  const localOverdue = (t, today) => t.status !== 'done' && !!t.due && t.due < today;
  const overdueFn = () => (M.tasks && M.tasks.isOverdue) || localOverdue;
  function progressOf(ctx, pid) {
    if (M.tasks && M.tasks.progress) {
      const r = M.tasks.progress(ctx, pid) || {};
      return {done: r.done || 0, total: r.total || 0, overdue: r.overdue || 0};
    }
    const today = U.todayStr();
    const isOd = overdueFn();
    const ts = tasksOf(ctx, pid);
    return {done: ts.filter(t => t.status === 'done').length, total: ts.length, overdue: ts.filter(t => isOd(t, today)).length};
  }
  const dueKey = x => x.due || '9999-99-99';
  const sortByDue = (a, b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : String(a.name || '').localeCompare(String(b.name || ''));
  const sortTasks = (a, b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : (a.created || 0) - (b.created || 0);

  /* the client or pitch a project belongs to, as display text */
  function linkName(ctx, p) {
    if (p.kind === 'client') { const c = p.client && ctx.coll.clients.map[p.client]; return c ? (c.name || 'Client') : 'Client'; }
    if (p.kind === 'pitch') { const x = p.pitch && ctx.coll.pitches.map[p.pitch]; return x ? (x.brand || 'Pitch') : 'Pitch'; }
    return 'Internal';
  }

  const StatusPill = ({status}) => { const s = STATUS[status] || STATUS.on; return html`<${UI.Pill} kind=${s.pill}>${s.label}<//>`; };
  const TaskPill = ({status}) => { const s = TASK_STATUS[status] || TASK_STATUS.todo; return html`<${UI.Pill} kind=${s.pill}>${s.label}<//>`; };
  const Progress = ({prog}) => html`<div class="row nowrap">
    <${UI.Bar} a=${prog.done} max=${prog.total}/>
    <span class="tiny num sub">${prog.done} of ${prog.total} tasks</span>
    ${prog.overdue > 0 ? html`<span class="tiny num flame-t">${prog.overdue} overdue</span>` : null}
  </div>`;

  /* ---------- list ---------- */
  function ProjectCard({p, ctx, today}) {
    const prog = progressOf(ctx, p.id);
    const late = p.status !== 'done' && !!p.due && p.due < today;
    return html`<button type="button" class="rowbtn" style=${{fontWeight: 300}} aria-label=${'Open ' + p.name}
      onClick=${() => M.nav('#projects/' + p.id)}>
      <div class="card stack tight">
        <div class="row between nowrap"><b class="grow">${p.name}</b><${StatusPill} status=${p.status}/></div>
        <div class="sub small">${linkName(ctx, p)}</div>
        <div class="row">
          <${UI.Avatar} id=${p.owner} size=${24}/>
          <span class=${'small num' + (late ? ' flame-t' : ' sub')}>${p.due ? 'due ' + U.fmtDate(p.due) : 'no due date'}</span>
        </div>
        <${Progress} prog=${prog}/>
      </div>
    </button>`;
  }

  function NewProjectDrawer({open, onClose}) {
    const ctx = M.useCtx();
    const blank = () => ({name: '', kind: 'client', template: 'campaign', client: '', pitch: '', owner: ctx.uid, due: ''});
    const [f, setF] = useState(blank);
    const [busy, setBusy] = useState(false);
    useEffect(() => { if (open) { setF(blank()); setBusy(false); } }, [open]);
    const set = (k, v) => setF(x => ({...x, [k]: v}));
    const setKind = k => setF(x => ({...x, kind: k, template: TEMPLATES[k] ? k : 'campaign'}));
    const memberIds = useMemo(() => {
      const ids = ctx.activeMembers.map(m => m.uid);
      if (!ids.includes(ctx.uid)) ids.unshift(ctx.uid);
      return ids;
    }, [ctx.activeMembers, ctx.uid]);
    const profs = M.useProfiles(memberIds);
    const ownerOpts = memberIds.map(u => ({v: u, label: (profs[u] && profs[u].name) || 'Someone'}));
    const byLabel = (a, b) => a.label.localeCompare(b.label);
    const clientOpts = [{v: '', label: 'Choose a client'}].concat(Object.keys(ctx.coll.clients.map)
      .map(id => ({v: id, label: ctx.coll.clients.map[id].name || id})).sort(byLabel));
    const pitchOpts = [{v: '', label: 'Choose a pitch'}].concat(Object.keys(ctx.coll.pitches.map)
      .map(id => ({v: id, label: ctx.coll.pitches.map[id].brand || id})).sort(byLabel));
    const canSave = !!f.name.trim() && !busy;
    const submit = () => {
      if (!canSave) return;
      setBusy(true);
      const id = create(ctx, f);
      M.toast('Project created');
      onClose();
      M.nav('#projects/' + id);
    };
    const tpl = TEMPLATES[f.template] || TEMPLATES.campaign;
    return html`<${UI.Drawer} open=${open} onClose=${onClose} title="New project"
      footer=${html`<${UI.Btn} disabled=${!canSave} onClick=${submit}>Create project<//>`}>
      <${UI.Input} id="proj-name" label="Name" value=${f.name} onChange=${v => set('name', v)} placeholder="Swisse Q4 campaign" onEnter=${submit}/>
      <${UI.Select} id="proj-kind" label="Kind" value=${f.kind} onChange=${setKind} options=${KINDS}/>
      <${UI.Select} id="proj-template" label="Template" value=${f.template} onChange=${v => set('template', v)} options=${TPL_OPTS}
        hint=${'Sections: ' + tpl.sections.join(', ')}/>
      ${f.kind === 'client' ? html`<${UI.Select} id="proj-client" label="Client" value=${f.client} onChange=${v => set('client', v)} options=${clientOpts}/>` : null}
      ${f.kind === 'pitch' ? html`<${UI.Select} id="proj-pitch" label="Pitch" value=${f.pitch} onChange=${v => set('pitch', v)} options=${pitchOpts}/>` : null}
      <${UI.Select} id="proj-owner" label="Owner" value=${f.owner} onChange=${v => set('owner', v)} options=${ownerOpts}/>
      <${UI.Input} id="proj-due" label="Due date" type="date" value=${f.due} onChange=${v => set('due', v)}/>
    <//>`;
  }

  function ProjectsList() {
    const ctx = M.useCtx();
    const [scope, setScope] = useState('active');
    const [kind, setKind] = useState('all');
    const [open, setOpen] = useState(false);
    M.useIntent('project', () => setOpen(true));
    const today = U.todayStr();
    const all = Object.keys(ctx.coll.projects.map).map(id => ({id, ...ctx.coll.projects.map[id]}));
    const isActive = p => p.status !== 'done' && !p.archived;
    const list = all.filter(p => {
      if (scope === 'active' && !isActive(p)) return false;
      if (scope === 'done' && p.status !== 'done') return false;
      if (kind !== 'all' && p.kind !== kind) return false;
      return true;
    }).sort(sortByDue);

  /* ---------- project page: list tab ---------- */
  function AddTask({ctx, project, section}) {
    const [v, setV] = useState('');

        title, owner: ctx.uid, client: project.client || '', project: project.id, section: section.id,
        due: '', status: 'todo', priority: 'normal', link: '', revisions: 0, shown20: false,

  function TaskRow({t, ctx, today, isOd, onOpen}) {

  function ListTab({ctx, project, tasks, onOpen}) {

  function MemberCheck({u, checked, onToggle}) {

  function MembersCard({ctx, project}) {

      </div>
    <//>`;

  function SectionRow({s, i, n, count, onRename, onUp, onDown, onDelete}) {
    const [v, setV] = useState(s.name);
    const sent = useRef(null);
    useEffect(() => { setV(s.name); sent.current = null; }, [s.name]);
    const commit = () => {
      const name = v.trim();

      sent.current = name;
      onRename(name);

    return html`<div class="row nowrap">
      <input id=${'sec-name-' + s.id} class="input grow" value=${v} aria-label="Section name"
        onInput=${e => setV(e.target.value)} onBlur=${commit}
        onKeyDown=${e => { if (e.key === 'Enter') commit(); }}/>
      <span class="tiny num sub" style=${{width: '22px', textAlign: 'right'}}>${count}</span>
      <${UI.Btn} kind="ghost" sm disabled=${i === 0} onClick=${onUp} ariaLabel="Move up"><${icons.up}/><//>
      <${UI.Btn} kind="ghost" sm disabled=${i === n - 1} onClick=${onDown} ariaLabel="Move down"><${icons.down}/><//>
      ${count ? html`<${UI.Btn} kind="ghost" sm disabled title="Move its tasks first" ariaLabel="Delete section"><${icons.trash}/><//>`
        : html`<${UI.ConfirmBtn} onConfirm=${onDelete} label="Tap again to delete"><${icons.trash}/><//>`}
    </div>`;
  }

  function SectionsCard({ctx, project, tasks}) {
    const secs = project.sections || [];
    const [nv, setNv] = useState('');
    const write = next => ctx.W.update('projects/' + project.id, {sections: next});
    const rename = (i, name) => { const next = U.clone(secs); next[i] = {...next[i], name}; after(write(next), 'Section renamed'); };
    const swap = (i, j) => {
      if (j < 0 || j >= secs.length) return;
      const next = U.clone(secs); const t = next[i]; next[i] = next[j]; next[j] = t;
      after(write(next));
    };
    const remove = i => { const next = U.clone(secs); next.splice(i, 1); after(write(next), 'Section removed'); };
    const add = raw => {
      const name = String(raw == null ? nv : raw).trim();
      if (!name) return;
      after(write(secs.concat([{id: U.uid(), name}])), 'Section added');
      setNv('');
    };
    const counts = {};
    tasks.forEach(t => { counts[t.section] = (counts[t.section] || 0) + 1; });
    return html`<${UI.Card} title="Sections">
      <div class="stack tight">
        ${secs.map((s, i) => html`<${SectionRow} key=${s.id} s=${s} i=${i} n=${secs.length} count=${counts[s.id] || 0}
          onRename=${name => rename(i, name)} onUp=${() => swap(i, i - 1)} onDown=${() => swap(i, i + 1)} onDelete=${() => remove(i)}/>`)}
        ${!secs.length ? html`<${UI.Empty} text="No sections yet."/>` : null}
      </div>
      <div class="row nowrap" style=${{marginTop: '10px'}}>
        <div class="grow"><${UI.Input} id="add-section" value=${nv} onChange=${setNv} placeholder="Add section" onEnter=${add}/></div>
        <${UI.Btn} kind="sec" sm disabled=${!nv.trim()} onClick=${() => add()}>Add section<//>
      </div>
    <//>`;
  }

  function OverviewTab({ctx, project, tasks}) {
    return html`<div class="grid2">
      <div class="stack"><${DescCard} ctx=${ctx} project=${project}/><${UpdatesCard} ctx=${ctx} project=${project}/></div>
      <div class="stack"><${MembersCard} ctx=${ctx} project=${project}/><${SectionsCard} ctx=${ctx} project=${project} tasks=${tasks}/></div>
    </div>`;
  }

  /* ---------- project page ---------- */
  function ProjectPage({id}) {
    const ctx = M.useCtx();
    const [tab, setTab] = useState('list');
    const [openTask, setOpenTask] = useState(null);
    useEffect(() => { setOpenTask(null); }, [id]);
    const p = ctx.coll.projects.map[id];
    const back = html`<${UI.Btn} kind="sec" sm onClick=${() => M.nav('#projects')}><${icons.chevL}/>All projects<//>`;
    if (!p) {
      const waiting = !ctx.coll.projects.ready || fresh.has(id);
      return html`<${React.Fragment}>
        <${UI.PageHead} micro="projects" title="Project">${back}<//>
        <${UI.Empty} text=${waiting ? 'Loading the project.' : 'No project with this link.'}/>
      <//>`;
    }
    const project = {id, ...p};
    const tasks = tasksOf(ctx, id).sort(sortTasks);
    const prog = progressOf(ctx, id);
    const today = U.todayStr();
    const late = project.status !== 'done' && !!project.due && project.due < today;
    const client = project.client ? ctx.coll.clients.map[project.client] : null;
    const pitch = project.pitch ? ctx.coll.pitches.map[project.pitch] : null;
    const onOpen = t => {
      if (M.parts.TaskDrawer) setOpenTask({taskId: t.id, section: t.section});
      else M.toast('Task details are on their way.');
    };
    const D = M.parts.TaskDrawer;
    const view = tab === 'board' ? BoardTab : tab === 'overview' ? OverviewTab : ListTab;
    return html`<${React.Fragment}>
      <${UI.PageHead} micro=${linkName(ctx, project)} title=${project.name}>${back}<//>
      <${UI.Card}>
        <div class="stack">
          <div class="row">
            <${StatusPill} status=${project.status}/>
            <span class="row nowrap small"><${UI.Avatar} id=${project.owner} size=${24}/><${UI.Name} id=${project.owner}/></span>
            <${UI.AvatarRow} ids=${project.members || []} size=${24}/>
            <span class=${'small num' + (late ? ' flame-t' : ' sub')}>${project.due ? 'due ' + U.fmtDate(project.due) : 'no due date'}</span>
            ${client ? html`<${UI.Btn} kind="ghost" sm onClick=${() => M.nav('#clients')}><${icons.link}/>${client.name || 'Client'}<//>` : null}
            ${pitch ? html`<${UI.Btn} kind="ghost" sm onClick=${() => M.nav('#pitches')}><${icons.link}/>${pitch.brand || 'Pitch'}<//>` : null}
          </div>
          <${Progress} prog=${prog}/>
          <${UI.Seg} options=${TABS} value=${tab} onChange=${setTab} ariaLabel="Project view"/>
        </div>
      <//>
      <${view} ctx=${ctx} project=${project} tasks=${tasks} onOpen=${onOpen}/>
      ${(D && openTask) ? html`<${D} taskId=${openTask.taskId} onClose=${() => setOpenTask(null)}
        defaults=${{project: id, section: openTask.section, client: project.client || '', owner: ctx.uid}}/>` : null}
    <//>`;
  }

  function Projects({id}) {
    return id ? html`<${ProjectPage} id=${id}/>` : html`<${ProjectsList}/>`;
  }

  M.pages.Projects = Projects;
  M.projects = {TEMPLATES, STATUS, create, tasksOf, progress: progressOf};
})();

/* ==== 23-pitches.js ==== */
/* module: pitches */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useEffect, useMemo} = React;

  /* stages in board order, each with its default probability in percent */
  const STAGES = [
    {v: 'lead', label: 'Lead', prob: 10},
    {v: 'qualified', label: 'Qualified', prob: 25},
    {v: 'diagnostic', label: 'Diagnostic', prob: 40},
    {v: 'proposal', label: 'Proposal sent', prob: 55},
    {v: 'negotiation', label: 'Negotiation', prob: 75},
    {v: 'won', label: 'Won', prob: 100},
    {v: 'lost', label: 'Lost', prob: 0}
  ];
  const STAGE_OF = {};
  STAGES.forEach(s => { STAGE_OF[s.v] = s; });
  const STAGE_OPTS = STAGES.map(s => ({v: s.v, label: s.label}));
  const OPEN_STAGES = STAGES.filter(s => s.v !== 'won' && s.v !== 'lost');
  const DAY = 86400000;

  const stageOf = p => STAGE_OF[p && p.stage] || STAGE_OF.lead;
  const isClosed = p => { const v = stageOf(p).v; return v === 'won' || v === 'lost'; };
  const isOverdue = (p, today) => !isClosed(p) && !!p.nextDate && p.nextDate < today;

  /* the founder's private finance entries per pitch: {[id]: {value, prob}}; empty for everyone else */
  const financePath = ctx => 'data/users/' + (ctx.founderUid || ctx.uid) + '/finance';
  const financeOf = ctx => {
    const d = ctx.priv && ctx.priv.finance && ctx.priv.finance.data;
    return (d && d.pitch) || {};
  };
  const valueOf = fe => { const n = Number(fe && fe.value); return isFinite(n) && n > 0 ? n : 0; };
  const hasProb = fe => fe && fe.prob !== null && fe.prob !== undefined && fe.prob !== '' && isFinite(Number(fe.prob));
  /* the probability override when set, else the stage default */
  const probOf = (p, fe) => hasProb(fe) ? Math.max(0, Math.min(100, Number(fe.prob))) : stageOf(p).prob;

  /* Weighted pipeline sums open pitches only. Won and lost pitches sit outside the pipeline, so they add 0 here;
     their value still shows under byStage.won.value and byStage.lost.value. */
  function metrics(ctx) {
    const map = (ctx.coll && ctx.coll.pitches && ctx.coll.pitches.map) || {};
    const fin = financeOf(ctx);
    const today = U.todayStr();
    const cut = (ctx.now || Date.now()) - 90 * DAY;
    const byStage = {};
    STAGES.forEach(s => { byStage[s.v] = {count: 0, value: 0}; });
    let weighted = 0, won = 0, lost = 0;
    const overdue = [];
    for (const id of Object.keys(map)) {
      const p = map[id];
      const st = stageOf(p).v;
      const fe = fin[id];
      const value = valueOf(fe);
      byStage[st].count += 1;
      byStage[st].value += value;
      if (st === 'won' || st === 'lost') {
        if ((p.stageAt || 0) >= cut) { if (st === 'won') won += 1; else lost += 1; }
        continue;
      }
      weighted += value * probOf(p, fe) / 100;
      if (isOverdue(p, today)) overdue.push(id);
    }
    const winRate90 = (won + lost) > 0 ? Math.round(100 * won / (won + lost)) : null;
    return {weighted: Math.round(weighted), byStage, winRate90, overdue};
  }

  /* soonest next date first, then the freshest stage change */
  const nextKey = p => p.nextDate || '9999-99-99';
  const sortCol = (a, b) => {
    const ka = nextKey(a), kb = nextKey(b);
    if (ka !== kb) return ka < kb ? -1 : 1;
    return (b.stageAt || 0) - (a.stageAt || 0);
  };

  const daysText = n => n === 1 ? '1 day in stage' : n + ' days in stage';

  /* the client page whose name matches this brand, when one exists */
  const clientFor = (ctx, brand) => {
    const map = ctx.coll.clients.map;
    const key = String(brand || '').trim().toLowerCase();
    if (!key) return null;
    return Object.keys(map).find(id => String(map[id].name || '').trim().toLowerCase() === key) || null;
  };

  /* ---------- founder metrics bar ---------- */
  function Tile({id, v, l, flame}) {
    return html`<${UI.Card} id=${id}><div class="kpi">
      <div class=${'v num' + (flame ? ' flame-t' : '')}>${v}</div>
      <div class="l">${l}</div>
    </div><//>`;
  }

  function MetricsBar({m}) {
    const inPlay = OPEN_STAGES.reduce((n, s) => n + m.byStage[s.v].count, 0);
    const od = m.overdue.length;
    return html`<${React.Fragment}>
      <div class="kpi-rail">
        <${Tile} id="kpi-weighted" v=${U.inr(m.weighted)} l="weighted pipeline"/>
        <${Tile} id="kpi-open" v=${inPlay} l="pitches in play"/>
        <${Tile} id="kpi-win" v=${m.winRate90 == null ? 'no data' : m.winRate90 + '%'} l="win rate, 90 days"/>
        <${Tile} id="kpi-overdue" v=${od} l="next steps overdue" flame=${od > 0}/>
      </div>
      <${UI.Card} title="Count by stage" id="stage-counts">
        <div class="row">
          ${STAGES.map(s => html`<${UI.Pill} key=${s.v} kind=${m.byStage[s.v].count ? 'warm' : undefined}>
            ${s.label} <span class="num">${m.byStage[s.v].count}</span><//>`)}
        </div>
      <//>
    <//>`;
  }

  /* ---------- board ---------- */
  function PitchCard({p, fe, founder, today, now, onOpen}) {
    const days = Math.max(0, Math.floor((now - (p.stageAt || p.created || now)) / DAY));
    const od = isOverdue(p, today);
    const value = founder ? valueOf(fe) : 0;
    return html`<button type="button" class="tcard" style=${{fontWeight: 300}} data-pitch=${p.id}
      aria-label=${'Open ' + (p.brand || 'pitch')} onClick=${() => onOpen(p.id)}>
      <span class="t">${p.brand || 'Untitled'}</span>
      ${p.category ? html`<span class="small sub">${p.category}</span>` : null}
      <span class="row between nowrap">
        <span class="row nowrap"><${UI.Avatar} id=${p.owner} size=${22}/><span class="tiny num sub">${daysText(days)}</span></span>
        ${value > 0 ? html`<span class="small num">${U.inr(value)}</span>` : null}
      </span>
      ${(p.next || p.nextDate) ? html`<span class="row between nowrap">
        <span class="small grow" style=${{overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>${p.next || 'Next step'}</span>
        ${p.nextDate ? html`<span class=${'tiny num' + (od ? ' flame-t' : ' sub')}>${U.fmtDay(p.nextDate)}</span>` : null}
      </span>` : null}
    </button>`;
  }

  function Board({ctx, all, fin, onOpen}) {
    const today = U.todayStr();
    const now = ctx.now || Date.now();
    return html`<${UI.Card}><div class="board-wrap"><div class="board">
      ${STAGES.map(s => {
        const list = all.filter(p => stageOf(p).v === s.v).sort(sortCol);
        return html`<div class="colm" key=${s.v} data-stage=${s.v}>
          <div class="col-head"><span>${s.label}</span><span class="num">${list.length}</span></div>
          ${list.length ? list.map(p => html`<${PitchCard} key=${p.id} p=${p} fe=${fin[p.id]} founder=${ctx.isFounder} today=${today} now=${now} onOpen=${onOpen}/>`)
            : html`<div style=${{padding: '2px 6px'}}><${UI.Empty} text="No pitches"/></div>`}
        </div>`;
      })}
    </div></div><//>`;
  }

  /* ---------- drawer ---------- */
  function PitchDrawer({pitchId, onClose}) {
    const ctx = M.useCtx();
    const {W} = ctx;
    const isNew = !pitchId;
    const pitch = pitchId ? ctx.coll.pitches.map[pitchId] : null;
    const finReady = !!(ctx.priv && ctx.priv.finance && ctx.priv.finance.ready);
    const fe = pitchId ? financeOf(ctx)[pitchId] : null;

    const blank = () => ({brand: '', category: '', contact: '', source: '', stage: 'lead', owner: ctx.uid,
      next: '', nextDate: '', lost: '', value: '', prob: ''});
    const fromDoc = (p, e) => ({
      brand: p.brand || '', category: p.category || '', contact: p.contact || '', source: p.source || '',
      stage: stageOf(p).v, owner: p.owner || ctx.uid, next: p.next || '', nextDate: p.nextDate || '', lost: p.lost || '',
      value: valueOf(e) > 0 ? String(valueOf(e)) : '', prob: hasProb(e) ? String(Number(e.prob)) : ''
    });
    const [f, setF] = useState(() => pitch ? fromDoc(pitch, fe) : blank());
    const [busy, setBusy] = useState(false);
    useEffect(() => {
      const p = pitchId ? ctx.coll.pitches.map[pitchId] : null;
      setF(p ? fromDoc(p, pitchId ? financeOf(ctx)[pitchId] : null) : blank());
      setBusy(false);
    }, [pitchId, finReady]);
    const set = k => v => setF(x => ({...x, [k]: v}));

    const memberIds = useMemo(() => {
      const ids = ctx.activeMembers.map(m => m.uid);
      if (!ids.includes(ctx.uid)) ids.unshift(ctx.uid);
      if (pitch && pitch.owner && !ids.includes(pitch.owner)) ids.push(pitch.owner);
      return ids;
    }, [ctx.activeMembers, ctx.uid, pitch && pitch.owner]);
    const profs = M.useProfiles(memberIds);
    const ownerOpts = memberIds.map(u => ({v: u, label: (profs[u] && profs[u].name) || 'Someone'}));

    const project = pitch && pitch.project ? ctx.coll.projects.map[pitch.project] : null;
    const projects = M.projects;
    const canCreateProject = !!(projects && typeof projects.create === 'function');
    const clientId = pitch ? clientFor(ctx, pitch.brand) : null;
    const canSave = !!f.brand.trim() && !busy;

    const save = () => {
      if (!canSave) return;
      setBusy(true);
      const now = Date.now();
      const id = isNew ? U.uid() : pitchId;
      const body = {brand: f.brand.trim(), category: f.category.trim(), contact: f.contact.trim(),
        source: f.source.trim(), owner: f.owner || ctx.uid, updated: now};
      let p;
      if (isNew) {
        p = W.set('pitches/' + id, {...body, stage: 'lead', stageAt: now, next: '', nextDate: '', project: '', lost: '', created: now});
      } else {
        p = W.update('pitches/' + id, {...body, stage: f.stage,
          stageAt: f.stage !== stageOf(pitch).v ? now : (pitch.stageAt || now),
          next: f.next.trim(), nextDate: f.nextDate || '', lost: f.lost.trim()});
      }
      if (ctx.isFounder && (fe || f.value !== '' || f.prob !== '')) {
        const probNum = f.prob === '' ? null : Math.max(0, Math.min(100, Number(f.prob) || 0));
        const entry = {value: Math.max(0, Number(f.value) || 0), prob: probNum};
        p = p.then(() => W.merge(financePath(ctx), {pitch: {[id]: entry}}));
      }
      p.then(() => { M.toast(isNew ? 'Pitch created' : 'Saved'); onClose(); }, () => setBusy(false));
    };

    const startProject = () => {
      if (!canCreateProject || busy || !pitch) return;
      setBusy(true);
      const pid = projects.create(ctx, {name: (pitch.brand || 'Pitch') + ' pitch', kind: 'pitch', template: 'pitch',
        pitch: pitchId, owner: pitch.owner || ctx.uid});
      Promise.all([
        W.update('pitches/' + pitchId, {project: pid, updated: Date.now()}),
        W.update('projects/' + pid, {pitch: pitchId})
      ]).then(() => { M.toast('Pitch project started'); setBusy(false); }, () => setBusy(false));
    };

    const createClient = () => {
      if (busy || !pitch) return;
      setBusy(true);
      const cid = U.uid(), now = Date.now();
      let p = W.set('clients/' + cid, {name: pitch.brand || 'Client', status: 'live', pod: '', owner: pitch.owner || ctx.uid,
        memory: '', approvals: '', never: '', links: '', updated: now, by: ctx.uid});
      /* the founder's private monthly revenue starts from the pitch value */
      if (ctx.isFounder && valueOf(fe) > 0) p = p.then(() => W.merge(financePath(ctx), {clients: {[cid]: {monthly: valueOf(fe)}}}));
      p.then(() => { M.toast('Client page created'); onClose(); M.nav('#clients'); }, () => setBusy(false));
    };

    const createRetainer = () => {
      if (!canCreateProject || busy || !pitch) return;
      setBusy(true);
      const pid = projects.create(ctx, {name: (pitch.brand || 'Client') + ' retainer', kind: 'client', template: 'retainer',
        client: clientId || '', owner: pitch.owner || ctx.uid});
      M.toast('Retainer project created');
      onClose();
      M.nav('#projects/' + pid);
    };

    if (!isNew && !pitch) {
      return html`<${UI.Drawer} open=${true} onClose=${onClose} title="Pitch">
        <${UI.Empty} text=${ctx.coll.pitches.ready ? 'This pitch is gone.' : 'Loading the pitch.'}/>
      <//>`;
    }

    const won = !!pitch && stageOf(pitch).v === 'won';
    const actions = isNew ? null : html`<div class="grow row">
      ${!pitch.project ? html`<${UI.Btn} kind="sec" sm disabled=${!canCreateProject || busy} onClick=${startProject}>Start pitch project<//>` : null}
      ${won ? (clientId
        ? html`<${UI.Btn} kind="sec" sm onClick=${() => M.nav('#clients')}><${icons.link}/>Open client page<//>`
        : html`<${UI.Btn} kind="sec" sm disabled=${busy} onClick=${createClient}>Create client page<//>`) : null}
      ${won ? html`<${UI.Btn} kind="sec" sm disabled=${!canCreateProject || busy} onClick=${createRetainer}>Create retainer project<//>` : null}
    </div>`;
    const footer = html`<${React.Fragment}>
      ${actions}
      <${UI.Btn} disabled=${!canSave} onClick=${save}>${isNew ? 'Create pitch' : 'Save'}<//>
    <//>`;
    const stagePill = pitch ? html`<${UI.Pill} kind=${won ? 'ink' : stageOf(pitch).v === 'lost' ? 'flame' : undefined}>${stageOf(pitch).label}<//>` : null;
    const stageProb = stageOf({stage: f.stage}).prob;

    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${isNew ? 'New pitch' : 'Pitch'} head=${stagePill} footer=${footer}>
      <${UI.Input} id="pitch-brand" label="brand" value=${f.brand} onChange=${set('brand')} placeholder="Brand name" onEnter=${save}/>
      <${UI.Input} id="pitch-category" label="category" value=${f.category} onChange=${set('category')} placeholder="Fine jewellery, hospitality, wellness"/>
      <${UI.Input} id="pitch-contact" label="contact, name and role" value=${f.contact} onChange=${set('contact')} placeholder="Name and role"/>
      <${UI.Input} id="pitch-source" label="source" value=${f.source} onChange=${set('source')} placeholder="Referral, inbound, event"/>
      ${!isNew ? html`<${UI.Field} label="stage">
        <${UI.Seg} sm options=${STAGE_OPTS} value=${f.stage} onChange=${set('stage')} ariaLabel="Stage"/>
      <//>` : null}
      <${UI.Select} id="pitch-owner" label="owner" value=${f.owner} onChange=${set('owner')} options=${ownerOpts}/>
      ${!isNew ? html`<${React.Fragment}>
        <${UI.Input} id="pitch-next" label="next step" value=${f.next} onChange=${set('next')} placeholder="What happens next"/>
        <${UI.Input} id="pitch-nextdate" label="next date" type="date" value=${f.nextDate} onChange=${set('nextDate')}/>
        ${f.stage === 'lost' ? html`<${UI.TextArea} id="pitch-lost" label="lost reason" value=${f.lost} onChange=${set('lost')} rows=${3} placeholder="Why it was lost, in one or two lines"/>` : null}
        ${pitch.project ? html`<${UI.Field} label="project">
          <div><${UI.Btn} kind="sec" sm onClick=${() => M.nav('#projects/' + pitch.project)}><${icons.link}/>${project ? (project.name || 'Project') : 'Open project'}<//></div>
        <//>` : null}
      <//>` : null}
      ${ctx.isFounder ? html`<${React.Fragment}>
        <hr class="hair"/>
        <${UI.Micro}>founder only<//>
        <${UI.Input} id="pitch-value" label="monthly value, ₹" type="number" min="0" step="1000" value=${f.value} onChange=${set('value')} placeholder="0"
          hint="Private to you. Shows on the card and feeds the weighted pipeline."/>
        <${UI.Input} id="pitch-prob" label="probability override, %" type="number" min="0" max="100" step="1" value=${f.prob} onChange=${set('prob')} placeholder=${String(stageProb)}
          hint=${'Blank uses the stage default, ' + stageProb + '%.'}/>
      <//>` : null}
    <//>`;
  }

  /* ---------- page ---------- */
  function Pitches() {
    const ctx = M.useCtx();
    const [open, setOpen] = useState(null);
    M.useIntent('pitch', () => setOpen('new'));
    const map = ctx.coll.pitches.map;
    const all = Object.keys(map).map(id => ({id, ...map[id]}));
    const fin = financeOf(ctx);
    const m = ctx.isFounder ? metrics(ctx) : null;
    const nOpen = all.filter(p => !isClosed(p)).length;
    return html`<${React.Fragment}>
      <${UI.PageHead} micro=${nOpen + ' in play'} title="Pitches">
        <${UI.Btn} onClick=${() => setOpen('new')}><${icons.plus}/>New pitch<//>
      <//>
      ${m ? html`<${MetricsBar} m=${m}/>` : null}
      ${!ctx.coll.pitches.ready ? html`<${UI.Empty} text="Loading pitches."/>`
        : html`<${Board} ctx=${ctx} all=${all} fin=${fin} onOpen=${setOpen}/>`}
      ${open ? html`<${PitchDrawer} pitchId=${open === 'new' ? null : open} onClose=${() => setOpen(null)}/>` : null}
    <//>`;
  }

  M.pages.Pitches = Pitches;
  M.parts.PitchDrawer = PitchDrawer;
  M.pitches = {STAGES, metrics, isOverdue, probOf};
})();

/* ==== 24-clients.js ==== */
/* module: clients (BRIEF 7.16). Client brains, and revenue for the founder only. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo, useEffect} = React;

  const STATUS = [{v: 'live', label: 'Live'}, {v: 'pitch', label: 'Pitch'}, {v: 'paused', label: 'Paused'}];
  const STATUS_PILL = {live: 'ink', pitch: null, paused: 'warm'};
  const FIELDS = ['memory', 'approvals', 'never'];

  function completeness(client) {
    const c = client || {};
    const missing = FIELDS.filter(f => !String(c[f] || '').trim());
    return {filled: FIELDS.length - missing.length, total: FIELDS.length, missing};
  }

  function financeOf(ctx) {
    const d = (ctx.priv && ctx.priv.finance && ctx.priv.finance.data) || {};
    return d.clients || {};
  }

  function shares(ctx) {
    const map = (ctx.coll && ctx.coll.clients && ctx.coll.clients.map) || {};
    const fin = financeOf(ctx);
    const rows = Object.keys(map).map(id => ({
      id, name: map[id].name || '', monthly: Number((fin[id] || {}).monthly) || 0
    }));
    const total = rows.reduce((n, r) => n + r.monthly, 0);
    return rows.map(r => ({...r, share: total > 0 ? Math.round(100 * r.monthly / total) : 0}));
  }

  function openTaskCount(ctx, id) {
    const list = (M.tasks && M.tasks.open) ? M.tasks.open(ctx) : [];
    return list.filter(t => t && t.client === id).length;
  }

  function ClientDrawer({id, onClose}) {
    const ctx = M.useCtx();
    const existing = id ? ctx.coll.clients.map[id] : null;
    const fin = financeOf(ctx);
    const [f, setF] = useState(() => ({
      name: (existing && existing.name) || '', status: (existing && existing.status) || 'live',
      pod: (existing && existing.pod) || '', owner: (existing && existing.owner) || ctx.uid,
      memory: (existing && existing.memory) || '', approvals: (existing && existing.approvals) || '',
      never: (existing && existing.never) || '', links: (existing && existing.links) || '',
      monthly: id && fin[id] ? String(fin[id].monthly || '') : ''
    }));
    const set = (k, v) => setF(x => ({...x, [k]: v}));
    const owners = ctx.activeMembers.map(m => ({v: m.uid, label: m.title ? m.empId + ' ' + m.title : m.empId}));

    async function save() {
      if (!f.name.trim()) return;
      const cid = id || U.uid();
      const doc = {name: f.name.trim(), status: f.status, pod: f.pod, owner: f.owner,
        memory: f.memory, approvals: f.approvals, never: f.never, links: f.links,
        updated: Date.now(), by: ctx.uid};
      if (id) await ctx.W.update('clients/' + id, doc);
      else await ctx.W.set('clients/' + cid, doc);
      if (ctx.isFounder && String(f.monthly).trim() !== '') {
        await ctx.W.merge('data/users/' + ctx.uid + '/finance', {clients: {[cid]: {monthly: Number(f.monthly) || 0}}});
      }
      M.toast('Saved');
      onClose();
    }

    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${id ? 'Client' : 'New client'}
      footer=${html`<div class="row between grow">
        <div>${id && ctx.isFounder ? html`<${UI.ConfirmBtn} label="Tap again to confirm"
          onConfirm=${() => { ctx.W.del('clients/' + id).then(() => { M.toast('Deleted'); onClose(); }); }}>Delete<//>` : null}</div>
        <${UI.Btn} onClick=${save} disabled=${!f.name.trim()}>${id ? 'Save' : 'Create client'}<//>
      </div>`}>
      <${UI.Input} id="client-name" label="name" value=${f.name} onChange=${v => set('name', v)}/>
      <${UI.Field} label="status"><${UI.Seg} options=${STATUS} value=${f.status} onChange=${v => set('status', v)} ariaLabel="Status"/><//>
      <${UI.Input} label="pod" value=${f.pod} onChange=${v => set('pod', v)}/>
      <${UI.Select} label="owner" value=${f.owner} onChange=${v => set('owner', v)}
        options=${[{v: '', label: 'No owner'}].concat(owners)}/>
      <${UI.TextArea} label="brand memory" value=${f.memory} onChange=${v => set('memory', v)}/>
      <${UI.TextArea} label="approvals" value=${f.approvals} onChange=${v => set('approvals', v)}/>
      <${UI.TextArea} label="lines never to cross" value=${f.never} onChange=${v => set('never', v)}/>
      <${UI.TextArea} label="links, one per line" value=${f.links} onChange=${v => set('links', v)}/>
      ${id && M.parts.ClientUpdate ? html`<${M.parts.ClientUpdate} id=${id} name=${f.name}/>` : null}
      ${ctx.isFounder ? html`<${UI.Input} label="monthly revenue" type="number" value=${f.monthly}
        onChange=${v => set('monthly', v)} hint="Private to you."/>` : null}
    <//>`;
  }

  function Clients() {
    const ctx = M.useCtx();
    const [open, setOpen] = useState(null); /* id, or 'new' */
    M.useIntent('client', () => setOpen('new'));
    const map = ctx.coll.clients.map;
    const sh = useMemo(() => {
      const out = {};
      if (ctx.isFounder) shares(ctx).forEach(r => { out[r.id] = r; });
      return out;
    }, [ctx]);
    const ids = Object.keys(map).sort((a, b) => String(map[a].name || '').localeCompare(String(map[b].name || '')));

    return html`<div class="stack" style=${{gap: '18px'}}>
      <${UI.PageHead} micro="client brains" title="Clients">
        <${UI.Btn} onClick=${() => setOpen('new')}>New client<//>
      <//>
      ${ids.length ? html`<div class="grid2">
        ${ids.map(id => {
          const c = map[id];
          const comp = completeness(c);
          const s = sh[id];
          return html`<button type="button" class="card rowbtn" key=${id} onClick=${() => setOpen(id)}
            style=${{cursor: 'pointer'}}>
            <div class="row between">
              <span style=${{fontWeight: 500, fontSize: '17px'}}>${c.name}</span>
              <${UI.Pill} kind=${STATUS_PILL[c.status]}>${c.status || 'live'}<//>
            </div>
            <div class="row small ink62" style=${{marginTop: '8px'}}>
              ${c.pod ? html`<span>${c.pod}</span>` : null}
              ${c.owner ? html`<${UI.Avatar} id=${c.owner} size=${22}/>` : null}
              <span class="num">${openTaskCount(ctx, id)} open tasks</span>
            </div>
            <div class="row" style=${{marginTop: '10px'}}>
              <span class=${'small num' + (comp.filled < comp.total ? ' flame-t' : '')}>${comp.filled} of ${comp.total} fields</span>
              <span class="tiny ink62">updated ${c.updated ? U.timeAgo(c.updated) : 'never'}</span>
            </div>
            ${s ? html`<div class="row small" style=${{marginTop: '8px'}}>
              <span class="num" style=${{fontWeight: 500}}>${U.inr(s.monthly)}</span>
              <span class="ink62 num">${s.share}% of monthly revenue</span>
            </div>` : null}
          </button>`;
        })}
      </div>` : html`<${UI.Card}><${UI.Empty} text="No clients yet."/><//>`}
      ${open ? html`<${ClientDrawer} id=${open === 'new' ? null : open} onClose=${() => setOpen(null)}/>` : null}
    </div>`;
  }

  /* AI: a client-ready status note from this client's projects and tasks */
  function ClientUpdate({id, name}) {
    const ctx = M.useCtx();
    const r = M.ai.useRun();
    if (!M.ai.on(ctx)) return null;
    async function go() {
      const nm = await M.ai.names(ctx);
      const td = U.todayStr();
      const projects = Object.keys(ctx.coll.projects.map).map(k => ({id: k, ...ctx.coll.projects.map[k]})).filter(p => p.client === id && !p.archived);
      const tasks = Object.keys(ctx.coll.tasks.map).map(k => ({id: k, ...ctx.coll.tasks.map[k]})).filter(t => t.client === id || projects.some(p => p.id === t.project));
      const lines = tasks.slice(0, 60).map(t => '- ' + t.title + ' (' + t.status + (t.due ? ', due ' + t.due : '') + ', ' + (nm[t.owner] || 'unassigned') + ')');
      const out = await r.run(o => M.ai.text(ctx,
        'Write a short WhatsApp status update for the client ' + name + ' from Mask360, in the agency\'s warm and confident voice. Today is ' + td + '. ' +
        'Structure: one friendly opening line, then "Done" and "Next" as short bullet lists, then one line on what we need from them (or "Nothing needed from your side"). ' +
        'Never mention internal statuses, revisions, lateness or people\'s workloads. Under 120 words. No emoji.\n\nPROJECTS:\n' +
        (projects.map(p => '- ' + p.name + ' (' + p.status + (p.due ? ', due ' + p.due : '') + ')').join('\n') || '- none') + '\n\nTASKS:\n' + (lines.join('\n') || '- none'),
        {signal: o.signal, onText: o.onText, cache: false}));
      return out;
    }
    const busy = r.state === 'thinking' || r.state === 'streaming';
    return html`<div class="ai-card" id="client-update">
      <div class="row between">
        <div class="grow"><${UI.Micro}>m360 ai<//><div class="card-title" style=${{marginTop: '4px'}}>Client update</div></div>
        <button type="button" class="btn sm" disabled=${busy} onClick=${go}>${busy ? html`<${M.Thinking}/>` : html`<span class="spark">\u2726</span> ${r.text ? 'Write it again' : 'Write an update'}`}</button>
      </div>
      ${r.text ? html`<div style=${{marginTop: '12px'}}><${M.AIText} text=${r.text}/>
        <button type="button" class="linky small" style=${{marginTop: '8px'}} onClick=${() => navigator.clipboard.writeText(r.text).then(() => M.toast('Copied'), () => M.toast('Copy is blocked here', true))}>Copy for WhatsApp</button></div>`
        : html`<div class="small ink62" style=${{marginTop: '8px'}}>${busy ? 'Reading this client\'s projects and tasks.' : 'A client-ready note on what shipped and what is next, in one tap.'}</div>`}
      ${r.state === 'error' ? html`<div class="small flame-t" style=${{marginTop: '8px'}}>${M.ai.errCopy(r.err)}</div>` : null}
    </div>`;
  }
  M.parts.ClientUpdate = ClientUpdate;

  M.pages.Clients = Clients;
  M.clients = {completeness, shares, openTaskCount, STATUS};
})();

/* ==== 30-week.js ==== */
/* module: week (BRIEF 7.10). The attendance grid, EOD cells, outcomes and the Friday review. */
'use strict';
(function () {
  const {html, React, U, UI, icons} = M;
  const {useState, useMemo} = React;

  const STATUS_PILL = {office: {k: 'ink', t: 'office'}, wfh: {k: null, t: 'wfh'},
    leave: {k: 'warm', t: 'leave'}, holiday: {k: 'warm', t: 'holiday'}};
  const MARK_PILL = {hit: 'ink', miss: 'flame'};
  const QUALITY = [1, 2, 3, 4, 5].map(n => ({v: String(n), label: String(n)}));
  const MARKS = [{v: 'hit', label: 'Hit'}, {v: 'miss', label: 'Miss'}];

  function eodOf(ctx, uid, date) {
    return ((ctx.coll.eod.map[uid] || {}).days || {})[date] || null;
  }

  function Cell({uid, date, today, onOpen}) {
    const ctx = M.useCtx();
    const d = (M.att && M.att.dayStatus) ? M.att.dayStatus(ctx, uid, date) : {status: 'none'};
    const e = eodOf(ctx, uid, date);
    const past = date < today;
    const working = ctx.isWorkingDay(date, uid);
    const p = STATUS_PILL[d.status];
    const future = date > today;
    return html`<button type="button" class="rowbtn" onClick=${() => onOpen({uid, date})}
      style=${{padding: '4px 2px', minWidth: '96px'}}>
      <div class="stack tight" style=${{gap: '4px', alignItems: 'flex-start'}}>
        ${future ? html`<span class="tiny ink62">to come</span>`
          : html`<div class="row" style=${{gap: '5px'}}>
            ${p ? html`<${UI.Pill} kind=${p.k}>${p.t}<//>` : html`<span class="tiny ink62">${working ? 'not in' : ''}</span>`}
          </div>`}
        ${d.in ? html`<div class="row" style=${{gap: '5px'}}>
          <span class="tiny num">${U.hhmm(d.in)}</span>
          ${d.late && ctx.canSee(uid) ? html`<${UI.Pill} kind="flame">late<//>` : null}
        </div>` : null}
        ${!future && (e || (past && working))
          ? (e
            ? (String(e.blocked || '').trim()
              ? html`<${UI.Pill} kind="flame">blocked<//>`
              : html`<${UI.Pill} kind="ink">eod<//>`)
            : html`<span class="pill" style=${{borderStyle: 'dashed'}}>no eod</span>`)
          : null}
      </div>
    </button>`;
  }

  function CellDrawer({cell, onClose}) {
    const ctx = M.useCtx();
    const {uid, date} = cell;
    const e = eodOf(ctx, uid, date);
    const d = (M.att && M.att.dayStatus) ? M.att.dayStatus(ctx, uid, date) : {status: 'none'};
    const ps = M.useProfiles([uid]);
    const nm = (ps[uid] && ps[uid].name) || 'Someone';
    return html`<${UI.Drawer} open=${true} onClose=${onClose} title=${nm + ', ' + U.fmtDay(date)}>
      ${e ? html`<div class="stack tight">
        <${UI.Micro}>shipped<//><p style=${{margin: 0, whiteSpace: 'pre-wrap'}}>${e.shipped}</p>
        ${e.next ? html`<${UI.Micro}>next<//><p style=${{margin: 0, whiteSpace: 'pre-wrap'}}>${e.next}</p>` : null}
        ${e.blocked ? html`<${UI.Micro}>blocked<//><p class="flame-t" style=${{margin: 0, whiteSpace: 'pre-wrap'}}>${e.blocked}</p>` : null}
      </div>` : html`<${UI.Empty} text="No EOD line that day."/>`}
      ${ctx.canSee(uid) && d.in ? html`<div>
        <hr class="hair"/>
        <${UI.Micro}>check-in<//>
        <div class="stack tight" style=${{marginTop: '8px'}}>
          <div class="row"><span class="small ink62">in</span><span class="num">${U.hhmm(d.in)}</span>
            ${d.late ? html`<${UI.Pill} kind="flame">late<//>` : null}</div>
          ${d.out ? html`<div class="row"><span class="small ink62">out</span><span class="num">${U.hhmm(d.out)}</span></div>` : null}
          ${d.place ? html`<div class="row"><span class="small ink62">place</span><span>${d.place}</span>
            ${d.verified ? html`<${UI.Pill} kind="ink">verified<//>` : html`<${UI.Pill} kind="flame-o">unverified<//>`}</div>` : null}
        </div>
      </div>` : null}
    <//>`;
  }

  function ReviewCard({uid, weekId}) {
    const ctx = M.useCtx();
    const plan = ((ctx.coll.plan.map[uid] || {}).weeks || {})[weekId];
    const rev = ((ctx.coll.review.map[uid] || {}).weeks || {})[weekId];
    const items = (plan && plan.items) || [];
    const mine = uid === ctx.uid;
    const isOwnFounderCard = ctx.isFounder && uid === ctx.uid;
    const [marks, setMarks] = useState(() => ({...((rev && rev.marks) || {})}));
    const [quality, setQuality] = useState(() => (rev && rev.quality != null ? String(rev.quality) : ''));
    const [note, setNote] = useState(() => (rev && rev.note) || '');
    React.useEffect(() => {
      setMarks({...((rev && rev.marks) || {})});
      setQuality(rev && rev.quality != null ? String(rev.quality) : '');
      setNote((rev && rev.note) || '');
    }, [weekId, uid, rev && rev.at]);

    async function save() {
      const weeks = U.clone(((ctx.coll.review.map[uid] || {}).weeks) || {});
      weeks[weekId] = {marks, quality: isOwnFounderCard ? null : (quality === '' ? null : Number(quality)), note, at: Date.now()};
      await ctx.W.merge('review/' + uid, {weeks: U.pruneWeeks(weeks)});
      M.toast('Review saved');
    }

    return html`<${UI.Card} title=${html`<${UI.Name} id=${uid}/>`}>
      ${items.length ? html`<div class="stack tight">
        ${items.map(it => html`<div class="listrow" key=${it.id}>
          <span class="grow">${it.text}</span>
          ${ctx.isFounder
            ? html`<${UI.Seg} sm=${true} options=${MARKS} value=${marks[it.id] || ''}
                onChange=${v => setMarks(m => ({...m, [it.id]: v}))} ariaLabel="Mark"/>`
            : ((rev && rev.marks && rev.marks[it.id])
              ? html`<${UI.Pill} kind=${MARK_PILL[rev.marks[it.id]]}>${rev.marks[it.id]}<//>`
              : html`<${UI.Pill}>open<//>`)}
        </div>`)}
      </div>` : html`<${UI.Empty} text="No outcomes posted."/>`}

      ${ctx.isFounder ? html`<div class="stack tight" style=${{marginTop: '14px'}}>
        ${isOwnFounderCard ? null : html`<${UI.Field} label="quality, 1 to 5">
          <${UI.Seg} sm=${true} options=${QUALITY} value=${quality} onChange=${setQuality} ariaLabel="Quality"/><//>`}
        <${UI.Input} label="note" value=${note} onChange=${setNote}/>
        <div class="row"><${UI.Btn} sm=${true} onClick=${save}>Save review<//></div>
      </div>` : (mine && rev ? html`<div class="stack tight" style=${{marginTop: '14px'}}>
        ${rev.quality != null ? html`<div class="row"><span class="small ink62">quality</span>
          <span class="num" style=${{fontWeight: 500}}>Quality ${rev.quality} of 5</span></div>` : null}
        ${rev.note ? html`<div class="small">${rev.note}</div>` : null}
      </div>` : null)}
    <//>`;
  }

  function Week() {
    const ctx = M.useCtx();
    const today = U.todayStr();
    const [offset, setOffset] = useState(0);
    const [cell, setCell] = useState(null);
    const monday = useMemo(() => U.addDays(U.mondayOf(new Date(ctx.now)), offset * 7), [offset, ctx.now]);
    const weekId = U.isoWeek(monday);
    const days = U.weekDays(monday);
    const range = U.fmtDate(days[0]) + ' to ' + U.fmtDate(days[5]);

    return html`<div class="stack" style=${{gap: '18px'}}>
      <${UI.PageHead} micro=${weekId.toLowerCase() + ', ' + range.toLowerCase()} title="The week">
        <div class="row nowrap">
          <button type="button" class="iconbtn" aria-label="Previous week" onClick=${() => setOffset(o => o - 1)}><${icons.chevL}/></button>
          <${UI.Btn} kind="sec" sm=${true} onClick=${() => setOffset(0)}>This week<//>
          <button type="button" class="iconbtn" aria-label="Next week" disabled=${offset >= 0}
            style=${offset >= 0 ? {opacity: .35, pointerEvents: 'none'} : null}
            onClick=${() => setOffset(o => Math.min(0, o + 1))}><${icons.chevR}/></button>
        </div>
      <//>

      <${UI.Card}>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>person</th>${days.map(d => html`<th key=${d}>${U.fmtDay(d).toLowerCase()}</th>`)}</tr></thead>
          <tbody>
            ${ctx.activeMembers.map(m => html`<tr key=${m.uid}>
              <td><span class="row nowrap"><${UI.Avatar} id=${m.uid} size=${26}/><${UI.Name} id=${m.uid}/></span></td>
              ${days.map(d => html`<td key=${d} style=${{padding: '4px 6px'}}>
                <${Cell} uid=${m.uid} date=${d} today=${today} onOpen=${setCell}/></td>`)}
            </tr>`)}
          </tbody>
        </table></div>
        ${ctx.activeMembers.length ? null : html`<${UI.Empty} text="Nobody on the roster yet."/>`}
      <//>

      <${UI.Micro}>outcomes and review<//>
      ${ctx.activeMembers.map(m => html`<${ReviewCard} key=${m.uid + weekId} uid=${m.uid} weekId=${weekId}/>`)}
      ${cell ? html`<${CellDrawer} cell=${cell} onClose=${() => setCell(null)}/>` : null}
    </div>`;
  }

  M.pages.Week = Week;
})();

/* ==== 31-scores.js ==== */
/* module: scores (BRIEF 7.11 and section 9). Points, podium, leaderboard, breakdowns. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useMemo} = React;

  const PRINCIPLE = 'Output earns about three times what discipline earns. Showing up is the floor. Shipping is what scores.';
  const PERIODS = [{v: 'week', label: 'Week'}, {v: 'month', label: 'Month'}, {v: 'quarter', label: 'Quarter'}];
  const LABELS = {
    checkinOnTime: 'on-time check-ins', eod: 'eod lines', planOnTime: 'monday outcomes on time',
    planLate: 'monday outcomes late', outcomeHit: 'outcomes hit', outcomeMiss: 'outcomes missed',
    taskOnTime: 'tasks on time', taskLate: 'tasks late', revision: 'revisions', shown20: '20% shown',
    qualityMult: 'quality', kudos: 'kudos', rockDone: 'rocks done', overdueOpen: 'overdue open'
  };
  const ORDER = ['outcomeHit', 'outcomeMiss', 'taskOnTime', 'taskLate', 'revision', 'shown20', 'qualityMult',
    'kudos', 'rockDone', 'overdueOpen', 'checkinOnTime', 'eod', 'planOnTime', 'planLate'];

  function Breakdown({uid, range, title}) {
    const ctx = M.useCtx();
    const p = (M.points && M.points.pointsFor) ? M.points.pointsFor(ctx, uid, range.from, range.to) : null;
    if (!p) return null;
    const parts = p.parts || {}, counts = p.counts || {};
    const rows = ORDER.filter(k => (counts[k] || 0) !== 0 || (parts[k] || 0) !== 0);
    return html`<${UI.Card} title=${title}>
      ${rows.length ? html`<div class="tbl-wrap"><table class="tbl">
        <tbody>
          ${rows.map(k => html`<tr key=${k}>
            <td>${LABELS[k] || k}</td>
            <td class="num ink62" style=${{textAlign: 'right'}}>${counts[k] || 0}</td>
            <td class="num" style=${{textAlign: 'right', fontWeight: 500}}>${parts[k] > 0 ? '+' + parts[k] : (parts[k] || 0)}</td>
          </tr>`)}
          <tr><td>output</td><td/><td class="num" style=${{textAlign: 'right', fontWeight: 500}}>${p.output}</td></tr>
          <tr><td>discipline</td><td/><td class="num" style=${{textAlign: 'right', fontWeight: 500}}>${p.discipline}</td></tr>
          <tr class="dark"><td>total</td><td/><td class="num" style=${{textAlign: 'right', fontWeight: 500}}>${p.total}</td></tr>
        </tbody>
      </table></div>` : html`<${UI.Empty} text="No points yet."/>`}
      ${(p.badges || []).length ? html`<div class="row" style=${{marginTop: '12px'}}>
        ${p.badges.map(b => html`<${UI.Pill} key=${b}>${b}<//>`)}</div>` : null}
    <//>`;
  }

  function Scores() {
    const ctx = M.useCtx();
    const [period, setPeriod] = useState('week');
    const range = useMemo(() => U.periodRange(period, new Date(ctx.now)), [period, ctx.now]);
    const board = useMemo(() => (M.points && M.points.leaderboard)
      ? M.points.leaderboard(ctx, period, new Date(ctx.now)) : [], [ctx, period]);
    /* one profiles call for the whole page: hooks never run inside a loop */
    const profs = M.useProfiles(board.map(r => r.uid));
    const top = board.length ? Math.max(1, board[0].total) : 1;
    const three = board.slice(0, 3);
    /* podium order: second, first, third */
    const podium = three.length === 3 ? [three[1], three[0], three[2]] : three;

    return html`<div class="stack" style=${{gap: '18px'}}>
      <${UI.PageHead} micro="points from the work itself" title="Scores">
        <${UI.Seg} options=${PERIODS} value=${period} onChange=${setPeriod} ariaLabel="Period"/>
      <//>

      <${UI.Card}><p style=${{margin: 0}}>${PRINCIPLE}</p><//>

      ${three.length ? html`<${UI.Card} title="Top 3">
        <div class="podium">
          ${podium.map((r, i) => {
            const isFirst = r === three[0];
            const h = isFirst ? 92 : (r === three[1] ? 70 : 54);
            return html`<div class=${'po' + (isFirst ? ' first' : '')} key=${r.uid}>
              <${UI.Avatar} id=${r.uid} size=${isFirst ? 44 : 36}/>
              <div class="small" style=${{fontWeight: 500, textAlign: 'center'}}><${UI.Name} id=${r.uid}/></div>
              <div class="plinth num" style=${{height: h + 'px'}}>${r.total}</div>
            </div>`;
          })}
        </div>
      <//>` : null}

      <${UI.Card} title="Leaderboard">
        ${board.length ? html`<div class="stack tight">
          ${board.map((r, i) => html`<div class="listrow" key=${r.uid}>
            <span class="num ink62" style=${{width: '20px'}}>${i + 1}</span>
            <${UI.Avatar} id=${r.uid} size=${28}/>
            <span style=${{minWidth: '120px'}}><${UI.Name} id=${r.uid}/></span>
            <${UI.Bar} a=${Math.max(0, r.output)} b=${Math.max(0, r.discipline)} max=${top}/>
            <span class="num" style=${{fontWeight: 500, width: '46px', textAlign: 'right'}}>${r.total}</span>
          </div>`)}
        </div>` : html`<${UI.Empty} text="No points yet."/>`}
      <//>

      ${ctx.isFounder
        ? (board.length ? board.map(r => html`<${Breakdown} key=${r.uid} uid=${r.uid} range=${range}
            title=${((profs[r.uid] || {}).name) || 'Points'}/>`) : null)
        : html`<${Breakdown} uid=${ctx.uid} range=${range} title="Your points"/>`}
    </div>`;
  }

  M.pages.Scores = Scores;
})();

/* ==== 32-people.js ==== */
/* module: people. Directory, person page, onboarding checklist, access register and offboarding
   (BRIEF 7.12, 7.17, 7.18). Everything shown is derived from ctx.coll at render time. */
'use strict';
(function () {
  const {html, React, U, UI} = M;
  const {useState, useEffect} = React;

  const ONBOARD_TOTAL = 13;
  const NEW_HIRE_DAYS = 45;
  const KUDOS_SHOWN = 20;
  const EOD_SHOWN = 5;

  /* ---------- pure helpers ---------- */
  const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && U.ymd(U.parseYmd(s)) === s;
  const collMap = (ctx, name) => ((ctx && ctx.coll && ctx.coll[name]) || {}).map || {};
  const docOf = (ctx, name, uid) => collMap(ctx, name)[uid] || {};
  const hasKeys = o => !!o && typeof o === 'object' && Object.keys(o).length > 0;
  const nowDate = ctx => new Date((ctx && typeof ctx.now === 'number') ? ctx.now : Date.now());
  const todayOf = ctx => U.ymd(nowDate(ctx));
  const quarterNow = ctx => U.quarterId(nowDate(ctx));
  const acksOf = (ctx, uid) => docOf(ctx, 'acks', uid).s || {};
  const okState = s => (s === 'off' || s === 'done') ? s : 'on';
  /* rocks for one quarter, blanks dropped */
  const rocksOf = (ctx, uid, qid) => ((docOf(ctx, 'rocks', uid).q || {})[qid || quarterNow(ctx)] || [])
    .filter(r => r && String(r.text || '').trim());

  const ROCK_STATES = [
    {v: 'on', label: 'On track'},
    {v: 'off', label: 'Off track'},
    {v: 'done', label: 'Done'}
  ];
  const ROCK_PILL = {on: {kind: 'ink', label: 'on track'}, off: {kind: 'flame-o', label: 'off track'}, done: {kind: 'ink', label: 'done'}};
  const LADDER_KIND = {clear: 'ink', note: 'flame-o', warning: 'flame', exit: 'flame'};

  const STATUS = {
    office: {label: 'In office', kind: 'ink'},
    wfh: {label: 'WFH', kind: undefined},
    leave: {label: 'On leave', kind: 'warm'},
    none: {label: 'Not in yet', kind: undefined}
  };
  /* today's status pill. M.att may load later or never, so the checkin document is the fallback. */
  function statusOf(ctx, uid, ymd) {
    let s = null;
    const att = M.att;
    if (att && typeof att.dayStatus === 'function') {
      try { const r = att.dayStatus(ctx, uid, ymd); s = r ? r.status : null; } catch (e) { s = null; }
    }
    if (s == null) {
      if (typeof ctx.onLeave === 'function' && ctx.onLeave(uid, ymd)) s = 'leave';
      else {
        const e = (docOf(ctx, 'checkin', uid).days || {})[ymd];
        s = (e && (e.mode === 'office' || e.mode === 'wfh')) ? e.mode : 'none';
      }
    }
    return STATUS[s] || STATUS.none;
  }

  /* ---------- onboarding model ---------- */
  const AUTO_ITEMS = [
    {key: 'read-house-rules', label: 'Read House rules', done: (ctx, uid) => !!acksOf(ctx, uid)['house-rules']},
    {key: 'read-the-week', label: 'Read The week', done: (ctx, uid) => !!acksOf(ctx, uid)['the-week']},
    {key: 'read-ladder', label: 'Read The ladder', done: (ctx, uid) => !!acksOf(ctx, uid)['ladder']},
    {key: 'read-role', label: 'Read your role card', done: (ctx, uid) => !!acksOf(ctx, uid)['role-brand-strategist']},
    {key: 'first-checkin', label: 'First check-in', done: (ctx, uid) => hasKeys(docOf(ctx, 'checkin', uid).days)},
    {key: 'first-eod', label: 'First EOD line', done: (ctx, uid) => hasKeys(docOf(ctx, 'eod', uid).days)},
    {key: 'first-plan', label: 'First Monday outcomes', done: (ctx, uid) => hasKeys(docOf(ctx, 'plan', uid).weeks)},
    {key: 'rocks-set', label: 'Rocks set for the quarter', done: (ctx, uid) => rocksOf(ctx, uid).length > 0}
  ];
  const MANUAL_ITEMS = [
    {key: 'laptop', label: 'Working laptop confirmed'},
    {key: 'workspace', label: 'Google Workspace account active'},
    {key: 'groups', label: 'Added to client groups'},
    {key: 'access', label: 'Access register filled in'},
    {key: 'brief', label: 'First brief delivered'}
  ];
  /* [{key, label, done, manual}] in checklist order */
  function onboardItems(ctx, uid) {
    if (!ctx || !uid) return [];
    const done = docOf(ctx, 'onboard', uid).done || {};
    const out = AUTO_ITEMS.map(i => ({key: i.key, label: i.label, done: !!i.done(ctx, uid), manual: false}));
    for (const i of MANUAL_ITEMS) out.push({key: i.key, label: i.label, done: !!done[i.key], manual: true});
    return out;
  }
  function onboardingProgress(ctx, uid) {
    return {done: onboardItems(ctx, uid).filter(i => i.done).length, total: ONBOARD_TOTAL};
  }
  function isNewHire(ctx, uid) {
    const m = ctx && ctx.members && ctx.members[uid];
    if (!m || !okDate(m.joined)) return false;
    const d = U.daysBetween(m.joined, todayOf(ctx));
    return d >= 0 && d <= NEW_HIRE_DAYS;
  }

  /* ---------- access model ---------- */
  const KINDS = [
    {v: 'client group', label: 'Client group'},
    {v: 'drive folder', label: 'Drive folder'},
    {v: 'tool seat', label: 'Tool seat'},
    {v: 'social account', label: 'Social account'},
    {v: 'client login', label: 'Client login'},
    {v: 'other', label: 'Other'}
  ];
  const RISKS = [{v: 'normal', label: 'Normal'}, {v: 'high', label: 'High'}];
  /* [{id, name, kind, risk, xfer, added, by, revoked, revokedAt}] oldest first */
  function accessItems(ctx, uid) {
    const items = docOf(ctx, 'access', uid).items || {};
    return Object.keys(items)
      .filter(id => items[id] && typeof items[id] === 'object')
      .map(id => ({id, ...items[id]}))
      .sort((a, b) => (a.added || 0) - (b.added || 0) || String(a.id).localeCompare(String(b.id)));
  }
  const STEPS = [
    {key: 'drive', label: 'Drive file ownership transferred to a Mask360 account'},
    {key: 'groups', label: 'Removed from client groups'},
    {key: 'logins', label: 'Client-side logins rotated by the client owner'},
    {key: 'email', label: 'Email suspended and forwarded'},
    {key: 'handover', label: 'Handover document received'},
    {key: 'settlement', label: 'Full and final settlement released'},
    {key: 'letter', label: 'Relieving letter issued'},
    {key: 'roster', label: 'Removed from the roster'}
  ];

  /* kudos received by uid from every giver, newest first */
  function kudosFor(ctx, uid) {
    const out = [];
    const km = collMap(ctx, 'kudos');
    for (const giver of Object.keys(km)) {
      for (const k of ((km[giver] || {}).given || [])) {
        if (!k || k.to !== uid) continue;
        out.push({id: giver + ':' + (k.id || k.at || out.length), giver, why: String(k.why || ''), at: typeof k.at === 'number' ? k.at : 0});
      }
    }
    out.sort((a, b) => b.at - a.at);
    return out;
  }

  /* names resolved inside this module, so a name next to an avatar for the same id settles on the same render */
  function useNames(ctx, ids) {
    const key = (ids || []).filter(Boolean).sort().join(',');
    const [ps, setPs] = useState({});
    useEffect(() => {
      const user = ctx && ctx.user;
      if (!user || !key || typeof user.profiles !== 'function') return undefined;
      let live = true;
      Promise.resolve().then(() => user.profiles(key.split(','))).then(r => { if (live && r) setPs(r); }).catch(() => {});
      return () => { live = false; };
    }, [ctx && ctx.user, key]);
    return ps;
  }
  const nameIn = (names, uid) => (names[uid] && names[uid].name) || 'Someone';

  /* ---------- small parts ---------- */
  const RockPill = ({state}) => {
    const p = ROCK_PILL[okState(state)];
    return html`<${UI.Pill} kind=${p.kind}>${p.label}<//>`;
  };
  /* a read-only checklist line, same look as UI.Check */
  const ReadCheck = ({label, checked}) => html`<label class="checkline"><input type="checkbox" checked=${!!checked} disabled/><span>${label}</span></label>`;
  const CountText = ({done, total}) => html`<span class="small num sub">${done} of ${total} done</span>`;

  /* ---------- directory ---------- */
  function Directory() {
    const ctx = M.useCtx();
    const today = todayOf(ctx);
    const list = ctx.activeMembers || [];
    const names = useNames(ctx, list.map(m => m.uid));
    return html`<${React.Fragment}>
      <${UI.PageHead} micro="team" title="People"/>
      ${list.length ? html`<div class="grid2" id="people-grid">
        ${list.map(m => {
          const st = statusOf(ctx, m.uid, today);
          const line = [m.title, m.pod].filter(Boolean).join(' · ');
          return html`<button key=${m.uid} type="button" class="rowbtn" onClick=${() => M.nav('#people/' + m.uid)}>
            <div class="card clickable">
              <div class="row nowrap">
                <${UI.Avatar} id=${m.uid} size=${40}/>
                <div class="grow">
                  <div class="row between nowrap"><b class="grow">${nameIn(names, m.uid)}</b><${UI.Pill} kind=${st.kind}>${st.label}<//></div>
                  <div class="tiny num sub">${m.empId || ''}</div>
                  ${line ? html`<div class="small sub">${line}</div>` : null}
                </div>
              </div>
            </div>
          </button>`;
        })}
      </div>` : html`<${UI.Card}><${UI.Empty} text="Nobody on the roster yet."/><//>`}
    <//>`;
  }

  /* ---------- person page: overview ---------- */
  function RocksForm({ctx, uid, qid}) {
    const saved = rocksOf(ctx, uid, qid);
    const norm = list => JSON.stringify(list.map(r => ({id: r.id || '', text: String(r.text || '').trim(), state: okState(r.state)})));
    const savedKey = norm(saved);
    const fromSaved = () => [0, 1, 2].map(i => saved[i]
      ? {id: saved[i].id || '', text: String(saved[i].text || ''), state: okState(saved[i].state)}
      : {id: '', text: '', state: 'on'});
    const [draft, setDraft] = useState(fromSaved);
    const [busy, setBusy] = useState(false);
    /* the form follows the saved document until the person types */
    useEffect(() => { setDraft(fromSaved()); }, [savedKey]);
    const items = () => draft.filter(r => r.text.trim()).map(r => ({id: r.id || U.uid(), text: r.text.trim(), state: okState(r.state)}));
    const changed = norm(draft.filter(r => r.text.trim())) !== savedKey;
    const upd = (i, patch) => setDraft(d => d.map((r, j) => j === i ? {...r, ...patch} : r));
    const save = () => {
      if (!changed || busy) return;
      setBusy(true);
      ctx.W.merge('rocks/' + uid, {q: {[qid]: items()}})
        .then(() => M.toast('Saved'))
        .catch(() => {})
        .then(() => setBusy(false));
    };
    return html`<div class="stack">
      <div class="sub small">1 to 3 outcomes for the quarter. Keep each one to a line.</div>
      ${draft.map((r, i) => html`<div key=${i} class="stack tight">
        <${UI.Input} id=${'rock-' + (i + 1)} label=${'rock ' + (i + 1)} value=${r.text} placeholder="One outcome for the quarter"
          onChange=${v => upd(i, {text: v})}/>
        <div class="row"><${UI.Seg} sm options=${ROCK_STATES} value=${r.state} onChange=${v => upd(i, {state: v})} ariaLabel=${'Rock ' + (i + 1) + ' state'}/></div>
      </div>`)}
      <div class="row"><${UI.Btn} disabled=${!changed || busy} onClick=${save}>Save rocks<//></div>
    </div>`;
  }

  function Overview({uid}) {
    const ctx = M.useCtx();
    const qid = quarterNow(ctx);
    const mine = ctx.uid === uid;
    const rocks = rocksOf(ctx, uid, qid);
    const eodDays = docOf(ctx, 'eod', uid).days || {};
    const recent = Object.keys(eodDays).filter(okDate).sort().reverse().slice(0, EOD_SHOWN);
    const kudos = kudosFor(ctx, uid).slice(0, KUDOS_SHOWN);

    return html`<${React.Fragment}>
      <${UI.Card} title=${'Rocks, ' + qid} id="person-rocks">

              <span class="grow">${r.text}</span><${RockPill} state=${r.state}/>

      <//>
      <div class="grid2">
        <${UI.Card} title="Recent EOD lines" id="person-eod">
          ${recent.length ? recent.map(d => html`<div class="listrow" key=${d}>
            <div class="grow">
              <div class="tiny num sub">${U.fmtDay(d)}</div>
