name: edgeone-probe
on:
  push:
    branches: [claude/amazing-euler-c4ngj2]
    paths: ['m360-os/edgeone-probe/**', '.github/workflows/edgeone-probe.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy anonymously
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/m360os" && cp -r m360-os/edgeone-probe/. "$RUNNER_TEMP/m360os/"
          cd "$RUNNER_TEMP/m360os" && npm install --no-audit --no-fund
          for i in 1 2 3 4; do
            if npx --yes edgeone@1.6.41 makers deploy --anonymous --site global --json 2>&1 | tee deploy.log; then
              grep -q '"status":"success"' deploy.log && break
            fi
            sleep 5
          done
          cp deploy.log "$GITHUB_WORKSPACE/deploy.log"
      - name: Probe the deployed function
        run: |
          URL=$(grep -o '"url":"[^"]*"' deploy.log | head -1 | cut -d'"' -f4)
          BASE="${URL%%\?*}"; QS="${URL#*\?}"
          echo "BASE=$BASE"
          sleep 15
          for i in 1 2; do
            curl -sS -i -X POST "$BASE/api/ping?$QS" -H 'content-type: application/json' -d '{"hello":1}' | sed -n '1,40p' || true
            echo
          done
          curl -sS -o /dev/null -w "root without token: %{http_code}\n" "$BASE/" || true
          curl -sS -o /dev/null -w "api without token: %{http_code}\n" -X POST "$BASE/api/ping" || true
