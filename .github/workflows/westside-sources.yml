name: westside-sources
# Fetches primary sources for the Westside proposal (Trent filings on BSE/NSE, launch coverage, Westside's own pages)
# into research_notes/Westside proposal v4/sources/ as text, because the coding sandbox cannot reach those hosts.
on:
  push:
    branches: [claude/wizardly-bardeen-2oc2qq]
    paths: ['research_notes/Westside proposal v4/sources/urls.txt', 'pitches/westside/fetch_sources.py', '.github/workflows/westside-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westside-sources
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch
        run: python3 pitches/westside/fetch_sources.py "research_notes/Westside proposal v4/sources"
      - name: Commit the text
        run: |
          cd "research_notes/Westside proposal v4/sources"
          rm -rf raw
          ls -la
          cd -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "research_notes/Westside proposal v4/sources"
          git commit -m "Westside v4 research: primary sources fetched as text" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
